 flavor_zun.1:"准噶尔的崛起"
 flavor_zun.1.title:"准噶尔的崛起"
 flavor_zun.1.desc:"准噶尔汗国是一个起源于蒙古的游牧汗国。在其最大范围内，它覆盖了北起西伯利亚南部，南至今天的吉尔吉斯斯坦，东至今天的蒙古西部和中国长城，西至今天的哈萨克斯坦。准噶尔汗国的核心是今天新疆北部的一部分，也被称为准噶尔。"
 flavor_zun.1.a:"宣告我们的命运"
 flavor_zun.1.b:"我们还是最好与周边国家开展更多贸易"
 STATIC_MODIFIER_NAME_rise_of_dzungar_horde:"准噶尔的崛起"
 STATIC_MODIFIER_NAME_conquest_tibet_region:"	远征吐蕃"
 flavor_zun.2:"发起对[GetCountry('CHG').GetName]的进攻?"
 flavor_zun.2.title:"发起对[GetCountry('CHG').GetName]的进攻"
 flavor_zun.2.desc:"叶儿羌汗国统治塔里木地区。他们有更多的土地，但缺乏足够的力量来保护自己，作为准噶尔人，我们有义务帮助他们保护自己的土地。"
 flavor_zun.2.a:"为了财富和伟大的汗"
 flavor_zun.2.b:"转念一想我们也许可以和他们开展贸易"
 flavor_zun.3:"发起对[GetCountry('QKH').GetName]和[GetCountry('UUS').GetName]的进攻?"
 flavor_zun.3.title:"发起对[GetCountry('QKH').GetName]和[GetCountry('UUS').GetName]的进攻?"
 flavor_zun.3.desc:"1717年，策妄阿拉布坦的兄弟策妄顿珠入侵呼和浩特汗国，废黜耶喜嘉措，杀害拉藏汗，洗劫拉萨。康熙皇帝在1718年进行了报复，但他的军队在离拉萨不远的萨尔温江之战中被准噶尔人歼灭。他们将格桑嘉措从塔尔班带到拉萨，并于1721年立为第七世达赖喇嘛。"
 flavor_zun.3.a:"征服吐蕃"
 flavor_zun.3.b:"雇佣一个人为我们征服吐蕃"
 flavor_zun.3.c:"转念一想我们也许不应该攻击藏传佛教的领袖"
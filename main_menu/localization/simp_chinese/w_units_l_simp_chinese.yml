 a_klephts_desc:"“克莱夫特”这个词意为“盗贼”，或许最初仅指“强盗”，他们是土匪出身，后来自封为武装民兵，成为反抗[GetCountry('TUR').GetName]的起义者，也是好战的山民，在希腊大部分地区被[GetCountry('TUR').GetName]统治的时候，他们生活在山野之中，反抗着对方的统治。"

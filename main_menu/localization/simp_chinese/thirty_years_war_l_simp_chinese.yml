##Historical Westphalia
thirty_years_war_events.1.title: "威斯特伐利亚和约"
thirty_years_war_events.1.desc: "终于，和平谈判得以结束，从而结束了困扰中欧长达三十年的战争。这两个联盟在两年内分别在两个不同的城市进行了谈判，最终达成了妥协。参与谈判的外交官们正准备为这项协议的成功举行庆祝仪式。"

thirty_years_war_events.1.a: "为了欧洲的和平，先生们！"


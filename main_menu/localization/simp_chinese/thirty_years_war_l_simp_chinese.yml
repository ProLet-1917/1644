thirty_years_war_events.4.title: "奥斯纳布吕克条约"
thirty_years_war_events.4.desc: "这场持续已久的欧洲战争似乎没有尽头。基督徒们肆意残杀同胞，许多富饶的领地也遭到了破坏。我们的一些顾问已经开始考虑曾经被认为不可能的事情：与我们的敌人进行谈判。有人提出了在奥斯纳布吕克举行正式会谈的提议，这或许能促使战争结束。"

thirty_years_war_events.4.a: "派遣一个代表团"

thirty_years_war_events.5.title: "不谈判政策"
thirty_years_war_events.5.desc: "我们关于在奥斯纳布吕克展开正式谈判的请求遭到了断然拒绝。我们的使者返回时称，对方告知他们，他们拒绝与异端进行谈判。"
thirty_years_war_events.5.a: "哈！那些蠢货根本没意识到他们才是异端分子！"

thirty_years_war_events.100.title: "分裂波美拉尼亚"
thirty_years_war_events.100.desc: "关于波美拉尼亚的谈判陷入了僵局。为打破谈判僵局，可能的一种解决方案是将该地区一分为二。我们目前的状况如何？"

thirty_years_war_events.100.a: "这看起来是合理的，而且肯定也不会在日后引发什么问题。"
thirty_years_war_events.100.b: "不！我们坚守原则。波美拉尼亚必须完整无损。这就是我们誓死捍卫的阵地！"

thirty_years_war_events.101.title: "我们的要求"
thirty_years_war_events.101.desc: "我们已将我们的要求传达给了我们在奥斯纳布吕克的谈判对手。我们希望他们能理解并接受这些要求。"

thirty_years_war_events.101.a: ""


l_simp_chinese:
 #thirty_years_war_events: "The Thirty Years' War"

##Historical Westphalia
 thirty_years_war_events.1.title: "威斯特伐利亚和约"
 thirty_years_war_events.1.desc: "漫长等待后，终结肆虐中欧三十年之久的和平谈判终告结束。两大联盟在两地历经逾两年磋商，终于达成妥协。参与谈判的外交官们正准备为条约的成功而举杯。"
 thirty_years_war_events.1.a: "为欧洲的和平干杯，先生们！"

 thirty_years_war_events.2.title: "来自天主教联盟的消息"
 thirty_years_war_events.2.desc: "战争仍在继续，我们的人民和敌国的人民都饱受战祸之苦。如今，敌人已来信表示愿意与我们进行和平谈判。我们应如何回应？"
 thirty_years_war_events.2.a: "或许我们应该接受他们的请求"
 thirty_years_war_events.2.b: "拒绝。"

 thirty_years_war_events.3.title: "来自新教联盟的消息"
 thirty_years_war_events.3.desc: "战争仍在继续，我们的人民和敌国的人民都饱受战祸之苦。如今，敌人已来信表示愿意与我们进行和平谈判。我们应如何回应？"
 thirty_years_war_events.3.a: "或许我们应该接受他们的请求"
 thirty_years_war_events.3.b: "拒绝。"

 thirty_years_war_events.4.title: "奥斯纳布吕克条约"
 thirty_years_war_events.4.desc: "长期蹂躏欧洲的战争似乎永无尽头。基督徒肆意屠戮基督徒，许多富饶的封地化为废墟。我们的一些顾问开始考虑曾经不可想象之事：与敌人谈判。一份在奥斯纳布吕克进行正式和谈的提议已提上日程，这可能终结这场战争。"
 thirty_years_war_events.4.a: "派遣代表团。"

 thirty_years_war_events.5.title: "不谈判政策"
 thirty_years_war_events.5.desc: "我们在奥斯纳布吕克开始正式和谈的请求遭到断然拒绝。我们的信使回报称，敌人宣称他们拒绝与异端分子谈判。"
 thirty_years_war_events.5.a: "哈！那些白痴没意识到他们自己才是异端！"

 thirty_years_war_events.6.title: "加入和会"
 thirty_years_war_events.6.a: "加入和会"
 thirty_years_war_events.6.desc: "加入和会"

 thirty_years_war_events.100.title: "分割波美拉尼亚"
 thirty_years_war_events.100.desc: "谈判在波美拉尼亚问题上陷入僵局。打破谈判僵局的一个可能方案是将该地区一分为二。我们持何立场？"
 thirty_years_war_events.100.a: "这似乎合理，当然不会在日后引发问题。"
 thirty_years_war_events.100.b: "不行！我们坚持原则。波美拉尼亚必须完整。这是我们决不退让的底线！"

 thirty_years_war_events.101.title: "我们的要求"
 thirty_years_war_events.101.desc: "我们已向奥斯纳布吕克的……谈判伙伴们提出了我们的要求。我们希望他们能认清事理。"
 thirty_years_war_events.101.a: "如果他们不……"

 thirty_years_war_events.102.title: "未使用事件"
 thirty_years_war_events.102.desc: "未使用事件"
 thirty_years_war_events.102.a: "未使用事件"

 thirty_years_war_events.103.title: "低地国家问题"
 thirty_years_war_events.103.desc: "低地国家独立问题在会议上被提出。我们可以选择我们想要的结果。"
 thirty_years_war_events.103.a: "让我看看。"

 thirty_years_war_events.104.title: "我们的诉求？"
 thirty_years_war_events.104.desc: "现在，我们可以在会议桌上提出我们的要求，并与西班牙代表团进行讨论。"
 thirty_years_war_events.104.a: "我们要求完全独立"
 thirty_years_war_events.104.b: "我们要求整个尼德兰！"

 thirty_years_war_events.105.title: "来自尼德兰的消息"
 thirty_years_war_events.105.desc: "尼德兰的要求是我们应结束当前冲突，并承认其完全独立。"
 thirty_years_war_events.105.a: "我们接受，此事应当就此了结"
 thirty_years_war_events.105.b: "不，我们仍然想控制整个低地地区。"

 thirty_years_war_events.106.title: "来自尼德兰的消息"
 thirty_years_war_events.106.desc: "尼德兰的要求是我们应结束当前冲突，并将所有低地地区割让给他们。"
 thirty_years_war_events.106.a: "我们必须接受这些条件"
 thirty_years_war_events.106.b: "绝不！"

 thirty_years_war_events.107.title: "维特尔斯巴赫家族问题"
 thirty_years_war_events.107.desc: "维特尔斯巴赫家族的问题在会议上被提出。作为帝国的皇帝，我们应就此问题表达我们的意见。"
 thirty_years_war_events.107.a: "让我看看。"

 thirty_years_war_events.108.title: "维特尔斯巴赫家族问题的解决方案"
 thirty_years_war_events.108.desc: "在担任帝国皇帝并与参会各国商议后，我认为我们可以将以下内容纳入条约。"
 thirty_years_war_events.108.a: "巴伐利亚获得选帝侯资格。"
 thirty_years_war_events.108.b: "巴伐利亚和普法尔茨获得选帝侯资格。"
 thirty_years_war_events.108.c: "普法尔茨获得选帝侯资格。"

 thirty_years_war_events.109.title: "加泰罗尼亚问题"
 thirty_years_war_events.109.desc: "加泰罗尼亚在最近的战争中宣布从我们这里独立。我们应在会议上讨论此事。"
 thirty_years_war_events.109.a: "让我看看。"

 thirty_years_war_events.110.title: "加泰罗尼亚问题"
 thirty_years_war_events.110.desc: "西班牙代表团就加泰罗尼亚问题提出了他们的要求，我们也将对此事作出回应。"
 thirty_years_war_events.110.a: "让我们保持现状"
 thirty_years_war_events.110.b: "加泰罗尼亚将重新并入，但我们将获得鲁西永。"
 thirty_years_war_events.110.c: "加泰罗尼亚将回归西班牙。"
 thirty_years_war_events.110.d: "我们不想解决这个问题，让我们继续与西班牙的战争。"

 thirty_years_war_events.1000.title: "威斯特伐利亚条约"
 thirty_years_war_events.1000.desc: "威斯特伐利亚条约已缔结。欧洲的宗教战争结束了。新地图上的线条非常漂亮，而且，现在当然不会出任何差错。主要的外交官们已提议举杯庆贺。"
 thirty_years_war_events.1000.a: "为欧洲的和平干杯，先生们？"

l_simp_chinese:
 # ===== 第七时代行政倾向 =====
 public_sanitation_advance: "公共卫生"
 public_sanitation_advance_desc: "为日益膨胀的城市提供净水、下水道与卫生检疫。"
 compulsory_education_advance: "义务教育"
 compulsory_education_advance_desc: "每一名儿童皆须入学，其费用由国家负担。"
 municipal_reform_advance: "市政改革"
 municipal_reform_advance_desc: "市议会获得实权与实款，城市在其治理下繁荣。"
 statistical_administration_advance: "统计行政"
 statistical_administration_advance_desc: "中央统计局丈量全国的人口、收成与岁入。"
 state_railway_advance: "国营铁路"
 state_railway_advance_desc: "干线由国家自行修筑与营运，为商亦为战。"
 anti_trust_legislation_advance: "反托拉斯立法"
 anti_trust_legislation_advance_desc: "以自由市场之名，拆解或规制庞大的联合企业。"
 civil_service_examination_advance: "文官考试"
 civil_service_examination_advance_desc: "公职之任命以竞争考试为准，而非以人情为准。"
 imperial_postal_advance: "帝国邮政"
 imperial_postal_advance_desc: "划一而廉价的邮政通达帝国的每一个角落。"

 # ===== 第七时代外交倾向 =====
 balance_of_power_advance: "均势外交"
 balance_of_power_advance_desc: "我们与较弱的一方结盟以抗衡较强者，使任何单一强权皆无从称霸。"
 national_self_determination_advance: "民族自决"
 national_self_determination_advance_desc: "我们宣告每一民族皆有权自治，并据此行事。"
 colonial_conference_advance: "殖民地会议"
 colonial_conference_advance_desc: "殖民列强集议，瓜分尚未被占据的世界，并在不开战的前提下解决争端。"
 treaty_system_advance: "条约体系"
 treaty_system_advance_desc: "由同盟、保证与仲裁协定织成的网络，将列强彼此缚在一起。"
 intelligence_academy_advance: "情报学院"
 intelligence_academy_advance_desc: "一所专业学院训练我方情报人员掌握密码、暗号与外国语。"
 neutrality_doctrine_advance: "中立主义"
 neutrality_doctrine_advance_desc: "我们置身于列强的争执之外，仅为本国土地而武装。"
 gunboat_diplomacy_advance: "炮舰外交"
 gunboat_diplomacy_advance_desc: "驻泊远方的舰队，是我们最有说服力的使节。"
 international_arbitration_advance: "国际仲裁"
 international_arbitration_advance_desc: "我们将争端交付常设仲裁法院，而非诉诸刀兵。"
 cultural_exports_advance: "文化输出"
 cultural_exports_advance_desc: "我们的语言、文学与艺术，随学堂、传教与商队流传海外。"

 # ===== 第七时代军事倾向 =====
 conscription_act_advance: "义务兵役法"
 conscription_act_advance_desc: "每一名壮丁皆须服役若干年，常备军之后站着一支庞大的受训预备役。"
 military_academy_advance: "军事学院"
 military_academy_advance_desc: "总参谋学院以战略、工程与军事科学训练我方军官。"
 logistical_corps_advance: "后勤兵团"
 logistical_corps_advance_desc: "专职的补给与运输兵团，使军队在战地有食有弹。"
 field_medicine_advance: "战地医疗"
 field_medicine_advance_desc: "野战医院、担架队与护理队，救回了昔日必死的伤兵。"
 railway_mobilization_advance: "铁路运兵"
 railway_mobilization_advance_desc: "在平时排定的时刻表，可在数日内将整支大军送至边境。"
 machine_gun_tactics_advance: "机枪战术"
 machine_gun_tactics_advance_desc: "机枪被编入步兵营，战线上的一次齐射即成屠戮。"
 naval_modernization_advance: "海军现代化"
 naval_modernization_advance_desc: "蒸汽、装甲与重炮，把舰队变为投射国力的利器。"
 expeditionary_warfare_advance: "远征作战"
 expeditionary_warfare_advance_desc: "我方部队按海外作战编成、登船与补给。"

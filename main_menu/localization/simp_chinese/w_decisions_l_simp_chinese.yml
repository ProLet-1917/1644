 DEC_HORDE_SELL_HERD_TT:"这个决议的需求已被满足.将会失去250个单位的牧群并获得50金币"
 claim_mandate_of_heaven:"宣称天命"
 claim_mandate_of_heaven_desc:"天命一直被视为统治中国的基础。随着我们占据了中国的主要领土，我们现在可以宣称天命。"
 rtr_recreate_middle_kingdom.tt:"[GetInternationalOrganizationType('middle_kingdom').GetName]将会重建"
 DECISIONS_TT:"决议"
 DECISIONS_GROUP_TT:"决议组"
 create_general_war_commissariat:"创建总战争委员会"
 create_general_war_commissariat_desc:"总战争委员会是一个永久性的战争委员会，负责军队及其后勤支持的组织和维护，包括负责增加和分配军费的机构。它由我们的统治者建立，以更高效地管理军队的各个方面。"
 reform_sejm_parliament:"改革议会"
 reform_sejm_parliament_desc:"议会内部的普遍腐败一直是我们行使权力的最大障碍。通过逐步加强自身权力，我们现在可以消除议会中的腐败。"
 claim_dominance_over_the_baltic_sea:"宣称波罗的海霸权"
 claim_dominance_over_the_baltic_sea_desc:"作为$SWE$，我们的领土主要位于波罗的海两侧。在统一波罗的海两岸的土地后，我们现在可以宣布对波罗的海的霸权。"
 unite_ukranie:"统一乌克兰"
 unite_ukranie_desc:"随着我们控制了乌克兰的左右岸，我们现在可以宣布统一的乌克兰已形成。"
 custom_unite_ukraine:"我们将#E 形成[GetFormableCountry('UKR').GetName]"
 reform_the_regulars:"改革常备军"
 reform_the_regulars_desc:"随着一定数量的常备军建立，我们现在可以改进其中的一些问题。"
 declare_golden_age_of_our_country:"宣告我们的黄金时代"
 declare_golden_age_of_our_country_desc:"凭借我们最近在世界舞台上的主导地位，我们现在可以宣称我们的黄金时代已经到来。"
 only_once_golden_age_of_our_country_allowed_per_game:"每场游戏只允许#L 宣告黄金时代#N 一次"
 Reform_tibet_empire:"重建吐蕃帝国"
 Reform_tibet_empire_desc:"在我们统一喜马拉雅两侧后，我们现在可以遵循古代藏族人民的脚步，重新建立[GetFormableCountry('TIB').GetName]帝国并统一文化。"
 Between_the_two_seas:"在两海之间"
 Between_the_two_seas_desc:"对于[GetCountry('RUS').GetName]来说，我们的国家一直缺乏适合的沿海地区。我们必须向波罗的海和黑海发动攻势，夺取那里的港口，并扩大我们在海上的影响力。"
 Claim_the_third_rome:"宣称第三罗马"
 Claim_the_third_rome_desc:"作为罗马的真正继承者，成功征服了罗马和新罗马后，我们现在可以宣称我们将永远作为第三罗马统治。"

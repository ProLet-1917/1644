 Expand_hofburg_palace_desc:"REPLACE_ME"
 promoting_religious_tolerance: "推行宗教宽容法令"
 promoting_religious_tolerance_desc: "推行宗教宽容法令可以改善我国异教徒的生活情况，这将使他们更倾向于接受我国的其他政策并稳定我们的社会。"
 connect_global_trade: "建立起全球贸易网络"
 connect_global_trade_desc: "随着我们在各大洲上的扩张，我们如今可以建立起一条条自东方到西方，从北方到南方的航线，这连接起了我们的一个个地区并带来无与伦比的竞争优势。"
 unified_united_province: "统一联合省"
 unified_united_province_desc: "随着我们从敌人的手中获得独立，现在是时候将我们的各自治城市纳入我们的统一的国家当中了。"
 reform_the_byzantine_empire: "重建[GetFormableCountry('BYZ').GetName]"
 reform_the_byzantine_empire_desc: "随着我们重新控制[GetFormableCountry('BYZ').GetName]的核心地区，我们现在可以宣布我们再一次光复了帝国。凤凰涅槃，再度重生，如1261年那般，[GetFormableCountry('BYZ').GetName]的旗帜再次飘扬在世界之上。"
 we_already_choose_roman_path:"我们已经选择复兴[GetFormableCountry('BYZ').GetName]的道路"

l_simp_chinese:
 # =========================================================
 # 明清交替（1644-1683）
 # =========================================================
 mqt_1644.1.title: "剃发令"
 mqt_1644.1.desc: "朝廷已下令：凡汉人臣民皆须剃去前额头发，依满洲之制留辫。“留头不留发，留发不留头”——此令以刀锋推行，在江南已激起反抗。"
 mqt_1644.1.historical_info: "1645年的剃发令强制汉人男子改从满洲发式，引发了广泛的抵抗与屠戮。"
 mqt_1644.1.a: "此令必将厉行。"
 mqt_1644.1.b: "此令暂且从宽。"

 mqt_1644.2.title: "扬州陷落"
 mqt_1644.2.desc: "扬州拒降，大军已破城而入。统帅提议屠城以示惩戒，使其他城池不敢再作抵抗。江南士人必不会忘记此事。"
 mqt_1644.2.historical_info: "1645年扬州十日屠发生在明臣史可法殉国之后，成为清军征服的象征。"
 mqt_1644.2.a: "让扬州成为儆戒。"
 mqt_1644.2.b: "保全此城，以收士人之心。"

 mqt_1644.3.title: "大顺之亡"
 mqt_1644.3.desc: "那位闯王已被追剿于湖广群山之间，死于地方乡勇之手。其部众群龙无首，这场浩大的农民起义已然破碎。"
 mqt_1644.3.historical_info: "李自成，大顺政权的建立者，1645年死于湖北。"
 mqt_1644.3.a: "首领已死。"
 mqt_1644.3.b: "余部将继续抗争。"

 mqt_1644.4.title: "大西之亡"
 mqt_1644.4.desc: "张献忠在四川与清军的一次遭遇战中阵亡。其诸将如今必须在投降、逃亡与联明抗清之间做出抉择。"
 mqt_1644.4.historical_info: "张献忠，四川大西政权的统治者，1647年战死。"
 mqt_1644.4.a: "首领已死。"
 mqt_1644.4.b: "余部将归附明室。"

 mqt_1644.5.title: "两蹶名王"
 mqt_1644.5.desc: "西南的明军一年之内两战两捷，阵斩敌方两位亲王统帅。十年来，复明大业第一次有了希望。"
 mqt_1644.5.historical_info: "李定国1652年桂林、衡州两役阵斩清定南王孔有德与敬谨亲王尼堪，史称“两蹶名王”。"
 mqt_1644.5.a: "复明大业重燃希望。"
 mqt_1644.5.b: "民心为之一振。"

 mqt_1644.6.title: "北伐"
 mqt_1644.6.desc: "一支水陆大军已在沿海集结，一位声名卓著的将领提议溯长江而上，直取南京。此城曾陷落一次，或许还会再陷落一次。"
 mqt_1644.6.historical_info: "郑成功1659年北伐兵临南京城下，围城未克而退。"
 mqt_1644.6.a: "让大军出航。"
 mqt_1644.6.b: "当守海疆，而非长江。"

 mqt_1644.7.title: "行在缅甸"
 mqt_1644.7.desc: "最后的明廷已自云南退入缅甸的丛林之中——一个没有都城的政府，一个没有宝座的皇帝。山中的复明军队仍在没有它的情况下继续作战。"
 mqt_1644.7.historical_info: "永历帝1659年退入缅甸，1662年被执送清军。"
 mqt_1644.7.a: "朝廷将退入缅甸。"
 mqt_1644.7.b: "我们将在云南死守到底。"

 mqt_1644.8.title: "禁海迁界"
 mqt_1644.8.desc: "岛上的明郑势力靠大陆的海上贸易为生。朝廷提议将沿海居民内迁，禁止一切海上往来——以毁掉自己的海岸来饿死敌人。"
 mqt_1644.8.historical_info: "1661年的迁界禁海使东南沿海荒废，以断绝台湾郑氏的补给。"
 mqt_1644.8.a: "沿海将被迁空。"
 mqt_1644.8.b: "海上贸易将继续开放。"

 mqt_1644.9.title: "三藩之乱"
 mqt_1644.9.desc: "三位因参与征服而被酬以行省的汉将，如今把它们当作自己的领地来统治。朝廷决意收回其权——而他们决意不肯交出。"
 mqt_1644.9.historical_info: "三藩之乱（1673-1681）由吴三桂、耿精忠、尚之信发动，起因是康熙帝欲撤其藩。"
 mqt_1644.9.a: "他们的藩镇将被撤销。"
 mqt_1644.9.b: "暂且容他们安处。"

 mqt_1644.10.title: "三藩平定"
 mqt_1644.10.desc: "历经八年战事，叛乱已然崩溃。吴三桂已死，其孙在昆明自缢，南方诸省重新归于朝廷。"
 mqt_1644.10.historical_info: "1673-1681年的三藩之乱以昆明陷落告终；藩镇被撤销，南方归于直辖。"
 mqt_1644.10.a: "南方已平。"
 mqt_1644.10.b: "削其权柄，而不必尽灭。"

 mqt_1644.11.title: "收复台湾"
 mqt_1644.11.desc: "一位明郑水师将领愿为朝廷取岛，舰队已准备就绪。明郑据台是旧秩序的最后一处残迹，它将被终结。"
 mqt_1644.11.historical_info: "1683年施琅在澎湖击败郑氏水师，终结了明郑在台湾的统治。"
 mqt_1644.11.a: "此岛将归于朝廷。"
 mqt_1644.11.b: "此岛不值一支舰队。"

 mqt_1644.12.title: "博学鸿儒科"
 mqt_1644.12.desc: "朝廷提议召集前朝遗存的学者，特开一科考试，并任用他们编纂御定丛书。许多人拒不应召；应召者将获得官职与荣典。"
 mqt_1644.12.historical_info: "1679年的博学鸿儒科将前明遗民学者纳入清朝的任用，并促成了《四库全书》的编纂。"
 mqt_1644.12.a: "召用这些学者。"
 mqt_1644.12.b: "细查其著述有无悖逆。"

 # =========================================================
 # 王朝稳定度
 # =========================================================
 dynasty_stability_1644.1.title: "盛世"
 dynasty_stability_1644.1.desc: "仓廪充实，边徼安静，科场人才济济，朝贡之舟溯江而上。人们谈论我们的治世，如同谈论古人一般。"
 dynasty_stability_1644.1.a: "天命眷顾本朝。"

 dynasty_stability_1644.2.title: "隐忧"
 dynasty_stability_1644.2.desc: "征兆含混不明，奏疏却愈发大胆。尚无不可补救之弊，然而朝廷知道太平与繁荣之间的分别。"
 dynasty_stability_1644.2.a: "情势比表面更糟。"
 dynasty_stability_1644.2.b: "我们经历过更坏的。"

 dynasty_stability_1644.3.title: "天命动摇"
 dynasty_stability_1644.3.desc: "山中盗匪遍地，国库空虚，官员公然议论君上之失。百姓开始追问：本朝是否还配得上天子之名。"
 dynasty_stability_1644.3.a: "本朝须自省。"
 dynasty_stability_1644.3.b: "将颁罪己诏。"

 dynasty_stability_1644.4.title: "亡国之兆"
 dynasty_stability_1644.4.desc: "各省公然叛乱，军队已不可恃，世家大族正在私下为自己作打算。王朝崩溃的种种征兆同时显现。"
 dynasty_stability_1644.4.a: "我们必须撑住。"
 dynasty_stability_1644.4.b: "大赦或可为我们争取时间。"

 dynasty_stability_1644.5.title: "改朝换代"
 dynasty_stability_1644.5.desc: "天命已离此室而去。王朝的宗庙已毁，都城已失，问题不再是王朝会不会亡，而是由谁来取代它。"
 dynasty_stability_1644.5.a: "另立新朝。"
 dynasty_stability_1644.5.b: "让王朝有尊严地终结。"
 dynasty_stability_1644.5.c: "我们将重振本室的气运。"

 dynasty_stability_1644.6.title: "新朝肇建"
 dynasty_stability_1644.6.desc: "社稷已重建，新元号已颁行。百官已宣誓就职，军队已重新入籍，而百姓——一如既往——将静观新朝是否比旧朝更好。"
 dynasty_stability_1644.6.a: "一个新时代开始了。"
 dynasty_stability_1644.6.b: "天命重新归于我们。"

 dynasty_stability_1644.7.title: "前朝余孽"
 dynasty_stability_1644.7.desc: "仍有人不肯接受新秩序——旧臣、士人与故朝的军官。他们聚集山中，以密文通信，称我们为篡逆。"
 dynasty_stability_1644.7.a: "将他们缉捕。"
 dynasty_stability_1644.7.b: "授之以官。"

 # =========================================================
 # 新增中华王朝交互
 # =========================================================
 enfeoff_tributary_king: "册封朝贡国国王"
 enfeoff_tributary_king_desc: "授予朝贡国君主册封之诏、印信，以及中华天下秩序中的位号。"
 revoke_fanwang: "削藩"
 revoke_fanwang_desc: "削减宗室藩王的土地、名号与特权，以为其余藩王之戒。"
 force_gaitu_guiliu: "改土归流"
 force_gaitu_guiliu_desc: "废除一处土司，将其土地直接纳入帝国的常设行政。"
 grant_amnesty_to_rebels: "招安"
 grant_amnesty_to_rebels_desc: "若叛军首领肯放下兵器，则予以赦免并授以官职。"
 bestow_imperial_surname: "赐姓"
 bestow_imperial_surname_desc: "赐予受宠之君主以皇室之姓，以其家族与我室结下不可断绝的荣典之谊。"

 # =========================================================
 # 皇帝行动
 # =========================================================
 issue_edict_of_self_blame: "颁罪己诏"
 issue_edict_of_self_blame_desc: "皇帝将天下的灾祸归咎于己身，并承诺改革。此举有损威望，或可重获民心。"
 proclaim_great_amnesty: "大赦天下"
 proclaim_great_amnesty_desc: "除罪大恶极者外，普行赦免，颁行天下。"
 order_tax_remission: "蠲免赈灾"
 order_tax_remission_desc: "蠲免受灾各省的赋税，并开仓赈济贫民。"
 conduct_imperial_audit: "京察大计"
 conduct_imperial_audit_desc: "考核京官与外官之簿籍与操守。"
 undertake_imperial_tour: "巡狩"
 undertake_imperial_tour_desc: "皇帝以仪仗巡行各省，示民以君容，并察核官员之治绩。"
 proclaim_imperial_call_to_arms: "讨逆檄文"
 proclaim_imperial_call_to_arms_desc: "颁下檄文，号召每一位忠臣与藩属为天子之业执戈而起。"
 proclaim_imperial_call_to_arms_tt: "王朝的每一位成员都将被号召响应天子的征召。"
 present_captives_at_ancestral_temple: "献俘告庙"
 present_captives_at_ancestral_temple_desc: "将大捷告于太庙，并按礼制献上敌方首领。"

 # =========================================================
 # 新增静态修正
 # =========================================================
 imperial_favour: "天恩浩荡"
 imperial_favour_desc: "皇帝的恩宠加于我方，我方在诸藩属中的地位亦因此更佳。"
 imperial_investiture: "册封藩国"
 imperial_investiture_desc: "我方持有天子颁下的诏书与印信，统治在众人眼中因而名正言顺。"
 fanwang_reduced: "削藩"
 fanwang_reduced_desc: "我方的土地与特权已为朝廷削减，势力大不如前。"
 imperial_amnesty: "招安"
 imperial_amnesty_desc: "皇帝已赦免我方的叛乱，并将我方纳入其任用。"
 imperial_surname_bestowed: "赐姓"
 imperial_surname_bestowed_desc: "朝廷以其本姓加恩于我室，结下不可断绝的荣典之谊。"
 imperial_call_to_arms: "讨逆檄文"
 imperial_call_to_arms_desc: "帝国已号召执戈，凡忠臣皆当响应。"
 answered_the_call_to_arms: "应诏勤王"
 answered_the_call_to_arms_desc: "我方已响应天子的征召，派兵赴其旗号之下。"
 captives_presented_at_the_temple: "献俘告庙"
 captives_presented_at_the_temple_desc: "大捷已告于太庙，献捷之礼亦已举行。"
 dynasty_golden_age: "盛世"
 dynasty_golden_age_desc: "本朝气运正盛；国库充盈，边境安静，皇位稳固。"
 dynasty_peace_and_prosperity: "承平"
 dynasty_peace_and_prosperity_desc: "天下太平，年成丰稔。"
 dynasty_creeping_decline: "隐忧"
 dynasty_creeping_decline_desc: "表面上尚无大弊，然而政事的机杼正在无声地松弛。"
 dynasty_mandate_shaken: "天命动摇"
 dynasty_mandate_shaken_desc: "天象与奏疏都在暗示，本朝已失上天之信。"
 dynasty_on_the_brink: "亡国之兆"
 dynasty_on_the_brink_desc: "本朝立于崩溃之边缘；叛乱、财政与党争同时相逼。"
 imperial_apology_edict: "罪己诏"
 imperial_apology_edict_desc: "皇帝已把天下的过失归于己身，民心稍安。"
 great_amnesty: "大赦天下"
 great_amnesty_desc: "普行赦免之诏已颁行天下。"
 imperial_audit: "京察大计"
 imperial_audit_desc: "官员的簿籍与操守已经考核，吏治因而较为清明。"
 war_levies_imposed: "加派"
 war_levies_imposed_desc: "为军需所迫，已在各省加征额外赋税。"
 tax_remission_and_relief: "蠲免赈灾"
 tax_remission_and_relief_desc: "受灾各省的赋税已获蠲免，仓廪亦已开启。"
 imperial_tour: "巡狩"
 imperial_tour_desc: "皇帝已亲临各省，官员因而不敢懈怠。"
 new_dynasty_consolidation: "新朝鼎革"
 new_dynasty_consolidation_desc: "新的皇室正在稳固其对天下的治理。"
 new_era_proclaimed: "改元建号"
 new_era_proclaimed_desc: "新的元号已经颁行，历数自此重新开始。"
 loyalists_of_the_old_dynasty: "前朝余孽"
 loyalists_of_the_old_dynasty_desc: "仍有人不肯接受新秩序，暗中与之作对。"
 mandate_of_heaven_bestowed: "天命所归"
 mandate_of_heaven_bestowed_desc: "上天已将此室付以天命，天下亦已承认。"


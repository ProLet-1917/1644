l_simp_chinese:
 cossack_hetmanate_reform: "盖特曼政府"
 cossack_hetmanate_reform_desc: "The government of Hetman was one led by Hetman himself. Hetman was mainly elected into office."
 landless_adventurer_reform: "无地冒险者"
 landless_adventurer_reform_desc: "Adventurers can usually consist of a wide variety of people, ranging from nobles who have lost their territories to explorers, those who aim to conquer their own lands, or various bandits."
 an_army_owned_country: "拥有国家的军队"
 an_army_owned_country_desc: "Prussia was usually referred to as a country "owned by the army" due to its unique status as an army state."
 rebuild_the_theme_system: "重建的军区系统"
 rebuild_the_theme_system_desc: "这是一种由省级总部和军队组成的体系，由一位肩负双重职责的统帅领导，其职责包括保护当地民众以及根据[GetCountry('MOI').GetFlavorRank)]的指示树立权威。这一体系取代了戴克里先时期的省级行政管理，并且自此一直服务于我们的人民。"
 diverse_society: "多元化社会"
 diverse_society_desc: "我们社会的多元化可以有效的吸引在其它地区遭受压迫的人民迁移到我们的领土上，这将为我们带来更多的人口。"
 klephts_society: "克莱夫特社会"
 klephts_society_desc: "克莱夫特组成了我们国家重要的一部分，他们保卫着我们的土地，维持了我们国家的独立"

 moi_protect_klephts_right: "克莱夫特受保护权"
 moi_protect_klephts_right_desc: "克莱夫特作为我们抵抗敌人入侵的游击者，我们将会保护每一个抵达我国的克莱夫特并给予他们特殊地位。"
 legacy_of_the_romans: "罗马人的传统"
 legacy_of_the_romans_desc: "尽管我们曾经强大的帝国早已不复存在，但是作为罗马人，我们继承了我们曾经的传统，并将传承下去。"
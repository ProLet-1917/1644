l_simp_chinese:
 bookmark_1337_name: "百年战争（不推荐）"
 bookmark_1337_desc: "欧洲因王朝纷争而分裂，黑死病正悄然逼近。从金帐汗国的草原到初现雏形的意大利共和国，每个王国都面临着十字路口的抉择。"
 bookmark_1644_name: "全面危机"
 bookmark_1644_desc: "明王朝已在崩溃边缘，而在欧洲，宗教战争仍然在持续，欧洲的强权都被卷入一场又一场。新航路的开辟带来了大量的财富，随着一天天过去，世界的联系正在变得越发紧密。"
 # =========================================================
 # 0.5 版政府改革（government_reforms/0_5_reforms.txt）
 # =========================================================
 the_chinese_emperor: "中国皇帝"
 the_chinese_emperor_desc: "天子临御中土及其一切臣服之地。王朝的稳定度即是其天命的度量，而帝国则被组织为一个以皇帝为至尊的神圣秩序。"
 the_chinese_warlords: "中国军阀"
 the_chinese_warlords_desc: "皇位空悬，各省只听从自己的将领。权威属于能养活、能发饷最多兵马的人。"
 yingzhuangzhi: "营庄制"
 yingzhuangzhi_desc: "士兵被安置于土地之上并以其自养，于是军队所费于国库者甚少，而乡野亦被犁锄所驯。这是一支贫弱的军队，却是一支廉价的军队。"
 fanwang_reform: "藩王制"
 fanwang_reform_desc: "宗室诸王以世袭之权握有其藩地，以天子之名屏藩边陲，并因其忠诚而受岁给。这是亲族的屏障，也是皇位的隐忧。"

 # =========================================================
 # 意大利统一 - 国际组织与和平条约
 # =========================================================
 italy_unification_union_desc: "意大利诸邦集结于其中最强者之下，只为将这座半岛建成一个单一的民族国家。"
 give_up_leader_of_italy_unification_union_desc: "战败的一方放弃领导意大利统一的主张，被降为意大利诸邦中的普通一员。"

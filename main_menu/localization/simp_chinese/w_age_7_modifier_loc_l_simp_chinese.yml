l_simp_chinese:
 # =========================================================
 # 第七时代核心静态修正
 # =========================================================
 second_french_empire: "第二帝国"
 second_french_empire_desc: "以公民投票为基础的帝国：国内秩序，国外荣光，以及一位向人民负责的皇帝。"
 revanchism_against_germany: "复仇主义"
 revanchism_against_germany_desc: "失去的省份并未被遗忘，每一本教科书都在教授那条本应如此的边界线。"
 paris_commune_crushed: "公社被镇压"
 paris_commune_crushed_desc: "首都的起义已被血腥扑灭，军队与有产阶层由此明白了自己能做到什么。"
 french_colonial_party: "殖民党"
 french_colonial_party_desc: "议员、军官与商人已把殖民扩张变成了一项国家事业。"
 french_master_painter: "一位大师级画家"
 french_master_painter_desc: "他的画布改变了欧洲观看光本身的方式。"
 french_man_of_letters: "一位文豪"
 french_man_of_letters_desc: "他的小说在各省被阅读，在每一处沙龙被争论。"
 mandate_of_heaven_upheld: "天命未改"
 mandate_of_heaven_upheld_desc: "征兆吉利，皇位稳固于臣民的爱戴之中。"
 mandate_of_heaven_failing: "天命将倾"
 mandate_of_heaven_failing_desc: "种种迹象皆不利于我方：饥荒、水患与叛乱同至一季。"
 new_dynasty_enthroned: "新朝鼎革"
 new_dynasty_enthroned_desc: "社稷已重建，新的皇室已接掌天下的治理。"
 dynastic_collapse: "王朝倾覆"
 dynastic_collapse_desc: "国家的机杼已然卡死；各省已不受节制，王朝之名被人以轻蔑的口吻提起。"
 dynastic_restoration: "中兴之治"
 dynastic_restoration_desc: "本室已渡过风暴，天下再度被整肃就序。"

 # =========================================================
 # 第七时代国别风味（DHE）
 # =========================================================
 # --- 哈布斯堡君主国 ---
 habsburg_reform_era: "改革时代"
 habsburg_reform_era_desc: "宪法、学校与铁路已被颁行，君主国为自己买到了时间。"
 habsburg_military_absolutism: "军事专制"
 habsburg_military_absolutism_desc: "军队维系着君主国，而君主国就是这支军队。"
 austro_hungarian_compromise: "二元君主国"
 austro_hungarian_compromise_desc: "一位君主之下的两个国家：这一妥协安抚了马扎尔人，也稳住了帝国。"
 balkan_annexation_crisis: "巴尔干危机"
 balkan_annexation_crisis_desc: "我们在巴尔干的进取政策惊动了欧洲的每一个强权。"
 viennese_master_composer: "维也纳乐派大师"
 viennese_master_composer_desc: "这座音乐之都又孕育出一位世人不会忘记的作曲家。"
 viennese_secession_painter: "分离派画家"
 viennese_secession_painter_desc: "他与学院决裂，以金色与装饰描绘出现代人的灵魂。"
 viennese_scientific_school: "维也纳学派"
 viennese_scientific_school_desc: "首都的一位医生创立了一门关于心灵的新科学，医学院为此分裂。"

 # --- 俄罗斯 ---
 crimean_war_humiliation: "克里米亚之耻"
 crimean_war_humiliation_desc: "我军在南方战败，全世界都看清了我们的落后。"
 emancipation_of_the_serfs: "解放农奴"
 emancipation_of_the_serfs_desc: "四千万灵魂连同土地一并获得自由，旧的农业秩序就此终结。"
 serfdom_upheld: "维持农奴制"
 serfdom_upheld_desc: "贵族保住了劳力，农民保住了他们的怨愤。"
 trans_siberian_railway: "西伯利亚大铁路"
 trans_siberian_railway_desc: "七千俄里钢铁将太平洋与欧洲相连，使我们在东方的力量成为现实。"
 october_manifest: "十月宣言"
 october_manifest_desc: "宪法与杜马已被颁行，专制制度第一次受到了限制。"
 stolypin_reaction: "斯托雷平反动"
 stolypin_reaction_desc: "绞架与土地改革一同折断了革命的脊梁。"
 russian_man_of_letters: "俄国小说家"
 russian_man_of_letters_desc: "他关于战争、家庭与信仰的巨著，从彼得堡一直读到西伯利亚。"
 russian_master_composer: "俄国作曲家"
 russian_master_composer_desc: "他把俄罗斯的旋律与西方的音乐厅结合在一起，世界为之倾听。"

 # --- 奥斯曼帝国 ---
 tanzimat_reforms: "坦志麦特"
 tanzimat_reforms_desc: "法律、军队、财政与学校皆已重组，全体臣民被宣告在法律面前平等。"
 ottoman_old_order: "旧制"
 ottoman_old_order_desc: "乌理玛与世家大族把帝国维持在四百年所造就的形态之中。"
 ottoman_constitution: "奥斯曼宪法"
 ottoman_constitution_desc: "成文宪法与议会已被颁行，苏丹的权力终于有了界限。"
 ottoman_absolutism: "奥斯曼专制"
 ottoman_absolutism_desc: "议会已被解散，苏丹以敕令与警察独治天下。"
 balkan_retreat: "巴尔干退却"
 balkan_retreat_desc: "一个又一个省份接连失去，帝国正向其腹地收缩。"
 empty_treasury: "空虚的国库"
 empty_treasury_desc: "国家付不出官吏与士兵的薪饷，只能以毁灭性的利率借债。"
 ottoman_imperial_architect: "帝国建筑师"
 ottoman_imperial_architect_desc: "他在博斯普鲁斯海峡畔的宫殿将奥斯曼的形制与欧洲的工程结合，帝国又有了形象。"

 # --- 日本 ---
 meiji_restoration: "明治维新"
 meiji_restoration_desc: "幕府被废，天皇复位，日本正被从根基上重新塑造。"
 bakufu_preserved: "幕府维持"
 bakufu_preserved_desc: "旧秩序得以保全，诸藩保留着他们的特权与纷争。"
 iwakura_mission: "岩仓使团"
 iwakura_mission_desc: "我们的政治家与学生遍访欧美，把可用的东西带回了国。"
 leave_asia_join_europe: "脱亚入欧"
 leave_asia_join_europe_desc: "日本将被当作欧洲强国对待，并且将如欧洲强国一般行事。"
 preserve_asian_traditions: "保存亚洲传统"
 preserve_asian_traditions_desc: "我们将取西方的机器，而不取其灵魂。"
 japanese_imperial_expansion: "帝国扩张"
 japanese_imperial_expansion_desc: "我们的陆海军已准备就绪，而邻国尚未。"
 ukiyo_e_master_modifier: "浮世绘大师"
 ukiyo_e_master_modifier_desc: "他描绘浮世的版画被当作包装纸出口，却被当作杰作收藏。"

 # --- 美国 ---
 westward_expansion: "西进运动"
 westward_expansion_desc: "定居者、测量员与铁路正把边疆推向大陆的另一端。"
 civil_war_and_emancipation: "联邦得以保全"
 civil_war_and_emancipation_desc: "叛乱已被平定，奴隶制已被废除，共和国以武力重新合而为一。"
 compromise_of_the_sections: "各部分的妥协"
 compromise_of_the_sections_desc: "围绕奴隶制的争执被交易与让步暂时搁置。"
 gilded_age: "镀金时代"
 gilded_age_desc: "铁路、钢铁与石油造就了世人前所未见的财富。"
 progressive_era: "进步主义时代"
 progressive_era_desc: "托拉斯受到规制，城市得到整顿，选举权得以扩大。"
 american_overseas_empire: "海外帝国"
 american_overseas_empire_desc: "共和国如今拥有自己海域之外的岛屿，以及一支守卫它们的海军。"
 anti_imperialist_league: "反帝国主义同盟"
 anti_imperialist_league_desc: "公民们坚称：共和国不统治殖民地。"
 american_man_of_letters: "美国之声"
 american_man_of_letters_desc: "他的著作给了这个国家一种既非英国式亦非乡土的文学。"
 american_inventor_modifier: "发明家"
 american_inventor_modifier_desc: "他把发明本身变成了一种产业，世界因此被点亮。"
 american_industrial_laboratories: "工业实验室"
 american_industrial_laboratories_desc: "大公司如今自设实验室，发明成了一门生意。"

 # --- 西班牙 ---
 carlist_wars: "卡洛斯战争"
 carlist_wars_desc: "继承权存在争议，旧秩序已为王座与祭坛举起武器。"
 disaster_of_1898: "1898年的灾难"
 disaster_of_1898_desc: "旧帝国的最后残片在一个夏天之内丧失，国家必须重新认识自己。"
 spanish_restoration_compromise: "复辟妥协"
 spanish_restoration_compromise_desc: "各党派同意轮流执政，政治变得和平——虽然并不诚实。"
 catalan_modernisme_architect: "巴塞罗那的建筑师"
 catalan_modernisme_architect_desc: "他的建筑仿佛从大地中生长而出，这座城市正在我们眼前被重塑。"

 # --- 葡萄牙 ---
 portuguese_constitutional_monarchy: "立宪君主制"
 portuguese_constitutional_monarchy_desc: "一部宪章与一个议会了结了专制派与自由派之间的漫长争执。"
 pink_map_plan: "粉红地图"
 pink_map_plan_desc: "我们的探险者已勘测出一条从海岸到海岸的非洲地带，我们决意声索它。"
 portuguese_man_of_letters: "葡萄牙诗人"
 portuguese_man_of_letters_desc: "他书写“萨乌达德”，书写这个国家消逝的伟大。"

 # --- 尼德兰 ---
 dutch_trade_reorientation: "贸易转向"
 dutch_trade_reorientation_desc: "南方诸省已去，阿姆斯特丹的商人望向大海与东印度。"
 dutch_liberal_reform: "自由主义改革"
 dutch_liberal_reform_desc: "一部自由主义宪法已被颁行，议院获得了实权。"
 cultivation_system: "文化系统"
 cultivation_system_desc: "东印度被要求种植欧洲会购买的东西，利润流入国库。"
 ethical_policy: "伦理政策"
 ethical_policy_desc: "东印度将同时为岛民与母国的利益而受治理。"
 dutch_master_painter: "荷兰画家"
 dutch_master_painter_desc: "他把圩田的光线化为全然属于自己的东西，生前却几乎一幅画也没卖出去。"

 # --- 瑞典 ---
 swedish_era_of_liberty: "自由时代"
 swedish_era_of_liberty_desc: "各等级治理国家，出版自由，王室专制的时代已经结束。"
 swedish_scandinavian_union: "斯堪的纳维亚合作"
 swedish_scandinavian_union_desc: "北方诸王国彼此靠得更近，半岛因此更为安宁。"
 swedish_industrial_breakthrough: "工业突破"
 swedish_industrial_breakthrough_desc: "铁矿、木材与工程使一个小国成为现代经济体。"
 swedish_man_of_letters: "瑞典小说家"
 swedish_man_of_letters_desc: "她把外省小镇变成了整个人间喜剧的舞台。"

 # --- 波兰-立陶宛 ---
 polish_national_rising: "民族起义"
 polish_national_rising_desc: "国家已被瓜分却尚未死去，它再次为独立而起。"
 organic_work: "有机劳动"
 organic_work_desc: "学校、银行、铁路与合作社：民族正从内部被壮大。"
 polish_master_composer: "波兰作曲家"
 polish_master_composer_desc: "他把乡间的舞曲化为全欧洲赞赏的民族音乐。"

 # --- 意大利 ---
 risorgimento_legacy: "复兴运动的遗产"
 risorgimento_legacy_desc: "民族已经建成，如今的任务是造就意大利人。"
 italian_transformismo: "变通主义"
 italian_transformismo_desc: "政府由议员的管理而成败，这套制度以其自身的方式运转着。"
 italian_southern_question: "南方问题"
 italian_southern_question_desc: "南方贫困，道路破败，大庄园由无地劳工耕作；王国继承了一个难题。"
 italian_brigandage_suppressed: "盗匪已平"
 italian_brigandage_suppressed_desc: "山中的匪帮已被军队击破，南方虽不安分却也安静。"
 italian_master_composer: "意大利作曲家"
 italian_master_composer_desc: "他的歌剧在第二场演出之前就已在街头传唱。"

 # --- 德国 ---
 german_empire_proclaimed: "帝国宣告成立"
 german_empire_proclaimed_desc: "一个由诸侯、军队与大学组成的民族，已成为单一的帝国。"
 german_liberal_empire: "自由的帝国"
 german_liberal_empire_desc: "帝国拥有一个有实权的议会，以及一个会用这些权力的报界。"
 land_of_poets_and_thinkers: "诗人与思想家的国度"
 land_of_poets_and_thinkers_desc: "我们的大学是世界最好的，我们的工业依靠实验室生存。"
 german_militarism: "德国军国主义"
 german_militarism_desc: "军队是民族的学校，而民族被组织成一支军队。"
 weltpolitik: "世界政策"
 weltpolitik_desc: "一支舰队、一些殖民地，以及在每一场谈判中的一席之地：德国要求阳光下的地盘。"
 german_continental_policy: "大陆政策"
 german_continental_policy_desc: "德国是大陆强国，其力量在于陆军与外交，而非舰队。"
 german_master_composer: "德国作曲家"
 german_master_composer_desc: "他的乐剧改变了音乐可以是什么。"

 # --- 英国 ---
 victorian_imperial_zenith: "帝国的鼎盛"
 victorian_imperial_zenith_desc: "世界上四分之一的人口与三分之一的贸易都在我们的旗帜之下。"
 little_england_policy: "小英格兰"
 little_england_policy_desc: "帝国是负担与分心之物；国家的事务在国内。"
 british_raj: "英属印度"
 british_raj_desc: "印度由伦敦直接治理，由王室自己的官吏与王室自己的军队。"
 company_rule_preserved: "公司统治维持"
 company_rule_preserved_desc: "公司仍以王室之名治理印度，并且仍然有利可图。"
 repeal_of_the_corn_laws: "自由贸易"
 repeal_of_the_corn_laws_desc: "为工业城市提供廉价面包，而地主阶层不得不让步。"
 protectionist_lobby: "保护主义势力"
 protectionist_lobby_desc: "地主阶层保住了关税，乡间保住了地租。"
 british_man_of_letters: "维多利亚时代的小说家"
 british_man_of_letters_desc: "他的小说按月分册出版，被各个阶层争相阅读，而他以法院与学校的种种不公为题材。"

 # =========================================================
 # 明清交替与王朝稳定度
 # =========================================================
 qing_queue_decree: "剃发令"
 qing_queue_decree_desc: "凡臣民皆须剃去前额头发、依制留辫，违者处死。"
 qing_queue_deferred: "剃发暂缓"
 qing_queue_deferred_desc: "此令暂且从宽，南方因此稍安。"
 yangzhou_massacre: "扬州十日"
 yangzhou_massacre_desc: "此城被作为儆戒，江南士人至今未忘。"
 yangzhou_pacified: "扬州招抚"
 yangzhou_pacified_desc: "此城得以保全，士人得以收服，征服因此有了较温和的面目。"
 dashun_leaderless: "大顺群龙无首"
 dashun_leaderless_desc: "闯王已死，其军四散，这场浩大的起义已然破碎。"
 dashun_guerrilla_warfare: "大顺转战山野"
 dashun_guerrilla_warfare_desc: "余部退入山林与道路之间，再难被擒获。"
 daxi_leaderless: "大西群龙无首"
 daxi_leaderless_desc: "张献忠已死，其诸将正为余产争执不休。"
 daxi_remnants_alliance: "大西余部联明"
 daxi_remnants_alliance_desc: "西军残部已与明室遗臣结盟，共抗入侵者。"
 two_princes_slain: "两蹶名王"
 two_princes_slain_desc: "敌方两位亲王统帅在同一年内先后阵亡，复明大业有了希望。"
 northern_expedition: "北伐"
 northern_expedition_desc: "一支水陆大军已溯江而上，直取旧都。"
 maritime_defence: "固守海疆"
 maritime_defence_desc: "海岸由设防的港口与一支不肯被诱入内陆的舰队守卫。"
 court_in_exile: "行在异邦"
 court_in_exile_desc: "皇帝成了异国的流亡者，而这个政府是帐篷里的政府。"
 last_stand_in_yunnan: "死守云南"
 last_stand_in_yunnan_desc: "西南的群山是天然的要塞，遗臣们决意守住它。"
 coastal_evacuation: "迁界禁海"
 coastal_evacuation_desc: "沿海已被迁空，海上往来已被禁止，只为把岛屿困死。"
 maritime_trade_opened: "开海贸易"
 maritime_trade_opened_desc: "港口重新开放，海关又忙碌起来。"
 three_feudatories_rebellion: "三藩之乱"
 three_feudatories_rebellion_desc: "南方藩镇已举兵反抗朝廷，八年战事由此展开。"
 three_feudatories_leader: "三藩之首"
 three_feudatories_leader_desc: "叛乱的藩王已结成同盟，并拥有自己的军队。"
 feudatories_appeased: "姑息藩镇"
 feudatories_appeased_desc: "藩镇暂且得以安处，藩王们心满意足。"
 feudatories_abolished: "撤藩"
 feudatories_abolished_desc: "藩镇已被撤销，南方重新归于朝廷。"
 feudatories_reduced: "削减藩镇"
 feudatories_reduced_desc: "藩王保留了名号，却已被拔去了爪牙。"
 conquest_of_taiwan: "收复台湾"
 conquest_of_taiwan_desc: "此岛已归于朝廷，旧秩序的最后残迹就此终结。"
 boxue_hongru_examination: "博学鸿儒科"
 boxue_hongru_examination_desc: "前朝遗存的学者已被召集、考试并录用。"
 literary_inquisition: "文字狱"
 literary_inquisition_desc: "著述因悖逆而受审查，士人已学会谨慎下笔。"

 # =========================================================
 # 第七时代倾向科技（原有五条）
 # =========================================================
 manage_oversea_territories_advance: "管理海外领地"
 manage_oversea_territories_advance_desc: "远方的属地行政被集中管理，与它们之间的海上交通变得更为廉价可靠。"
 national_debt_advance: "国家公债"
 national_debt_advance_desc: "国家以永久的公债为战争筹款，债券市场由此成为政策的一部分。"
 overseas_expantion_advance: "海外扩张"
 overseas_expantion_advance_desc: "我们的商人与舰队为寻求市场与加煤站而驶向更远的海域。"
 overseas_conscription_advance: "海外征兵"
 overseas_conscription_advance_desc: "设在海外的募兵站为本土军队输送殖民地的人力。"
 enlistment_manual_advance: "操典"
 enlistment_manual_advance_desc: "为每一个战列团规定统一的操练手册与编制。"

 # =========================================================
 # 后续新增的改革
 # =========================================================
 banner_modernization_reform: "旗制改革"
 banner_modernization_reform_desc: "汗国战士被编入世袭的旗籍，各有其土地、官长与名册。"


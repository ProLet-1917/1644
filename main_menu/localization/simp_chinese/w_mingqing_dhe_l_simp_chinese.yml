l_simp_chinese:
 # ===== 清 =====
 dhe_qing_1644.1.title: "摄政王"
 dhe_qing_1644.1.desc: "天下已定而未治。幼帝坐于尚不能自持的龙椅之上，其身后站着摄政王——正是他的旗兵击破了流寇，打开了长城的关隘。朝中有人主张将国政尽付于王；也有人低语：借出去的王座，是要不回来的。"
 dhe_qing_1644.1.historical_info: "多尔衮（1612-1650）自1643年起为顺治帝摄政，直至去世，是清军入关定鼎中原的主持者。"
 dhe_qing_1644.1.a: "命摄政王代天子理政。"
 dhe_qing_1644.1.b: "天子当亲政，亲王当效命。"
 dhe_qing_1644.2.title: "圈地令"
 dhe_qing_1644.2.desc: "随我们入关的旗人并无自己的土地。朝廷提议将京畿田亩划归旗人，并驱逐其上耕作的农夫。这是征服的旧例，也是残酷的旧例。"
 dhe_qing_1644.2.historical_info: "1644-1669年的圈地令为八旗圈占京畿大量农田，使数十万农民流离失所。"
 dhe_qing_1644.2.a: "旗人须有安身之地。圈地。"
 dhe_qing_1644.2.b: "田地应属于耕种它的人。"
 dhe_qing_1644.3.title: "剃发令"
 dhe_qing_1644.3.desc: "有人提议下令：凡男子皆须剃去前额之发、蓄留辫子，使人一望便知其为大皇帝之民。南方城镇已因这类传言而骚动。"
 dhe_qing_1644.3.historical_info: "1645年的剃发令激起广泛抵抗，以江阴、嘉定保卫战最为著名，后放宽为「三日剃发」。"
 dhe_qing_1644.3.a: "严行此令。天下一统，头亦一统。"
 dhe_qing_1644.3.b: "布告天下，但不缉拿拒剃者。"
 dhe_qing_1644.4.title: "顺治亲政"
 dhe_qing_1644.4.desc: "摄政之期已过。天子已届亲政之年，百官已受确认，玉玺已交入他本人手中。自此，帝国的诏令只出自一个意志。"
 dhe_qing_1644.4.historical_info: "多尔衮死后，顺治帝于1651年亲政。"
 dhe_qing_1644.4.a: "天子亲政。"
 dhe_qing_1644.5.title: "雅克萨与北界"
 dhe_qing_1644.5.desc: "哥萨克移民在黑龙江上筑起了堡垒，向我朝纳贡的当地部族纷纷抱怨其劫掠。沙皇的使节远在天边、回复迟缓，而用兵的季节很短。"
 dhe_qing_1644.5.historical_info: "清军于1685、1686年两次围攻雅克萨的俄军堡垒；1689年的《尼布楚条约》以黑龙江流域划定边界。"
 dhe_qing_1644.5.a: "拔其堡垒，以实力谈判。"
 dhe_qing_1644.5.b: "划定边界，让北方太平。"
 dhe_qing_1644.6.title: "多伦会盟"
 dhe_qing_1644.6.desc: "喀尔喀诸王公因准噶尔的侵扰而来多伦诺尔朝觐。大皇帝将在巨大的帐幕中与他们同宴，并依照我们的制度将他们编为旗分。"
 dhe_qing_1644.6.historical_info: "1691年的多伦会盟正式将喀尔喀蒙古贵族纳入清朝的盟旗制度。"
 dhe_qing_1644.6.a: "受其朝觐，授以旗分。"
 dhe_qing_1644.6.b: "让他们的王公保留本部——连同他们之间的纷争。"

 # ===== 顺 =====
 dhe_shun_1644.1.title: "均田免赋"
 dhe_shun_1644.1.desc: "我们的军队是靠一个承诺聚起来的：田归耕者，三年免赋。如今前朝的赋役黄册已在我们手中，而国库空空。这个承诺，是一副沉重的担子。"
 dhe_shun_1644.1.historical_info: "李自成「均田免赋」的口号在1643-1644年间为他的大顺政权赢得了北方的民心。"
 dhe_shun_1644.1.a: "信守承诺，三年免征。"
 dhe_shun_1644.1.b: "兵马未动粮草先行。征粮。"
 dhe_shun_1644.2.title: "追赃助饷"
 dhe_shun_1644.2.desc: "前明的官绅把白银藏在窖中，或将之送往乡间的亲族。我们的将领提议对他们用刑，直到他们交出银子——他们把这叫做「助饷」。"
 dhe_shun_1644.2.historical_info: "1644年的「追赃助饷」拷掠前明官绅以取其财，使华北士绅离心。"
 dhe_shun_1644.2.a: "用刑追赃。军队必须发饷。"
 dhe_shun_1644.2.b: "住手。我们需要的士人，比他们的银子更重要。"
 dhe_shun_1644.3.title: "李自成之死"
 dhe_shun_1644.3.desc: "大顺皇帝在湖广的山中被乡民武装所杀，其时他正带着少数人马觅食。军中尚不知情，朝中也不敢宣告。"
 dhe_shun_1644.3.historical_info: "李自成于1645年在湖北山中觅食时被地方武装所杀。"
 dhe_shun_1644.3.a: "秘不发丧，用他的名字维系这支军队。"
 dhe_shun_1644.3.b: "公布其死，另立新主。"
 dhe_shun_1644.4.title: "夔东十三家"
 dhe_shun_1644.4.desc: "在川湖之间的群山中，我们残余的队伍据守着任何军队都无法绕过的关隘。他们已开始耕垦山谷、扼守隘口——一年之内拔不掉，十年之内也拔不掉。"
 dhe_shun_1644.4.historical_info: "「夔东十三家」据守川鄂边界的山区抗击清军，直到1664年。"
 dhe_shun_1644.4.a: "守住隘口，耕垦山谷。我们等得起。"
 dhe_shun_1644.4.b: "与敌议抚。活着的忠臣，总比死了的好。"
 dhe_shun_1644.5.title: "忠贞营入楚"
 dhe_shun_1644.5.desc: "旧军的余部带着自己的旗号进入湖广，南方的明廷官员已派使者前来，提议共组阵线。他们称我们为兄弟，可他们的公文里写着「贼」。"
 dhe_shun_1644.5.historical_info: "大顺余部——其中以「忠贞营」为最——自1647年起与南明并肩抗清。"
 dhe_shun_1644.5.a: "答允南明。让我们共抗满洲。"
 dhe_shun_1644.5.b: "我们自有统属，自有恩仇。"

 # ===== 明 =====
 dhe_ming_1644.1.title: "南京的朝廷"
 dhe_ming_1644.1.desc: "北京陷落，天子殉国。逃出的诸臣带着印信聚集于南京，他们必须赶在消息传得更远之前，立一位藩王于龙椅之上。"
 dhe_ming_1644.1.historical_info: "1644年六月，弘光帝在南京即位，南明由此开始。"
 dhe_ming_1644.1.a: "拥立藩王，号召天下。"
 dhe_ming_1644.1.b: "先保安定江南。恢复之事可待一季。"
 dhe_ming_1644.2.title: "江北四镇"
 dhe_ming_1644.2.desc: "长江的防务系于四位将领及其私兵，他们把驻地当作自己的领地，只在合意时才听命于朝廷。他们保住了江南，而他们自己也知道这一点。"
 dhe_ming_1644.2.historical_info: "江北四镇是半独立的军事集团，把持弘光朝廷并严重削弱了它的权威。"
 dhe_ming_1644.2.a: "倚重四镇，让他们守江。"
 dhe_ming_1644.2.b: "削夺其兵，恢复朝廷权威。"
 dhe_ming_1644.3.title: "左良玉东下"
 dhe_ming_1644.3.desc: "镇守长江上游的左将军已率军东下，声称是去「清君侧」。他究竟是要救这个王朝，还是要据有它，南京无人能说清。"
 dhe_ming_1644.3.historical_info: "1645年左良玉东下南京，矛头指向马士英一党；其事败之后，长江防线空虚，遂为清军所乘。"
 dhe_ming_1644.3.a: "严旨命其回镇，违者以叛逆论。"
 dhe_ming_1644.3.b: "召其东来，予之朝中一席。"
 dhe_ming_1644.4.title: "江阴八十一日"
 dhe_ming_1644.4.desc: "长江边的一座县城关闭城门抗拒剃发令，由本县士绅主持固守。围城已历数周，全省都在观望：一城之民，能否抗拒一个帝国。"
 dhe_ming_1644.4.historical_info: "1645年江阴军民坚守八十一日抵抗清军，成为明遗民抗争的典范。"
 dhe_ming_1644.4.a: "当众褒奖，使天下皆知。"
 dhe_ming_1644.4.b: "能派多少救援便派多少，仅此而已。"
 dhe_ming_1644.5.title: "海上的国姓"
 dhe_ming_1644.5.desc: "郑氏以一支南方无人能敌的舰队据守着从厦门到海峡的沿海，其子已受赐国姓。他请求正式的委任，以及夺取大岛、驱逐荷兰人的自由。"
 dhe_ming_1644.5.historical_info: "郑成功（1624-1662）于1662年驱逐荷兰人据有台湾，使之成为明郑抗清的基地。"
 dhe_ming_1644.5.a: "赐以委任，让他去取台湾。"
 dhe_ming_1644.5.b: "让他守住大陆沿海；海岛可以等。"
 dhe_ming_1644.6.title: "播迁之廷"
 dhe_ming_1644.6.desc: "最后一个朝廷已被逐出云南，退入缅甸的群山，其臣僚或散或死。旧西营的将领仍据守着边境州县，他们询问：该如何是好。"
 dhe_ming_1644.6.historical_info: "永历帝于1659年逃入缅甸，1662年被移交清军并于昆明遇害，南明至此终结。"
 dhe_ming_1644.6.a: "随朝廷播迁。"
 dhe_ming_1644.6.b: "与大军立于西陲。王朝不是一处地方。"

 # ===== 西 =====
 dhe_xi_1644.1.title: "成都的龙椅"
 dhe_xi_1644.1.desc: "四川全境已在我们手中。诸将已在成都营建大殿，请我们即皇帝位，以便朝廷得以设官、军队得以定阶。"
 dhe_xi_1644.1.historical_info: "张献忠于1644年末在成都称帝，国号大西。"
 dhe_xi_1644.1.a: "即皇帝位。大西肇建。"
 dhe_xi_1644.1.b: "称王即可，把军队留在战场上。"
 dhe_xi_1644.2.title: "七杀碑"
 dhe_xi_1644.2.desc: "城中立起一方石碑，上刻「天生万物与人，人无一物与天，杀杀杀杀杀杀杀」。诸将说，必须让百姓知道抵抗的代价。"
 dhe_xi_1644.2.a: "让它立着。让他们读，让他们怕。"
 dhe_xi_1644.2.b: "推倒它。我们需要的是一省供养这支军队。"
 dhe_xi_1644.3.title: "江口沉银"
 dhe_xi_1644.3.desc: "装载着全川财货的船队沉没于江口浅滩，渔夫们知道沉船在哪里。军队询问是否可以打捞河床。"
 dhe_xi_1644.3.a: "打捞。一钱也不放过。"
 dhe_xi_1644.3.b: "让死者与他们的银子留在水里。"
 dhe_xi_1644.4.title: "西营与明"
 dhe_xi_1644.4.desc: "残余的队伍已南下，而南明朝廷仍守着天下的一角。诸将提议站在明一边，放下旧怨，共抗满洲。"
 dhe_xi_1644.4.a: "咽下旧怨。明与西共战。"
 dhe_xi_1644.4.b: "我们打自己的仗，守自己的省。"
 dhe_xi_1644.5.title: "大西皇帝之死"
 dhe_xi_1644.5.desc: "他在西充被流矢所中而亡——当时他只带少数人马出营察看地形。统领大军的四位将军已发誓，在继承之事底定之前秘不发丧。"
 dhe_xi_1644.5.historical_info: "张献忠于1647年1月在西充被清军箭矢射死；其四将军随后率军南下，与明联合。"
 dhe_xi_1644.5.a: "秘不发丧。四将军足以维系这支军队。"
 dhe_xi_1644.5.b: "公布死讯，退保云贵。"

 # ===== 新增静态修正 =====
 qing_dorgon_regency: "摄政王理政"
 qing_dorgon_regency_desc: "摄政王代天子理政，天下官署皆奉其印信。"
 qing_tonsure_order: "严行剃发令"
 qing_tonsure_order_desc: "凡男子皆须剃去前额之发、蓄留辫子，此令由军队强制执行。"
 shun_leadership_crisis: "群龙无首"
 shun_leadership_crisis_desc: "大顺皇帝已死，诸将互不统属；这支军队只靠劫掠与惯性维系。"
 xi_four_generals: "四将军分统"
 xi_four_generals_desc: "统领西营的四位将军，将政务与土地分而治之。"

# ===== 西：补充历史注释 =====
 dhe_xi_1644.2.historical_info: "相传张献忠在成都所立的「七杀碑」见于后世记载，真伪存疑；它成为其统治四川期间屠戮之事的象征。"
 dhe_xi_1644.3.historical_info: "1646年张献忠的运银船队在江口沉没；自2017年起考古工作者从河床中打捞出大量白银。"
 dhe_xi_1644.4.historical_info: "张献忠死后，其四将军——孙可望、李定国、刘文秀、艾能奇——率西营南下，与南明联合抗清。"
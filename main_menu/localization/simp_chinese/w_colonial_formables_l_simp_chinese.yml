l_simp_chinese:
 # ===== Anno 1644 新增可成立国家（引擎键为 <KEY>_f / <KEY>_f_desc）=====
 VOB_f: "巴西"
 VOB_f_desc: "南十字之下的广袤土地因蔗糖、黄金与牛群而富庶，其船长们已不再向里斯本请示。让总督区就此终结，让巴西作为列强之一立国。"
 LPL_f: "拉普拉塔"
 LPL_f_desc: "波托西的白银顺流而下汇入大河口的巨湾，潘帕斯的牛群供养着沿海城镇。在布宜诺斯艾利斯与蒙特维的亚，一个拉普拉塔的新国家可以被宣告成立。"
 VOP_f: "秘鲁"
 VOP_f_desc: "秘鲁总督区依靠波托西的矿山与安第斯的劳力而立。利马的土生白人早已习惯治理，只需宣布自己是一个国家，它便是了。"
 NSP_f: "新西班牙"
 NSP_f_desc: "自墨西哥城起，总督们统治着半个大陆。萨卡特卡斯的白银、北方的道路与谷地的大庄园，已使这块殖民地强大到足以自立。"
 NEN_f: "新英格兰"
 NEN_f_desc: "北部海岸的城镇靠着礼拜堂、学校与船只生活。它们的特许状本就是自治的凭据，只差名义；而当那一天到来时，它们将不再需要特许状。"
 NFR_f: "新法兰西"
 NFR_f_desc: "圣劳伦斯的毛皮贸易把移民推向西部，河谷的农场如今供养着他们。一个美洲的法兰西民族已在此扎根，不会再被移走。"
 GRN_f: "新格拉纳达"
 GRN_f_desc: "波哥大高地扼守加勒比与太平洋之间的道路，穆索的祖母绿矿充實着国库。一个新格拉纳达王国已准备好被宣告。"
 VNZ_f: "委内瑞拉"
 VNZ_f_desc: "珍珠海岸与炎热带的可可种植园使加拉加斯成为商人之城。让委内瑞拉做自己的主人。"
 ECU_f: "厄瓜多尔"
 ECU_f_desc: "赤道上的群山环抱着基多与瓜亚基尔，沿海的可可被运往世界。在安第斯与大海之间，一个国家可在此宣告成立。"
 BLV_f: "玻利维亚"
 BLV_f_desc: "上秘鲁是帝国最富的矿业省份，波托西的银山无与伦比。这座因矿而富的土地，有资格自理其政。"
 CLH_f: "智利"
 CLH_f_desc: "北有沙漠、南有森林，西临大海、东阻安第斯，智利长成了一片有自己的脾性的土地。让它成为一个国家。"
 URG_f: "乌拉圭"
 URG_f_desc: "东岸之地及其蒙特维的亚良港位于拉普拉塔北岸。牛群与港口足以支撑一个自己的国家。"
 PGY_f: "巴拉圭"
 PGY_f_desc: "亚松森是内陆最古老的城市之一，耶稣会传教区的瓜拉尼人已成其民。巴拉圭可以自立。"
 UCA_f: "中美洲联合省"
 UCA_f_desc: "危地马拉、圣萨尔瓦多、洪都拉斯、尼加拉瓜与哥斯达黎加共有一个都督区、一条海岸线，以及对外来统治的恐惧。与其让五方争吵，不如结成一体。"
 GTM_f: "危地马拉"
 GTM_f_desc: "旧日的危地马拉都督区保有法院、铸币厂与检审庭，其首府三百年来一直是政府所在地。它自身也可以成为一个国家。"
 COS_f: "哥斯达黎加"
 COS_f_desc: "内陆肥沃的高地远离矿区与大道，养出了一个自耕农的省份。让哥斯达黎加成为自己的国家。"
 NIC_f: "尼加拉瓜"
 NIC_f_desc: "大湖与横越地峡的通道，一直使尼加拉瓜成为往来之地。它也可以是一个国家，而不只是一条路。"
 CUB_f: "古巴"
 CUB_f_desc: "安的列斯群岛中最大的一座，拥有加勒比最好的港湾与无尽的甘蔗园，已成为西属印度群岛的基石。古巴可以取得国家的地位。"
 HTI_f: "海地"
 HTI_f_desc: "伊斯帕尼奥拉岛的西部以蔗糖与咖啡供养世界，而耕作者并非生来就该戴镣铐。他们以刀剑夺得自由，绝不会再交还。"
 SDM_f: "圣多明各"
 SDM_f_desc: "新世界最古老的城市坐落在伊斯帕尼奥拉岛东岸，内陆的牧牛场使它成为一个自耕农之地。让它自主。"
 QUE_f: "魁北克"
 QUE_f_desc: "圣劳伦斯的移民区有自己的语言、自己的教会与自己的法律。在长河之畔，一个加拿大人国家可以被宣告成立。"
 NNL_f: "新尼德兰"
 NNL_f_desc: "大河之谷与再往北的海湾由荷兰人开辟，其人民仍在。让新尼德兰成为一个自己的国家。"
 AUS_f: "澳大利亚"
 AUS_f_desc: "南方大陆是流放地、羊毛与黄金之地。它距声称统治它的政府有半个世界之遥，终将自行治理。"
 NZL_f: "新西兰"
 NZL_f_desc: "两座由森林、山峦与河流构成的岛屿，由来自海上的人与毛利人共同开拓。南海之上的一个国家可在此宣告成立。"
 SAF_f: "南非"
 SAF_f_desc: "好望角扼守东往印度、西通欧洲的要道，内陆的移民已越出公司的掌控。让一个新的国家在此奠基。"

 # ===== 新世界立国修正的 STATIC_MODIFIER 别名 =====
 STATIC_MODIFIER_NAME_new_world_nation_founded: "一个国家已经建立"
 STATIC_MODIFIER_DESC_new_world_nation_founded: "殖民地已宣布自己为一个国家，拥有自己的政府、自己的旗帜，以及在世界列强中的一席之地。"

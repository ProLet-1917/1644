l_simp_chinese:
 land_of_free_advance: "自由之地"
 land_of_free_advance_desc: "作为自由民，我们称自己的国家为自由之地。"
 nation_with_various_groups_of_people_advance: "多族共居之国"
 nation_with_various_groups_of_people_advance_desc: "尽管组成我们国家的人在文化与职业上各不相同，我们仍统称其为哥萨克。"
 black_land_advance: "黑土"
 black_land_advance_desc: "我们统治的土地多为黑土，此类土壤极为肥沃，有利于我们的农业活动。"
 reform_cossack_cavalry: "改革哥萨克骑兵"
 reform_cossack_cavalry_desc: "哥萨克骑兵逐渐被认为难以适应时代发展。我们必须对其进行改革，方能令其再度扬名于世。"
 unlock_cossack_infantry_advance: "哥萨克步兵"
 unlock_cossack_infantry_advance_desc: "哥萨克步兵主要由哥萨克组成。这些人过去可能从事过多种职业，因而掌握了一定技艺并具备足够实力。"
 unlock_cossack_cavalry_advance: "哥萨克骑兵"
 unlock_cossack_cavalry_advance_desc: "哥萨克骑兵主要由哥萨克组成。这些人过去可能从事过多种职业，因而掌握了一定技艺并具备足够实力。"
 improve_herd_organzation_advance: "改进畜群管理"
 improve_herd_organzation_advance_desc: "我们应改进畜群管理方式，以提高其产量。"
 reform_the_duty_of_herd_organzier_advance: "改革牧群管理者职责"
 reform_the_duty_of_herd_organzier_advance_desc: "改革牧群管理者、明确其职责，将有利于我们畜群的发展。"
 centralize_the_manage_of_herds_advance: "集中管理畜群"
 centralize_the_manage_of_herds_advance_desc: "对畜群实行集中管理可带来根本性的变革与进步。"
 modernize_herd_organzation_advance: "畜群管理现代化"
 modernize_herd_organzation_advance_desc: "将我们的畜群管理方式现代化，可提高畜群生产力并产出更优质的牲畜。"
 country_unity_organize_herd_advance: "国家统一管理畜群"
 country_unity_organize_herd_advance_desc: "将畜群纳入国家统一管理，可减少不必要的损失，并由国家进行统一的科学饲养。"
 klephts_advance: "克莱夫特"
 klephts_advance_desc: "$a_klephts_desc$"
 country_among_the_mountains_advance: "群山中的国度"
 country_among_the_mountains_advance_desc: "我们的国家位于希腊半岛上崎岖的地形，这使我们的人民得以适应高山的存在。"
 moi_naval_tradition_advance:"海军传统"
 moi_naval_tradition_advance_desc: "我们自千年前就已经拥有常备的海军，并利用海军在千年间成功的守护了我们的海岸线。"
 moi_military_society_advance: "军事化社会"
 moi_military_society_advance_desc: "我们的人民从小就接受军事教育以使他们可以有一天拿起武器保卫我们的家园。"
 moi_oblique_order: "斜线战术"
 moi_oblique_order_desc: "斜线战术是一种军事策略，即进攻方集中兵力攻击敌方的一个侧翼。斜线战术的首次记载使用是在公元前 371 年的勒克萨拉战役中。"
 moi_spartan_style_training_advance: "斯巴达式训练"
 moi_spartan_style_training_advance_desc: "我们应该效仿古希腊时期的斯巴达城邦那样，以严格的规定和严格的训练方式训练我们的士兵。"
 moi_universal_society_advance: "普世社会"
 moi_universal_society_advance_desc: "我们的社会总是充斥着各种异国来客，我们的人民早已接纳了他们。"
 reformed_klephts_advance: "$a_klephts_2$"
 reformed_klephts_advance_desc: "$a_klephts_2_desc$"

 early_institutionalized_tools: "统一工具模板"
 early_institutionalized_tools_desc: "一个工具匠固定了他所做的工具的形状和大小可以有效的通过固定的模板来增加生产工具的效率。"
 legacy_apprenticeship: "学徒制度"
 legacy_apprenticeship_desc: "学徒可以在工坊里作为初级的生产人员来辅助物品的生产。"
 wooden_lifting_machine: "木制起重设备"
 wooden_lifting_machine_desc: "通过用木板和简易的滑轮来搭建的起重设备可以有效的吊起建材，这将增快修建建筑的速度。"
 mercenary_contract: "雇佣兵合同"
 mercenary_contract_desc: "通过与雇佣兵签订长期的合同可以减少雇佣时期带来的纠纷并且划定好双方应得的服务或金钱。"
 early_levies_training: "训练农民"
 early_levies_training_desc: "对农民在农闲时期的少许训练可以增加他们的战斗能力。"
 early_collegiate_system: "早期学院体系"
 early_collegiate_system_desc: "为一所学校建立起不同的学院可以增涨他们研究的效率。"
 early_academic_discussion: "学院讨论"
 early_academic_discussion_desc: "对研究的内容进行讨论可以减少不必要的科研损失并且增加研究的效率。"
 early_monetary_management: "货币重制"
 early_monetary_management_desc: "对古老的不同单位的货币进行收集并重新生产出新的货币可以减少在交易中带来的问题，显著改善交易的效率。"
 discovery_regional_trade_networt: "简易的区域贸易网"
 discovery_regional_trade_networt_desc: "在一些小型区域建立起贸易网络可以改善该区域的生产效率，并且减少因路程而带来的损失。"
 temporary_bureaucratic_institutions: "临时官僚机构"
 temporary_bureaucratic_institutions_desc: "由一些专业人士组成的临时的官僚机构可以改善我们在该对应问题上的治理缺陷。"
 discovery_collegiate_system: "改进学院体系"
 discovery_collegiate_system_desc: "规定一所学校所建立起的不同的学院的具体事务可以避免在相近的问题上的重复研究，这可以增加他们研究的效率。"
 standard_mercenary_contract: "标准化雇佣兵合同"
 standard_mercenary_contract_desc: "对雇佣兵合同制作标准可以改进我们雇佣他们的效率和非必要的损失。"
 discovery_levies_training: "集结训练"
 discovery_levies_training_desc: "对征召兵进行一些定期的集合起来的训练可以增加他们在队列中的技巧，这可以改善他们在战场上的战斗力，以适应新时代的战斗。"
 early_government_administration: "简易行政机构"
 early_government_administration_desc: "建立一些简易的行政机构可以辅助统治者进行统治，及时的发现问题并改进。"
 reformation_academic_discussion: "学术辩议"
 reformation_academic_discussion_desc: "定期进行辩论会以讨论学术上遇到的问题可以尽量避免错误的研究并启发更好的点子。"
 multiple_regional_trade_networt: "复杂区域贸易网"
 multiple_regional_trade_networt_desc: "在一些小型区域建立起复杂的贸易网络可以改善该区域的生产效率，并且减少因需要运输路途遥远的货物而带来的损失。"
 reformation_apprenticeship: "改善学徒制"
 reformation_apprenticeship_desc: "对学徒进行一些考核可以避免其造成的部分问题并改进生产中的效率。"
 reformation_currency_manage: "早期货币管理"
 reformation_currency_manage_desc: "建立一些简易的机构以对古老的不同单位的货币进行收集并重新生产出新的货币可以减少在交易中带来的问题，显著改善交易的效率。"
 reformation_bureaucratic_institutions: "简易官僚机构"
 reformation_bureaucratic_institutions_desc: "由一些专业人士组成的简易但是长时间存在的官僚机构可以改善我们在该对应问题上的治理缺陷。"
 reformation_levies_training: "征召兵训练"
 reformation_levies_training_desc: "对征召兵定期集合到固定地点并且进行训练可以提前发现并避免我们征召征召兵时的问题，并且让他们相互磨合，提升战斗能力。"
 reformation_standard_army_training: "固定训练方法"
 reformation_standard_army_training_desc: "对常备兵平时进行的训练的内容和地点进行系统性的研究和规定可以改进常备兵训练的效率和效果。"
 early_blast_furnace: "鼓风冶铁"
 early_blast_furnace_desc: "利用水力驱动鼓风机从而进行冶铁可以大大提高冶铁的效率并能产生质量更好的铁锭。"
 coarse_wollens: "粗纺毛料"
 coarse_wollens_desc: "通过将毛线不经梳理而直接纺成纱线，并在大型纺车而非使用纺锤和纺线轴的方式下进行纺纱，这一工艺使得能够生产出一种较为粗糙的粗毛织物。此外，这种毛线的生产速度更快、成本更低。"
 power_revolution_advance: "动力革命"
 power_revolution_advance_desc: "从传统的肌肉、风力和水力，过渡到集中化的蒸汽与电力，实现了前所未有的工业生产力与城市化。"

 anaesthesia_advance: "麻醉术"
 anaesthesia_advance_desc: "在外科手术中使用乙醚、氯仿或一氧化二氮诱导昏迷，实现无痛操作，极大地拓展了医疗手术的范围。"

 chemotherapy_advance: "化学疗法"
 chemotherapy_advance_desc: "使用化合物治疗疾病（尤其是癌症和感染）。早期突破包括保罗·埃利希用于治疗梅毒的洒尔佛散，开创了系统性药物治疗。"

 penicillin_advance: "青霉素"
 penicillin_advance_desc: "第一种真正的抗生素，由亚历山大·弗莱明发现。它通过破坏细菌细胞壁合成来杀灭细菌，彻底改变了感染的治疗，挽救了无数生命。"

 sulfanilamide_advance: "磺胺"
 sulfanilamide_advance_desc: "第一种合成抗生素，属于磺胺类药物。对链球菌及其他细菌感染有效；为20世纪30年代的现代抗菌化疗铺平了道路。"

 x-rays_advance: "X射线"
 x-rays_advance_desc: "由伦琴发现的高能电磁辐射。能够对骨骼和内部结构进行无创成像，彻底革新了医学诊断及后来的放射治疗。"

 steam_engine_factory_advance: "蒸汽机工厂"
 steam_engine_factory_advance_desc: "大规模生产蒸汽机的专业化工厂。标准化零件和装配方法降低了成本，使可靠的固定式和移动式蒸汽动力得到广泛应用。"

 clean_coal_advance: "洁净煤"
 clean_coal_advance_desc: "在燃烧前清洗煤炭、减少杂质的技术。还包括早期的消烟和改进燃烧技术，降低了城市空气污染，提高了热效率。"

 steel_factory_advance: "钢铁厂"
 steel_factory_advance_desc: "使用贝塞麦法或平炉法大规模生产钢材的综合性工厂。为铁路、船舶、桥梁和摩天大楼提供负担得起的结构钢。"

 structural_steel_construction_advance: "结构钢建筑"
 structural_steel_construction_advance_desc: "使用钢梁、钢柱和铆接连接建造高层建筑和大跨度桥梁的框架。催生了第一批摩天大楼和现代城市建筑。"

 ammunition_factory_advance: "弹药厂"
 ammunition_factory_advance_desc: "使用精密机械大规模生产子弹、炮弹和发射药的工业设施。提高产量和一致性，对现代战争至关重要。"

 artillery_factory_advance: "火炮厂"
 artillery_factory_advance_desc: "专门锻造和加工大口径火炮、炮尾机构及后坐系统的工厂。能够快速生产线膛后装火炮。"

 steel_railroad_advance: "钢轨铁路"
 steel_railroad_advance_desc: "用更坚固耐用的钢轨取代铁轨。允许更重的机车和货运列车，延长轨道寿命，降低维护成本，扩展铁路网络。"

 modernize_high_speed_railroad_advance: "高速铁路"
 modernize_high_speed_railroad_advance_desc: "升级的轨道、信号和机车，能够持续保持100公里/小时以上的速度。包括快速客运服务和简化运营，缩短旅行时间。"

 bessemer_steel_advance: "贝塞麦法"
 bessemer_steel_advance_desc: "第一种廉价的工业化大规模炼钢工艺。向熔融生铁中吹入空气以去除杂质，彻底改变了建筑、交通和武器装备。"

 cordite_advance: "柯达火药"
 cordite_advance_desc: "由硝化甘油、硝化纤维素和凡士林制成的双基无烟火药。为枪炮提供稳定的推力、更少的烟雾和更远的射程。"

 open_hearth_furnace_advance: "平炉"
 open_hearth_furnace_advance_desc: "使用蓄热式熔炉熔化废钢和生铁的炼钢工艺。比贝塞麦法对化学成分控制更好、批量更大，从1880年代到1950年代占据主导地位。"

 stainless_steel_advance: "不锈钢"
 stainless_steel_advance_desc: "含铬量至少10.5%的钢合金，形成一层能抗锈抗腐蚀的钝化氧化层。由布雷尔利于1913年发明，广泛用于餐具和工业设备。"

 harvey_steel_advance: "哈维钢"
 harvey_steel_advance_desc: "一种通过渗碳工艺进行表面硬化的镍钢合金，用于海军装甲。于1890年代开发，提供优越的抗弹防护性能。"

 electricity_advance: "电力"
 electricity_advance_desc: "利用电力提供照明、驱动马达和加热。发电机、变压器和配电网络的发展，使工厂、有轨电车和家庭照明成为可能。"

 electric_rolling_techniques_advance: "电动轧制技术"
 electric_rolling_techniques_advance_desc: "在钢铁生产中使用电动机驱动轧机。相比蒸汽驱动的轧机，提供更精确的速度控制、反转能力和更高的效率。"

 electric_arc_furnace_advance: "电弧炉"
 electric_arc_furnace_advance_desc: "利用电弧加热废金属的熔炉。能够独立于煤炭，以精确的温度控制生产特种钢和合金。"

 high_and_low_pressure_steam_engine_advance: "高低压蒸汽机"
 high_and_low_pressure_steam_engine_advance_desc: "复合式发动机，先使用高压蒸汽，然后膨胀进入低压气缸。热效率提高达30%，为船舶和工厂节约燃料。"

 mobile_engine_advance: "移动式发动机"
 mobile_engine_advance_desc: "安装在轮子或滑橇上的自持式便携蒸汽机或内燃机。无需固定安装即可为脱粒机、锯木厂等农用或建筑设备提供动力。"

 agricultural_harvesting_machinery_advance: "农业收割机械"
 agricultural_harvesting_machinery_advance_desc: "由马或蒸汽机驱动的机械收割机、打捆机和联合收割机。大幅减少谷物收获所需劳动力，实现大规模农业。"

 large_construction_machinery_advance: "大型工程机械"
 large_construction_machinery_advance_desc: "用于挖掘运河、地基和土方工程的蒸汽铲、打桩机和缆索挖掘机。使巴拿马运河和铁路路堑等重大工程成为可能。"

 modern_paper_factory_advance: "现代化造纸厂"
 modern_paper_factory_advance_desc: "使用木浆（亚硫酸盐或硫酸盐法）代替破布的综合制浆造纸厂。连续造纸机（长网造纸机）廉价生产成卷纸张，推动报纸和书籍业发展。"

 modern_tools_factory_advance: "现代化工具厂"
 modern_tools_factory_advance_desc: "使用模锻、精密磨削和可互换零件生产高质量手工工具（锯、锉、扳手）的工厂。供应建筑和制造业所需。"

 modern_cloth_factory_advance: "现代化纺织厂"
 modern_cloth_factory_advance_desc: "配备自动织机、环锭纺纱和整理机械的机械化纺织厂。使用蒸汽或电力驱动，大幅提高布料产量，降低价格。"

 modern_furniture_factory_advance: "现代化家具厂"
 modern_furniture_factory_advance_desc: "使用锯木机、单板切削机和装配线大规模生产桌椅柜的工厂。使用窑干木材和标准化设计。"

 modern_glass_factory_advance: "现代化玻璃厂"
 modern_glass_factory_advance_desc: "采用连续槽窑、自动压吹机的工业化玻璃制造。高速生产瓶子、平板玻璃和餐具，降低成本。"

 rubber_using_advance: "橡胶加工"
 rubber_using_advance_desc: "硫化工艺（固特异，1839年）使天然橡胶与硫磺交联。生产出耐用、有弹性、耐热的材料，用于轮胎、软管和垫圈。"

 combustion_engine_advance: "内燃机"
 combustion_engine_advance_desc: "在气缸内燃烧燃料（汽油、柴油或重油）的发动机。效率高于蒸汽机，催生了汽车、卡车及后来的航空业。关键发明：奥托循环（1876年）、狄塞尔循环（1893年）。"

 turbine_engine_advance: "涡轮发动机"
 turbine_engine_advance_desc: "利用流体（蒸汽、燃气或水）推动叶片旋转的旋转式发动机。帕森斯（1884年）的蒸汽轮机彻底改变了船舶推进和发电。"

 electrical_power_generation_advance: "发电"
 electrical_power_generation_advance_desc: "使用蒸汽轮机或水轮机驱动交流发电机、产生交流电的中心电站。实现远距离输电和广泛的电气化。"

 oil_refinery_advance: "炼油厂"
 oil_refinery_advance_desc: "将原油蒸馏成煤油、汽油、润滑油和燃料油的工业设施。使用分馏塔和热裂化提高高价值产品产率。"

 synthetic_oil_factory_advance: "合成油厂"
 synthetic_oil_factory_advance_desc: "使用加氢法或费托法从煤炭或天然气中生产液态碳氢化合物的设施。为缺乏原油的国家提供燃料自主。"

 wood_based_synthetic_oil_method_advance: "木质合成油法"
 wood_based_synthetic_oil_method_advance_desc: "通过木材干馏（木材热解）或木气反应生产甲醇和油类的早期方法。是现代煤制油工艺的前身。"

 mechanization_factory_advance: "机械化工厂"
 mechanization_factory_advance_desc: "机器完成大部分生产步骤，取代手工工具的工厂。皮带、传动轴以及后来的电动机驱动多个工作站，提高人均产量。"

 mechanical_production_advance: "机械化生产"
 mechanical_production_advance_desc: "系统使用机床（车床、铣床、刨床）生产精密、可互换的金属零件。是大规模生产和现代工业的基础。"

 assembly_line_advance: "装配线"
 assembly_line_advance_desc: "产品依次经过固定工位，每个工人添加一个零件的生产方法。福特于1913年率先应用于汽车，大幅缩短装配时间。"

 telephone_assembly_advance: "电话装配"
 telephone_assembly_advance_desc: "使用装配线和标准化组件大规模生产电话机和交换台。支持电信网络的快速扩张。"

 radio_application_advance: "无线电应用"
 radio_application_advance_desc: "电磁波的实际应用，用于无线电报（马可尼），随后是语音和音乐广播。带来船岸通信、新闻和娱乐。"

 fertilizer_advance: "人造肥料"
 fertilizer_advance_desc: "氮肥的工业化生产（例如来自智利的硝酸钠，后来通过哈伯法合成氨，1909年）。大幅提高农作物产量，支撑人口增长。"

 large_scale_farms_advance: "大规模农场"
 large_scale_farms_advance_desc: "使用机械、雇佣劳动力和科学管理，面积达数百或数千公顷的商业农场。专注于出口单一作物，提高效率。"

 ideology_advance: "现代意识形态"
 ideology_advance_desc: "系统性的政治信仰体系（自由主义、保守主义、社会主义、民族主义），动员群众、塑造制度并为国家行为辩护，取代王朝合法性。"

 nationalism_advance: "民族主义"
 nationalism_advance_desc: "认为民族（共享语言、文化、历史）是政治合法性基础的意识形态。推动了统一运动（德国、意大利）和分裂主义诉求。"

 manifest_destiny_advance: "天定命运"
 manifest_destiny_advance_desc: "美国认为其注定要横跨北美大陆扩张的信念。被用来为领土扩张、原住民迁移和大陆统治辩护。"

 secret_police_advance: "秘密警察"
 secret_police_advance_desc: "以秘密方式运作的国家安全机构，通过监视、线人和秘密行动（如奥克瑞纳）监控、拘留和清除政治异见。"

 modern_diplomacy_advance: "现代外交"
 modern_diplomacy_advance_desc: "职业外交部门，设有大使馆、常驻使团和成文协议（维也纳会议）。包括多边会议、条约和国际法。"

 social_science_advance: "社会科学"
 social_science_advance_desc: "使用实证方法系统研究社会的学科——经济学、社会学、人类学、政治学。作为独立于哲学的学术领域出现。"

 modern_education_advance: "现代教育体系"
 modern_education_advance_desc: "为所有儿童提供国家资助的义务教育、有组织的中学和研究型大学。培养有文化的劳动力和国家认同。"

 quality_education_advance: "优质教育"
 quality_education_advance_desc: "强调教师培训、标准化课程和督导制度。提高识字率、计算能力和科学知识；带来更高的生产力和创新。"

 modern_research_facility_advance: "现代研究设施"
 modern_research_facility_advance_desc: "拥有先进仪器（光谱仪、显微镜、测试舱）和专职人员的专用实验室，用于工业或学术研发（如通用电气实验室、威廉皇帝研究所）。"

 financial_center_advance: "金融中心"
 financial_center_advance_desc: "集中了银行、证券交易所、保险公司和商品市场的城市（伦敦、纽约、巴黎）。在全球范围内提供资本、流动性和投资服务。"

 modern_bank_advance: "现代商业银行"
 modern_bank_advance_desc: "提供存款账户、贷款、支票清算和外汇的股份制银行。拓宽了企业和个人获得信贷的渠道，支持工业增长。"

 modern_national_bank_advance: "现代国家银行"
 modern_national_bank_advance_desc: "管理货币发行、政府债务和最后贷款人功能的中央银行（如英格兰银行、德意志联邦银行）。稳定金融体系和货币政策。"

 modern_customs_office_advance: "现代海关"
 modern_customs_office_advance_desc: "采用统一关税、分类系统和检查程序的专业海关机构。促进国际贸易，高效征收进出口关税。"

 central_bank_money_bill_printing_advance: "中央银行印钞"
 central_bank_money_bill_printing_advance_desc: "垄断法定纸币的发行，使用防伪技术（水印、雕刻）。实现对货币供应和信贷的集中控制。"

 investment_banks_advance: "投资银行"
 investment_banks_advance_desc: "专门从事证券承销、促进并购和企业重组的金融机构。推动大型工业企业和股票市场的兴起。"

 corporate_governance_advance: "公司治理"
 corporate_governance_advance_desc: "将所有权（股东）与管理权（董事）分离的结构。包括董事会、会计准则和披露规则，提高问责制和投资者信心。"

 international_exchange_standard_advance: "国际汇兑本位制"
 international_exchange_advance_desc: "将主要货币与固定黄金价格挂钩的金本位或金汇兑本位制。促进稳定的汇率和国际贸易结算（19世纪末至20世纪初）。"

 monior_market_behaviour_advance: "市场行为监测"
 monior_market_behaviour_advance_desc: "系统收集和分析价格、成交量和趋势数据。使用自动报价机、图表和统计数据预测市场动向。（原文'监ior'应为'监视'）"

 organized_factory_advance: "工厂组织化管理"
 organized_factory_advance_desc: "科学管理（泰勒制）及系统的布局、生产计划、成本核算和质量控制。提高效率，减少浪费。"

 shift_system_advance: "轮班制"
 shift_system_advance_desc: "组织每日多班次（白班、晚班、夜班）工作，使工厂和服务持续运行。最大化资本利用率和产出。"

 citizen_rights_advance: "公民权利"
 citizen_rights_advance_desc: "法律承认个人自由（言论、集会、选举）和法律面前人人平等。逐步扩展到更广泛的阶层，包括工人和女性。"

 organized_sports_advance: "有组织的体育"
 organized_sports_advance_desc: "成文规则、全国性协会、联赛和国际比赛（1896年复兴奥运会）。促进体能、大众娱乐和民族自豪感。"

 civilian_government_advance: "文官政府"
 civilian_government_advance_desc: "由选举或任命的文职官员控制军事政策、预算和人事任命的原则。降低军事政变风险，确保民主问责。"

 identification_documents_advance: "身份证件"
 identification_documents_advance_desc: "带有照片、指纹和序列号的官方证件（护照、身份证、驾照）。使国家能够控制人员流动、投票和获取服务的资格。"

 camera_advance: "摄影术"
 camera_advance_desc: "使用干板、胶卷（柯达，1888年）和手持设计的便携式摄影设备。使影像制作大众化，用于新闻、家庭肖像和记录。"

 film_advance: "电影胶片"
 film_advance_desc: "捕捉连续图像的柔性赛璐珞胶片带。快速投影时产生动态影像。电影、新闻短片和娱乐产业的基础。"

 large_cinema: "电影宫"
 large_cinema_desc: "专门为放映电影而建的大剧院，可容纳数百或数千人。配备高质量放映设备、声音（1920年代后）和舒适座椅，使电影成为大众媒介。"

 political_agitation_advance: "政治鼓动"
 political_agitation_advance_desc: "系统使用小册子、集会、海报和报纸来动员公众舆论支持或反对某项政策。大众运动和革命政党的关键工具。"

 the_theory_on_war_advance: "战争论"
 the_theory_on_war_advance_desc: "克劳塞维茨的《战争论》（1832年）将战争分析为政策的延续，强调“战争迷雾”、摩擦和决战。塑造了现代军事学说。"

 flexible_firepower_advance: "灵活火力"
 flexible_firepower_advance_desc: "强调机动、速射火炮和步兵火力的学说。使用榴霰弹、速射炮和分散指挥以适应战场条件。"

 field_works_advance: "野战工事"
 field_works_advance_desc: "包括战壕、散兵坑和土方在内的野战防御工事。使防御者能抵御重型炮火和步兵冲击，提升防御优势。"

 general_staff_organization_advance: "总参谋部"
 general_staff_organization_advance_desc: "由训练有素的军官组成的常设机构，负责计划行动、后勤、情报和动员。普鲁士首创，确保专业指挥和快速部署。"

 enlistment_offices_advance: "征兵处"
 enlistment_offices_advance_desc: "面向志愿者或应征者的系统性招募中心。进行体检、能力测试和文书工作，实现预备役的大规模动员。"

 war_propaganda_advance: "战争宣传"
 war_propaganda_advance_desc: "政府组织的宣传运动，以塑造公众舆论、促进招募、销售战争债券和妖魔化敌人。使用海报、电影、报纸和演讲。"

 trench_works_advance: "复杂战壕体系"
 trench_works_advance_desc: "由前沿战壕、支援战壕、交通战壕、掩蔽部和带刺铁丝网组成的复杂网络。一战静态战的特征，提供保护但也导致僵局。"

 trench_infantry_advance: "堑壕步兵战术"
 trench_infantry_advance_desc: "针对战壕突袭、手榴弹使用以及配合炮兵弹幕（徐进弹幕）实施协同攻击的专门步兵训练。适应僵局状态。"

 siege_artillery_advance: "重型榴弹炮"
 siege_artillery_advance_desc: "用于摧毁防御工事的大口径、短身管、大仰角火炮。例如德国的大贝尔莎（420毫米）和奥匈帝国的Mörser。"

 early_armor_advance: "装甲车"
 early_armor_advance_desc: "装有钢板和机枪的机动车辆，用于侦察和步兵支援。坦克的前身；1914-15年由英法首次使用。"

 modern_armor_advance: "坦克"
 modern_armor_advance_desc: "集火力、防护和机动性于一体的履带式装甲战斗车辆。1916年由英军在索姆河首次部署，以打破堑壕僵局。"

 flamethrower_advance: "火焰喷射器"
 flamethrower_advance_desc: "喷射点燃燃料（油/气）达20米的便携式装置。用于清除战壕和碉堡。1915年由德国人引入，后各方采用。"

 skirmish_infantry_advance: "散兵战术"
 skirmish_infantry_advance_desc: "士兵以散开队形作战，利用掩体和单兵射击技术而非密集队列。提高现代战场上的生存能力和灵活性。"

 handcranked_machine_gun_advance: "手摇机枪"
 handcranked_machine_gun_advance_desc: "需要手动摇转曲柄来发射多个枪管的早期速射枪（如加特林、诺登飞）。射速高但笨重且依赖多人操作。"

 automatic_machine_gun_advance: "自动机枪"
 automatic_machine_gun_advance_desc: "只要扣住扳机就能持续射击的后坐式或导气式机枪（马克沁，1884年）。使用布制或金属弹链，彻底改变步兵火力。"

 military_aviation_advance: "军事航空"
 military_aviation_advance_desc: "飞机用于侦察、炮火校射、轰炸及后来的空战。首次发挥重要作用是在第一次世界大战（1914-18年）。"

 interceptor_advance: "截击机"
 interceptor_advance_desc: "设计用于快速爬升、在敌轰炸机抵达目标前将其捕获并摧毁的飞机。强调速度和大威力武器。"

 fighter_advance: "驱逐机"
 fighter_advance_desc: "用于争夺制空权的轻型、灵活武装飞机。装备机枪（通常配有射击协调器，可穿过螺旋桨射击）。从侦察机演变为专用的格斗机。"

 close_air_supportor_advance: "近距离空中支援"
 close_air_supportor_advance_desc: "在己方部队附近攻击敌方地面部队的飞机。使用炸弹、机枪和火箭弹。发展于第一次世界大战后期，用于支援步兵攻势。"

 bomber_advance: "轰炸机"
 bomber_advance_desc: "设计用于向战略目标（工厂、城市、铁路）投掷炸弹的远程飞机。范围从轻型战术轰炸机到重型战略轰炸机（如哥达式）。"

 iron_made_ships_advance: "铁质船体"
 iron_made_ships_advance_desc: "使用熟铁或低碳钢而非木材建造的船体。更坚固、不易腐烂，并允许更大的船体和更好的装甲。"

 ironclad_advance: "铁甲舰"
 ironclad_advance_desc: "由铁质或钢质装甲板保护的蒸汽动力战舰。从带装甲带的木船发展到炮塔式设计，如勇士号（1860年）。"

 pre_dreadnoughts_advance: "前无畏舰"
 pre_dreadnoughts_advance_desc: "19世纪末期的战列舰，主炮口径混合（通常为4门重炮和许多中口径炮）。采用钢质装甲、三胀式蒸汽机和炮塔。"

 early_fire_control_advance: "早期火控"
 early_fire_control_advance_desc: "指挥舰炮射击的基础系统：测距仪（合像式或体视式）、观测镜和向炮塔传输数据的传声管。"

 dreadnoughts_advance: "无畏舰"
 dreadnoughts_advance_desc: "以皇家海军无畏号（1906年）为代表的全重炮战列舰。统一主炮（单一口径的10-12门炮）、蒸汽轮机推进和厚重的 belt 装甲。"

 late_dreadnoughts_advance: "超无畏舰"
 late_dreadnoughts_advance_desc: "改进的无畏舰，配备更大口径的主炮（13.5-15英寸），更好的装甲布局和更高的速度。包括美国标准型战列舰和英国伊丽莎白女王级。"

 modern_fire_control_advance: "中央指挥仪"
 modern_fire_control_advance_desc: "使用由指挥仪引导的机械计算机（距离保持器）进行集中火控。能够同时齐射所有主炮并修正瞄准，约1912年英国皇家海军首次使用。"

 monitor_advance: "浅水重炮舰"
 monitor_advance_desc: "吃水浅、航速慢、装甲厚重、装有一到两个大型炮塔的舰船。设计用于海岸轰炸和河流支援；在美国内战和一战期间复兴。"

 destroyer_advance: "雷击舰驱逐舰"
 destroyer_advance_desc: "装有火炮和鱼雷的快速、灵活的护航舰艇。演变为保护舰队免受鱼雷艇攻击，随后本身也进行鱼雷攻击。"

 early_armor_cruiser_advance: "早期装甲巡洋舰"
 early_armor_cruiser_advance_desc: "带有防护装甲带和甲板的大型巡洋舰，能够独立进行破交战或舰队侦察。战列巡洋舰的前身。"

 scout_cruiser_advance: "侦察巡洋舰"
 scout_cruiser_advance_desc: "高速、轻装甲、高续航力的巡洋舰，用于舰队侦察和屏护。通常配备小口径速射炮。"

 heavy_cruiser_advance: "重巡洋舰"
 heavy_cruiser_advance_desc: "主炮口径为8英寸（203毫米）的巡洋舰，根据1922年《华盛顿海军条约》设计，在10000吨排水量下平衡火力和防护。"

 self_propelled_torpedoes_advance: "自推进鱼雷"
 self_propelled_torpedoes_advance_desc: "具有自身动力（压缩空气，后为湿加热发动机）、陀螺仪转向和爆炸战斗部的水下导弹。由怀特黑德于1866年发明。"

 torpedo_boat_advance: "鱼雷艇"
 torpedo_boat_advance_desc: "搭载鱼雷的小型、快速、廉价水面舰艇。设计用于蜂群攻击击沉战列舰，迫使开发驱逐舰作为对抗手段。"

 modern_transport_advance: "现代化部队运输船"
 modern_transport_advance_desc: "专门用于运载士兵和军用物资的钢制船体、蒸汽动力船舶。包括改装的客轮和配备住宿及起重机的专用船只。"

 sailor_schools_advance: "水兵学校"
 sailor_schools_advance_desc: "面向现役水兵的导航、炮术、工程和航海技能的正规教学。提高船员素质，减少事故。"

 naval_university_advance: "海军军官大学"
 naval_university_advance_desc: "进行战略、后勤和指挥高级研究的机构，如海军战争学院（纽波特）和皇家海军学院（格林威治）。培养职业军官。

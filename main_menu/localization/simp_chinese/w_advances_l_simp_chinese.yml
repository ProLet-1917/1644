l_simp_chinese:
 land_of_free_advance: "Land of Freedom"
 land_of_free_advance_desc: "As free people, we call our country the Land of Freedom."
 nation_with_various_groups_of_people_advance: "Nation with various groups of People"
 nation_with_various_groups_of_people_advance_desc: "Although the people who make up our country are diverse in terms of culture and occupation, we collectively refer to them as Cossacks."
 black_land_advance: "Black Land"
 black_land_advance_desc: "The land we govern is mostly black soil, and this type of soil is extremely fertile, which is conducive to our agricultural activities."
 reform_cossack_cavalry: "Reform Cossack Cavalry"
 reform_cossack_cavalry_desc: "The Cossack cavalry was gradually regarded as no longer capable of adapting to the development of the times. We must reform them in order to enable them to rise again in the world."
 unlock_cossack_infantry_advance: "Cossack Infantry"
 unlock_cossack_infantry_advance_desc: "The Cossack infantry was mainly composed of Cossacks. These people might have held various occupations in the past, thus acquiring certain skills and possessing sufficient strength."
 unlock_cossack_cavalry_advance: "Cossack Cavalry"
 unlock_cossack_cavalry_advance_desc: "The Cossack cavalry was mainly composed of Cossacks. These people might have held various occupations in the past, thus acquiring certain skills and possessing sufficient strength."
 improve_herd_organzation_advance: "Improve Herd Management"
 improve_herd_organzation_advance_desc: "We should improve our herd management methods in order to increase its production."
 reform_the_duty_of_herd_organzier_advance: "Reform the Duty of Herd Manager"
 reform_the_duty_of_herd_organzier_advance_desc: "Reforming herd managers to make their responsibilities clearer will bring benefits to the growth of our herds."
 centralize_the_manage_of_herds_advance: "Centralize the manage of Herds"
 centralize_the_manage_of_herds_advance_desc: "Centralized management of herds can bring about fundamental changes and progress."
 modernize_herd_organzation_advance: "Modernize Herd Management"
 modernize_herd_organzation_advance_desc: "Modernizing our herd management methods can increase the productivity of the herds and produce higher-quality herds."
 country_unity_organize_herd_advance: "The Country uniformly manages the Herds"
 country_unity_organize_herd_advance_desc: "Unifying the herds under the state's management will reduce unnecessary losses and enable unified scientific breeding by the state."
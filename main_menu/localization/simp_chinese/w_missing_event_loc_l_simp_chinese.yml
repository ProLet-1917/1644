l_simp_chinese:

# ===== D 节：此前没有标题/描述的事件 =====
 ai_diary_event.1.title: "出售牧群换取黄金"
 ai_diary_event.1.desc: "牧群的数量已经超过了牧场的承载能力。长老们建议把一部分牧群卖给绿洲城镇的商人，以牲畜换取白银。"
 ai_diary_event.1.a: "卖掉多余的牲畜。"
 ai_diary_event.1.b: "保持牧群完整。"
 great_eastern.1.title: "大东方号"
 great_eastern.1.desc: "一艘巨大的铁壳船正躺在船台上，比以往任何船都长。它将不靠加煤便能把乘客与货物运到世界的另一端。工程师发誓这可以做到，银行家却不那么肯定。"
 great_eastern.1.a: "把她建成，世界将随之改变。"
 great_eastern.1.b: "代价荒唐，放弃这个项目。"
 qng_1644_unification.2.title: "南征"
 qng_1644_unification.2.desc: "我朝旗帜已越长城，南方门户洞开。南明余部正在江河诸省集结，问题在于我们该迅速南下还是先稳固后方。"
 qng_1644_unification.2.a: "毫不停顿，继续南下。"
 qng_1644_unification.2.b: "先稳固北方。"
 qng_1644_unification.6.title: "迁界"
 qng_1644_unification.6.desc: "沿海一直是叛军与海盗的通道。朝廷提议清空海滨，禁止与海外岛屿的一切贸易。"
 qng_1644_unification.6.a: "清空沿海。"
 qng_1644_unification.6.b: "让百姓留在原地。"
 qng_1644_unification.6.historical_info: "「迁界令」（1661-1683）使东南沿海大片地区人烟断绝，以切断台湾明郑势力的物资来源。"
 qng_1644_unification.7.title: "三藩"
 qng_1644_unification.7.desc: "归顺我朝的南方三王几乎以国王自居，其地赋税入贡，其军却只听从他们。朝廷询问：这样的权势可以长久容忍吗？"
 qng_1644_unification.7.a: "命其裁撤军队。"
 qng_1644_unification.7.b: "暂且容他们安享太平。"
 qng_1644_unification.7.historical_info: "三藩之乱（1673-1681）的导火索，正是康熙帝下令吴三桂等撤藩。"
 qng_1644_unification.8.title: "新朝肇建"
 qng_1644_unification.9.title: "开科取士"
 qng_1644_unification.9.desc: "旧日书院空置，士大夫仍在观望。若要新朝被接纳，必须开科考试，把士人纳入我们的朝廷。"
 qng_1644_unification.9.a: "开科取士。"
 qng_1644_unification.9.historical_info: "清朝保留并扩大了科举制度，使大批汉族士绅得以与新朝合作。"
 qng_1644_unification.10.title: "剃发令"
 qng_1644_unification.10.desc: "有人提议下令：凡男子皆须剃去前额之发、蓄留辫子，使人一望便知其为大皇帝之民。"
 qng_1644_unification.10.a: "强制执行此令。"
 qng_1644_unification.10.historical_info: "1645年的「剃发令」激起广泛抵抗，以江阴、嘉定保卫战最为著名，后放宽为「三日剃发」。"
 qng_1644_unification.11.title: "开海"
 qng_1644_unification.11.desc: "海禁已行一代人。如今海波不惊，海关请求恢复当年使南方富庶的贸易。"
 qng_1644_unification.11.a: "重开口岸。"
 qng_1644_unification.11.historical_info: "康熙帝于1684年解除海禁，开设四处海关，奠定了此后支配中国对外贸易的广州体系。"
 start_events.1.title: "1644年的天下"
 start_events.1.desc: "时值1644年。东方，满洲八旗步步进逼；内部，流寇与饥荒啃噬着大明的躯体。海外，欧洲列强为贸易、信仰与帝国彼此角力。"
 start_events.1.a: "开始吧。"
 start_events.1.historical_info: "1644年既是明朝覆亡、清军入关之年，也是《威斯特伐利亚和约》终结欧洲三十年战争之年。"
 cleanup_1644.2.title: "清理棋局"
 cleanup_1644.2.desc: "棋盘上堆满了旧日计划的残渣，是时候清扫干净了。"
 cleanup_1644.2.a: "清扫干净。"
 cleanup_1644.3.title: "清理棋局"
 cleanup_1644.3.desc: "棋盘上堆满了旧日计划的残渣，是时候清扫干净了。"
 cleanup_1644.3.a: "清扫干净。"
 csh_1644_unification.6.title: "山海关之战"
 csh_1644_unification.6.desc: "连接中原与满洲道路的关隘，是天下枢纽。谁掌握山海关，谁就决定谁将统治华北。"
 csh_1644_unification.6.a: "我们必守此关。"
 csh_1644_unification.6.historical_info: "1644年5月，吴三桂开关迎清军入关，双方联军在山海关之战中大败李自成。"
 mng_1644.6.title: "北伐"
 mng_1644.6.desc: "我们的将领必须决定向何处出击，以及投入多少兵力。"
 mng_1644.6.a: "继续进军。"
 mng_1644.6.historical_info: "1644年之后，明朝在南方以历次南明朝廷的形式继续抵抗近二十年。"
 wsg_1644_choice.100.title: "少年时的颜色"
 wsg_1644_choice.100.a: "抉择已定。"
 colonial_charter.100.title: "新式特许状"
 colonial_charter.100.desc: "旧特许状由海岸上十几双不同的手分别颁授。如今各殖民地的代表齐聚一堂，要把它们整理为一部统一的政府架构。"
 colonial_charter.100.a: "由我们任命总督。"
 colonial_charter.100.b: "由驻军持有者组成议事会。"
 colonial_charter.100.c: "由贸易城镇组成议会。"
 colonial_charter.100.d: "由自由持有者选举代表议会。"
 colonial_charter.100.e: "依照旧教会与士绅的特许。"
 colonial_charter.100.f: "一切旧特许状照旧。"
 flavor_all_chi.1.title: "中华"
 flavor_all_chi.1.desc: "中原已在掌中，天下道路尽归京师。如今的问题在于：这个中华将是一个怎样的国家。"
 flavor_all_chi.1.a: "车同轨，书同文，法同一。"
 flavor_all_chi.1.b: "让各省保留各自的习俗。"
 flavor_all_chi.1.c: "重修粮仓与运河。"
 flavor_all_chi.1.d: "高扬边塞的旗帜。"
 flavor_all_chi.1.e: "招揽士人入朝。"
 flavor_all_chi.1.f: "重修庙宇。"
 flavor_all_chi.1.g: "向海洋开放市场。"
 flavor_all_chi.1.h: "改革天下赋税。"
 flavor_all_chi.1.i: "加固城墙与关隘。"
 flavor_all_chi.1.j: "与民休息。"
 flavor_cas.50.title: "《最新法令汇编》"
 flavor_cas.50.desc: "王国的法律散落在上百部不同的汇编之中。卡斯蒂利亚议会提议将它们汇集成一部统一法典。"
 flavor_cas.50.a: "命其汇编。"
 flavor_cas.50.b: "旧法已足敷用。"
 flavor_cas.50.historical_info: "《最新法令汇编》（Novísima Recopilación）是1805年出版的卡斯蒂利亚法律汇编，法典化的工作长期拖延。"
 flavor_eng.219.title: "学院派的画家"
 flavor_eng.219.desc: "皇家艺术学院培养出一位画家，他为显贵所作的肖像使他成为全国最负盛名的艺术家。"
 flavor_eng.219.desc_joshua_reynolds: "皇家艺术学院首任院长乔舒亚·雷诺兹爵士，使肖像画成为最高贵的艺术，而他本人则无可争议地成为其宗师。"
 flavor_eng.219.desc_random_artist: "学院的一位画家引起了公众的注意，各家大宅的肖像订约纷至沓来。"
 flavor_eng.219.a: "订购他的作品。"
 flavor_eng.219.b: "我们不需要画家。"
 flavor_eng.219.historical_info: "乔舒亚·雷诺兹爵士（1723-1792）是皇家艺术学院首任院长，十八世纪英国最杰出的肖像画家。"
 flavor_eng.220.title: "机器与人"
 flavor_eng.220.desc: "新式纺纱机每雇用十几人，便使上百名穷人失业，织工们已在夜间开始捣毁机器。"
 flavor_eng.220.a: "由我们出手捣毁，以维持治安。"
 flavor_eng.220.b: "站在机器主一边。"
 flavor_eng.220.historical_info: "1811-1816年的捣毁机器骚乱与卢德运动，是熟练劳工被机器排挤后的暴力反抗。"
 flavor_fra.1103.title: "合并采邑"
 flavor_fra.1103.desc: "过去有些土地被授予旁支亲王，其持有者拥有自己的法庭和军队。王室提议将它们重新收归王领。"
 flavor_fra.1103.a: "合并采邑。"
 flavor_fra.415.title: "大敕令"
 flavor_fra.415.desc: "南北两地的习惯法对诉讼程序的规定彼此冲突，同一个案子在哪里审理便会有不同的结果。国王提议制定统一的民事诉讼敕令。"
 flavor_fra.415.a: "全王国施行统一程序。"
 flavor_fra.415.b: "维持各地习惯法。"
 flavor_fra.415.c: "先咨询各高等法院。"
 flavor_hab.14.title: "《关于无形权利论》"
 flavor_hab.14.desc: "王国的博学博士们撰成一部关于法人团体权利的论著，宫廷视其为良治的典范。"
 flavor_hab.14.a: "命各大学讲授此书。"
 flavor_hab.14.b: "那是法学家的事，与我们无关。"
 flavor_hab.14.historical_info: "《Tractatus de iuribus incorporalibus》是十七世纪一部关于奥地利法及土地与职位法人化的论著。"
 flavor_hab.64.title: "枢密院的制度化"
 flavor_hab.64.desc: "枢密院会期不定，也不留正式档案。若设一常设机构，成员宣誓、受俸、有固定办公之所，君主的意志便能贯通整个行政体系。"
 flavor_hab.64.a: "设立常设枢密院。"
 flavor_hab.64.b: "宫廷维持旧制。"
 flavor_jap.2.title: "兰学"
 flavor_jap.2.desc: "兰学学者在长崎设馆，就瘟疫、地震以及威胁我们的疫病之奥秘提出种种学说。"
 flavor_jap.2.a: "善用这些夷人的学问。"
 flavor_jap.2.b: "旧有的医术已经足够。"
 flavor_mch.16.title: "八旗"
 flavor_mch.16.desc: "八旗同时是军队、行政与民族。问题在于：他们的特权应在被征服的土地上扩展到何种程度。"
 flavor_mch.16.a: "每个旗都应得到赏赐。"
 flavor_mch.16.b: "八旗领饷效力即可。"
 flavor_mos.64.title: "旧礼仪派"
 flavor_mos.64.desc: "教会因那些用两指画十字、称牧首为异端的人而分裂。他们在边疆的聚落年年增多。"
 flavor_mos.64.a: "缉拿他们。"
 flavor_mos.64.b: "让他们在北方安静生活。"
 flavor_mos.64.historical_info: "旧礼仪派（分裂派）在1650年代尼康牧首改革之后自俄罗斯正教会分裂而出。"
 flavor_mos.69.title: "铜钱暴动"
 flavor_mos.69.desc: "铜币把白银逐出流通，面包的价格已非市民所能承担。一群暴民已聚集在宫前。"
 flavor_mos.69.a: "熔毁铜钱。"
 flavor_mos.69.b: "让射击军去对付这群人。"
 flavor_mos.69.c: "惩办投机者。"
 flavor_mos.69.historical_info: "1662年的铜钱暴动，起因是莫斯科人发现用以征收白银税款的，竟是铜币。"
 flavor_mos.78.title: "大使团"
 flavor_mos.78.desc: "一个庞大的使团将循常规外交渠道之外的方式西行，以沙皇亲眼察看荷兰与英格兰的船坞与造船厂。"
 flavor_mos.78.a: "派遣使团。"
 flavor_mos.78.b: "沙皇不得离开国境。"
 flavor_mos.88.title: "波尔塔瓦战役"
 flavor_mos.88.desc: "因严冬与长途追击而削弱的瑞典军，已在波尔塔瓦附近求战。北方的归属将在此决定。"
 flavor_mos.88.a: "接受会战。"
 flavor_mos.88.b: "避开战场，让严冬替我们作战。"
 flavor_mos.88.c: "派骑兵断其补给。"
 flavor_mos.88.d: "退往河边。"
 flavor_mos.88.historical_info: "1709年的波尔塔瓦战役摧毁了瑞典在乌克兰的军队，使俄罗斯成为北欧首要强国。"
 flavor_mos.98.title: "官秩表"
 flavor_mos.98.desc: "沙皇设立了十四级官秩表，从准尉到元帅，国家的每一名官员都依其服役而非出身在其中占有一席之地。"
 flavor_mos.98.a: "让官秩表施行。"
 flavor_mos.98.b: "旧世家必将大怒。"
 flavor_mos.98.historical_info: "1722年的官秩表把文职、军事与宫廷职务置于同一座十四级阶梯之上，使贵族身份向有才之人开放。"
 flavor_mos.103.title: "科学院"
 flavor_mos.103.desc: "外国教授已抵达首都，为一个新设的科学院充任教职。他们的信件无法辨读，习惯古怪，学问却无可否认。"
 flavor_mos.103.a: "设立科学院。"
 flavor_mos.103.b: "先把他们的著作译出来。"
 flavor_mos.103.c: "神学就是足够的学问。"
 flavor_mos.103.historical_info: "俄罗斯科学院于1724年在圣彼得堡仿照欧洲各科学院设立。"
 flavor_ned.10.title: "耕作制度"
 flavor_ned.10.desc: "东印度被要求种植欧洲会购买的东西，利润流入国库。这极为有利可图，而且靠强制劳动维持。"
 flavor_ned.10.a: "这套制度有利，让它继续。"
 flavor_ned.10.b: "我们将推行「伦理政策」。"
 flavor_rus.42.title: "君主的枢机"
 flavor_rus.42.desc: "沙皇的私人枢机已发展为一个常设机构，其秘书如今副署国家法令。"
 flavor_rus.42.desc_ruler: "君主本人的秘书副署国家法令，没有他的手书，任何命令都不生效。"
 flavor_rus.42.desc_orlov: "宫廷宠臣奥尔洛夫伯爵，站在枢机及其秘书的背后。"
 flavor_rus.42.desc_both: "沙皇的枢机与主政大臣，共同居于政府的中心。"
 flavor_rus.42.a: "让枢机继续存在。"
 flavor_rus.42.b: "专制政体不需要大臣。"
 flavor_rus.42.historical_info: "18世纪的御前枢机是君主的私人机要机构，后来逐渐接管了中央政府的协调职能。"
 flavor_rus.55.title: "莫斯科育婴堂"
 flavor_rus.55.desc: "仿照欧洲的慈善机构，莫斯科设立了一所庞大的育婴堂，首都的弃儿被送入其中。"
 flavor_rus.55.a: "由国库拨款。"
 flavor_rus.55.b: "让教会收养他们。"
 flavor_rus.55.c: "私人慈善已足够。"
 flavor_rus.72.title: "《莫斯科新闻》"
 flavor_rus.72.desc: "首都开始刊行一份报纸，载有宫廷消息与外国宫廷的消息，沙皇对它所印的内容颇有兴趣。"
 flavor_rus.72.a: "让报馆处于沙皇的注视之下。"
 flavor_rus.72.b: "查禁此报。"
 flavor_rus.72.historical_info: "《莫斯科新闻》（Московские ведомости）1756年创刊，是俄国第一份面向大众的报纸。"
 flavor_tur.112.title: "蒂玛尔的终结"
 flavor_tur.112.desc: "旧的军事采邑已不能再为国家提供士兵，其持有者却仍收取收益而不服役。国库提议将它们改为国家的普通田庄。"
 flavor_tur.112.a: "改行蒂玛尔。"
 flavor_tur.112.b: "蒂玛尔持有者就是军队。"
 flavor_tur.112.historical_info: "17、18世纪蒂玛尔制度的废除，以包税制与常备军取代了骑兵采邑，也摧毁了旧的省区军事阶层。"
 flavor_tur.132.title: "包税制改革"
 flavor_tur.132.desc: "各大税区被拍卖给出价最高者，而中标者把行省榨干以收回成本。若由中央国库征收，或许可得同样的款项而少些祸害。"
 flavor_tur.132.a: "集中征收。"
 flavor_tur.132.b: "仍让投标者承包。"
 flavor_tur.132.historical_info: "奥斯曼的包税制（iltizam）在十九世纪的坦志麦特改革中逐步走向中央集权。"
 flavor_tur.137.title: "信士的法官"
 flavor_tur.137.desc: "帝国的法官与穆夫提靠捐纳得官，判决也可买卖。伊斯兰教长提议把司法职位变为需经考试、可以升迁的职业。"
 flavor_tur.137.a: "考试任命。"
 flavor_tur.137.b: "照旧捐纳。"
 flavor_tur.137.historical_info: "改革奥斯曼乌莱玛与伊斯兰教长职位，是坦志麦特改革的核心工程之一。"
 flavor_tur.162.title: "黑如罪孽，甜如叛乱"
 flavor_tur.162.desc: "咖啡馆在首都遍地开花，任何出得起一杯钱的人，都能在那里公开议论时政。"
 flavor_tur.162.a: "关闭它们。"
 flavor_tur.162.b: "发放执照并征税。"
 flavor_tur.162.c: "任凭它们存在。"
 flavor_tur.162.historical_info: "奥斯曼咖啡馆屡因被视为政治讽刺与煽动之地而遭当局猜忌，多次被查封又重开。"
 flavor_tur.208.title: "易卜拉欣·穆特费里卡的印刷所"
 flavor_tur.208.desc: "宫廷的一位学者获准设立印刷所，第一本书将是一部土耳其语的地理学辞典。"
 flavor_tur.208.a: "准其设立印刷所。"
 flavor_tur.208.b: "抄书人将因此破产。"
 flavor_ira.1001.title: "沙阿的遗产"
 flavor_ira.1001.desc: "宫廷回顾先朝的各项工程，考虑何者应当完成、何者应当放弃。"
 flavor_ira.1001.a: "继续这些工程。"
 flavor_ira.1001.historical_info: "EU5 中继承性事件会沿用其所承接事件的标题与描述。"
 banking.2.entry: "$banking.1.title$"
 banking.4.entry: "$banking.3.title$"
 flavor_ira.1001.entry: "$flavor_ira.1000.title$"
# ===== D 节补充 =====
 late_ming_crisis.1.title: "明末危机"
 late_ming_crisis.1.desc: "崇祯十七年。国库空虚，粮仓见底，北方的流寇比前去讨伐的官军行动更快。天下正在四分五裂。"
 late_ming_crisis.1.a: "危机已至。"
 late_ming_crisis.1.b: "我们守得住。"
 late_ming_crisis.1.c: "看看还能挽救些什么。"
 flavor_rus.50.title: "立法委员会"
 flavor_rus.50.desc: "一个大委员会奉命召集，为代表们编纂帝国法律。贵族、市民、哥萨克与农民第一次同处一堂。"
 flavor_rus.50.a: "让他们编纂新法典。"
 flavor_rus.50.b: "委员会无权约束我们。"
 flavor_rus.50.c: "趁它还没有变成议会就解散它。"
 flavor_rus.50.historical_info: "叶卡捷琳娜二世1767-1768年的立法委员会起草了《训令》并召集各等级代表，但其工作并未产生新法典。"
# ===== D 节补充：late_ming_crisis 2-6 =====
 late_ming_crisis.2.title: "致吴三桂"
 late_ming_crisis.2.desc: "吴将军以北方最后一支劲旅据守山海关。必须派人前去，而他带去的信，将决定此关是向我们、向满洲，还是向谁都不开。"
 late_ming_crisis.2.a: "命他为朝廷守住此关。"
 late_ming_crisis.3.title: "北方的军队"
 late_ming_crisis.3.desc: "流寇已在北方聚集大军，通往京师的道理已在眼前。我们的将领请示方略。"
 late_ming_crisis.3.a: "与他们在野战中决战。"
 late_ming_crisis.4.title: "山河贝子"
 late_ming_crisis.4.desc: "一位宗室亲王在山中举起旗号，号召所有忠义之士团结于朝廷，既抗流寇，也抗满洲。"
 late_ming_crisis.4.a: "支持这位亲王。"
 late_ming_crisis.5.title: "白旗"
 late_ming_crisis.5.desc: "南方的百姓举白旗起兵，其首领发誓他们是为朝廷而战，而非反叛朝廷。"
 late_ming_crisis.5.a: "任他们作战。"
 late_ming_crisis.5.b: "趁其未成气候先解除武装。"
 late_ming_crisis.5.historical_info: "1640年代，农民武装与忠明义军（如「白旗」起义）同时对抗流寇与清军入关。"
 late_ming_crisis.6.title: "元帅的军事会议"
 late_ming_crisis.6.desc: "天下各路军马元帅聚议军略，争论直到深夜。"
 late_ming_crisis.6.a: "北上直击流寇主力。"
 late_ming_crisis.6.b: "守住江河防线。"
 late_ming_crisis.6.historical_info: "明军指挥层为前线将帅与朝廷之间的争执所瘫痪，这是1644年一系列惨败的重要原因。"

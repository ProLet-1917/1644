l_simp_chinese:
 italy_unification: "意大利问题"
 italy_unification_desc: "建立单一民族的梦想激荡着意大利各邦。其中最强者将弱小者纳入自己的联盟，然而罗马仍握于教廷之手，列强也密切注视着这座半岛。"
 ITALIAN_UNIFIER: "潜在统一者"
 ITALIAN_COUNTRY: "意大利诸邦"
 ITALIAN_PAPAL_STATES: "教宗国"
 only_1_italian_unifier_now: "目前仅剩一名潜在统一者"
 italy_unification_union: "意大利统一联盟"
 ITALY_UNIFICATION_UNION_NAME: "意大利统一联盟"
 support_the_italian_unifier: "支持统一者"
 support_the_italian_unifier_desc: "加入某位意大利统一者的联盟，支持其领导民族的主张。"
 declare_unification_of_italy_kingdom: "宣布成立意大利王国"
 declare_unification_of_italy_kingdom_desc: "作为唯一残存的统一者，我们可以宣布建立意大利王国，并邀请联盟成员以及其他意大利诸邦加入。"
 launch_expedition_of_the_thousand: "发起千人远征"
 launch_expedition_of_the_thousand_desc: "一支由魅力领袖统率的志愿军南下，志在解放南方。此举或可博得荣光，亦可能以惨败收场。"
 intervene_in_italy: "干预意大利"
 intervene_in_italy_desc: "半岛的归属与我方利害攸关。我们将在意大利问题上施加自己的分量。"
 cb_italian_unification: "意大利统一"
 cb_italian_unification_desc: "统一意大利是我们的事业，凡阻挠者皆须被制服。"
 give_up_leader_of_italy_unification_union: "放弃意大利统一联盟的领导权"

 italy_unification.1000.title: "意大利问题"
 italy_unification.1000.desc: "从皮埃蒙特到西西里，人们都在谈论同一个意大利民族。较强大的邦国开始争夺复兴运动的领导权，将弱小者纳入各自的联盟。"
 italy_unification.1000.a: "意大利的新时代开始了。"

 italy_unification.1001.title: "意大利宣告成立"
 italy_unification.1001.desc: "[target_country.GetNameWithNoTooltip]已宣布成立意大利王国。作为其联盟成员，我们理应加入这个新国家。"
 italy_unification.1001.a: "民族在召唤。"

 italy_unification.1002.title: "来自意大利的邀请"
 italy_unification.1002.desc: "[target_country.GetNameWithNoTooltip]已宣布成立意大利王国。他们邀请所有残存的意大利诸邦加入这个新国家。"
 italy_unification.1002.a: "我们将加入意大利。"
 italy_unification.1002.b: "我们将保持独立。"

 italy_unification.1101.title: "教宗国与新王国"
 italy_unification.1101.desc: "新的意大利王国已经宣告成立，其军队已兵临罗马城下。枢机们必须决定是向新王国称臣，还是抵抗到最后。"
 italy_unification.1101.a: "我们向新王国称臣。"
 italy_unification.1101.b: "我们绝不交出罗马。"

 italy_unification.1200.title: "罗马问题"
 italy_unification.1200.desc: "王国已近乎完整，唯有罗马仍在教廷手中。只要教宗仍是意大利腹地的世俗君主，我们的民族便永无完整之日。"
 italy_unification.1200.historical_info: "罗马问题是意大利王国与教廷之间关于罗马的争端，1871年由《保障法》部分解决，直至1929年《拉特兰条约》方告终结。"
 italy_unification.1200.a: "我们将与教宗订立政教协定。"
 italy_unification.1200.b: "我们将以武力夺取罗马。"
 italy_unification.1200.c: "此事可以从长计议。"

 italy_unification.1201.title: "教宗的抗议"
 italy_unification.1201.desc: "圣座已向整个天主教世界谴责对其世袭领地的夺取。信众因此分裂，我方教士亦深感不安。"
 italy_unification.1201.a: "教宗的世俗权力已告终结。"
 italy_unification.1201.b: "我们愿向教会作出补偿。"

 italy_unification.1300.title: "意大利问题与我方"
 italy_unification.1300.desc: "意大利的统一威胁着地中海的均势与我们在半岛上友邦的地位。内阁必须决定我们究竟要走到哪一步。"
 italy_unification.1300.a: "我们将以武力干预。"
 italy_unification.1300.b: "我们将以外交调停。"
 italy_unification.1300.c: "我们将不予干涉。"

 italy_unification.1301.title: "意大利问题与我方"
 italy_unification.1301.desc: "意大利的统一可能扰乱我们在半岛上的领地。宫廷必须决定如何回应这场复兴运动。"
 italy_unification.1301.a: "我们将加以干预。"
 italy_unification.1301.b: "我们任由事态自行发展。"

 italy_unification.1400.title: "千人远征"
 italy_unification.1400.desc: "一位极具魅力的志愿军领袖提出，愿招募一小队冒险者南下，推翻旧秩序。命运眷顾勇者，然而失败将使国家蒙羞。"
 italy_unification.1400.historical_info: "1860年，朱塞佩·加里波第自热那亚率约一千名志愿军出航，在西西里登陆并推翻了两西西里王国，将其征服之地献予维托里奥·埃马努埃莱二世。"
 italy_unification.1400.a: "让志愿军出征吧。"
 italy_unification.1400.b: "这只是痴人说梦。"

 papal_concordat: "政教协定"
 papal_concordat_desc: "与圣座达成的协议使教廷接受了新秩序，并给予教会其中稳固的地位。"
 roman_question_settled_negotiated: "罗马问题已解决"
 roman_question_settled_negotiated_desc: "罗马以协议而非武力并入王国，王室因此更为稳固。"
 roman_question_settled_by_force: "罗马以武力夺取"
 roman_question_settled_by_force_desc: "都城已归我手，然而强夺罗马使我们失去了全欧洲天主教舆论的好感。"
 papal_imprisoned_in_the_vatican: "教宗困于梵蒂冈"
 papal_imprisoned_in_the_vatican_desc: "圣父拒绝承认新王国，退居于梵蒂冈城墙之后，成为自己宫中的囚徒。"
 italian_unification_foreign_pressure: "外国对意大利的施压"
 italian_unification_foreign_pressure_desc: "列强已将意大利问题视为己事，我方的行动自由因此受到限制。"
 italian_risorgimento_fever: "复兴运动热潮"
 italian_risorgimento_fever_desc: "民族已然建成，民众为之如痴如醉。志愿者纷纷投军，整座半岛都在回响着意大利之名。"
 roman_question_postponed: "罗马问题被搁置"
 roman_question_postponed_desc: "我们推迟了罗马问题的解决，教会与爱国者皆对我们感到失望。"
 expedition_of_the_thousand: "千人远征"
 expedition_of_the_thousand_desc: "一千名身着红衫的志愿军将我们的事业带到了南方，凡见过他们的人皆无法忘怀。"


l_simp_chinese:
 # 1644模组：政府改革
 chi_peasant_empire_reform: "追赃助饷"
 chi_peasant_empire_reform_desc: "我大顺军历来以追赃助饷为国策，没收伪明内帑及宗室、勋戚、太监的家产，对官僚实行派饷。"
 csh_three_year_tax_exemption_reform: "均田免粮"
 csh_three_year_tax_exemption_reform_desc: "杀牛羊，备酒浆，开了城门迎闯王，闯王来了不纳粮。"
 qng_banner_reform: "八旗制度"
 qng_banner_reform_desc: "$qng_banner_reform$是清国独特的军事和社会组织制度。八旗分为正黄、正白、正红、正蓝、镶黄、镶白、镶红、镶蓝八旗，每旗由若干牛录组成。八旗制度不仅是一种军事组织，更是清朝统治的基础，确保了满洲贵族和士兵的特权地位，同时提供了强大的征召兵源。"

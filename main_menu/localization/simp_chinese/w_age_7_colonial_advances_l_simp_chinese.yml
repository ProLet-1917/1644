l_simp_chinese:
 # ===== 殖民国家通用分支 =====
 colonial_frontier_expansion: "边疆开拓"
 colonial_frontier_expansion_desc: "边疆被进一步推向内陆：丈量、定居，并与海岸相连。"
 immigration_policy_advance: "移民政策"
 immigration_policy_advance_desc: "国家主动招徕海外移民，授予其土地、工具与路费。"
 continental_railroad_advance: "大陆铁路"
 continental_railroad_advance_desc: "一条钢铁线路把已开发的海岸与内陆联结起来，又把内陆与海岸联结起来。"
 federal_industrialization_advance: "联邦工业化"
 federal_industrialization_advance_desc: "在关税壁垒之后，以本国的矿石与燃料建立炉坊、纱厂与机器工场。"
 colonial_constitution_advance: "殖民地宪法"
 colonial_constitution_advance_desc: "一部成文政体赋予殖民地自己的议会、法院与权利宪章。"
 colonial_manifest_destiny_advance: "昭昭天命"
 colonial_manifest_destiny_advance_desc: "我民族显然注定要横贯大陆而扩展，并携其制度同行。"
 public_land_grants_advance: "公有土地授予"
 public_land_grants_advance_desc: "经丈量的公有土地以宽厚的条件授予愿意开垦的定居者。"
 transcontinental_telegraph_advance: "横贯大陆电报"
 transcontinental_telegraph_advance_desc: "电杆与电线将两端海岸相连，消息以分钟而非月份传递。"
 independent_foreign_policy_advance: "独立外交"
 independent_foreign_policy_advance_desc: "我们自行办理外交、缔结条约，不受任何外国部院管辖。"

 # ===== 十三殖民地 / 美国 =====
 usa_manifest_destiny_advance: "我们的昭昭天命"
 usa_manifest_destiny_advance_desc: "这片大陆注定由我们从海洋开拓到海洋，任何强权都无权否认。"
 usa_homestead_act_advance: "宅地法"
 usa_homestead_act_advance_desc: "凡愿在其上居住并开垦的户主，皆可获授四分之一平方英里的公有土地。"
 usa_abolition_amendment_advance: "废奴修正案"
 usa_abolition_amendment_advance_desc: "以宪法修正案废除奴隶制，并赋予获释者公民身份。"
 usa_transcontinental_railroad_advance: "横贯大陆铁路"
 usa_transcontinental_railroad_advance_desc: "两家公司竞相穿越平原与山岭，在大陆的另一端会合。"
 usa_progressive_reform_advance: "进步主义运动"
 usa_progressive_reform_advance_desc: "托拉斯受到规制，城市得到整顿，选举权以修正案得以扩大。"

 # ===== 新西班牙 / 墨西哥 =====
 mex_mining_modernization_advance: "矿业现代化"
 mex_mining_modernization_advance_desc: "蒸汽抽水机、排水与近代冶炼，使银矿重获往日的丰饶。"
 mex_reform_wars_advance: "改革法"
 mex_reform_wars_advance_desc: "自由派宪法实行政教分离，并废除教士与军队的团体特权。"
 mex_land_reform_advance: "土地改革"
 mex_land_reform_advance_desc: "大庄园被拆解，村社的共有土地得以恢复。"

 # ===== 巴西 =====
 brz_coffee_economy_advance: "咖啡经济"
 brz_coffee_economy_advance_desc: "帕拉伊巴谷的咖啡园使巴西成为世界上最大的咖啡出口国。"
 brz_abolition_advance: "黄金法"
 brz_abolition_advance_desc: "奴隶制在帝国全境被废除，旧种植园秩序的最后残迹亦随之消逝。"
 brz_republic_advance: "共和国"
 brz_republic_advance_desc: "帝国被各州组成的联邦共和国取代，设有宪法与民选总统。"

 # ===== 加拿大 =====
 can_dominion_advance: "自治领地位"
 can_dominion_advance_desc: "各省联合为一个自治的自治领，拥有自己的议会与内阁。"
 can_pacific_railway_advance: "太平洋铁路"
 can_pacific_railway_advance_desc: "一条钢铁线路把大西洋各省与太平洋海岸联结起来。"

 # ===== 拉普拉塔 =====
 arg_conquest_of_the_desert_advance: "荒漠远征"
 arg_conquest_of_the_desert_advance_desc: "以武力向南方与西方拓展边疆，并将土地开放给定居者。"
 arg_export_economy_advance: "出口经济"
 arg_export_economy_advance_desc: "牛肉、皮革、小麦与羊毛经由冷藏舱与新建铁路运往欧洲。"

l_simp_chinese:
 flavor_cxi.1.title: "大西称帝"
 flavor_cxi.1.desc: "成都已在掌握之中。张献忠的后继者可以称帝，建立大西之朝。"
 flavor_cxi.1.a: "即皇帝位"
 flavor_cxi.1.b: "时机未至"
 flavor_cxi.1.entry: "$flavor_cxi.1.title$"
 flavor_cxi.2.title: "联明抗清"
 flavor_cxi.2.desc: "清军不断南下，明室仍在支撑。有人主张草泽与残明应当合力抗击入关之敌。"
 flavor_cxi.2.historical_info: "张献忠死后，孙可望、李定国率大西余部转向与永历朝廷联合，在西南打出扶明抗清的旗号。"
 flavor_cxi.2.a: "与明室联兵"
 flavor_cxi.2.b: "天命当由我承"
 flavor_cxi.2.entry: "$flavor_cxi.2.title$"
 flavor_cxi.3.title: "移跸昆明"
 flavor_cxi.3.desc: "成都已不可恃。昆明控滇黔孔道，可作为新的根本。"
 flavor_cxi.3.historical_info: "大西余部与后来的永历朝廷都在失去四川盆地后以昆明为退路，借云南纵深继续战争。"
 flavor_cxi.3.a: "定都昆明"
 flavor_cxi.3.b: "仍守现都"
 flavor_cxi.3.entry: "$flavor_cxi.3.title$"

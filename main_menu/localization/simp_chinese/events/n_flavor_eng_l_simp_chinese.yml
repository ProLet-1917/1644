l_simp_chinese:
 flavor_eng.1.title: "复辟君主制"
 flavor_eng.1.desc: "数年间对于议会共和制度的探索对我们的国家造成了大量的破坏，目前种种迹象都表明我们也许应该回到古老的道路上去，重新迎回一位君主来领导我们伟大的国家。"
 flavor_eng.1.historical_info: "自护国公奥利弗·克伦威尔死后，其子理查德·克伦威尔继任护国公，但他缺乏权威。他试图在军队和民间社会之间进行调解，但所有和平的调解均告失败。随后军队在圣詹姆斯宫集结，克伦威尔最终屈服于他们的要求。1659 年 5 月 25 日，克伦威尔递交了一封正式信函，辞去了护国公的职务。随后在乔治·蒙克将军的主导下，君主制得以复辟。1660 年 5 月，查理二世结束流亡返回英国并随后于 1661 年 4 月 23 日在威斯敏斯特教堂加冕为王。"
 flavor_eng.1.a: "我们将迎回查理一世的继承人"
 flavor_eng.1.b: "我们应该选择苏格兰的国王"
 flavor_eng.1.c: "我们应该加冕现任领袖成为国王"
 flavor_eng.1.d: "议会和共和将继续下去"
 flavor_eng.1.entry: "$flavor_eng.1.title$"
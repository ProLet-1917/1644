l_simp_chinese:
 holy_league.1.title: "[GetCountry('TUR').GetName]的当前局势"
 holy_league.1.desc: "奥斯曼帝国在17世纪进入了一个新状态。对外，帝国已无法对新目标发动进攻；对内，兵变与起义时有发生。自14世纪开始的那种对外积极进取的状态如今已荡然无存。如果我们无法摆脱当前局面，必将因宫廷的权力斗争和总督的离心离德而一步步走向衰落。\n目前，我们面前有几个选择。我们可以进攻苏丹苏莱曼一直向往的城市——维也纳，以打击基督教信徒的信心。同时，我们也可以先改革国内行政架构，从而先稳定国内局势。"
 holy_league.1.a: "我们应将攻占维也纳作为首要任务。"
 holy_league.1.b: "我们应将改革内部行政架构作为首要任务。"
 unlock_ottomans_decisions: "将解锁几项决策，帮助我们改善当前局势"
 holy_league.2.title: "征服[GetCountry('CRT').GetName]"
 holy_league.2.a: "我们应该立即宣战！"
 holy_league.2.b: "准备舰船！"
 holy_league.2.desc: "克里特岛被威尼斯控制已达数百年，作为威尼斯的基地，它严重阻碍了我方海军进入地中海。由于威尼斯人对克里特岛及周边岛屿的封锁，过去一个世纪里，我们统治下的巴尔干半岛不断受到基督教联盟的威胁。因此，我们必须攻克克里特岛，才能有效保护我方领土。"
 holy_league.2.historical_info: "克里特战争，又称干地亚战争或第五次奥斯曼-威尼斯战争，是威尼斯共和国及其盟友（主要是马耳他骑士团、教宗国和法国）与奥斯曼帝国及巴巴里诸国之间的一场冲突，主要围绕克里特岛——威尼斯最大、最富庶的海外领地——展开。战争从1645年持续到1669年，主要在克里特岛、尤其是干地亚城进行，并在爱琴海周边发生了众多海战和劫掠行动，达尔马提亚则作为次要战场。"
 holy_league.3.title: "加强干地亚的防御"
 holy_league.3.a: "我们应该加强当地防御。"
 holy_league.3.b: "我们应该相信我方舰队能很好地保护该地区。"
 holy_league.3.desc: "近日有传言称，[GetCountry('TUR').GetName]即将进攻我们在克里特岛上的主要基地——干地亚。我方顾问建议加强当地防御工事。"
 holy_league.4.title: "援助干地亚的抵抗"
 holy_league.4.a: "我们将派兵援助。"
 holy_league.4.b: "我们现在没有足够的力量去帮助他们。"
 holy_league.4.desc: "干地亚正遭受奥斯曼人的进攻。作为他们的朋友，我们应该派遣一支部队去协助他们。"
 holy_league.5.title: "来自[GetCountry('MOI').GetName]的援助"
 holy_league.5.a: "我们会充分利用它。"
 holy_league.5.desc: "我们的朋友[GetCountry('MOI').GetName]派遣了一支队伍，帮助我们抵御[GetCountry('TUR').GetName]。"
 holy_league.6.title: "上匈牙利传来的消息"
 holy_league.6.a: "我们应该资助他。"
 holy_league.6.b: "他将证明自己的能力。"
 holy_league.6.desc: "一位名叫埃默里克·特克伊的匈牙利王子率军越过特兰西瓦尼亚公国的边境。他和他的部队成功占领了斯洛伐克的一些土地。在得到增援后，他已开始向[GetCountry('HUN').GetName]的首都进军。"
 upper_hungary: "上匈牙利"
 holy_league.7.title: "征服马耳他？"
 holy_league.7.a: "准备舰船！"
 holy_league.7.desc: "马耳他处于[GetCountry('KNI').GetName]的统治之下，我们曾试图征服它，但失败了。如今有了新技术和更强大的军队，我们有信心征服它。"
 holy_league.8.title: "科普鲁律·穆罕默德帕夏"
 holy_league.8.a: "任命他为大维齐尔"
 holy_league.8.b: "任命他为顾问"
 holy_league.8.desc: "在近来的宫廷中，一个名叫科普鲁律·穆罕默德的人崭露头角。经由前任大维齐尔的推荐，我们是否应该考虑授予他大维齐尔的职位？"
 holy_league.8.historical_info: "首先，科普鲁律·穆罕默德帕夏彻底清除了伊斯坦布尔内的敌对军事派系，牢牢掌握了权力。1657年8月，科普鲁律在爱琴海再次击败威尼斯海军，打破了敌国对博斯普鲁斯海峡的封锁。伊斯坦布尔的主要威胁被消除，为他所实施的强硬政策提供了坚实基础。尤其是宫中的图尔罕苏丹后强力支持这位年迈的大维齐尔。次年，为惩罚与奥斯曼帝国不和的特兰西瓦尼亚公爵，大维齐尔远征特兰西瓦尼亚并进攻波兰。此外，他以在瓦拉几亚煽动混乱为由，处决了希腊正教会的首席主教。另一方面，那些感到自身行动受到威胁的反建制军事政客和地方有影响力的军事人物也变得不安。阿勒颇省督阿巴扎·哈桑帕夏在安纳托利亚举起了叛旗，随后叛乱蔓延至安纳托利亚地区。然而，科普鲁律·穆罕默德帕夏在1661年平定了叛乱，为17世纪后半期的经济社会稳定奠定了基础。"
 holy_league.9.title: "进军维也纳"
 holy_league.9.a: "骰子已经掷下！"
 holy_league.9.desc: "经过数年的准备，我们终于组织起一支由盟友和附庸国组成的大军。在大维齐尔的领导下，他将率军向维也纳进军，为帝国赢得荣耀，并摧毁敌国。"
 holy_league.10.title: "来自[GetCountry('TUR').GetName]的消息"
 holy_league.10.a: "集结军队！"
 holy_league.10.desc: "边境上一个接一个的传言宣布了一个可怕的消息：奥斯曼帝国正在组织一支前所未有的强大军队，准备围攻维也纳，并决心夺取这座城市。我们应当竭尽全力保卫我们的首都。"
 holy_league.11.title: "修建临时防御栅栏？"
 holy_league.11.a: "我们应该修建它。"
 holy_league.11.b: "现有的城墙足够了，我们现在应该把金币花在招募更多军队上。"
 holy_league.11.desc: "我们的工程师检查了维也纳的城墙。他们建议在城市的西侧和南侧——那些没有河流保护的地区——修建临时的木制栅栏用于防御。"
 holy_league.12.title: "号召发动针对[GetCountry('TUR').GetName]的十字军？"
 holy_league.12.a: "发动十字军！"
 holy_league.12.b: "我们有其他事情要做。"
 holy_league.12.desc: "[GetCountry('TUR').GetName]对[GetCountry('HAB').GetName]发动了进攻，集结了一支强大的军队，决心占领维也纳。作为教宗，我们是否应该号召发动十字军来对付他们？"
 holy_league.13.title: "加入十字军？"
 holy_league.13.a: "上帝之愿！"
 holy_league.13.b: "我们不加入。"
 holy_league.13.desc: "[GetCountry('TUR').GetName]对[GetCountry('HAB').GetName]发动了进攻！教宗号召组建十字军。作为天主教会的一员，我们是否应该加入？"
 holy_league.14.title: "与[GetCountry('FRA').GetName]结盟？"
 holy_league.14.a: "派遣外交官"
 holy_league.14.b: "我们不应继续这个联盟"
 holy_league.14.desc: "我们之前与法国签订了一系列盟约。我们是否应该为了巩固我们在东欧的统治而延续这些条约？"

 holy_league.15.title: "与[GetCountry('TUR').GetName]结盟？"
 holy_league.16.title: "他们已接受"
 holy_league.17.title: "他们已拒绝"
 holy_league.15.a: "我们接受"
 holy_league.15.b: "我们拒绝"
 holy_league.15.desc: "过去，我们与奥斯曼人签订了一系列盟约。现在他们派遣外交官至我们的宫廷，提议延续这一系列条约。"
 holy_league.16.a: "签署条约"
 holy_league.16.desc: "外交官带回了消息：对方已正式接受我们的提议。"
 holy_league.17.a: "没有他们，我们能做得更好"
 holy_league.17.desc: "外交官带回了消息：对方已正式拒绝我们的提议。"

 holy_league.18.title: "战胜神圣同盟"
 holy_league.18.a: "胜利！"
 holy_league.18.desc: "经过艰苦的战斗，我们成功占领了维也纳，并控制了周边地区。神圣同盟已被击败，通往中欧的道路已向我们敞开。"

 holy_league.19.title: "神圣同盟胜利"
 holy_league.19.a: "为了上帝和所有人"
 holy_league.19.desc: "经过艰苦的战斗，我们成功的击败了[GetCountry('TUR').GetName]，现在让我们来庆祝胜利吧"


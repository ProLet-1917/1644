l_simp_chinese:
 flavor_moi.1.title: "群山中的抵抗者"
 flavor_moi.1.desc: "作为一个曾在群山之中与[GetCountry('TUR').GetName]作战的群体，我们的抗争已持续了百余年。我们将团结一心，在群山中给予敌人沉重一击，以捍卫我们的自由。"
 flavor_moi.1.a: "团结一致！"
 flavor_moi.1.historical_info: "自1453年君士坦丁堡陷落于[GetCountry('TUR').GetName]之手，直至伯罗奔尼撒最终脱离[GetCountry('TUR').GetName]的统治宣布独立，马尼半岛的人民数百年来一直团结一心，抵抗[GetCountry('TUR').GetName]的统治。直到希腊独立战争结束，此地一直是抵抗运动的基地。人们一直在支援所有与[GetCountry('TUR').GetName]为敌的力量，尤其是在1648年至1669年的克里特战争期间。"

 flavor_moi.2.title: "购买基西拉岛"
 flavor_moi.2.a: "我们应该向威尼斯出价购买此岛。"
 flavor_moi.2.b: "我们不能冒购买此岛的风险。"
 flavor_moi.2.desc: "作为[GetCountry('VEN').GetName]在爱琴海的重要岛屿，鉴于威尼斯目前对此岛的维护投入有所减少，作为他们的友好邻邦，我们可以提议以50[gold|e]的价格购买此岛，以帮助他们维持对爱琴海的控制。"

 flavor_moi.3.title: "来自[GetCountry('MOI').GetName]的信函"
 flavor_moi.3.a: "我们应该接受他们的提议。"
 flavor_moi.3.b: "此岛对我们仍有价值。"
 flavor_moi.3.desc: "[GetCountry('MOI').GetName]的信使告知我们，他们有意购买我们的基西拉岛。我们最近一直在减少对该岛的维护投入。也许我们应该考虑以一个更好的价格将其出售给他们。"

 flavor_moi.4.title: "[GetCountry('VEN').GetName]的答复"
 flavor_moi.4.a: "为我们，干杯！"
 flavor_moi.4.desc: "[GetCountry('VEN').GetName]的答复告知我们，他们已接受我们的出价，该岛将很快移交给我们。"

 flavor_moi.5.title: "[GetCountry('VEN').GetName]的答复"
 flavor_moi.5.a: "真遗憾！"
 flavor_moi.5.desc: "威尼斯的答复告知我们，他们拒绝了我的出价。看来我们应当放弃这个念头。"

 flavor_moi.6.title: "克莱夫特之歌"
 flavor_moi.6.a: "闻之甚悦。"
 flavor_moi.6.desc: "我国的一些人自发创作了一些民歌。我们将统称这些歌曲为克莱夫特之歌。这将被作为我们民族文化不可或缺的一部分世代相传。"
 flavor_moi.6.historical_info: "克莱夫特歌曲或民谣，产生于希腊本土。它们是希腊民间音乐流派的一部分，包含民间诗歌，主题上或聚焦于某位克莱夫特（抗奥斯曼武装）的功绩与牺牲，或描绘克莱夫特群体作为整体的生活。"

 flavor_moi.7.title: "扩建米斯特拉斯"
 flavor_moi.7.a: "我们应当扩建它。"
 flavor_moi.7.b: "对我们来说足够了。"
 flavor_moi.7.desc: "米斯特拉斯，作为前[GetFormableCountry('BYZ').GetName]在伯罗奔尼撒的统治中心，现已归我们掌控。我们应当扩建这座旧城，以支持我们抵抗[GetCountry('TUR').GetName]的事业。"

 flavor_moi.8.title: "扩建卡拉马塔"
 flavor_moi.8.a: "我们应当扩建它。"
 flavor_moi.8.b: "对我们来说足够了。"
 flavor_moi.8.desc: "卡拉马塔，作为昔日[GetCountry('VEN').GetName]在伯罗奔尼撒的重要贸易港口，现已归我们掌控。我们应当扩建这座旧城，以支持我们抵抗[GetCountry('TUR').GetName]的事业。"

 flavor_moi.9.title: "我们为何而战？"
 flavor_moi.9.a: "我们是罗马人，并将重建我们的帝国。"
 flavor_moi.9.b: "我们是希腊人，并将解放所有与我们同文化的同胞。"
 flavor_moi.9.desc: "随着我们最近的扩张，我们可以开始思考：我们的传统、我们的未来，以及我们所做这一切背后的目的，究竟是什么。"
 follow_romans_path: "我们将选择复兴[GetFormableCountry('BYZ').GetName]的道路，并竭尽全力实现这一目标。"
 follow_greek_path: "我们将选择复兴[GetFormableCountry('GRE').GetName]的道路，并竭尽全力实现这一目标。"

 flavor_moi.10.title: "扩建基西拉"
 flavor_moi.10.a: "我们应当扩建它。"
 flavor_moi.10.b: "对我们来说足够了。"
 flavor_moi.10.desc: "基西拉，作为昔日[GetCountry('VEN').GetName]在爱琴海的重要基地，现已归我们掌控。我们应当扩建这片定居点，以支持我们抵抗[GetCountry('TUR').GetName]的事业。"

 flavor_moi.11.title: "重建[ShowBuildingTypeNameWithNoTooltip('hexamilion_wall')]"
 flavor_moi.11.desc: "随着我们重新征服[ShowAreaNameWithNoTooltip('morea_area')]，我们可以在[ShowLocationName('corinth')]重建[ShowBuildingTypeNameWithNoTooltip('hexamilion_wall')]以保卫[ShowAreaNameWithNoTooltip('morea_area')]，确保敌人无法进入[ShowAreaNameWithNoTooltip('morea_area')]。这样我们就能安心建设家园了。"
 flavor_moi.11.a: "[ShowAreaNameWithNoTooltip('morea_area')]的安全是我们的首要之务。"
 flavor_moi.11.b: "[ShowBuildingTypeNameWithNoTooltip('hexamilion_wall')]太过昂贵了。"
 flavor_moi.11.historical_info: "在君士坦丁十一世统治摩里亚期间，他将帝国的重心转向了该地区的群山，认为如果帝国要生存下去，就必须加固六里城墙并发展那里的城市。然而，当奥斯曼人入侵他的领地时，他的计划失败了，乡村地区惨遭蹂躏。"

 flavor_moi.12.title: "重建军区制"
 flavor_moi.12.a: "我们应当重建这一制度，以更高效地组织我们的军队。"
 flavor_moi.12.b: "历史已经证明这种制度并不合适。"
 flavor_moi.12.desc: "军区制是一种由将军领导的省级总部与军队体系，将军肩负着保卫地方和建立权威的双重责任。几个世纪以来，它一直是帝国统治的基石。尽管这一制度后来被废除，但基于其特性，我们中的一些人呼吁重建军区制，以更有效地维持我们的军事力量。"

 reopening_of_the_olympic_games: "我们将重开奥运会"
 flavor_moi.13.title: "重开奥运会"
 flavor_moi.13.a: "我们应当重办这一盛事。"
 flavor_moi.13.b: "不，这太过昂贵了。而且我们当前的主要精力应放在抵御外敌上。"
 flavor_moi.13.desc: "我们重新占领了奥林匹亚。自古典时代以来，这座城市一直是奥运会的举办地。每个希腊城邦都会派遣代表参加这一盛事。既然我们志在复兴古希腊，我们应当重开奥运会，并邀请其他国家一同参与。"
 flavor_moi.13.historical_info: "古代奥运会是各城邦代表之间的一系列体育竞赛，也是古希腊泛希腊运动会之一。运动会在奥林匹亚的泛希腊宗教圣地举行，以纪念宙斯，希腊人赋予其神话起源。奥运会传统上始于公元前776年。运动会每四年举办一次，称为奥林匹亚周期，这成为历史纪年中的一个时间单位。这些奥林匹亚周期根据其斯塔迪翁赛跑冠军来命名，例如“阿尔戈斯的拉达斯赢得斯塔迪翁赛跑的第十八届奥林匹亚周期的第三年”。公元前2世纪希腊被罗马统治后，奥运会仍继续举办。有记录的最后一届奥运会于公元393年在狄奥多西一世皇帝治下举行，但考古证据表明此后仍有部分赛事举行。奥运会很可能在狄奥多西二世时期终结，可能与在其统治期间烧毁奥林匹亚宙斯神庙的大火有关。"

 flavor_moi.14.title: "收复科林斯"
 flavor_moi.14.a: "迈向收复故土的重要一步！"
 flavor_moi.14.desc: "我们最近的军事行动使我们成功夺回了[ShowLocationName('corinth')]，这座城市位于伯罗奔尼撒半岛与希腊其他地区的交界处。随着我们控制此城，我们离实现目标又近了一步。"

 flavor_moi.15.title: "收复雅典"
 flavor_moi.15.a: "迈向收复故土的重要一步！"
 flavor_moi.15.desc: "我们最近的军事行动使我们成功夺回了[ShowLocationName('athens')]，这座城市在希腊地区一直极其重要。随着我们的旗帜再次在卫城上空飘扬，我们得以洗刷自1204年以来持续的耻辱。"

 flavor_moi.16.title: "收复拉里萨"
 flavor_moi.16.a: "迈向收复故土的重要一步！"
 flavor_moi.16.desc: "我们最近的军事行动使我们成功夺回了[ShowLocationName('larissa')]，这座城市位于希腊中部，是连接南北的关键枢纽。夺取此地后，我们得以将其用作重要军事基地，并对该区域施加控制。"

 flavor_moi.17.title: "收复塞萨洛尼基"
 flavor_moi.17.a: "迈向收复故土的重要一步！"
 flavor_moi.17.desc: "我们最近的军事行动使我们成功夺回了[ShowLocationName('thessaloniki')]。作为拜占庭帝国仅次于君士坦丁堡的第二大城市，塞萨洛尼基的财富与声望源于其战略性的商业地位。其繁忙的港口在意大利与罗马腹地之间输送着贵重货物，成为连接东西方的重要桥梁。"

 flavor_moi.18.title: "进入君士坦丁堡！"
 flavor_moi.18.a: "世界渴望之城再次重归我们所有！"
 flavor_moi.18.b: "我们将把首都迁至此地。"
 flavor_moi.18.desc: "经过一场艰苦卓绝的战斗，时隔一个世纪的时间，我们的军队跨越金门，进入了君士坦丁堡。这座曾被称为新罗马的城市，如今已被我们光复。君士坦丁堡曾是[GetFormableCountry('BYZ').GetName]帝国的旧都。随着我们重返此地，这也将标志着一个新时代的开端。正如凤凰涅槃，我们将重建我们的帝国。"

 universality_vs_exclusivity: "普世 vs 排他"
 universality_vs_exclusivity_desc: "一个普世的国家会更欢迎其他文化的人民，而一个排他的国家则会对其充满敌意。"
 universality_focus: "普世"
 exclusivity_focus: "排他"

 flavor_moi.19.title: "突厥人被逐出色雷斯！"
 flavor_moi.19.a: "凤凰涅槃！"
 flavor_moi.19.desc: "[GetCountry('TUR').GetName]的势力已被逐出[ShowAreaName('thrace_area')]，此地曾是他们的权力中心。随着[ShowAreaNameWithNoTooltip('thrace_area')]的稳固，我们的繁荣便有了保障！"

 flavor_moi.20.title: "复兴[ShowReligionName('hellenism_religion')]？"
 flavor_moi.20.a: "也许[ShowReligionName('hellenism_religion')]终究是正确的。"
 flavor_moi.20.b: "我们不能接受如此异端邪说。"
 flavor_moi.20.desc: "在我们国内，出现了一群人，他们倡导复兴古老的[ShowReligionName('hellenism_religion')]。他们声称我们目前的困境完全是由于接受了基督教造成的。他们提议，我们应该回归对古代[ShowReligionName('hellenism_religion')]的信仰。"

 flavor_moi.21.title: "突厥人被逐出马其顿！"
 flavor_moi.21.a: "凤凰涅槃！"
 flavor_moi.21.desc: "[GetCountry('TUR').GetName]的势力已被逐出[ShowAreaName('macedonia_area')]，此地曾是他们的权力中心。随着[ShowAreaNameWithNoTooltip('macedonia_area')]的稳固，我们的繁荣便有了保障！"


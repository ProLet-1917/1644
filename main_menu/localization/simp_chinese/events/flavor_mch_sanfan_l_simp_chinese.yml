l_simp_chinese:
 flavor_mch.20.title: "三藩之乱"
 flavor_mch.20.desc: "吴三桂等藩王在南方坐拥重兵。若骤然削藩，恐其举兵；若置之不问，则无异于另立一朝。"
 flavor_mch.20.historical_info: "康熙十二年清廷议撤藩，吴三桂在云南起兵，尚之信、耿精忠先后响应，南方陷入八年战乱，至康熙二十年方告平定。"
 flavor_mch.20.a: "撤藩"
 flavor_mch.20.b: "暂缓，以恩羁縻"
 flavor_mch.20.entry: "$flavor_mch.20.title$"
 sanfan_rebellion_tt: "吴三桂将起兵对抗朝廷。"

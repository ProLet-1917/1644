l_simp_chinese:
 flavor_mng.1.title: "弘光帝"
 flavor_mng.1.desc: "北都[ShowLocationName('dadu')]陷于贼人之手，先帝已死于乱军之中，然国不可一日无君，我们已经于南都拥立新君。我们定要重整河山，再造国家。"
 flavor_mng.1.historical_info: "1644年李自成攻占北京后，南京官僚拥立朱由崧为帝，年号“弘光”，推行“借虏平寇”政策，意图联合清军消灭农民军。然而内部党争激烈导致统治腐败、军备松弛。史可法坚守扬州殉国后，清军突破长江防线，南京守将赵之龙、钱谦益等开城投降，弘光政权就此灭亡。"
 flavor_mng.1.a: "重建朝廷"
 flavor_mng.1.entry: "$flavor_mng.1.title$"
 emperor_in_nanjing: "如果南京失守，将会造成不可控的事情发生"
 flavor_mng.2.title: "南京丢失"
 flavor_mng.2.desc: "[ShowLocationName('shangyuan')]陷于贼人之手，皇帝日前以离开南京向南暂避，各地纷纷质疑我们是否还能统治下去？"
 flavor_mng.2.a: "弘光帝被敌军俘获"
 flavor_mng.2.b: "弘光帝南逃"
 flavor_mng.2.entry: "$flavor_mng.2.title$"
 lost_nanjing: "南京失守，后果将在数个月的时间内慢慢显现"
 flavor_mng.3.title: "隆武帝"
 flavor_mng.3.desc: "在以郑芝龙为首的集团的拥立下，朱聿键作为皇室成员，在[ShowLocationName('minxian')]称帝。我们定要重整河山，再造国家。"
 flavor_mng.3.historical_info: "隆武帝朱聿键在弘光政权覆灭后，于1645年闰六月受郑芝龙等拥立，在福州称帝，改元隆武。在位期间厉行吏治革新，严惩贪腐，推行“联寇抗清”政策，收编大顺军余部，任用金声、杨廷麟、何腾蛟等抗击清军，并收复安徽旌德、宁国等失地，同时试图调和与鲁王政权矛盾。然受制于郑氏集团拥兵自保，加之清军南下攻势，终未能扭转局势。1646年清军突破仙霞关入闽，郑芝龙降清，朱聿键在汀州被俘后绝食殉国，享年44岁。"
 flavor_mng.3.a: "重建朝廷"
 emperor_in_fuzhou: "如果福州失守，将会造成不可控的事情发生"
 flavor_mng.3.entry: "$flavor_mng.3.title$"
 flavor_mng.4.title: "鲁王"
 flavor_mng.4.desc: "朱以海在绍兴受张国维、孙嘉绩等人的拥戴宣布监国，浙江地区仍受我们控制的领土均宣布归于鲁王统领"
 flavor_mng.4.historical_info: "1645年，弘光帝被害以后，鲁王朱以海在张国维、孙嘉绩等人的拥戴下,于绍兴宣布监国，后组织钱塘江战役，企图划江而守，最终被清军击退。1646年清军大举渡江，江上溃败，绍兴失陷，鲁王设法脱逃，幸免于难。"
 flavor_mng.4.a: "岂有二主之理乎？"
 flavor_mng.4.b: "我将领导他们"
 flavor_mng.4.entry: "$flavor_mng.4.title$"
 flavor_mng.5.title: "隆武北伐"
 flavor_mng.5.desc: "大半江山现已落入敌军之手，日前我等暂避南方，我们应当重建军队，兴兵北伐，夺回被占领的土地"
 flavor_mng.5.a: "克复中原"
 flavor_mng.5.entry: "$flavor_mng.5.title$"
 flavor_mng.6.title: "光复南京"
 flavor_mng.6.desc: "曾陷落于敌人之手的南都南京日前已被我军光复，作为王朝兴起之地，这一事件标志了我们得以证明我们仍有统治中华的能力。"
 flavor_mng.6.a: "重新重建南京六部"
 flavor_mng.6.entry: "$flavor_mng.6.title$"
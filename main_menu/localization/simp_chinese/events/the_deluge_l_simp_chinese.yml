l_simp_chinese:
 the_deluge.1.t: "[GetCountry('ZAZ').GetName]请求我们加入他们对[GetCountry('PLC').GetName]的战争"
 the_deluge.2.t: "来自[GetCountry('CRI').GetName]的消息"
 the_deluge.3.t: "来自[GetCountry('CRI').GetName]的消息"
 the_deluge.4.t: "来自[GetCountry('PRU').GetName]的消息"
 the_deluge.5.t: "[GetCountry('PLC').GetName]的软弱"
 the_deluge.6.t: "干预部队"
 the_deluge.7.t: "来自华沙的消息——普鲁士提供军队"
 the_deluge.8.t: "来自友方的援助"
 the_deluge.1.a: "我们接受。"
 the_deluge.1.b: "我们拒绝！"
 the_deluge.1.desc: "我们的北方邻居——哥萨克人，在赫梅利尼茨基的领导下向北挺进，决心为他在联邦中所遭受的不公而战。他们派来信使，询问我们是否愿意加入他们一方。"
 the_deluge.2.a: "欢迎！"
 the_deluge.2.desc: "派往克里米亚的信使近日带回了好消息：他们将加入我们一方。"
 the_deluge.3.a: "他们太弱小了。"
 the_deluge.3.desc: "派往克里米亚的信使近日带回了坏消息：他们不会帮助我们。"
 the_deluge.4.a: "我们接受，但他们应该派遣一支部队来协助我们作战。"
 the_deluge.4.b: "我们拒绝，普鲁士必须处于联邦统治之下。"
 the_deluge.4.c: "我们不得不接受，但他们必须留在当前的战争中。"
 the_deluge.4.desc: "来自普鲁士的信使带来了一份条约，条约内容要求我们承认他们的独立。"
 the_deluge.5.a: "不！"
 the_deluge.5.desc: "联邦已变得如此虚弱，以至于无法再掩盖公然的混乱。我们的军队低效而腐败，人民也遭受着贵族的暴政。随着外敌入侵，我们的未来岌岌可危。"
 the_deluge.6.a: "是时候离开家园了。"
 the_deluge.6.b: "我将领导他们！"
 the_deluge.6.desc: "我们已向其他国家派遣了一支干预部队，以协助他们在战场上取得胜利。"
 the_deluge.7.a: "我们接受。"
 the_deluge.7.b: "不。"
 the_deluge.7.desc: "我们派往华沙的信使带回了波兰人的要求。他们要求我们提供一支军队，以换取他们对我们的承认。"
 the_deluge.8.a: "欢迎。"
 the_deluge.8.desc: "目前，有一个外国向我们国家派遣了一支干预部队，以协助我们对抗敌人。"
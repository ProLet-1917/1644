l_simp_chinese:
  flavor_eng_imperialism.1.title: "宪章运动"
  flavor_eng_imperialism.1.desc: "王国的工厂与矿井中，劳动阶层正高举起《人民权利新宪章》的旗帜：要求普选权、无记名投票以及在议会中的发言权。运动日益壮大，政府必须决定如何应对工人的呼声。"
  flavor_eng_imperialism.1.historical_info: "1838 年，宪章运动围绕一份宪章组织起来，要求男性普选权、议会年选和无记名投票。1839 年、1842 年和 1848 年的请愿书共获得多达三百万人的签名。议会虽然否决了《宪章》，但这场运动推动了一系列改革，使工人在此后数十年间逐步获得了选举权。"
  flavor_eng_imperialism.1.a: "回应人民的诉求"
  flavor_eng_imperialism.1.b: "守护现有宪法"
  flavor_eng_imperialism.1.entry: "$flavor_eng_imperialism.1.title$"

  flavor_eng_imperialism.2.title: "爱尔兰大饥荒"
  flavor_eng_imperialism.2.desc: "爱尔兰的土豆收成染上了疫病——而这已经是连续第三年了。饥荒正席卷西部各省，移民船上挤满了逃往美国的绝望者。政府必须决定如何应对这场灾难。"
  flavor_eng_imperialism.2.historical_info: "1845 年至 1852 年间，爱尔兰大饥荒（爱尔兰语：An Gorta Mór）降临，土豆连年歉收。多达一百万人死于饥荒，另有一百万人被迫移民海外。英国政府克制的自由贸易应对方式遭到广泛谴责，饥荒成为爱尔兰记忆中一道至今未愈的伤疤。"
  flavor_eng_imperialism.2.a: "运送援助，开放粮仓"
  flavor_eng_imperialism.2.b: "让市场自行调节"
  flavor_eng_imperialism.2.entry: "$flavor_eng_imperialism.2.title$"

  flavor_eng_imperialism.3.title: "1851 年万国工业博览会"
  flavor_eng_imperialism.3.desc: "亲王提议举办一场“万国工业博览会”，选址海德公园。一座玻璃与钢铁铸造的宫殿将在数月之内拔地而起——一座将令世界惊叹的工程奇迹。"
  flavor_eng_imperialism.3.historical_info: "1851 年 5 月 1 日，万国工业博览会在海德公园的水晶宫开幕。这座宏伟的玻璃钢铁建筑由约瑟夫·巴克斯顿设计。约一万四千名参展商展示了他们的商品，超过六百万名参观者前来参观。这是世界上第一届世博会，也是工业时代的辉煌胜利。"
  flavor_eng_imperialism.3.a: "建造水晶宫"
  flavor_eng_imperialism.3.b: "这种排场简直是浪费黄金"
  flavor_eng_imperialism.3.entry: "$flavor_eng_imperialism.3.title$"

  flavor_eng_imperialism.4.title: "《物种起源》"
  flavor_eng_imperialism.4.desc: "一位博物学家出版了一部颠覆自然秩序根基的著作：所有生物都由共同祖先演化而来，生存竞争选择出最适应者。学术界为之沸腾。"
  flavor_eng_imperialism.4.historical_info: "1859 年，查尔斯·达尔文出版了《物种起源——论自然选择》。首版 1250 册在出版当天即告售罄。他的进化论——建立于二十年的研究以及“小猎犬号”的航行考察之上——彻底改变了生物学，并引发了教会与科学界的激烈争论。"
  flavor_eng_imperialism.4.a: "学界欣然接受"
  flavor_eng_imperialism.4.b: "谴责这一异端邪说"
  flavor_eng_imperialism.4.entry: "$flavor_eng_imperialism.4.title$"

  flavor_eng_imperialism.5.title: "前拉斐尔派兄弟会"
  flavor_eng_imperialism.5.desc: "一群年轻的画家、诗人与雕塑家结成了一个兄弟会，他们推崇拉斐尔之前“早期”画家那种宝石般的色彩与细节，拒绝学院派的方式和皇家艺术学院的陈规——他们决心让王国的艺术焕然一新。"
  flavor_eng_imperialism.5.historical_info: "1848 年，但丁·加百列·罗塞蒂、威廉·霍尔曼·亨特和约翰·埃弗里特·米莱斯在伦敦创立了前拉斐尔派兄弟会。他们从自然中汲取素材，以宝石般的细节与浓郁的色彩作画，这场运动在一个世代中彻底改变了英国的绘画、文学与设计，其回响延续至今。"
  flavor_eng_imperialism.5.a: "资助兄弟会"
  flavor_eng_imperialism.5.b: "不过是些平庸的画作"
  flavor_eng_imperialism.5.entry: "$flavor_eng_imperialism.5.title$"

  flavor_eng_imperialism.6.title: "现代小说之父"
  flavor_eng_imperialism.6.desc: "一位年轻的作家正在以连载的方式出版他的小说，读者如痴如醉。他讲述伦敦孤儿、债务人监狱和历史洪流中的故事，使他成为英格兰最有名望的人。他的名字就是查尔斯·狄更斯。"
  flavor_eng_imperialism.6.historical_info: "查尔斯·狄更斯（1812–1870）是帝国时代最具代表性的小说家。他的连载小说——《雾都孤儿》《大卫·科波菲尔》《双城记》《远大前程》——以及他对贫困与法律的新闻报道，使他成为那个时代最负盛名的作家，也是其最敏锐的社会批评者。"
  flavor_eng_imperialism.6.a: "让他成为时代的喉舌"
  flavor_eng_imperialism.6.b: "不过是昙花一现"
  flavor_eng_imperialism.6.entry: "$flavor_eng_imperialism.6.title$"

  flavor_eng_imperialism.7.title: "铁路时代的工程师"
  flavor_eng_imperialism.7.desc: "消息从王国最著名的工程师布鲁内尔那里传来：横跨埃文峡谷的大型悬索桥已经竣工，他的铁壳远洋巨轮正在让旧时代的渡海方式成为过去。铁路、桥梁与铁壳正在重塑王国的面貌。"
  flavor_eng_imperialism.7.historical_info: "伊桑巴德·金卡德·布鲁内尔（1806–1859）是铁路时代的工程师：克利夫顿悬索桥、“大西部”号蒸汽船、大西部铁路，还有铁壳的“大不列颠号”。他的工程纪念碑至今仍矗立着，激励着后世的工程师。"
  flavor_eng_imperialism.7.a: "资助这个时代的铁路"
  flavor_eng_imperialism.7.b: "立一座朴素的纪念碑"
  flavor_eng_imperialism.7.entry: "$flavor_eng_imperialism.7.title$"

  flavor_eng_imperialism.8.title: "提灯女士"
  flavor_eng_imperialism.8.desc: "克里米亚战场传来消息：一位名叫南丁格尔的女士接管了斯库塔里的医院。士兵们写信回家说，他们会追随“提灯女士”奔赴任何地方。曾经夺去半数伤员性命的恶臭与污秽，终于正在被清除。"
  flavor_eng_imperialism.8.historical_info: "弗洛伦斯·南丁格尔（1820–1910）率领一批护士前往克里米亚战争，在君士坦丁堡的斯库塔里医院彻底革新了野战医疗。她在卫生防疫和死亡统计研究方面的工作，使她成为民族偶像，也成为现代护理学的奠基人。"
  flavor_eng_imperialism.8.a: "向提灯女士致敬"
  flavor_eng_imperialism.8.b: "给她发放养老金"
  flavor_eng_imperialism.8.entry: "$flavor_eng_imperialism.8.title$"

  flavor_eng_imperialism.9.title: "福尔摩斯探案"
  flavor_eng_imperialism.9.desc: "一位来自苏格兰的年轻军医出版了一部小说，塑造了一位贝克街上的咨询侦探——他以“演绎法”破解每一桩罪案。这个世界永远不会忘记这个角色。他的名字就是夏洛克·福尔摩斯。"
  flavor_eng_imperialism.9.historical_info: "阿瑟·柯南·道尔的《血字的研究》（1887 年）塑造了夏洛克·福尔摩斯与华生医生。从《巴斯克维尔的猎犬》到《恐怖谷》的连载冒险，开创了侦探推理的世界，贝克街 221B 也成为文学史上最著名的地址之一。"
  flavor_eng_imperialism.9.a: "让故事公之于众"
  flavor_eng_imperialism.9.b: "只是炉边故事罢了"
  flavor_eng_imperialism.9.entry: "$flavor_eng_imperialism.9.title$"

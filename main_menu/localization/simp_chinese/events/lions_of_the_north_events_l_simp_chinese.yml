l_simp_chinese:
 flavor_plc.5000.title:"亚努什拉齐维乌的叛乱"
 flavor_plc.5000.desc:"随着国外军队的入侵，在维尔纽斯，有一位叫做亚努什拉齐维乌的立陶宛贵族现已联合一些其他贵族掀起叛乱的旗帜。"
 flavor_plc.5000.historical_info:"1655 年 6 月，瑞典军队开始向波兰立陶宛联邦的北部领土推进。瑞典对波兰立陶宛联邦的入侵是第二次北方战争的一部分，在立陶宛的历史上被称为“大洪水”。亚努什与他的堂兄博古斯瓦夫·拉齐维乌一起，与瑞典国王查尔斯·克里斯托夫·古斯塔夫进行了谈判，讨论如何推翻卢布林联盟（该联盟创建了波兰立陶宛联邦）。亚努什于 1655 年 8 月 17 日在凯德亚尼亚条约中宣布大公国成为瑞典的保护国，随后兄弟俩于 10 月 20 日签署了另一份条约，根据该条约，瑞典与立陶宛结成联盟，而拉齐维乌家族将统治大公国。"
 flavor_plc.5000.a:"必须要出重拳"
 flavor_pru.1.title:"统一的[GetFormableCountry('PRU').GetName]"
 flavor_pru.1.desc:"随着我们的家族统治者勃兰登堡和普鲁士地区，随着对领地统一的在同一头衔下的需求日益增长，我们应该接受[GetFormableCountry('PRU').GetName]的头衔。"
 flavor_pru.1.historical_info:"作为对在西班牙王位继承战争中与皇帝结盟的回报，大选帝侯之子弗雷德里克三世在 1700 年 11 月 16 日的《王位继承条约》中被允许将普鲁士提升为王国。弗雷德里克于 1701 年 1 月 18 日为自己加冕为“普鲁士国王”——弗雷德里克一世。从法律上讲，除了波西米亚和意大利之外，神圣罗马帝国内不允许存在王国。然而，弗雷德里克坚持认为，由于普鲁士从未属于帝国，而霍亨索伦家族对其拥有完全主权，所以他可以将普鲁士提升为王国。为了在即将到来的西班牙王位继承战争中获得弗雷德里克的支持，利奥波德一世皇帝默许了这一决定。"
 flavor_pru.1.a:"宣称头衔，统一我们的领地"
 flavor_pru.1.b:"我们不能违反神圣罗马帝国的规定"
 flavor_pru.2.title:"被军队拥有的国家"
 flavor_pru.2.desc:"普鲁士因其领内特殊的军人地位而常常被人称作被陆军拥有的国家，这显示出了军人，尤其是军事容克在国家内的地位。"
 flavor_pru.2.a:"接受改革"
 flavor_pru.2.b:"也许还是不了"
 flavor_pru.3.title:"来自其它国家的兄弟"
 flavor_pru.3.desc:"随着宗教改革运动的高潮过去，和在宗教战争的结束，一些被其他天主教德意志邦国压迫的新教信徒们逃到我们的领土上寻求庇护。"
 flavor_pru.3.a:"安置好他们"
 flavor_pru.3.b:"把他们送回去"
 flavor_zaz.2000.title:"一个名叫博格丹·赫梅利尼茨基的男子请求援助"
 flavor_zaz.2000.desc:"博格丹·赫梅利尼茨基在波兰立陶宛联邦收到了不公平的对待，作为回应，他逃离了这个国家并来到了我们的土地上号召我们的人民加入支持他对抗波兰立陶宛联邦的行动。"
 flavor_zaz.2000.a:"让他来领导我们！"
 flavor_zaz.2000.b:"把他送回波兰。"
 flavor_zaz.2000.c:"说服他为我们服役。"

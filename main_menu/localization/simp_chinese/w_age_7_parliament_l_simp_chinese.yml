l_simp_chinese:
 # ===== 第七时代议会类型 =====
 republican_parliament: "共和议会"
 republican_parliament_desc: "以广泛选举权产生的至高议院。它制定法律、表决赋税，并监督大臣。"
 imperial_parliament: "帝国议会"
 imperial_parliament_desc: "由君主召集的贵族、教士与市民之议院。皇帝临朝，而钱袋握于议院之手。"
 presidential_parliament: "总统制议会"
 presidential_parliament_desc: "与总统分别选出的立法机关，握有财政权与质询权。"
 mass_suffrage_parliament: "普选议会"
 mass_suffrage_parliament_desc: "由全体成年公民选出的议院，劳工阶层在其中握有决定性的票数。"

 # ===== 第七时代议会议题 =====
 army_bill: "军队法案"
 army_bill_desc: "议院将就军队的兵额、款项与服役条件进行表决。"
 compulsory_education_bill: "义务教育法案"
 compulsory_education_bill_desc: "使初等教育普及且免费，其费用由国库负担。"
 colonial_autonomy_bill: "殖民地自治法案"
 colonial_autonomy_bill_desc: "授予殖民地一定程度的自治，并让其在自身税赋上有发言之权。"
 tariff_reform_bill: "关税改革法案"
 tariff_reform_bill_desc: "修订海关税则，或趋向保护，或趋向自由贸易。"
 suffrage_extension_bill: "选举权扩大法案"
 suffrage_extension_bill_desc: "降低财产资格，使新的阶层得以进入选举之列。"
 pension_bill: "养老金法案"
 pension_bill_desc: "由国家以一般税赋为财源，向贫苦老者发放养老金。"
 railway_nationalization_bill: "铁路国有化法案"
 railway_nationalization_bill_desc: "将干线铁路收归公有，为公共利益而经营。"
 anti_trust_bill: "反垄断法案"
 anti_trust_bill_desc: "抑制支配市场的庞大托拉斯、卡特尔与垄断。"
 public_health_bill: "公共卫生法案"
 public_health_bill_desc: "设立全国卫生局，掌理供水、下水道与住宅之权。"
 colonial_conscription_bill: "殖民征兵法案"
 colonial_conscription_bill_desc: "将服役义务扩展至各殖民地与属地。"
 civil_service_reform_bill: "文官改革法案"
 civil_service_reform_bill_desc: "以考试、才能与常任为原则，改革公职制度。"
 central_bank_charter_bill: "中央银行特许法案"
 central_bank_charter_bill_desc: "续展并扩大中央银行的特许状，并厘定其与国库的关系。"

 # ===== 第七时代选举 =====
 constitutional_cabinet_election: "内阁选举"
 constitutional_cabinet_election_desc: "握有多数议席的议院组阁。政府首脑由民选议院选出，并对之负责。"
 presidential_election: "总统选举"
 presidential_election_desc: "国家元首以直接或间接选举产生，任期固定，并独立于立法机关而行政。"
 mass_suffrage_election: "普选"
 mass_suffrage_election_desc: "每一位成年公民皆投下选票。结果取决于广大的劳工与农民大众。"
 imperial_diet_election: "帝国议会选举"
 imperial_diet_election_desc: "帝国议会以皇帝之名选出首相，组成政府。"
 universal_suffrage_eligibility: "普选：每一位成年公民皆可参选。"

 # ===== 第七时代静态修正 =====
 passed_army_bill: "军队法案通过"
 passed_army_bill_desc: "议院已为军队表决通过兵额与款项。"
 passed_compulsory_education_bill: "义务教育法案通过"
 passed_compulsory_education_bill_desc: "初等教育自此普及且免费。"
 passed_colonial_autonomy_bill: "殖民地自治通过"
 passed_colonial_autonomy_bill_desc: "殖民地已获得一定程度的自治。"
 granted_colonial_autonomy: "被授予殖民地自治"
 granted_colonial_autonomy_desc: "分享自身治理之权，使殖民地与母国重归和睦。"
 passed_tariff_reform_bill: "关税改革通过"
 passed_tariff_reform_bill_desc: "海关税则已由议院以法案修订。"
 passed_suffrage_extension_bill: "选举权扩大"
 passed_suffrage_extension_bill_desc: "新的选民阶层已被纳入选举之列。"
 passed_pension_bill: "养老金法案通过"
 passed_pension_bill_desc: "国家自此向贫苦老者发放养老金。"
 passed_railway_nationalization_bill: "铁路国有化"
 passed_railway_nationalization_bill_desc: "干线铁路已成为全民的财产。"
 passed_anti_trust_bill: "反垄断法案通过"
 passed_anti_trust_bill_desc: "庞大的托拉斯已由议院以法案加以抑制。"
 passed_public_health_bill: "公共卫生法案通过"
 passed_public_health_bill_desc: "全国卫生局自此掌理供水、下水道与住宅。"
 passed_colonial_conscription_bill: "殖民征兵通过"
 passed_colonial_conscription_bill_desc: "服役义务已扩展至各殖民地。"
 passed_civil_service_reform_bill: "文官制度改革"
 passed_civil_service_reform_bill_desc: "公职自此以考试录用，并以常任为保障。"
 passed_central_bank_charter_bill: "中央银行获特许"
 passed_central_bank_charter_bill_desc: "中央银行的特许状已获续展与扩大。"

 republican_parliament_law_vote_required: "变更法律须经表决"
 republican_parliament_law_vote_required_desc: "立法之权在议院而非在君主。政策不再能以稳定度直接购买，必须作为议会议题推动。"

 # ===== 第七时代自动修正 =====
 republican_parliament_law_vote_required_auto: "法律须经议会表决"
 republican_parliament_law_vote_required_auto_desc: "在至高议院开议期间，法律的变更必须由议会推动，而无法以稳定度购买。"
 parliament_seat_nobles_power: "议院中的贵族席位"
 parliament_seat_nobles_power_desc: "贵族在议院中握有可观的席次，其对国政的影响力随之增长。"
 parliament_seat_burghers_power: "议院中的市民席位"
 parliament_seat_burghers_power_desc: "城市中产阶层在议院中占据优势，其在国政中的力量随之增长。"
 parliament_seat_peasants_power: "议院中的平民席位"
 parliament_seat_peasants_power_desc: "劳工与农民大众掌握关键席次，其在国政中的力量随之增长。"

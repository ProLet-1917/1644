l_simp_chinese:
 # Tag specific. Please keep alphabetical order
 country_history_BAV: "自从数百年的分裂之后，[GetCountry('BAV').GetName]再次迎来了统一。我们位于[GetInternationalOrganization('hre').GetName]的核心地区，多瑙河流经我们的土地，带来了财富和富庶的土地。\n\n我们的国家现在被[GetDynasty('wittelsbach_dynasty').GetName]王朝所统治，目前[GetDynasty('wittelsbach_dynasty').GetName]王朝正在陷入一场关于[ShowSpecialStatusName('elector')]地位的争斗之中。\n\n宗教战争作为席卷了欧洲的冲突，我们也难以置身中立，我们正作为天主教联军的一员支持着[GetInternationalOrganization('hre').GetName]皇帝的权威。"
 country_history_BRA: "[GetDynasty('hohenzollern_dynasty').GetName]王朝已经统治了[GetCountry('BRA').GetName]数百年之久，在[GetDynasty('hohenzollern_dynasty').GetName]王朝的统治下，[GetCountry('BRA').GetName]的土地摆脱了曾经[GetDynasty('wittelsbach_dynasty').GetName]王朝统治的时代的那般困境并随着一代代君主的统治下重新繁荣起来。[GetDynasty('hohenzollern_dynasty').GetName]王朝现在同时也统治者[GetCountry('PRU').GetName]，或许有一天我们可以联合起来，组建成为一个新的国家。\n\n北德意志在不久之前被[GetCountry('SWE').GetName]的军队所入侵，同时[GetInternationalOrganization('hre').GetName]皇帝又在南方发起反击，战火又重新摧残了这片土地，不过混乱总是伴随着机遇，我们的领土并未收到太大的波及，也许我们可以趁着这一时机，开启属于我们的道路。"
 # Fallback
 country_history_fallback: "在这一历史交汇的时刻，我国正面临前所未有的机遇与挑战。随着全球贸易网络的延展，异域的思想瑰宝、珍稀的贸易商品和多元的文化养分，都已成为我们可资利用的宝贵资源。然而，如何在时代的洪流中保护我们的传统精华、维护国家的主权，成为了摆在我们面前的重大任务。\n\n现在，我们必须审视当前的形势和选择：是要深耕人文沃土，成就礼仪大邦；还是强化军备建设，建成无坚不摧的军队。这一关键的选择，将决定我国在这个联系愈发紧密的新时代的命运。"

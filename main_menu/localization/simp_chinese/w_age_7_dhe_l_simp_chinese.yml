# ===== 此前缺失的历史注释 =====
 flavor_gbr_imperialism.10.historical_info: "维多利亚时代的小说是一种伟大的通俗艺术，按月分册出版，被各个阶层争相阅读。查尔斯·狄更斯（1812-1870）以法院、学校与济贫院的种种不公为题材，是他那个时代读者最多的作家。"
 flavor_ger_imperialism.2.historical_info: "带有研讨班与实验室的德国研究型大学，是十九世纪全世界的榜样。德国科学家在早期诺贝尔奖中占了不成比例的高份额，而德国工业正依靠其实验室生存。"
 flavor_ger_imperialism.3.historical_info: "“世界政策”是威廉二世与比洛在1890年代宣布的路线：德国将要求在世界殖民与海军事务中获得与其实力相称的一份。这使她与英国发生了冲突。"
 flavor_ger_imperialism.10.historical_info: "理查德·瓦格纳（1813-1883）在拜罗伊特为他的乐剧修建了节日剧院；他的半音和声与主导动机改变了欧洲音乐的进程。"
 flavor_ita_imperialism.10.historical_info: "朱塞佩·威尔第（1813-1901）是本世纪最受欢迎的歌剧作曲家，并通过《纳布科》与合唱曲《飞吧，思想》等作品，成为意大利民族运动的象征。"
 flavor_plc_imperialism.10.historical_info: "弗雷德里克·肖邦（1810-1849）把玛祖卡与波罗乃兹——波兰乡间的舞曲形式——化为全欧洲赞赏的民族音乐。"
l_simp_chinese:
 # =========================================================
 # 法国
 # =========================================================
 flavor_fra_imperialism.1.title: "七月革命"
 flavor_fra_imperialism.1.desc: "国王颁布敕令解散议院、封禁报章。巴黎以街垒作答：条条街道筑起工事，三色旗升上杜伊勒里宫，一个新王朝在自由派的条件下接过了王冠。"
 flavor_fra_imperialism.1.historical_info: "1830年七月革命推翻了查理十世，拥立路易-菲利普为“法国人的国王”，建立了立宪君主制。"
 flavor_fra_imperialism.1.a: "立宪君主足以满足这个国家。"
 flavor_fra_imperialism.1.b: "敕令不可动摇，街垒必将肃清。"

 flavor_fra_imperialism.2.title: "二月革命"
 flavor_fra_imperialism.2.desc: "禁止政治宴会的法令已演变为全面起义。国民自卫军倒向人民，王座空悬，市政厅已宣告共和。"
 flavor_fra_imperialism.2.historical_info: "1848年二月革命建立了第二共和国，一度推行男性普选权并废除了殖民地奴隶制。"
 flavor_fra_imperialism.2.a: "共和国宣告成立。"
 flavor_fra_imperialism.2.b: "我们将以武力恢复君主制。"

 flavor_fra_imperialism.3.title: "第二帝国"
 flavor_fra_imperialism.3.desc: "总统解散了议会，逮捕了政敌，并向人民发出呼吁。公民投票已追认他为皇帝。秩序恢复了，而国家又有了主人。"
 flavor_fra_imperialism.3.historical_info: "路易-拿破仑·波拿巴1851年的政变与1852年的公投建立了第二帝国，直至1870年战败而终。"
 flavor_fra_imperialism.3.a: "帝国宣告成立。"
 flavor_fra_imperialism.3.b: "共和国将得以保全。"

 flavor_fra_imperialism.4.title: "通往战争之路"
 flavor_fra_imperialism.4.desc: "一个德意志强权正在将德意志各邦聚拢在其领导之下，莱茵问题已成为我们生死存亡的问题。军队信心十足，外交官却不这样看。"
 flavor_fra_imperialism.4.historical_info: "1870-71年的普法战争导致第二帝国崩溃、阿尔萨斯-洛林丧失，以及德意志帝国在凡尔赛宫的宣告成立。"
 flavor_fra_imperialism.4.a: "我们将在战场上迎击他们。"
 flavor_fra_imperialism.4.b: "我们不会被挑动开战。"

 flavor_fra_imperialism.5.title: "公社"
 flavor_fra_imperialism.5.desc: "敌军兵临城下，政府已逃，巴黎的工人宣告成立自己的公社。他们掌握着大炮、各区公署，以及首都的心脏。"
 flavor_fra_imperialism.5.historical_info: "1871年的巴黎公社治理巴黎两个月，最终在“血腥周”中被法军镇压。"
 flavor_fra_imperialism.5.a: "公社必须被镇压。"
 flavor_fra_imperialism.5.b: "我们将与公社谈判。"

 flavor_fra_imperialism.6.title: "德雷福斯事件"
 flavor_fra_imperialism.6.desc: "一名军官依据伪造的证据被判叛国，而军方拒绝承认错误。此事已把全国分裂成两个阵营，并使共和国本身成为日常争吵的话题。"
 flavor_fra_imperialism.6.historical_info: "德雷福斯事件（1894-1906）使法国分裂为共和派与民族主义者，并促成了1905年的政教分离。"
 flavor_fra_imperialism.6.a: "必须捍卫军队与教会。"
 flavor_fra_imperialism.6.b: "无论代价如何，正义必须得到伸张。"

 flavor_fra_imperialism.10.title: "印象派"
 flavor_fra_imperialism.10.desc: "一群年轻画家离开画室走向户外，捕捉转瞬即逝的时刻，以纯色的笔触描绘光本身。沙龙拒绝了他们，公众却开始注目。"
 flavor_fra_imperialism.10.historical_info: "印象派得名于莫奈1874年的《印象·日出》，它打破了学院派绘画，重塑了欧洲艺术。"
 flavor_fra_imperialism.10.a: "我们将资助这种新绘画。"
 flavor_fra_imperialism.10.b: "这不算艺术，让他们挨饿去吧。"

 flavor_fra_imperialism.11.title: "文豪"
 flavor_fra_imperialism.11.desc: "一位精力惊人的小说家把整个法国社会当作自己的题材——它的贪婪、它的政治、它的堕落与它的天才。他的书在各省被阅读，也在多处被查禁。"
 flavor_fra_imperialism.11.historical_info: "巴尔扎克的《人间喜剧》以及维克多·雨果、埃米尔·左拉的作品主导了十九世纪的法国小说。"
 flavor_fra_imperialism.11.a: "我们将礼敬最伟大的作家。"
 flavor_fra_imperialism.11.b: "教会来决定什么可以阅读。"

 flavor_fra_imperialism.12.title: "殖民党"
 flavor_fra_imperialism.12.desc: "议员、军官与商人组成了主张殖民扩张的党派。他们辩称，法国必须占有属于自己的那一份世界，否则将在欧洲沦为二流强国。"
 flavor_fra_imperialism.12.historical_info: "1830至1914年间，法国取得了阿尔及利亚、突尼斯、印度支那以及西非与赤道非洲的大部分地区。"
 flavor_fra_imperialism.12.a: "法国必须在阳光下占有一席之地。"
 flavor_fra_imperialism.12.b: "我们不需要沙漠与丛林。"

 # =========================================================
 # 哈布斯堡君主国
 # =========================================================
 flavor_hab_imperialism.1.title: "民族的春天"
 flavor_hab_imperialism.1.desc: "维也纳起义了。学生与工人占据街头，宫廷逃往因斯布鲁克，君主国境内的各民族——德意志人、马扎尔人、意大利人、捷克人——都要求自己的宪法与自己的国家。"
 flavor_hab_imperialism.1.historical_info: "1848年革命动摇了哈布斯堡君主国的根基；宫廷逃离维也纳，斐迪南皇帝让位于弗朗茨·约瑟夫。"
 flavor_hab_imperialism.1.a: "我们将推行改革，维系君主国。"
 flavor_hab_imperialism.1.b: "军队将恢复秩序。"

 flavor_hab_imperialism.2.title: "折衷方案"
 flavor_hab_imperialism.2.desc: "马扎尔贵族不愿像行省一样受维也纳统治。有人提出一项妥协：两个国家，一位君主，一支军队，一套外交——以及两个议会。"
 flavor_hab_imperialism.2.historical_info: "1867年的奥匈折衷建立了二元君主国，直至1918年。"
 flavor_hab_imperialism.2.a: "我们将接受二元君主国。"
 flavor_hab_imperialism.2.b: "一个帝国、一部法律、一个政府。"

 flavor_hab_imperialism.3.title: "巴尔干危机"
 flavor_hab_imperialism.3.desc: "奥斯曼对巴尔干的掌控正在松动，列强环伺。在巴尔干采取进取政策可以保障我们的南翼——也可能点燃整个欧洲。"
 flavor_hab_imperialism.3.historical_info: "1908年吞并波斯尼亚-黑塞哥维那以及1912-13年的巴尔干战争，为1914年的七月危机铺平了道路。"
 flavor_hab_imperialism.3.a: "我们将在巴尔干采取行动。"
 flavor_hab_imperialism.3.b: "我们将保持克制。"

 flavor_hab_imperialism.10.title: "音乐之都"
 flavor_hab_imperialism.10.desc: "从郊区到霍夫堡，维也纳以音乐为生。音乐厅座无虚席，音乐学院是欧洲最好的，新一代作曲家正为懂得倾听的听众写作。"
 flavor_hab_imperialism.10.historical_info: "维也纳是欧洲的音乐之都，贝多芬、舒伯特、施特劳斯家族、勃拉姆斯、布鲁克纳与马勒皆在此活动。"
 flavor_hab_imperialism.10.a: "我们将资助我们的作曲家。"
 flavor_hab_imperialism.10.b: "音乐是私人消遣，不是国事。"

 flavor_hab_imperialism.11.title: "维也纳分离派"
 flavor_hab_imperialism.11.desc: "一群艺术家与学院决裂，创立了自己的运动，有自己的刊物、展览馆，以及一种全新的装饰风格。公众既为之惊骇，又为之着迷。"
 flavor_hab_imperialism.11.historical_info: "1897年由古斯塔夫·克里姆特领导的维也纳分离派与学院派艺术决裂，催生了青年风格。"
 flavor_hab_imperialism.11.a: "新艺术应当被展示。"
 flavor_hab_imperialism.11.b: "学院代表维也纳。"

 flavor_hab_imperialism.12.title: "维也纳学派"
 flavor_hab_imperialism.12.desc: "本城的一位医生发表了一套关于无意识心灵的理论，主张我们的梦、口误与神经症皆有含义。医学院在愤怒与着迷之间分裂。"
 flavor_hab_imperialism.12.historical_info: "西格蒙德·弗洛伊德1899年的《梦的解析》创立了精神分析，改变了人类对心灵的理解。"
 flavor_hab_imperialism.12.a: "我们将支持这门新科学。"
 flavor_hab_imperialism.12.b: "这是江湖骗术，让他离开。"

 # =========================================================
 # 俄罗斯
 # =========================================================
 flavor_rus_imperialism.1.title: "克里米亚战争"
 flavor_rus_imperialism.1.desc: "我军在克里米亚被西方列强的联盟击败。黑海被中立化，舰队沉没，全世界如今都知道，俄罗斯连自己的边界都守不住。"
 flavor_rus_imperialism.1.historical_info: "克里米亚战争（1853-56）暴露了俄国军队与行政的落后，促成了亚历山大二世的改革。"
 flavor_rus_imperialism.1.a: "我们必须改革，否则灭亡。"
 flavor_rus_imperialism.1.b: "我们的信仰与人数足以应付。"

 flavor_rus_imperialism.2.title: "解放农奴"
 flavor_rus_imperialism.2.desc: "四千万灵魂被束缚在土地上。沙皇提议以敕令解放他们并分给土地——遭到贵族阶层的激烈反对，而农民则对条款心存疑虑。"
 flavor_rus_imperialism.2.historical_info: "1861年的《解放宣言》解放了俄国农奴，是十九世纪最重大的社会改革。"
 flavor_rus_imperialism.2.a: "让农奴获得自由。"
 flavor_rus_imperialism.2.b: "贵族不会允许。"

 flavor_rus_imperialism.3.title: "西伯利亚大铁路"
 flavor_rus_imperialism.3.desc: "工程师提议修建一条从莫斯科直抵太平洋的钢铁线路——七千俄里轨道穿越草原与针叶林。耗资巨大，而战略价值无可估量。"
 flavor_rus_imperialism.3.historical_info: "西伯利亚大铁路1891年动工、1916年建成，将西伯利亚与欧俄联结，使俄国在远东的力量成为可能。"
 flavor_rus_imperialism.3.a: "让铁路修起来。"
 flavor_rus_imperialism.3.b: "国库无力承担。"

 flavor_rus_imperialism.4.title: "动乱之年"
 flavor_rus_imperialism.4.desc: "战争进展不利，城市饥馑，一场前往冬宫的和平请愿遭到枪击。首都出现了罢工、兵变与工人苏维埃。"
 flavor_rus_imperialism.4.historical_info: "1905年革命迫使尼古拉二世颁布《十月宣言》，设立杜马，但专制制度一直延续到1917年。"
 flavor_rus_imperialism.4.a: "我们将颁行宪法并设立杜马。"
 flavor_rus_imperialism.4.b: "专制制度绝不放弃。"

 flavor_rus_imperialism.10.title: "俄国小说"
 flavor_rus_imperialism.10.desc: "一位小说家出版了一部关于人之道德境况的巨著——战争、家庭、信仰与死亡——从彼得堡到西伯利亚都有人在读。批评家争论不休，审查官密切注视。"
 flavor_rus_imperialism.10.historical_info: "托尔斯泰的《战争与和平》（1869）与陀思妥耶夫斯基的《罪与罚》（1866）是欧洲小说的巅峰之作。"
 flavor_rus_imperialism.10.a: "我们将礼敬我们的作家。"
 flavor_rus_imperialism.10.b: "由审查官来决定。"

 flavor_rus_imperialism.11.title: "俄罗斯乐派"
 flavor_rus_imperialism.11.desc: "一位天才作曲家把俄罗斯民歌的旋律与西方音乐厅的形式结合在一起。他的作品在莫斯科、巴黎与美洲上演。"
 flavor_rus_imperialism.11.historical_info: "彼得·伊里奇·柴可夫斯基（1840-1893）与“强力集团”为俄罗斯建立了民族乐派。"
 flavor_rus_imperialism.11.a: "我们将资助我们的作曲家。"
 flavor_rus_imperialism.11.b: "外国音乐已经足够。"

 # =========================================================
 # 奥斯曼帝国
 # =========================================================
 flavor_tur_imperialism.1.title: "坦志麦特"
 flavor_tur_imperialism.1.desc: "改革派提议自上而下重组帝国：为全体臣民制定成文法、建立现代军队与现代财政，并向穆斯林与非穆斯林同样保证生命、荣誉与财产。"
 flavor_tur_imperialism.1.historical_info: "1839-76年的坦志麦特（“重组”）改革使奥斯曼的法律、行政与教育现代化，并宣告全体臣民在法律面前平等。"
 flavor_tur_imperialism.1.a: "我们将推行改革。"
 flavor_tur_imperialism.1.b: "旧制已为我们服务了四百年。"

 flavor_tur_imperialism.2.title: "宪法"
 flavor_tur_imperialism.2.desc: "在巴黎与君士坦丁堡受教育的青年军官与官员要求宪法、议会，以及对苏丹权力的限制。乌理玛敌视此举，军队则抱同情。"
 flavor_tur_imperialism.2.historical_info: "1876年的奥斯曼宪法设立了短命的议会；1878年被阿卜杜勒-哈米德二世中止，1908年由青年土耳其党恢复。"
 flavor_tur_imperialism.2.a: "将颁行宪法。"
 flavor_tur_imperialism.2.b: "议会将被解散。"

 flavor_tur_imperialism.3.title: "巴尔干风暴"
 flavor_tur_imperialism.3.desc: "我们在欧洲的省份一个接一个地失去：波斯尼亚起事、与塞尔维亚和黑山开战，如今列强又要求我们推行无法推行的改革。"
 flavor_tur_imperialism.3.historical_info: "1875-1913年的巴尔干危机使奥斯曼帝国失去了其在欧洲的大部分领土。"
 flavor_tur_imperialism.3.a: "我们将为每一个省份而战。"
 flavor_tur_imperialism.3.b: "我们将以让步换取和平。"

 flavor_tur_imperialism.10.title: "帝国建筑师"
 flavor_tur_imperialism.10.desc: "一位宫廷建筑师开始以新的方式营造，将奥斯曼传统的形制与欧洲的工程技术结合起来。博斯普鲁斯海峡畔的宫殿将成为现代帝国的形象。"
 flavor_tur_imperialism.10.historical_info: "亚美尼亚裔的巴利扬家族建筑师设计了多尔玛巴赫切宫与贝勒贝伊宫，重塑了奥斯曼的天际线。"
 flavor_tur_imperialism.10.a: "让他去建造。"
 flavor_tur_imperialism.10.b: "我们将沿用旧制营造。"

 # =========================================================
 # 日本
 # =========================================================
 flavor_jap_imperialism.1.title: "维新"
 flavor_jap_imperialism.1.desc: "黑船自西方而来，强行打开我们的港口。幕府声名扫地；外样诸藩的青年武士要求恢复天皇亲政、驱逐蛮夷——若不成，则学习他们的技艺。"
 flavor_jap_imperialism.1.historical_info: "1868年的明治维新废除了幕府，恢复天皇权威，并开启了急速现代化的进程。"
 flavor_jap_imperialism.1.a: "天皇将亲政，日本将现代化。"
 flavor_jap_imperialism.1.b: "幕府将得以维持。"

 flavor_jap_imperialism.2.title: "遣使泰西"
 flavor_jap_imperialism.2.desc: "有人提议派遣一个由政治家与留学生组成的庞大使团出访美国与欧洲——考察他们的工厂、学校、军队与宪法，把可用的东西带回国来。"
 flavor_jap_imperialism.2.historical_info: "1871-73年的岩仓使团访问了美国与欧洲，考察现代制度。"
 flavor_jap_imperialism.2.a: "让使团出发。"
 flavor_jap_imperialism.2.b: "我们没有什么可向蛮夷学习的。"

 flavor_jap_imperialism.3.title: "脱亚入欧"
 flavor_jap_imperialism.3.desc: "时代的问题被我们的思想家直白地提出：日本应当继续作为亚洲诸国中的亚洲国家，还是应当采纳欧洲的作风与实力，跻身于列强之列？"
 flavor_jap_imperialism.3.historical_info: "《脱亚论》（1885）主张日本应被当作欧洲强国而非亚洲国家对待。"
 flavor_jap_imperialism.3.a: "日本将跻身列强之列。"
 flavor_jap_imperialism.3.b: "日本将保持自身。"

 flavor_jap_imperialism.4.title: "帝国的初战"
 flavor_jap_imperialism.4.desc: "我军已准备就绪。朝鲜与满洲近在咫尺，而声称拥有它们的陆上帝国虽大却迟缓。一场短促而决定性的战争将使日本成为不可忽视的强国。"
 flavor_jap_imperialism.4.historical_info: "日本于1894-95年战胜中国、1904-05年战胜俄国，成为第一个击败欧洲列强的亚洲强国。"
 flavor_jap_imperialism.4.a: "趁时机尚在，我们出击。"
 flavor_jap_imperialism.4.b: "我们将耐心等待。"

 flavor_jap_imperialism.10.title: "浮世绘"
 flavor_jap_imperialism.10.desc: "城市的版画师把浮世——优伶、游女、茶屋、神奈川的大浪——化为一门艺术。这些版画被当作包装纸出口，而欧洲画家已开始收藏它们。"
 flavor_jap_imperialism.10.historical_info: "北斋、广重等人的浮世绘深刻影响了印象派与新艺术运动。"
 flavor_jap_imperialism.10.a: "我们将礼敬我们的艺术家。"
 flavor_jap_imperialism.10.b: "版画不过是包装纸。"

 # =========================================================
 # 美国
 # =========================================================
 flavor_usa_imperialism.1.title: "边疆西进"
 flavor_usa_imperialism.1.desc: "定居者、测量员与铁路正把边疆推向大陆的另一端。土地辽阔，原住民抵抗，而新领地究竟自由还是蓄奴的问题已无法再拖。"
 flavor_usa_imperialism.1.historical_info: "十九世纪美国横贯大陆的扩张由定居、铁路与“昭昭天命”的信条推动。"
 flavor_usa_imperialism.1.a: "这片大陆等待我们去开拓。"
 flavor_usa_imperialism.1.b: "我们已有的土地已经足够。"

 flavor_usa_imperialism.2.title: "联邦分裂"
 flavor_usa_imperialism.2.desc: "一位敌视奴隶制的总统当选，促使南方各州退出联邦。萨姆特堡已遭炮击，联邦的存亡如今将由军队来裁决。"
 flavor_usa_imperialism.2.historical_info: "美国内战（1861-65）保全了联邦并废除了奴隶制。"
 flavor_usa_imperialism.2.a: "联邦将被保全，奴隶制将被终结。"
 flavor_usa_imperialism.2.b: "让各部分和平分离。"

 flavor_usa_imperialism.3.title: "镀金时代"
 flavor_usa_imperialism.3.desc: "铁路、钢铁与石油造就了世人前所未见的财富，工业巨头如君王般睥睨共和国。城市里工人组织起来，乡间农民起而反抗。"
 flavor_usa_imperialism.3.historical_info: "1870至1900年代的“镀金时代”见证了工业的巨幅增长，同时也伴随着政治腐败与劳工冲突。"
 flavor_usa_imperialism.3.a: "工业是国家的天赋所在。"
 flavor_usa_imperialism.3.b: "托拉斯必须拆解，工人必须受到保护。"

 flavor_usa_imperialism.4.title: "一场漂亮的小战争"
 flavor_usa_imperialism.4.desc: "古巴的叛乱与哈瓦那港沉没的战舰把我们推到了与西班牙开战的边缘。战利品将是一个海外帝国；代价将是我们自己的立国原则。"
 flavor_usa_imperialism.4.historical_info: "1898年的美西战争使美国成为加勒比与菲律宾的帝国强权。"
 flavor_usa_imperialism.4.a: "我们将担起白人的重负。"
 flavor_usa_imperialism.4.b: "共和国不统治殖民地。"

 flavor_usa_imperialism.10.title: "美国之声"
 flavor_usa_imperialism.10.desc: "一位美国作家终于找到了一种既非英国式亦非乡土的嗓音——大河与边疆的语言，朴素、诙谐而深刻。欧洲已开始阅读他。"
 flavor_usa_imperialism.10.historical_info: "马克·吐温的《哈克贝利·费恩历险记》（1884）被视为独具特色的美国文学奠基之作。"
 flavor_usa_imperialism.10.a: "我们将礼敬我们的作家。"
 flavor_usa_imperialism.10.b: "让道学家去抱怨吧。"

 flavor_usa_imperialism.11.title: "发明家的实验室"
 flavor_usa_imperialism.11.desc: "一位自学成才的发明家提议把发明本身变成一种产业：一间由助手组成的实验室，同时研究电灯、留声机与活动影像。"
 flavor_usa_imperialism.11.historical_info: "托马斯·爱迪生的门洛帕克实验室开创了工业研究，为世界带来了白炽灯与留声机。"
 flavor_usa_imperialism.11.a: "资助这间实验室。"
 flavor_usa_imperialism.11.b: "这是江湖骗子的梦话。"

 # =========================================================
 # 西班牙
 # =========================================================
 flavor_spa_imperialism.1.title: "卡洛斯战争"
 flavor_spa_imperialism.1.desc: "继承权存在争议：自由派支持年幼的女王，专制派支持她的叔父，而教士与巴斯克诸省已为旧秩序与旧信仰举起武器。"
 flavor_spa_imperialism.1.historical_info: "卡洛斯战争（1833-76）是一系列围绕继承权与西班牙国家性质的内战。"
 flavor_spa_imperialism.1.a: "立宪君主制将获胜。"
 flavor_spa_imperialism.1.b: "传统秩序将得以恢复。"

 flavor_spa_imperialism.2.title: "1898年的灾难"
 flavor_spa_imperialism.2.desc: "与美国的战争在一个夏天之内夺去了我们的古巴、波多黎各与菲律宾。旧帝国的最后残片已然丧失，国家必须决定，没有它之后自己是什么。"
 flavor_spa_imperialism.2.historical_info: "“98年灾难”剥夺了西班牙仅存的海外帝国，并促使“98年一代”重新思考西班牙的民族认同。"
 flavor_spa_imperialism.2.a: "我们必须复兴国家。"
 flavor_spa_imperialism.2.b: "总有一天我们将重建帝国。"

 flavor_spa_imperialism.10.title: "巴塞罗那的建筑师"
 flavor_spa_imperialism.10.desc: "一位加泰罗尼亚建筑师以仿佛从大地中生长出来的方式营造——弯曲的石材、彩色的瓷砖，取自植物与骨骼的形制。这座城市正在我们眼前被重塑。"
 flavor_spa_imperialism.10.historical_info: "安东尼·高迪的圣家堂与桂尔公园是加泰罗尼亚现代主义的杰作。"
 flavor_spa_imperialism.10.a: "让他去建造。"
 flavor_spa_imperialism.10.b: "这不是建筑，这是疯狂。"

 # =========================================================
 # 葡萄牙
 # =========================================================
 flavor_por_imperialism.1.title: "立宪君主制"
 flavor_por_imperialism.1.desc: "在专制派与自由派多年的内战后，一部宪章得以颁行，议会得以召集。旧帝国已逝，但国家至少有了稳定的宪法。"
 flavor_por_imperialism.1.historical_info: "自由战争（1828-34）终结了葡萄牙的专制制度，建立了立宪君主制。"
 flavor_por_imperialism.1.a: "宪章将得到维护。"
 flavor_por_imperialism.1.b: "旧秩序将回归。"

 flavor_por_imperialism.2.title: "粉红地图"
 flavor_por_imperialism.2.desc: "我们的探险者与士兵已勘测出一条从安哥拉到莫桑比克的带状领土，政府提议在其他列强到来之前加以声索。而英国人对同一片土地另有打算。"
 flavor_por_imperialism.2.historical_info: "连接安哥拉与莫桑比克的“粉红地图”计划因1890年英国的最后通牒而破灭。"
 flavor_por_imperialism.2.a: "我们将声索整个非洲属地。"
 flavor_por_imperialism.2.b: "我们不会与英国争执。"

 flavor_por_imperialism.10.title: "葡萄牙诗人"
 flavor_por_imperialism.10.desc: "一位诗人出现了，他书写葡萄牙的灵魂，书写“萨乌达德”，书写这个国家消逝的伟大。学童诵读他，议院引用他。"
 flavor_por_imperialism.10.historical_info: "费尔南多·佩索阿（1888-1935）与“俄耳甫斯一代”诗人改变了葡萄牙文学。"
 flavor_por_imperialism.10.a: "我们将礼敬我们的诗人。"
 flavor_por_imperialism.10.b: "诗歌救不了国家。"

 # =========================================================
 # 尼德兰
 # =========================================================
 flavor_ned_imperialism.1.title: "比利时之后"
 flavor_ned_imperialism.1.desc: "南方诸省已经离去，王国必须寻找新的立足点。阿姆斯特丹的商人望向大海与东印度，改革者则望向国内的自由主义宪法。"
 flavor_ned_imperialism.1.historical_info: "比利时独立（1830-39）使尼德兰联合王国缩减一半，荷兰的注意力转向殖民贸易。"
 flavor_ned_imperialism.1.a: "我们的未来在贸易与东印度。"
 flavor_ned_imperialism.1.b: "我们将在国内进行改革。"

 flavor_ned_imperialism.2.title: "文化系统"
 flavor_ned_imperialism.2.desc: "东印度被要求种植欧洲会购买的东西，利润流入国库。此举利润丰厚，却靠强制劳动运作。良心与账簿都为此不安。"
 flavor_ned_imperialism.2.historical_info: "“文化系统”（1830-70）要求爪哇农民为荷兰政府种植出口作物，后来受到批评并在“伦理政策”下部分改革。"
 flavor_ned_imperialism.2.a: "这套制度有利可图，就让它继续。"
 flavor_ned_imperialism.2.b: "我们将推行伦理政策。"

 flavor_ned_imperialism.10.title: "新时代的画家"
 flavor_ned_imperialism.10.desc: "一位荷兰画家把圩田的光线与印象派的色彩化为全然属于自己的东西。他生前几乎一幅画也没卖出去。"
 flavor_ned_imperialism.10.historical_info: "文森特·梵高（1853-1890）是现代最具影响力的画家之一。"
 flavor_ned_imperialism.10.a: "我们将礼敬他。"
 flavor_ned_imperialism.10.b: "他是个疯子。"

 # =========================================================
 # 瑞典
 # =========================================================
 flavor_swe_imperialism.1.title: "自由时代"
 flavor_swe_imperialism.1.desc: "芬兰已失，列强争霸的时代已然结束。各等级已把政府握在自己手中，瑞典必须在自由宪法与新的王室专制之间做出选择。"
 flavor_swe_imperialism.1.historical_info: "“自由时代”（1719-72）是瑞典的议会政治实验；1809年宪法开启了现代时期。"
 flavor_swe_imperialism.1.a: "由各等级来治理。"
 flavor_swe_imperialism.1.b: "斯堪的纳维亚将团结一致。"

 flavor_swe_imperialism.2.title: "钢铁突破"
 flavor_swe_imperialism.2.desc: "瑞典的铁与瑞典的工程师正在建造一种新工业：北方的矿山、通往海岸的铁路、城镇中的工厂。一个小国正在成为现代经济体。"
 flavor_swe_imperialism.2.historical_info: "十九世纪晚期，瑞典以铁矿、木材与工程为基础迅速工业化。"
 flavor_swe_imperialism.2.a: "工业将使我们富足。"
 flavor_swe_imperialism.2.b: "古老的乡野才是我们的力量。"

 flavor_swe_imperialism.10.title: "瑞典小说"
 flavor_swe_imperialism.10.desc: "一位瑞典作家把外省小镇变成了整个人间喜剧的舞台，这些书正被译成欧洲的每一种语言。"
 flavor_swe_imperialism.10.historical_info: "塞尔玛·拉格洛夫（1858-1940）是首位获得诺贝尔文学奖的女性。"
 flavor_swe_imperialism.10.a: "我们将礼敬我们的作家。"
 flavor_swe_imperialism.10.b: "外省生活不是文学的题材。"

 # =========================================================
 # 波兰-立陶宛
 # =========================================================
 flavor_plc_imperialism.1.title: "民族起义"
 flavor_plc_imperialism.1.desc: "国家已被瓜分，却尚未死去。军官、学生与贵族再次为独立而起，农民则被许诺：只要参战便可获得自由。"
 flavor_plc_imperialism.1.historical_info: "1830年的十一月起义与1863年的一月起义是波兰反抗俄国统治的起事。"
 flavor_plc_imperialism.1.a: "我们将为独立而战。"
 flavor_plc_imperialism.1.b: "我们将以别的方式保全民族。"

 flavor_plc_imperialism.2.title: "有机劳动"
 flavor_plc_imperialism.2.desc: "既然起义屡屡失败，一项新纲领被提出：从内部壮大民族——学校、银行、铁路、合作社与工业——以便时机到来时，波兰已经准备就绪。"
 flavor_plc_imperialism.2.historical_info: "“有机劳动”是1864年后波兰人推行的经济与教育自强纲领。"
 flavor_plc_imperialism.2.a: "我们将从内部建设民族。"
 flavor_plc_imperialism.2.b: "只有刀剑才能解放波兰。"

 flavor_plc_imperialism.10.title: "波兰作曲家"
 flavor_plc_imperialism.10.desc: "一位波兰作曲家把玛祖卡与波罗乃兹——乡间的舞曲——化为全欧洲赞赏、任何国家都无法查禁的民族音乐。"
 flavor_plc_imperialism.10.a: "我们将礼敬我们的作曲家。"
 flavor_plc_imperialism.10.b: "舞曲不过是小玩意。"

 # =========================================================
 # 意大利
 # =========================================================
 flavor_ita_imperialism.1.title: "复兴运动的遗产"
 flavor_ita_imperialism.1.desc: "民族已经建成，但它由从未共同受治的诸省拼合而成。复兴运动的人物如今面临更艰难的任务：把意大利人变成一个民族。"
 flavor_ita_imperialism.1.historical_info: "1861年统一之后，意大利面临“造就意大利人”的难题——整合法律、方言与经济各异的各地区。"
 flavor_ita_imperialism.1.a: "我们将使民族合而为一。"
 flavor_ita_imperialism.1.b: "各省将自行治理。"

 flavor_ita_imperialism.2.title: "南方问题"
 flavor_ita_imperialism.2.desc: "南方贫困，道路破败，大庄园由无地劳工耕作，盗匪与秘密会社猖獗。新王国继承了一个它尚不理解的难题。"
 flavor_ita_imperialism.2.historical_info: "“南方问题”——意大利南北经济差距——自统一以来一直塑造着意大利政治。"
 flavor_ita_imperialism.2.a: "我们将改革南方。"
 flavor_ita_imperialism.2.b: "我们将荡平盗匪。"

 flavor_ita_imperialism.10.title: "歌剧院"
 flavor_ita_imperialism.10.desc: "意大利的舞台是世界音乐之都。一部新歌剧是全国性的盛事，旋律在第二场演出之前就已在街头传唱。"
 flavor_ita_imperialism.10.a: "我们将资助我们的作曲家。"
 flavor_ita_imperialism.10.b: "让剧院自负盈亏。"

 # =========================================================
 # 德国
 # =========================================================
 flavor_ger_imperialism.1.title: "帝国宣告成立"
 flavor_ger_imperialism.1.desc: "在凡尔赛宫的镜厅，德意志诸侯把皇冠献给我们的国王。一个由诸侯与城市、军队与大学组成的民族，在一个下午之内成为了单一的帝国。"
 flavor_ger_imperialism.1.historical_info: "德意志帝国于1871年1月18日在凡尔赛宫镜厅宣告成立。"
 flavor_ger_imperialism.1.a: "帝国宣告成立。"
 flavor_ger_imperialism.1.b: "将建立一个自由的帝国。"

 flavor_ger_imperialism.2.title: "诗人与思想家的国度"
 flavor_ger_imperialism.2.desc: "我们的大学是世界最好的，我们的科学家赢得诺贝尔奖，我们的工业依靠实验室生存。一个阅读与发明的民族不会长久贫穷。"
 flavor_ger_imperialism.2.a: "我们将投资于科学与学问。"
 flavor_ger_imperialism.2.b: "军队才是民族真正的学校。"

 flavor_ger_imperialism.3.title: "世界政策"
 flavor_ger_imperialism.3.desc: "帝国在欧洲已臻强大，而世界正被他人瓜分。一支舰队、一些殖民地，以及在每一场谈判中的一席之地——这就是皇帝要求的政策。"
 flavor_ger_imperialism.3.a: "我们要求阳光下的地盘。"
 flavor_ger_imperialism.3.b: "德国是大陆强国，不是海上强国。"

 flavor_ger_imperialism.10.title: "德国作曲家"
 flavor_ger_imperialism.10.desc: "一位德国作曲家完成了取材于古老北方神话的歌剧系列，这种新音乐——半音的、庞大的、压倒性的——正在改变音乐可以是什么。"
 flavor_ger_imperialism.10.a: "我们将为他修建一座节日剧院。"
 flavor_ger_imperialism.10.b: "这是噪音，不是音乐。"

 # =========================================================
 # 英国
 # =========================================================
 flavor_gbr_imperialism.1.title: "帝国的鼎盛"
 flavor_gbr_imperialism.1.desc: "世界上四分之一的人口与三分之一的贸易都在我们的旗帜之下。帝国不是一项政策，而是一种自然事实，而在世人的记忆里，太阳从未在其上落下。"
 flavor_gbr_imperialism.1.historical_info: "维多利亚时代，大英帝国达到其最大版图，覆盖全球四分之一。"
 flavor_gbr_imperialism.1.a: "我们将守住并扩展帝国。"
 flavor_gbr_imperialism.1.b: "小英格兰对我们已经足够。"

 flavor_gbr_imperialism.2.title: "印度兵变"
 flavor_gbr_imperialism.2.desc: "土兵起义了，旧莫卧儿被再度拥立为皇帝，公司在印度的统治在一个夏天之内瓦解。王室必须决定由谁来统治印度。"
 flavor_gbr_imperialism.2.historical_info: "1857年印度起义终结了公司统治，确立了王室直辖——英属印度。"
 flavor_gbr_imperialism.2.a: "由王室直接统治印度。"
 flavor_gbr_imperialism.2.b: "公司将得以恢复。"

 flavor_gbr_imperialism.3.title: "废除谷物法"
 flavor_gbr_imperialism.3.desc: "工厂主与工人阶级都要求廉价的面包，而地主阶层要求保护。问题在于：英国应当是一个农业国，还是一个工业国。"
 flavor_gbr_imperialism.3.historical_info: "1846年废除谷物法使英国转向自由贸易，为工业城市提供了廉价食物。"
 flavor_gbr_imperialism.3.a: "自由贸易将养活这个国家。"
 flavor_gbr_imperialism.3.b: "地主阶层的利益将受到保护。"

 flavor_gbr_imperialism.10.title: "维多利亚时代的小说"
 flavor_gbr_imperialism.10.desc: "小说已成为这个时代伟大的通俗艺术，按月分册出版，被各个阶层争相阅读。其作者把法院与学校的种种不公作为自己的题材。"
 flavor_gbr_imperialism.10.a: "我们将礼敬我们的作家。"
 flavor_gbr_imperialism.10.b: "小说会腐蚀下层民众。"


l_simp_chinese:
 # ===== 第七时代通用改革（时代开始时自动解锁）=====
 # --- 通用 ---
 modern_civil_service_reform: "现代文官制度"
 modern_civil_service_reform_desc: "领取薪俸、以考试选拔的文官取代了旧日的恩荫与门第。官吏向国家负责，而非向朋党负责。"
 general_staff_reform: "总参谋部制"
 general_staff_reform_desc: "常设的参谋军官团在平时便筹划动员、后勤与作战方略，使军队在战时能如一件器械般运转。"
 public_welfare_reform: "公共福利法"
 public_welfare_reform_desc: "国家自此承担起对贫者、病者与老者的责任。赈济虽耗财，却远比革命为廉。"
 state_education_reform: "国家教育法"
 state_education_reform_desc: "由国家兴办学校、支付教习，使每一名臣民皆能识字、计数，为国家所用。"
 industrial_mobilization_reform: "工业动员体制"
 industrial_mobilization_reform_desc: "炉坊、纱厂与机器工场被组织起来，使国家能以自己的土地供养自己的军队。"
 central_banking_reform: "中央银行制度"
 central_banking_reform_desc: "由国家担保的单一发行银行掌管货币，贴现票据，并在战时放贷。"

 # --- 君主制 ---
 constitutional_monarchy_reform: "君主立宪制"
 constitutional_monarchy_reform_desc: "君主临朝而不亲政。大臣向民选的议院负责，而君主是国家活着的象征。"
 royal_army_reform: "皇家陆军改革"
 royal_army_reform_desc: "由王室供养、长期服役、操练有素并驻于营房的正规军，取代了昔日的征召之众。"
 imperial_court_reform: "帝国宫廷"
 imperial_court_reform_desc: "宫廷成为国家最宏大的舞台：使节、艺术家与军官皆在御前各尽其角。"

 # --- 共和制 ---
 republican_constitution_reform: "共和宪法"
 republican_constitution_reform_desc: "成文宪法界定国家的权柄、公民的权利与官吏的界限。"
 parliamentary_government_reform: "议会内阁制"
 parliamentary_government_reform_desc: "掌握多数议席的议院组阁。内阁行政，议会立法，法院司法。"
 presidential_republic_reform: "总统制"
 presidential_republic_reform_desc: "由选举产生、独立于议会的单一执政官，在固定任期内掌握行政权。"

 # --- 神权制 ---
 theocratic_constitution_reform: "神权立宪"
 theocratic_constitution_reform_desc: "圣法被编成法典，由信众之议会共同参与国政。"
 social_gospel_reform: "社会福音"
 social_gospel_reform_desc: "教会为贫苦的劳工发声，在四方兴办医院、学校与慈善。"

 # --- 部落 ---
 tribal_confederation_reform: "部落联盟"
 tribal_confederation_reform_desc: "各部以共同的议事会与共同的战帅相联结，却不放弃各自的习俗。"
 tribal_modernization_reform: "部落现代化"
 tribal_modernization_reform_desc: "向定居之民学习学堂、工坊与成文法，使部落得以在新世道中存续。"

 # --- 草原汗国 ---
 horde_modernization_reform: "汗国现代化"
 horde_modernization_reform_desc: "汗国采纳定居之民的行政、文字与工艺，而仍以骏马为其根本。"
 banner_modernization_reform: "旗制改革"
 banner_modernization_reform_desc: "汗国战士被编入世袭的旗籍，各有其土地、官长与名册。"

 # ===== 0.5 版改革（殖民地）=====
 colonial_government_reform: "殖民地政府"
 colonial_government_reform_desc: "殖民地获得了自己的政府：一部特许状、一个立法机关，以及“其为自身与母国共同利益而受治理”的主张。我们此后一切殖民科技皆以此为基。"

l_simp_chinese:
 ai_unifier: "统一"
 ai_unifier_desc: "这个国家将会致力于统一一个特定的区域，并会为了这个目标而拼尽全力。"
 ai_globalism: "全球"
 ai_globalism_desc: "这个国家将会致力于征服临近的国家，并同时寻求在海外的可能扩张。"
 ai_commercialist: "重商"
 ai_commercialist_desc: "这个国家的主要政策被商人所影响，将会更加的寻求贸易和赚钱的机会，以寻求在商业上的扩张，而非采纳军事扩张的路径。"
 ai_interior: "内政"
 ai_interior_desc: "这个国家相信建立稳定的社会，维持政府的合法性，改善各阶层间的关系才是统治的基石并保证国家的延续。"
 ai_adventurous: "冒险"
 ai_adventurous_desc: "这个国家坚信只有通过有计划的大胆的冒险，击败那些看似强大但徒有其表的国家，才能在世界上获得属于自己的一方土地。"
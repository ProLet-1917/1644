l_simp_chinese:
 character_title_governor:"总督"
 promote_to_local_governor: "任命一位总督"
 promote_to_local_governor_desc: "这个总督治所目前没有总督在任，我们可以任命一位总督协助治理此地。"
 rulling_nearby_land: "控制周围土地"
 rulling_nearby_land_desc: "我们可以要求我们的总督开展一项关于控制周围土地的工作，这将为总督所在的地方提供更多的控制力来源。"
 spread_culture: "宣扬文化"
 spread_culture_desc: "我们可以要求我们的总督开展一项宣扬我国文化工作，这将使总督所在的地方的人口更快的转变为我国文化。"
 spread_religion: "要求改宗"
 spread_religion_desc: "我们可以要求我们的总督开展一项要求异教徒改宗的工作，这将使总督所在的地方的人口更快的转变为我国宗教。"
 held_holiday_celebration: "开展节日庆典"
 held_holiday_celebration_desc: "我们可以要求我们的总督在节日的时候举办庆典，这将使总督所在的地方的人口更少的参与叛乱行动。"
 local_governor_organize_troops: "组织征召兵"
 local_governor_organize_troops_desc: "我们可以要求我们的总督开展征召兵的组织工作，这将使总督所在的地方的人口提供更多的征召兵。"
 local_governor_production_plan: "优化产业生产"
 local_governor_production_plan_desc: "我们可以要求我们的总督协商当地工坊的进出货等，这将使总督所在的地方的工坊生产的效率提高。"
 remove_current_work: "移除当前工作"
 remove_current_work_desc: "这将移除总督当前的工作，使总督可以去开展另一项工作。"
l_english:
 #thirty_years_war_events: "The Thirty Years' War"

 ##Historical Westphalia
 thirty_years_war_events.1.title: "The Peace of Westphalia"
 thirty_years_war_events.1.desc: "At long last, peace negotiations have concluded to end the Thirty Years of war that has plagued central europe. The two alliances met in two different cities over two years, but have finally reached a compromise. The diplomats involved are preparing to make a toast to the success of the treaty."
 thirty_years_war_events.1.a: "To peace in Europe, Gentlemen!"

 thirty_years_war_events.2.title: "A message from the Catholic League"
 thirty_years_war_events.2.desc: "As the war continues, both our people and those of the enemy have suffered from the war's devastation. Now, the enemy has sent a letter expressing their willingness to engage in peaceful negotiations with us. How should we respond?"
 thirty_years_war_events.2.a: "Maybe We should accept their request"
 thirty_years_war_events.2.b: "No."

 thirty_years_war_events.3.title: "A message from the Protestant Union"
 thirty_years_war_events.3.desc: "As the war continues, both our people and those of the enemy have suffered from the war's devastation. Now, the enemy has sent a letter expressing their willingness to engage in peaceful negotiations with us. How should we respond?"
 thirty_years_war_events.3.a: "Maybe We should accept their request"
 thirty_years_war_events.3.b: "No"

 thirty_years_war_events.4.title: "The Treaty of Osnabrück"
 thirty_years_war_events.4.desc: "The wars which have ravaged Europe for so long seem to have no end. Christians kill christians with abandon, and many profitable fiefs have been laid waste. Certain of our advisors have begun to consider what was once unthinkable: Negotiation with our enemies. A proposal has been put forward for formal talks at Osnabrück, which might lead to an end to the war."

 thirty_years_war_events.4.a: "Send a delegation."

 thirty_years_war_events.5.title: "Non-Negotiation Policy"
 thirty_years_war_events.5.desc: "Our request to begin formal negotiations at Osnabrück have been flatly denied. Our messengers returned, claiming the enemy told them that they refuse to negotiate with heretics."
 thirty_years_war_events.5.a: "Hah! Those idiots don't realize that they're the heretics!"

 thirty_years_war_events.6.title: "Join the Congress"
 thirty_years_war_events.6.a: "Join the Congress"
 thirty_years_war_events.6.desc: "Join the Congress"

 thirty_years_war_events.100.title: "Splitting Pomerania"
 thirty_years_war_events.100.desc: "Negotiations have reached an impasse over Pomerania. One possible solution to break the stalemate in negotiations is to split the region in half. Where do we stand?"
 thirty_years_war_events.100.a: "This seems reasonable and surely will not cause problems later down the line."
 thirty_years_war_events.100.b: "No! We stand on principle. Pomerania must be whole. This is the hill we will die on!

 thirty_years_war_events.101.title: "Our Demands"
 thirty_years_war_events.101.desc: "We have sent our demands to our... negotiating partners at Osnabrück. We hope they see reason."
 thirty_years_war_events.101.a: "And if they don't..."

 thirty_years_war_events.102.title: "Un-used Event"
 thirty_years_war_events.102.desc: "Un-used Event"
 thirty_years_war_events.102.a: "Un-used Event"

 thirty_years_war_events.103.title: "Lowland issue"
 thirty_years_war_events.103.desc: "The issue of independence in the lowlands was brought up at the meeting. We could choose what we want."
 thirty_years_war_events.103.a: "Let me see it."

 thirty_years_war_events.104.title: "What we want?"
 thirty_years_war_events.104.desc: "Now we can present our demands at the conference table and discuss them with the Spanish delegation."
 thirty_years_war_events.104.a: "We want fully independence"
 thirty_years_war_events.104.b: "We want entire Netherlands!"


 thirty_years_war_events.105.title: "Message from Netherland"
 thirty_years_war_events.105.desc: "The demand from the Netherlands is that we should end the current conflict and recognize their complete independence."
 thirty_years_war_events.105.a: "We accepted and it should be end"
 thirty_years_war_events.105.b: "No,we still want to control the entire lowland."

 thirty_years_war_events.106.title: "Message from Netherland"
 thirty_years_war_events.106.desc: "The demand from the Netherlands is that we should end the current conflict and cede all the lowlands to them."
 thirty_years_war_events.106.a: "We have to accepted these"
 thirty_years_war_events.106.b: "Never!"

 thirty_years_war_events.107.title: "The wittersbach family's Issue"
 thirty_years_war_events.107.desc: "The issue of the Wittelsbach family was brought up at the meeting. As the Emperor of the Empire, we should express our opinions on this matter."
 thirty_years_war_events.107.a: "Let me see it."

 thirty_years_war_events.108.title: "The solution of wittersbach family's issue"
 thirty_years_war_events.108.desc: "After serving as the imperial emperor and consulting with the participating countries, I believe we can incorporate the following contents into the treaty."
 thirty_years_war_events.108.a: "Bavaria will got the elector status."
 thirty_years_war_events.108.b: "Bavaria and Palatinate will got the elector status."
 thirty_years_war_events.108.c: "Palatinate will got the elector status."

 thirty_years_war_events.109.title: "Catalonia Issue"
 thirty_years_war_events.109.desc: "Catalonia declared its independence from us during the recent war. We should discuss this matter at the meeting."
 thirty_years_war_events.109.a: "Let me see it."

 thirty_years_war_events.110.title: "Catalonia Issue"
 thirty_years_war_events.110.desc: "The Spanish delegation presented their demands regarding the Catalonia issue, and we will respond to this matter as well."
 thirty_years_war_events.110.a: "Let we stay now"
 thirty_years_war_events.110.b: "Catalonia will join back, but we will get rosello"
 thirty_years_war_events.110.c: "Catalonia will back to spain."
 thirty_years_war_events.110.d: "We do not want slove this problem, let we continue the war with spain."

 thirty_years_war_events.1000.title: "Treaty of Westphalia"
 thirty_years_war_events.1000.desc: "The Treaty of Westphalia has been concluded. The religious wars of Europe are over. The lines on the new maps are very pretty, and, surely nothing can go wrong now. The leading diplomats have called for a toast."
 thirty_years_war_events.1000.a: "To peace in Europe, Gentlemen?"

 thirty_years_war_events.107.entry: "$thirty_years_war_events.107.title$"
 thirty_years_war_events.109.entry: "$thirty_years_war_events.109.title$"





 zzz_1644_generate_female_characters.1.desc:0 "To ensure the continuation of all dynasties, the system will generate a large number of female characters for all countries at game start."
 zzz_1644_generate_female_characters.1.a:0 "Understood."

 lmc_situation_dynamic.1.title:0 "Datong Rebellion"
 lmc_situation_dynamic.1.desc:0 "Seeing the Shun's military prestige declining, General Jiāng Xiāng of Datong decides to rebel and join the Qing or Ming."
 lmc_situation_dynamic.1.historical_info:0 "Jiāng Xiāng was originally a Ming general who surrendered to the Shun, but rebelled when he saw the Shun's power waning."
 lmc_situation_dynamic.1.a:0 "Surrender to Qing"
 lmc_situation_dynamic.1.b:0 "Return to Ming"
 
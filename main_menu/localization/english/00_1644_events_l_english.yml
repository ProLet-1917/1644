l_english:
 cleanup_1644.1.title:0 "Clean up the Mercenaries"
 cleanup_1644.1.desc:0 "Clean up the mercenaries." 
 qng_1644_unification.3.title:0 "The Purple Cloud Appears in the East"
 qng_1644_unification.3.desc:0 "The scout bring words: the rebel Lǐ Zìchéng has swept across Central Plains like a tidal wave, leaving the lands south of the Great Wall in a void of trembling despair. The hearts of the people are no longer with the Míng; they are adrift, untethered by chaos. It is a rare opportunity that comes but once in an age, and if all goes well, our dynasty shall take the Central Plains as the Jīn and Yuán once did!"
 qng_1644_unification.3.historical_info:0 "Fàn Wénchéng, Our Grand Secretary, reported to the Prince Regent:\nThe people of Northern China endure ruin and their misery is peaked. Bereft of aid, the masses seek a worthy lord to restore their peace. Those few who hold their walls do so for hearth and home, not to die for a country or a dynasty. The Great Míng is diseased beyond cure; their territory of Héběi will soon fall to the other warlord. The peril for us is not in the Míng's loss, but in their loss to our other enemy.\n Behold, the Míng’s only true adversary is Our Realm. Yet as the roaming bandits trample the Central Plains, the Mandate is uprooted—much as when Qín lost its Mandate, and Chǔ and Hàn rose to pursue it. While We have long vied with the Míng for dominion, the true contest shall henceforth be against the bandits. Therefore, we must employ the wise to soothe the many. \nLet discipline be stern; touch not a single hair of the people. Proclaim our intent: to settle the Central Plains and restore the old order. Let officials keep their rank and peasants their plow. Succor the helpless and honor the gifted. Thus, all the Chinese territory north of the Yellow River shall be won by the mere passing of a scroll. The people will flock to us as the waters to the sea. \n"
 qng_1644_unification.3.a:0 "Conquer! Conquer!"
 qng_1644_unification.3.b:0 "Mere Nikan's dream-talk. Prepare for the next breach!"
 
 qng_1644_unification.4.title:0 "Battle of Shānhǎi Pass"
 qng_1644_unification.4.desc:0 ""
 qng_1644_unification.4.historical_info:0 ""
 qng_1644_unification.4.a:0 "Dominate China!"
 
 qng_1644_unification.5.title:0 "Wú Sānguì Surrenders the Pass"
 qng_1644_unification.5.desc:0 ""
 qng_1644_unification.5.historical_info:0 ""
 qng_1644_unification.5.a:0 "The fate of success or failure hinges on this move"
 
 mng_1644.1.title:0 "Move our capital to the South?"
 mng_1644.1.desc:0 "Since We ascended the Throne seventeen years ago, We have labored day and night for the Great Peace. Yet the bandits arose, forcing Us to levy troops and silver against Our will. War has raged year upon year; the burdens on the folk have grown heavy. We sought to settle the people, yet We have only burdened them. This is Our Guilt. Corrupt officials took advantage, skinning the people alive with hidden taxes and the lash. Hidden within the Ninefold Palace, We failed to see your agony. This is Our Guilt. Generals were cowards and soldiers were proud; they refused to fight. They burned, killed, and plundered, treating you as their enemies. We entrusted the state to the wrong men. This is Our Guilt. Thus the bandits’ power soared, dragging the folk of Yù, Chǔ, Qín, and Jìn into ruin. Our Ancestors nurtured you for three hundred years, yet today you endure such cruelty. The pain in Our heart burns like fire! Now, We summon the loyal to save the Throne. We decree: all war taxes are hereby abolished. Any official who levies private tolls shall face Our wrath. For those who were forced to join the rebels out of fear: only Lǐ Zìchéng is beyond mercy. All others—even the false ministers Niú Jīnxīng and Liú Zōngmǐn—if you return to the Fold, your crimes are washed away. Heaven’s heart has not yet turned. We repent Our errors to seek a new beginning. Once the bandits are quelled, you shall plow your fields in peace once more. Is this not a blessing?"
 mng_1644.1.a:0 "Shall the Emperor guard the Empire, so shall the Emperor perish with it."
 mng_1644.1.b:0 ""Shall the Empire fall, or shall its Emperor find a path to Restoration in the South?"
 mng_1644.1.tt1:0 "We shall die."
 mng_1644.1.tt2:0 "Deserted by all, our monarch Zhū Yóujiǎn resolved to travel light and in secret, taking to the sea at Tiānjīn to seek refuge in Nánjīng."
 
 mng_1644.2.title:0 "Disaster of 1644"
 mng_1644.2.desc:0 ""
 mng_1644.2.historical_info:0 "He took his own life in the age of thirty-three, at the Pavilion of Imperial Longevity, upon the Mount of Ten Thousand Years.\nIn his final words, he lamented:\n\"...Though this heavenly punishment befalls Us for Our meager virtue and personal transgressions, it is Our ministers, one and all, who have misled the Throne to this very consequence. We die with no face to meet Our Ancestors beneath the earth. Thus, We remove the crown and cover Our face with Our hair. Let the rebels dismember Our body as they will, but let not any of Our common people be harmed.\""
 mng_1644.2.a:0 "Pity the tales of the Southern Flight across the seas; yet still they turn to the Autumn Gate, yearning for the Imperial Legions.”"
 mng_1644.2.tt1:0 "If the Throne is indeed vacant by martyrdom, we must move to establish a successor."
 
 mng_1644.3.title:0 "Fall of the Northern Capital"
 mng_1644.3.desc:0 "On April 28, 1644, Li Zicheng's Dashun army breached the walls of Beijing. "
 mng_1644.3.historical_info:0 "After the Northern Capital fell, Grand Secretary Jiàng Déjǐng, having retired to Gāoyòu, brought word that the Late Emperor had fled south. It was whispered that witnesses in Tiānjīn saw the Emperor accompanied by Empress Zhōu and dozens of eunuchs, all disguised in common attire to elude capture. Jiàng argued that the local prefectures should not be so hasty to erect mourning pavilions or perform the funeral rites of 'Kūlín'—for how can one mourn a King who may yet draw breath?"
 mng_1644.3.a:0 "\"Central Plains are in chaos, the officials are scattered, when will it be restored? Let the sad wind blow tears as we pass Yangzhou.\""
 mng_1644.3.tt1:0 "Hoping the Emperor can safely travel south"
 
 mng_1644.5.title:0 "Establishing a New Emperor"
 mng_1644.5.desc:0 "The late Emperor has perished for the Altars of State; the Realm cannot endure a single day without an Emperor. We must now select a man of virtue from the Imperial Line to inherit the Great Succession, that the hearts of the people may be stilled."
 mng_1644.5.historical_info:0 "Běijīng fell, and the Emperor perished upon the Méishān. When word reached Nánjīng, the ministers of the southern capital debated the enthronement of a new Emperor. The Princes of Fú, Lù, Lǔ, and Táng each stood among the claimants. Ultimately, with the backing of Shǐ Kěfǎ and Mǎ Shìyīng, Zhū Yóusōng, Prince of Fú, ascended the Throne in the fifth month, proclaiming the era of Hóngguāng."
 mng_1644.5.a:0 "Enthrone Zhū Yóusōng, Prince of Blessing and Popularity! "
 mng_1644.5.b:0 "Enthrone Zhū Chánglù, Prince of Fortune and Ability!"
 mng_1644.5.c:0 ""Popularity or Ability—is there truly no claimant more worthy?"
 mng_1644.5.tt1:0 "Zhū Yóusōng is the grandson of the Wànlì Emperor. By blood, he is the closest kinsman; his legitimacy and support are paramount. Grants significant Government Power and Prestige."
 mng_1644.5.tt2:0 "Zhū Chángfāng is the son of Zhū Yìliú, the Prince of Lù, a talented literati. His legitimacy is notable, but his support lags behind the Prince of Fú. Grants a minor bonus to Government Power."
 mng_1644.5.tt3:0 "Seek a candidate among other branches, such as the Princes of Lǔ or Táng. These claimants lack sufficient legitimacy and support, risking deep political strife. Penalizes Government Power and Prestige."
 
 qng_1644_banner_army.1.title:0 "Mobilize the Eight Banners"
 qng_1644_banner_army.1.desc:0 "Dorgon has gathered the Eight Banners; they wait only for the word to cross the Pass."
 qng_1644_banner_army.1.a:0 "The Iron Cavalry awaits the command."
 
 csh_1644_start_army.1.title:0 "March of Great Shùn"
 csh_1644_start_army.1.desc:0 "Lǐ Zìchéng and Liú Fāngliàng command two separate hosts, advancing from the north and south toward the Capital. The people of Shānxī welcome the King's Army with food and wine. We have fought across the world for fourteen years; at last, victory is within our grasp."
 csh_1644_start_army.1.historical_info:0 "The General-in-Chief proclaims this Punitive Expedition: Since ancient times, the rise and fall of Empires is signaled by the hearts of the people. Alas, Míng! Your destiny is over. Your harsh laws and heavy taxes put the people into despair and dangers. Then came Our Great Lord, born with merit of benevolence and loves for life, who raises the banner for justice and gains the hearts of all within the seas. The Lord crossed the Yellow River to pacify Yù and Chǔ; the Lord entered the Western Pass to sweep through Shǎnxī. Now, officials are settled, the folk are comforted, and the borders are guarded—the Great Work is nearly done. Only Jìn and Yān remain sufferings. Remaining passive is no longer an option. On the twentieth of this month, a vanguard of five hundred thousand shall depart Cháng'ān; our Lord follows with a million more. Not a thread nor a grain shall be stolen as we pass. Let the civil and military officials see the tide of the times: surrender your cities and seals to secure your future rank. Should you resist, the gentry and folk are permitted to bind you and present you to us; they shall be doubly rewarded. But if you resist together and the city falls, the jade and the stone shall be crushed alike. By then, repentance will be too late!"
 csh_1644_start_army.1.a:0 "Alas, Míng! Your Mandate has reached its end!"

 csh_1644_unification.1.title:0 "Last Challenge at the Capital"
 csh_1644_unification.1.desc:0 "With Xuānfǔ captured, no strong enemies remain in Shāndōng or Héběi; the House of Zhū is collapsing! The King originally intended to solidify our foundations and restore agriculture, but the court, though powerless to 'quell bandits', remains masterful at idle talk. Negotiations have repeatedly stalled as they still plot to consolidate their remaining forces for a final purge. Faced with such arrogance, our generals refuse to sit idly by. Yet, not everyone understands what truly awaits them in Shùntiān."
 csh_1644_unification.1.historical_info:0 "...Alas for you, the Míng Dynasty! Long have you sat in peace, only to let your discipline rot. The Emperor is not utterly dim, yet he is isolated and perpetually blinded by deceit; the ministers serve only themselves, forming cliques while loyalty and public duty vanish. Bribes flow between the palace and the government, shifting power day by day; the gentry hoard profits while the lifeblood of the common folk is drained dry. Dukes and Marquises are but silk-clad meat-eaters, yet the Emperor relies on them as his heart and soul; eunuchs are but bran-eating swine, yet he borrows them as his eyes and ears. Prisons are overflowing, and the scholars have no heart to serve; taxes are crushing, and the people yearn for mutual ruin. Since Heaven has withdrawn its mercy and the masses suffer in calamity, We, born of the common folk, have witnessed this exhaustion and felt the pain of the suffering in Our own flesh... If you can respect Heaven and your ancestors, weighing your virtue and the signs of the times, We shall grant favor to your predecessors and spare no extraordinary honors. Like the states of Qǐ or Sòng, your ancestral sacrifices shall continue—to honor your filial piety. Your family shall remain safe, and the people shall rejoice—to honor your benevolence. Let all officials protect their Emperor and preserve their high salaries. This decree is issued from the depths of Our heart. Let the Emperor and his ministers reflect upon it! Issued in the First Year of Yǒngchāng."
 csh_1644_unification.1.a:0 "Take the Last Challenge."
 csh_1644_unification.1.tt1:0 "Advance immediately into Yōuyàn. Carry out the Heavenly Punishment upon the recalcitrant Zhū Yóujiǎn and his accomplices."
 csh_1644_unification.1.b:0 "Overcome the Yīn and restrain the Liú; establish your merit forever."
 csh_1644_unification.1.tt2:0 "To avoid a total rupture with the Míng, we shall first occupy Shāndōng and sever the Grand Canal, attempting to force Zhū Yóujiǎn’s surrender."
 csh_1644_unification.1.c:0 "Accept the Investiture, relinquish the Imperial Title, and make peace."
 csh_1644_unification.1.tt3:0 "Accept the Míng court's investiture, drop the title of Emperor, and become a vassal state of the Míng to end the war."
 

 csh_1644_unification.2.title:0 "Overturn Heaven and Earth"
 csh_1644_unification.2.desc:0 "On the nineteenth day of the third month, in the first year of Yǒngchāng, our army advanced into the city of Shùntiān. That morning, with the stride of victors, the troops entered the Inner City through the Zhèngyáng, Chóngwén, and Xuānwǔ gates. Accompanied by Liú Zōngmǐn, Lǐ Guò, Niú Jīnxīng, and Sòng Xiàncè, Lǐ Zìchéng—once a mere postal courier—rode upon a towering steed into the Imperial City, the very heart of all authority in China. Halting beneath the Chéngtiānmén Gate, he gazed upon the past and present with profound emotion. Suddenly, he drew his bow, notched an arrow, and loosed it directly at the gate’s plaque. Thus, the 'Mandate of Heaven' claimed by the Míng Dynasty collapsed."
 csh_1644_unification.2.historical_info:0 "Early on the nineteenth, palace attendants fled in all directions, asking the way in a daze while the commoners trembled in fear... Groups of two or three hundred people came from the west, crying: 'They have entered the city!' Shortly after, others arrived shouting: 'All is well! There will be no slaughter. Quickly, paste the words \"Submissive Citizen\" upon your doors.' Some found yellow paper, others red; all wrote 'Submissive Citizen' and stuck them to their entrances. Soon, incense tables were set out with yellow strips reading 'Great Shùn Yǒngchāng, Long Live the Emperor!' The rebel soldiers wore white caps and blue tunics, clad in armor and bearing arrows, marching in silence with gags in their mouths. Most doors were shut; those on the streets retreated to the sides, and no one was questioned. It was eerily quiet, save for the clatter of armored horses. Then came the shouts: 'Surrender all donkeys and horses immediately; those who hide them shall be executed!' Beasts were led out at once. Soon, the soldiers broke into the great mansions, while for smaller houses, they stuck command arrows in the doorways to mark them for use. I was then hiding in Jiāojiāqiáo Alley. By afternoon, citizens wore the words 'Submissive Citizen' on their hats, moving about as before... That day, gate guards were posted and movement was restricted. Cavalry filled every street and alley, yet they did not plunder. When the rebels first entered, two soldiers robbed silk from a shop at the Front Gate; they were promptly executed by dismemberment, their limbs nailed to the left railing of the gate as a warning. I witnessed this with my own eyes. — Chén Shìjǐn, 'Chronicles of the Year 1644'"
 csh_1644_unification.2.a:0 "'I, a mere youth, having found men of virtue, dare to reverently succeed the Mandate of Heaven.'"

 csh_1644_unification.3.title:0 "The Two Kings and Three Respects"
 csh_1644_unification.3.desc:0 "The tradition of 'The Two Kings and Three Respects' is an ancient custom in our land, serving to demonstrate the magnanimity and benevolence of the new Son of Heaven. Following our prior vow, we have enfeoffed the young Míng Crown Prince, Zhū Cílǎng, as the Prince of Sòng, while his two younger brothers have been granted the rank of Duke."
 csh_1644_unification.3.historical_info:0 "When the rebels entered the palace, the Crown Prince knelt to receive them at the left of the gate; he was ordered to be helped up. The two younger Princes were also found, and told: 'Fear not, from this day you shall be as my own sons; you shall not lose your wealth or status.' Upon seeing Consort Yuán and the Princess, the King sighed at the Late Emperor's cruelty and ordered them taken to their quarters for care. It is said Empress Yì'ān came forth to present gold and silver; her whereabouts thereafter remain unknown. — Chén Shìjǐn, Chronicles of the Year 1644"
 csh_1644_unification.3.a:0 "Then, where is the last Emperor?"
 
 csh_1644_unification.4.title:0 "Wú Sānguì Surrenders the Pass! "
 csh_1644_unification.4.desc:0 ""
 csh_1644_unification.4.historical_info:0 ""
 csh_1644_unification.4.a:0 " Whose beneficence was like his?"
 
 csh_1644_unification.4.title:0 "Wú Sānguì revolts! "
 csh_1644_unification.4.desc:0 ""
 csh_1644_unification.4.historical_info:0 ""
 csh_1644_unification.4.a:0 "How could anyone abandon his people to side with the barbarians?"
 
 csh_1644_unification.4.title:0 "Battle of Shānhǎi Pass"
 csh_1644_unification.4.desc:0 ""
 csh_1644_unification.4.historical_info:0 ""
 csh_1644_unification.4.a:0 "A Misstep"
 
 csh_1644_unification.5.title:0 "Wú Sānguì's Rebellion"
 csh_1644_unification.5.desc:0 "Upon learning of the Dàshùn army's actions in Běijīng, Wú Sānguì decided to rebel. He closed Shānhǎiguān, refused to surrender to the Dàshùn, and began contacting the Qīng forces."
 csh_1644_unification.5.historical_info:0 "Wú Sānguì had initially accepted the Dàshùn's offer of surrender, but upon learning that his father had been tortured and his beloved concubine had been taken, he rebelled in anger. He closed Shānhǎiguān, refused the Dàshùn army entry, and sent messengers to request aid from the Qīng."
 csh_1644_unification.5.a:0 "Shānhǎiguān is closed"
 
 wsg_1644_start_army.1.title:0 "Guānníng Iron Cavalry on Alert"
 wsg_1644_start_army.1.desc:0 "Wú Sānguì has gathered the remnants of the Guānníng Army at Níngyuǎn to prevent being crushed between rival forces while the fate of the Interior remains undecided. Orders have been rushed to the military colonies and manor farms between Shānhǎiguān and Níngyuǎn to secure all supplies. Officers and soldiers alike fear that once the gates of the Pass are opened, there will be no retreat; it will be a fight to the death."
 wsg_1644_start_army.1.historical_info:0 "Between the 16th and 17th years of Chóngzhēn, the Guānníng Army was rebuilt several times. With Níngyuǎn as his base, Wú Sānguì maintained control over the last remaining fortresses on the Manchurian front in Western Liáo. However, after the Battle of Sōngjǐn, the original border force of over 300,000 had dwindled to only tens of thousands of elites. Records state that Wú 'drilled his troops and trained his generals day and night without rest,' intending to defend against both the Dàshùn and the Qīng court simultaneously."
 wsg_1644_start_army.1.a:0 "The Iron Cavalry prepares for war."

 cxi_1644_start_army.1.title:0 "Zhāng Xiànzhōng Enters Shǔ"
 cxi_1644_start_army.1.desc:0 "Zhāng Xiànzhōng leads the Great Xī Army westward from Húguǎng, reorganizing at Kuízhōu to cast his gaze upon Sìchuān. The mountain forts and walled cities of Shǔ have entered a state of emergency, while local gentry are forced to surrender grain and silver in a desperate hope for temporary peace."
 cxi_1644_start_army.1.historical_info:0 "Between late 1643 and early 1644, after returning north to Húguǎng, Zhāng Xiànzhōng turned toward Sìchuān. He first seized Kuízhōu and Bādōng before entering Sìchuān via the Three Gorges. Historical records describe him as 'sweeping away the armies of Jīngxiāng to press upon the gates of Sìchuān', establishing camps at Jiāngkǒu to prepare for the capture of Chóngqìng and Chéngdū. Both the 'History of Míng' and the 'Minor Records of the Affairs of the Year 1644' document his stationing in Bādōng as he peered into the gateways of Sìchuān."
 cxi_1644_start_army.1.a:0 "Great Xī assembles its army."

 mng_1644_start_army.1.title:0 "The Chāngpíng Garrison"
 mng_1644_start_army.1.desc:0 "The Capital is in peril. The Ministry of War has issued an urgent decree to Táng Tōng, Regional Commander of Chāngpíng, to stand ready at Jūyōngguān and prepare to reinforce Xuānfǔ and Shùntiān at a moment's notice. Meanwhile, Zuǒ Liángyù at Jiāngxià has also been ordered to consolidate his shattered forces to check the Dàshùn's southward advance."
 mng_1644_start_army.1.historical_info:0 "In Spring 1644, Emperor Chóngzhēn ordered Táng Tōng to lead his units to garrison the strategic heights north of the capital, guarding Jūyōng and Chāngpíng. This was among the last regular field forces still available to the Míng court. Meanwhile, Zuǒ Liángyù remained at Jiāngxià, claiming a host of eight hundred thousand men."
mng_1644_start_army.1.a:0 "For the Emperor."

csh_1644_unification.7.title:0 "Extort Funds from Officials"
csh_1644_unification.7.desc:0 "Though we have captured Běijīng, the treasury is empty and military pay is lacking. Generals such as Liú Zōngmǐn suggest implementing a policy of 'pursuing stolen goods to aid military funds'—extracting wealth from Míng officials and wealthy merchants through torture to fill our coffers. However, this policy will surely provoke fierce resentment from the gentry and merchants, and may even lead to the loss of popular support."
csh_1644_unification.7.historical_info:0 "When the rebels first entered the city, two soldiers robbed silk from a shop at the Front Gate; they were promptly executed by dismemberment, their limbs nailed to the left railing of the gate as a warning. Yet within days, rebel generals such as Liú Zōngmǐn began extorting funds from Míng officials. According to the Chronicles of the Year 1644: 'Rebel generals Liú Zōngmǐn and others tortured officials, pursuing stolen goods to aid military funds. From the twentieth day of the third month until early April, torture was carried out without pause. Officials who were tortured either died, were maimed, or took their own lives. The common people who witnessed this gnashed their teeth in fury.' Though this policy solved the military funding problem in the short term, it severely damaged the reputation of the Dàshùn regime, leading to the loss of popular support and planting the seeds of future failure."
csh_1644_unification.7.a:0 "Extort funds to fill our coffers"
csh_1644_unification.7.b:0 "Show leniency to win hearts"
csh_1644_unification.7.tt1:0 "Extract wealth from Míng officials and wealthy merchants through torture. Gain substantial gold, but lose popular support, stability will decrease, and control in the capital province will also decline."
csh_1644_unification.7.tt2:0 "The gentry and merchants in the capital province are extremely dissatisfied with the extortion policy, and their satisfaction drops significantly."
csh_1644_unification.7.tt3:0 "Adopt a moderate policy, raising military funds through other means. Though less gold is gained, popular support is maintained and stability loss is minimal."
csh_1644_unification.7.tt4:0 "The gentry and merchants in the capital province approve of the moderate policy, and their satisfaction increases slightly."

east_asia_1644_start_army.1.title:0 "1644 Starting Armies"
 east_asia_1644_start_army.1.desc:0 "In the year 1644, chaos reigns across the land. All factions are mobilizing their forces, preparing for the decisive battles that will determine the fate of the realm."
 east_asia_1644_start_army.1.historical_info:0 "In 1644, the late Míng period was in turmoil, with various factions gathering their forces. The Great Shùn advanced in multiple columns, the Great Qīng forces prepared for invasion, Wu Sangui held the frontier, Great Xī eyed Sichuan, Great Míng held isolated cities, and the four northern garrisons each had their own ambitions. All forces were ready, waiting for the signal to begin the great war that would decide the fate of the Middle Kingdom."
 east_asia_1644_start_army.1.a:0 "Mobilize the armies."
 
 

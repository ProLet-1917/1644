l_english:
 # ===== Age 7 choice advances (Administrative) =====
 public_sanitation_advance: "Public Sanitation"
 public_sanitation_advance_desc: "Clean water, sewers and public health inspection for the growing cities."
 compulsory_education_advance: "Compulsory Education"
 compulsory_education_advance_desc: "Every child is sent to school, and the state pays for it."
 municipal_reform_advance: "Municipal Reform"
 municipal_reform_advance_desc: "Town councils are given real powers and real budgets, and the cities flourish under them."
 statistical_administration_advance: "Statistical Administration"
 statistical_administration_advance_desc: "A central statistical office measures the population, the harvest and the revenue of the realm."
 state_railway_advance: "State Railways"
 state_railway_advance_desc: "The trunk lines are built and operated by the state itself, for strategy as much as for commerce."
 anti_trust_legislation_advance: "Anti-Trust Legislation"
 anti_trust_legislation_advance_desc: "The great combinations are broken up or regulated in the name of the free market."
 civil_service_examination_advance: "Civil Service Examination"
 civil_service_examination_advance_desc: "Appointment to the public service is by competitive examination rather than by favour."
 imperial_postal_advance: "Imperial Post"
 imperial_postal_advance_desc: "A uniform, cheap postal service reaches every corner of the realm."

 # ===== Age 7 choice advances (Diplomatic) =====
 balance_of_power_advance: "Balance of Power"
 balance_of_power_advance_desc: "We align ourselves with the weaker side against the stronger, so that no single power may dominate."
 national_self_determination_advance: "National Self-Determination"
 national_self_determination_advance_desc: "We proclaim that every nation has the right to govern itself, and act accordingly."
 colonial_conference_advance: "Colonial Conference"
 colonial_conference_advance_desc: "The colonial powers meet to divide the unclaimed world and to settle their rivalries without war."
 treaty_system_advance: "Treaty System"
 treaty_system_advance_desc: "A web of alliances, guarantees and arbitration agreements binds the powers to one another."
 intelligence_academy_advance: "Intelligence Academy"
 intelligence_academy_advance_desc: "A professional school trains our agents in cryptography, ciphers and foreign tongues."
 neutrality_doctrine_advance: "Neutrality Doctrine"
 neutrality_doctrine_advance_desc: "We stand apart from the quarrels of the great powers and arm only to defend our own soil."
 gunboat_diplomacy_advance: "Gunboat Diplomacy"
 gunboat_diplomacy_advance_desc: "Our squadrons on distant stations are our most persuasive diplomats."
 international_arbitration_advance: "International Arbitration"
 international_arbitration_advance_desc: "We submit our disputes to permanent courts of arbitration rather than to the sword."
 cultural_exports_advance: "Cultural Exports"
 cultural_exports_advance_desc: "Our language, letters and arts are carried abroad by our schools, missions and merchants."

 # ===== Age 7 choice advances (Military) =====
 conscription_act_advance: "Conscription Act"
 conscription_act_advance_desc: "Every able-bodied man owes a term of service, and a large trained reserve stands behind the standing army."
 military_academy_advance: "Military Academy"
 military_academy_advance_desc: "A general staff academy trains our officers in strategy, engineering and the science of war."
 logistical_corps_advance: "Logistical Corps"
 logistical_corps_advance_desc: "A dedicated corps of supply and transport keeps the army fed and munitioned in the field."
 field_medicine_advance: "Field Medicine"
 field_medicine_advance_desc: "Field hospitals, stretcher-bearers and nursing services save the wounded who would once have died."
 railway_mobilization_advance: "Railway Mobilisation"
 railway_mobilization_advance_desc: "Timetables drafted in peace move whole armies to the frontier in days."
 machine_gun_tactics_advance: "Machine Gun Tactics"
 machine_gun_tactics_advance_desc: "The machine gun is integrated into the infantry battalion, and the fire of the line becomes murderous."
 naval_modernization_advance: "Naval Modernisation"
 naval_modernization_advance_desc: "Steam, armour and heavy ordnance transform the fleet into a weapon of power projection."
 expeditionary_warfare_advance: "Expeditionary Warfare"
 expeditionary_warfare_advance_desc: "Our forces are organised, embarked and supplied for war across the seas."

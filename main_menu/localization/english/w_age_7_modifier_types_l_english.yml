l_english:
 # =========================================================
 # Age 7 modifier types (tooltip names and descriptions)
 # =========================================================
 MODIFIER_TYPE_NAME_allow_republican_parliament: "Republican Parliament"
 MODIFIER_TYPE_DESC_allow_republican_parliament: "This unlocks the [parliament_type|e] of a sovereign republican chamber, elected on a broad franchise."
 MODIFIER_TYPE_NAME_allow_imperial_parliament: "Imperial Parliament"
 MODIFIER_TYPE_DESC_allow_imperial_parliament: "This unlocks the [parliament_type|e] of an imperial chamber of nobles, clergy and burghers summoned by the crown."
 MODIFIER_TYPE_NAME_allow_presidential_parliament: "Presidential Assembly"
 MODIFIER_TYPE_DESC_allow_presidential_parliament: "This unlocks the [parliament_type|e] of a legislature elected separately from the head of state."
 MODIFIER_TYPE_NAME_allow_mass_suffrage_parliament: "Mass Suffrage Parliament"
 MODIFIER_TYPE_DESC_allow_mass_suffrage_parliament: "This unlocks the [parliament_type|e] of a chamber elected by every adult citizen."
 MODIFIER_TYPE_NAME_allow_law_change_by_stability: "Laws May Be Changed with Stability"
 MODIFIER_TYPE_DESC_allow_law_change_by_stability: "If this is set to no, a [country|e] may no longer enact [laws|e] by paying [stability|e]. Policy must instead be carried through [parliament_issues|e]."
 MODIFIER_TYPE_NAME_parliament_seat_estate_power: "Estate Power from Parliamentary Seats"
 MODIFIER_TYPE_DESC_parliament_seat_estate_power: "How strongly the seats an [estate|e] holds in [parliament|e] translate into [estate_power|e]."
 MODIFIER_TYPE_NAME_parliament_seat_agenda_impact: "Estate Agenda Impact from Parliamentary Seats"
 MODIFIER_TYPE_DESC_parliament_seat_agenda_impact: "How strongly the seats an [estate|e] holds in [parliament|e] translate into influence over the parliamentary agenda."
 MODIFIER_TYPE_NAME_monthly_election_tradition: "Monthly Election Tradition"
 MODIFIER_TYPE_DESC_monthly_election_tradition: "Additional [republican_tradition|e] gained each month from a functioning electoral system."
 MODIFIER_TYPE_NAME_election_manipulation: "Election Manipulation"
 MODIFIER_TYPE_DESC_election_manipulation: "The extent to which the government manages elections, discouraging the 'wrong' candidate from winning."
 MODIFIER_TYPE_NAME_dynasty_stability_from_examinations: "Dynasty Stability from Examinations"
 MODIFIER_TYPE_DESC_dynasty_stability_from_examinations: "How much [dynasty_stability|e] the state examination system generates for the dynasty each month."
 MODIFIER_TYPE_NAME_dynasty_stability_from_tribute: "Dynasty Stability from Tribute"
 MODIFIER_TYPE_DESC_dynasty_stability_from_tribute: "How much [dynasty_stability|e] the tribute network generates for the dynasty each month."
 MODIFIER_TYPE_NAME_dynasty_stability_on_enthronement: "Dynasty Stability on Enthronement"
 MODIFIER_TYPE_DESC_dynasty_stability_on_enthronement: "Additional [dynasty_stability|e] gained when a new emperor ascends the throne."

l_english:
 bookmark_1337_name: "The Hundred Years' War（Not Recommend)"
 bookmark_1337_desc: "Europe is fractured by dynastic feuds, while the Black Death looms on the horizon. From the steppes of the Golden Horde to the budding Italian republics, every realm faces a crossroads."
 bookmark_1644_name: "The General Crisis"
 bookmark_1644_desc: "The Ming Dynasty is on the verge of collapse, while in Europe, religious wars are still ongoing, and the powerful nations of Europe are embroiled in one conflict after another. The discovery of new routes brings about a great deal of wealth. As time goes on, the connections between different parts of the world are becoming increasingly close."
 # =========================================================
 # 0.5 version government reforms (government_reforms/0_5_reforms.txt)
 # =========================================================
 the_chinese_emperor: "The Chinese Emperor"
 the_chinese_emperor_desc: "The Son of Heaven rules the Central Kingdom and all under it. The dynasty's stability is the measure of its mandate, and the empire is organised as a single sacred order with the emperor at its head."
 the_chinese_warlords: "The Chinese Warlords"
 the_chinese_warlords_desc: "The throne is vacant and the provinces answer only to their own generals. Authority belongs to whoever can feed and pay the most soldiers."
 yingzhuangzhi: "The Barracks-Farm System"
 yingzhuangzhi_desc: "Soldiers are settled on the land and support themselves from it, so that the army costs the treasury little and the countryside is tamed by the plough. It is a poor army, but a cheap one."
 fanwang_reform: "The Princely Fiefs"
 fanwang_reform_desc: "The princes of the imperial house hold their fiefs by hereditary right, defend the marches in the emperor's name, and receive a payment for their loyalty. A shield of kin, and a danger to the throne."

 # =========================================================
 # Italian unification - International organization and peace treaty
 # =========================================================
 italy_unification_union_desc: "An alliance of Italian states gathered behind the strongest of them, in order to build a single nation out of the peninsula."
 give_up_leader_of_italy_unification_union_desc: "The defeated power abandons its claim to lead the unification of Italy and is reduced to an ordinary Italian state."

# ===== Section D: events that previously had no title/description =====
 ai_diary_event.1.title: "Sell Herd for Gold"
 ai_diary_event.1.desc: "The herds have grown beyond what the pastures can bear. The elders propose selling a part of the herd to the merchants of the oasis towns, trading beasts for silver."
 ai_diary_event.1.a: "Sell the surplus."
 ai_diary_event.1.b: "Keep the herd intact."
 great_eastern.1.title: "The Great Eastern"
 great_eastern.1.desc: "A colossal iron hull lies on the stocks, longer than any ship ever built. She is to carry passengers and cargo to the far side of the world without coaling. The engineers swear it can be done; the bankers are less certain."
 great_eastern.1.a: "Finish her. The world will follow."
 great_eastern.1.b: "The cost is madness. Abandon the project."
 qng_1644_unification.2.title: "The Southern Campaign"
 qng_1644_unification.2.desc: "Our banners have crossed the Great Wall and the south lies open before us. The Ming remnants gather in the river provinces, and the question is whether we move swiftly or consolidate."
 qng_1644_unification.2.a: "Press south without pause."
 qng_1644_unification.2.b: "Consolidate the north first."
 qng_1644_unification.6.title: "The Removal (迁界)"
 qng_1644_unification.6.desc: "The coasts have been a highway for rebels and pirates alike. The court proposes to clear the seaboard and forbid all trade with the offshore islands."
 qng_1644_unification.6.a: "Clear the coast."
 qng_1644_unification.6.b: "Leave the people where they are."
 qng_1644_unification.6.historical_info: "The 'Great Clearance' (迁界令, 1661-1683) depopulated much of the south-east coast in order to deny resources to the Ming loyalists on Taiwan."
 qng_1644_unification.7.title: "The Three Feudatories"
 qng_1644_unification.7.desc: "The three southern princes who submitted to us hold their provinces almost as kings. They pay tribute, but their armies answer to them alone. The court asks whether such power can be suffered to endure."
 qng_1644_unification.7.a: "Order them to dissolve their armies."
 qng_1644_unification.7.b: "Leave them in peace for now."
 qng_1644_unification.7.historical_info: "The Revolt of the Three Feudatories (1673-1681) was triggered when the Kangxi Emperor ordered Wu Sangui and his fellow princes to give up their fiefs."
 qng_1644_unification.8.title: "The Dynasty Is Proclaimed"
 qng_1644_unification.9.title: "The Scholars Are Examined"
 qng_1644_unification.9.desc: "The old academies stand empty and the mandarins keeps their distance. If the new order is to be accepted, the examinations must be held and the literati brought into our service."
 qng_1644_unification.9.a: "Let the examinations be held."
 qng_1644_unification.9.historical_info: "The Qing retained and expanded the imperial examination system, which reconciled much of the Chinese gentry to the new dynasty."
 qng_1644_unification.10.title: "The Queue Decree"
 qng_1644_unification.10.desc: "A decree is proposed requiring every man to shave the front of the head and wear the queue, so that all may be seen at a glance to be the Emperor's subjects."
 qng_1644_unification.10.a: "Enforce the decree."
 qng_1644_unification.10.historical_info: "The 'tonsure order' of 1645 provoked widespread resistance, most famously in the defence of Jiangyin and Jiading, and was later softened to the three-day shave."
 qng_1644_unification.11.title: "The Maritime Ban Lifted"
 qng_1644_unification.11.desc: "For a generation the coasts have been sealed. Now the seas are quiet and the customs houses plead for the trade that once made the south rich."
 qng_1644_unification.11.a: "Reopen the ports."
 qng_1644_unification.11.historical_info: "The Kangxi Emperor lifted the sea ban in 1684 and opened four customs houses, founding the Canton System that governed China's foreign trade until the nineteenth century."
 start_events.1.title: "The Empire in 1644"
 start_events.1.desc: "The year is 1644. From the East the Manchu banners press in; from within, rebels and famine gnaw at the body of the realm. Across the seas the powers of Europe crowd one another in pursuit of trade, faith and empire."
 start_events.1.a: "Let us begin."
 start_events.1.historical_info: "1644 marks the fall of the Ming and the entry of the Qing into China, as well as the Peace of Westphalia that ended the Thirty Years' War in Europe."
 cleanup_1644.2.title: "Clearing the Field"
 cleanup_1644.2.desc: "The board is cluttered with the debris of other schemes. It is time to sweep it clean."
 cleanup_1644.2.a: "Sweep it clean."
 cleanup_1644.3.title: "Clearing the Field"
 cleanup_1644.3.desc: "The board is cluttered with the debris of other schemes. It is time to sweep it clean."
 cleanup_1644.3.a: "Sweep it clean."
 csh_1644_unification.6.title: "The Battle of Shanhaiguan"
 csh_1644_unification.6.desc: "The pass through which the roads of China and Manchuria meet is the hinge of the world. Whoever holds Shanhaiguan decides who shall rule north China."
 csh_1644_unification.6.a: "We will hold the pass."
 csh_1644_unification.6.historical_info: "In May 1644 Wu Sangui opened the Shanhaiguan pass to the Manchu banners, and the combined armies shattered Li Zicheng's forces at the battle of the pass."
 mng_1644.6.title: "The Northern Campaign"
 mng_1644.6.desc: "Our generals must decide where to strike, and with how much."
 mng_1644.6.a: "Press on."
 mng_1644.6.historical_info: "The Ming resisted from the south for nearly twenty years after 1644, in the several courts of the Southern Ming."
 wsg_1644_choice.100.title: "The Colours of Our Youth"
 wsg_1644_choice.100.a: "The choice is made."
 colonial_charter.100.title: "A New Model Charter"
 colonial_charter.100.desc: "The old charters were granted by a dozen different hands along the coast. A great assembly of delegates now sits to reduce them into a single frame of government."
 colonial_charter.100.a: "A governor appointed by ourselves."
 colonial_charter.100.b: "A council of the garrison holders."
 colonial_charter.100.c: "A diet of the trading towns."
 colonial_charter.100.d: "A representative assembly elected by the freeholders."
 colonial_charter.100.e: "A charter of the old church and gentry."
 colonial_charter.100.f: "Let the old charters stand as they are."
 flavor_all_chi.1.title: "The Middle Kingdom"
 flavor_all_chi.1.desc: "The heartland is ours, and all the roads of the realm run inward to the capital. The question now is what manner of state the Middle Kingdom shall be."
 flavor_all_chi.1.a: "One realm, one law, one writing."
 flavor_all_chi.1.b: "Let the provinces keep their customs."
 flavor_all_chi.1.c: "Rebuild the granaries and the canals."
 flavor_all_chi.1.d: "Raise the banners of the frontier."
 flavor_all_chi.1.e: "Bring the scholars to court."
 flavor_all_chi.1.f: "Let the temples be restored."
 flavor_all_chi.1.g: "Open the markets to the seas."
 flavor_all_chi.1.h: "Reform the taxes of the realm."
 flavor_all_chi.1.i: "Strengthen the walls and the passes."
 flavor_all_chi.1.j: "Let the people be."
 flavor_cas.50.title: "The Novísima Recopilación"
 flavor_cas.50.desc: "The laws of the kingdom lie scattered through a hundred different compilations. The Council of Castile proposes to gather them into a single code."
 flavor_cas.50.a: "Let them be gathered."
 flavor_cas.50.b: "The old laws serve well enough."
 flavor_cas.50.historical_info: "The Novísima Recopilación was a compilation of the laws of Castile published in 1805, though the work of codification was long delayed."
 flavor_eng.219.title: "The Painter of the Academy"
 flavor_eng.219.desc: "The Royal Academy has produced a painter whose portraits of the great have made him the most celebrated artist in the land."
 flavor_eng.219.desc_joshua_reynolds: "Sir Joshua Reynolds, first President of the Royal Academy, has made portraiture the grandest of the arts and himself its undisputed master."
 flavor_eng.219.desc_random_artist: "A painter of the Academy has caught the public eye, and commissions for portraits arrive from every great house."
 flavor_eng.219.a: "Commission his work."
 flavor_eng.219.b: "We have no need of painters."
 flavor_eng.219.historical_info: "Sir Joshua Reynolds (1723-1792) was the first president of the Royal Academy and the leading English portrait painter of the eighteenth century."
 flavor_eng.220.title: "Machines and Men"
 flavor_eng.220.desc: "The new spinning frames throw a hundred poor men out of work for every dozen they employ, and the weavers have begun breaking the machines at night."
 flavor_eng.220.a: "Break them ourselves and keep the peace."
 flavor_eng.220.b: "Stand with the owners of the machines."
 flavor_eng.220.historical_info: "The frame-breaking riots and the Luddite movement of 1811-1816 were a violent reaction to the displacement of skilled labour by machinery."
 flavor_fra.1103.title: "The Appanages Consolidated"
 flavor_fra.1103.desc: "Certain lands have been granted to cadet princes in the past, and the holders keep their own courts and their own armies. The Crown proposes to bring them back into the royal domain."
 flavor_fra.1103.a: "Consolidate the appanages."
 flavor_fra.415.title: "The Grande Ordonnance"
 flavor_fra.415.desc: "The customs of the north and the south disagree on the conduct of a lawsuit, and a man's case depends on where it is heard. The King proposes a single ordinance of civil procedure."
 flavor_fra.415.a: "One procedure for the whole realm."
 flavor_fra.415.b: "Let the customs stand."
 flavor_fra.415.c: "Consult the parlements first."
 flavor_hab.14.title: "Tractatus de Iuribus Incorporalibus"
 flavor_hab.14.desc: "The learned doctors of the realm have produced a treatise on the rights of incorporated bodies, which the court regards as a model of good order."
 flavor_hab.14.a: "Let it be taught in the universities."
 flavor_hab.14.b: "It is a matter for lawyers, not for us."
 flavor_hab.14.historical_info: "The 'Tractatus de iuribus incorporalibus' was a seventeenth-century treatise on Austrian law and the incorporation of lands and offices."
 flavor_hab.64.title: "The Geheimer Rat Institutionalized"
 flavor_hab.64.desc: "The Privy Council meets irregularly and keeps no proper register. A permanent body, its members sworn, salaried and housed, would let the will of the sovereign run through the whole administration."
 flavor_hab.64.a: "A permanent council."
 flavor_hab.64.b: "The court keeps its old shape."
 flavor_jap.2.title: "Rangaku"
 flavor_jap.2.desc: "Scholars of the Dutch school have set up their tables in Nagasaki and offer theories about plagues, earthquakes and the mysteries of the pestilence that threatens us."
 flavor_jap.2.a: "Put the barbarians' learning to use."
 flavor_jap.2.b: "The old medicine is enough."
 flavor_mch.16.title: "The Eight Banners"
 flavor_mch.16.desc: "The banners are the army, the administration and the nation all at once. The question is how far their privileges shall be extended over the conquered lands."
 flavor_mch.16.a: "Let every banner be rewarded."
 flavor_mch.16.b: "The banners serve for their pay."
 flavor_mos.64.title: "The Old Believers"
 flavor_mos.64.desc: "The church is split by men who cross themselves with two fingers and call the patriarch a heretic. Their settlements on the frontier grow every year."
 flavor_mos.64.a: "Hunt them out."
 flavor_mos.64.b: "Let them live quietly in the north."
 flavor_mos.64.historical_info: "The Old Believers (Raskolniki) split from the Russian Orthodox Church after the reforms of Patriarch Nikon in the 1650s."
 flavor_mos.69.title: "The Copper Riot"
 flavor_mos.69.desc: "Copper coinage has driven silver out of circulation, and the price of bread is beyond the reach of the townsmen. A crowd has gathered before the palace."
 flavor_mos.69.a: "Melt out the copper."
 flavor_mos.69.b: "Let the streltsy answer the crowd."
 flavor_mos.69.c: "Punish the speculators."
 flavor_mos.69.historical_info: "The Copper Riot of 1662 began when Muscovites discovered that their copper coins were being paid in place of silver for taxes collected in silver."
 flavor_mos.78.title: "The Great Embassy"
 flavor_mos.78.desc: "A great embassy is to travel to the west, out of the usual diplomatic channels, to see the dockyards and shipyards of Holland and England with the Tsar's own eyes."
 flavor_mos.78.a: "Send the embassy."
 flavor_mos.78.b: "The Tsar shall not leave the realm."
 flavor_mos.88.title: "The Battle of Poltava"
 flavor_mos.88.desc: "The Swedish army, reduced by the winter and the long pursuit, has offered battle near Poltava. The issue of the north is to be decided."
 flavor_mos.88.a: "Accept battle."
 flavor_mos.88.b: "Avoid the field and let the winter do its work."
 flavor_mos.88.c: "Send the horse to cut his supply."
 flavor_mos.88.d: "Withdraw to the river."
 flavor_mos.88.historical_info: "The battle of Poltava (1709) destroyed the Swedish army in the Ukraine and made Russia the leading power of northern Europe."
 flavor_mos.98.title: "The Rank Table"
 flavor_mos.98.desc: "The Tsar has established a table of fourteen ranks in which every officer of the state, from ensign to field marshal, holds a place defined by service rather than birth."
 flavor_mos.98.a: "Let the table stand."
 flavor_mos.98.b: "The old families will be furious."
 flavor_mos.98.historical_info: "The Table of Ranks (1722) placed the civil, military and court service on a single ladder of fourteen grades, opening the nobility to men of merit."
 flavor_mos.103.title: "The Academy of Sciences"
 flavor_mos.103.desc: "Foreign professors have arrived to staff a new academy in the capital. Their letters are unreadable, their habits odd and their learning undeniable."
 flavor_mos.103.a: "Found the academy."
 flavor_mos.103.b: "Translate their works first."
 flavor_mos.103.c: "Theology is learning enough."
 flavor_mos.103.historical_info: "The Russian Academy of Sciences was founded in 1724 in St Petersburg on the model of the European academies."
 flavor_ned.10.title: "The Culture System"
 flavor_ned.10.desc: "The Indies are made to grow what Europe will buy, and the profits flow to the treasury. It is enormously profitable, and it is worked by forced labour."
 flavor_ned.10.a: "The system pays. Let it stand."
 flavor_ned.10.b: "We will adopt an ethical policy."
 flavor_rus.42.title: "The Ruler's Cabinet"
 flavor_rus.42.desc: "The Tsar's private cabinet has grown into a standing body, and its secretary now countersigns the decrees of the state."
 flavor_rus.42.desc_ruler: "The ruler's own secretary countersigns the decrees of state, and no order is valid without his hand."
 flavor_rus.42.desc_orlov: "Count Orlov, the favourite of the palace, stands behind the cabinet and its secretary."
 flavor_rus.42.desc_both: "Both the Tsar's cabinet and its chief minister stand at the centre of government."
 flavor_rus.42.a: "Let the cabinet be."
 flavor_rus.42.b: "The autocracy needs no ministers."
 flavor_rus.42.historical_info: "The Imperial Cabinet of the 18th century was a personal chancery of the sovereign that gradually took over the coordination of central government."
 flavor_rus.55.title: "The Moscow Foundlings' Home"
 flavor_rus.55.desc: "A great foundling home has been founded in Moscow after the example of the European charitable institutions, and the destitute children of the capital are brought into it."
 flavor_rus.55.a: "Fund it from the treasury."
 flavor_rus.55.b: "Let the church take them."
 flavor_rus.55.c: "Let private charity suffice."
 flavor_rus.72.title: "The Moscow Gazette"
 flavor_rus.72.desc: "A newspaper has begun printing in the capital, with news of the court and of foreign courts, and the Tsar has taken an interest in what it prints."
 flavor_rus.72.a: "Let the press stand under the Tsar's eye."
 flavor_rus.72.b: "Suppress the sheet."
 flavor_rus.72.historical_info: "The 'Moscow Gazette' (Московские ведомости) began publication in 1756, the first Russian newspaper of general circulation."
 flavor_tur.112.title: "The End of the Timars"
 flavor_tur.112.desc: "The old military fiefs no longer bring soldiers to the field, and their holders draw the revenue without service. The treasury proposes to convert them into ordinary farms of the state."
 flavor_tur.112.a: "Convert the timars."
 flavor_tur.112.b: "The timariots are the army."
 flavor_tur.112.historical_info: "The abolition of the timar system in the 17th and 18th centuries replaced cavalry fiefs with tax farms and a standing army, and destroyed the old provincial military class."
 flavor_tur.132.title: "The Tax Farming Reform"
 flavor_tur.132.desc: "The great tax farms are auctioned to the highest bidder, and the bidders grind the provinces to repay themselves. A centralized treasury might collect the same sums with less ruin."
 flavor_tur.132.a: "Centralize the collection."
 flavor_tur.132.b: "Leave the farms to the bidders."
 flavor_tur.132.historical_info: "The Ottoman iltizam (tax farming) system was progressively centralized in the Tanzimat reforms of the nineteenth century."
 flavor_tur.137.title: "The Judges of the Faithful"
 flavor_tur.137.desc: "The judges and muftis of the empire hold their posts by purchase and their rulings are for sale. The Sheikh-ul-Islam proposes to make the judicial offices a career open to examination."
 flavor_tur.137.a: "Examine and appoint."
 flavor_tur.137.b: "The offices will be sold as before."
 flavor_tur.137.historical_info: "The reform of the Ottoman ulema and the office of the Sheikh-ul-Islam was a central project of the Tanzimat reforms."
 flavor_tur.162.title: "Black as Sin, Sweet as Sedition"
 flavor_tur.162.desc: "Coffee houses have multiplied in the capital, and in them the politics of the day are discussed openly by any man with the price of a cup."
 flavor_tur.162.a: "Close them."
 flavor_tur.162.b: "License them and tax them."
 flavor_tur.162.c: "Let them be."
 flavor_tur.162.historical_info: "Ottoman coffee houses repeatedly drew the suspicion of the authorities as places of political satire and sedition, and were closed and reopened many times."
 flavor_tur.208.title: "The Printing House of Ibrahim Muteferrika"
 flavor_tur.208.desc: "A scholar of the court has obtained leave to set up a printing press, and the first book is to be a Turkish dictionary of geography."
 flavor_tur.208.a: "Let the press be established."
 flavor_tur.208.b: "The scribes will be ruined."
 flavor_ira.1001.title: "The Legacy of the Shah"
 flavor_ira.1001.desc: "The court looks back on the works of the previous reign, and considers what must be completed and what abandoned."
 flavor_ira.1001.a: "Continue the works."
 flavor_ira.1001.historical_info: "Twin and successor events in EU5 reuse the title and description of the event they follow."
 banking.2.entry: "$banking.1.title$"

# ===== Section D leftovers =====
 late_ming_crisis.1.title: "The Late Ming Crisis"
 late_ming_crisis.1.desc: "The seventeenth year of the Chongzhen reign. The treasury is empty, the granaries are bare, and the bandits of the north move faster than the armies sent against them. The realm is coming apart at the seams."
 late_ming_crisis.1.a: "The crisis is upon us."
 late_ming_crisis.1.b: "We will hold."
 late_ming_crisis.1.c: "Let us see what can be salvaged."
 flavor_rus.50.title: "The Legislative Commission"
 flavor_rus.50.desc: "A great commission of deputies has been summoned to codify the laws of the realm. Nobles, townsmen, Cossacks and peasants sit together in one hall for the first time."
 flavor_rus.50.a: "Let them compile a new code."
 flavor_rus.50.b: "The commission has no power to bind us."
 flavor_rus.50.c: "Disband it before it becomes a parliament."
 flavor_rus.50.historical_info: "Catherine II's Legislative Commission of 1767-1768 drew up the Nakaz and gathered deputies from all estates, though its work produced no new code."
# ===== Section D: late_ming_crisis 2-6 (recovered) =====
 late_ming_crisis.2.title: "A Word to Wu Sangui"
 late_ming_crisis.2.desc: "General Wu holds the Shanhaiguan pass with the last of the northern army. A messenger must be sent, and what he carries will decide whether the pass opens to us, to the Manchus, or to no one at all."
 late_ming_crisis.2.a: "Bid him hold the pass for the dynasty."
 late_ming_crisis.3.title: "The Northern Host"
 late_ming_crisis.3.desc: "The rebels have gathered a great host in the north, and the roads to the capital lie open to them. Our generals ask for orders."
 late_ming_crisis.3.a: "Meet them in the field."
 late_ming_crisis.4.title: "The Beizi of the Mountains and Rivers"
 late_ming_crisis.4.desc: "A prince of the blood has raised his standard in the hill country and calls upon all loyal men to rally to the dynasty against the rebels and the Manchus alike."
 late_ming_crisis.4.a: "Support the prince."
 late_ming_crisis.5.title: "The White Banner"
 late_ming_crisis.5.desc: "The common people of the south have taken up arms under a white banner, and their leaders swear they fight for the dynasty, not against it."
 late_ming_crisis.5.a: "Let them fight."
 late_ming_crisis.5.b: "Disarm them before they grow too strong."
 late_ming_crisis.5.historical_info: "Peasant militias and loyalist bands (such as the 'white banner' risings) fought both the rebels and the Manchu conquest in the 1640s."
 late_ming_crisis.6.title: "The Marshal's War Council"
 late_ming_crisis.6.desc: "The marshals of the realm meet in council to settle the plan of the campaign, and the arguments run late into the night."
 late_ming_crisis.6.a: "Strike north at the rebel host."
 late_ming_crisis.6.b: "Hold the line of the rivers."
 late_ming_crisis.6.historical_info: "The Ming command was paralysed by disputes between the field marshals and the court, which contributed greatly to the disasters of 1644."

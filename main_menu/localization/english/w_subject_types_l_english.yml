l_english:
 crown_territory: "Crown Territory"
 crown_territory_desc: "A $crown_territory$ refers to the territory represented by the secondary titles held under the same [ShowGovernmentTypeName('monarchy')]. In diplomacy, it is regarded as part of the [overlord|e], and in military affairs, it accepts unified command assigned by the [monarch|e]."

 LEAD_crown_territory: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_crown_territory: "[SUBJECT_TYPE.GetName] of $LIST$."

 OFFER_crown_territory_TOOLTIP_HEADER: "Demand that [TARGET_COUNTRY.GetName] become a Crown Territory"
 OFFER_crown_territory_TOOLTIP_HEADER_NO_TARGET: "Demand that a [country|e] become a Crown Territory"
 REQUEST_crown_territory_TOOLTIP_HEADER: "Request that we become a Crown Territory of [TARGET_COUNTRY.GetName]"
 REQUEST_crown_territory_TOOLTIP_HEADER_NO_TARGET: "Request that we become a Crown Territory of a [country|e]"
 CANCEL_crown_territory_TOOLTIP_HEADER: "Cancel the Crown Territory of [TARGET_COUNTRY.GetName]"
 CANCEL_crown_territory_TOOLTIP_HEADER_NO_TARGET: "Cancel the Crown Territory of a [country|e]"
 BREAK_crown_territory_TOOLTIP_HEADER: "Refuse to be the [subject|e] of [TARGET_COUNTRY.GetName]"
 BREAK_crown_territory_TOOLTIP_HEADER_NO_TARGET: "Refuse to be the [subject|e] of a [country|e]"
 OFFER_crown_territoryTITLE: "Ask them to become our Crown Territory"
 OFFER_crown_territory_FLAVOR: "Choose a [country|e] to offer [ShowSubjectTypeName('crown_territory')] status"
 REQUEST_crown_territoryTITLE: "Ask to become their Crown Territory"
 REQUEST_crown_territory_FLAVOR: "Choose a [country|e] to become their [ShowSubjectTypeName('crown_territory')]"
 CANCEL_crown_territoryTITLE: "Cancel Crown Territory Status"
 CANCEL_crown_territory_FLAVOR: "Choose a [country|e] to cancel their [ShowSubjectTypeName('crown_territory')] status"
 BREAK_crown_territoryTITLE: "Cancel Crown Territory Status"
 OFFER_crown_territory_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
 REQUEST_crown_territory_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
 CANCEL_crown_territory_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
 BREAK_crown_territory_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
 OFFER_crown_territory_NEWDESC: "Do we wish to demand that [COUNTRY.GetName] becomes our Crown Territory?"
 REQUEST_crown_territory_NEWDESC: "Do we wish to request that we become a Crown Territory of [COUNTRY.GetName]?"
 CANCEL_crown_territory_NEWDESC: "Do we wish end Crown Territory status of [COUNTRY.GetName]?"
 BREAK_crown_territory_NEWDESC: "Do we wish to stop being a Crown Territory of [COUNTRY.GetName]?\nThis will cause our relations to worsen, and they will get a [casus_belli|e] against us!"
 OFFER_crown_territory_DESC: "Suggest that they become our Crown Territory, and we will protect them."
 REQUEST_crown_territory_DESC: "Suggest that we become their Crown Territory, and they will protect us."
 CANCEL_crown_territory_DESC: "End Crown Territory status."
 BREAK_crown_territory_DESC: "Cease being a Crown Territory."
 OFFER_crown_territory_REQDESC: "[COUNTRY.GetName] is asking us to become a [SUBJECT_TYPE.GetName]"
 REQUEST_crown_territory_REQDESC: "[COUNTRY.GetName] is asking to become our [SUBJECT_TYPE.GetName]"
 CANCEL_crown_territory_REQDESC: "$MONARCHTITLE$"
 BREAK_crown_territory_REQDESC: "$MONARCHTITLE$"
 OFFER_crown_territory_TOO_LOW: "@trigger_no! To make the [COUNTRY.GetLongName] a Crown Territory, their opinion of us must be at least $NEED|Y$, while it is currently only $VAL|Y0$."
 REQUEST_crown_territory_TOO_LOW: "@trigger_no! To make us a Crown Territory, our opinion of the [COUNTRY.GetLongName] must be at least $NEED|Y$, while it is currently only $VAL|Y0$."
 CANCEL_crown_territory_NOT_IN_TRUCE: "$not_possible_to_break_subject_in_truce$"
 BREAK_crown_territory_NOT_IN_TRUCE: "$not_possible_to_break_subject_in_truce$"
 OFFER_crown_territory_ALREADY_SUBJECT: "$country_already_a_subject$"
 REQUEST_crown_territory_ALREADY_SUBJECT: "$country_already_a_subject$"
 OFFER_crown_territory_AT_WAR: "$country_is_at_war$"
 REQUEST_crown_territory_AT_WAR: "$country_is_at_war$"
 OFFER_crown_territory_LOWER_IN_SUBJECT_CHAIN: "$country_lower_in_subject_chain$"
 REQUEST_crown_territory_LOWER_IN_SUBJECT_CHAIN: "$country_lower_in_subject_chain$"

 subject_pays_charted_company: "Charted Company pays Overlord"
 charted_company:"Charted Company"
 charted_company_desc:"$charted_company$ is created by [overlord|e],They always use the [ShowGovernmentTypeName('republic')] government type.They will focus on expanding overseas trade and colonial affairs, thereby generating income for the [overlord|e]."

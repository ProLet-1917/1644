l_english:
 # =========================================================
 # MING-QING TRANSITION (1644-1683)
 # =========================================================
 mqt_1644.1.title: "The Queue Decree"
 mqt_1644.1.desc: "The court has ordered that every Chinese subject shave the front of his head and wear the queue in the Manchu fashion. 'Keep the hair, lose the head' — the order is being enforced at the point of the sword, and in Jiangnan it has already provoked revolt."
 mqt_1644.1.historical_info: "The queue decree of 1645 made the Manchu hairstyle compulsory for all Chinese men, triggering widespread resistance and massacres."
 mqt_1644.1.a: "The decree will be enforced."
 mqt_1644.1.b: "The decree will be relaxed for the present."

 mqt_1644.2.title: "The Fall of Yangzhou"
 mqt_1644.2.desc: "Yangzhou has refused to surrender, and the army has taken it by storm. The commander proposes to make an example of the city, that no other city may think to resist. The literati of the south will not forget it."
 mqt_1644.2.historical_info: "The ten-day massacre of Yangzhou in 1645 followed the death of the Ming loyalist Shi Kefa and became a symbol of Qing conquest."
 mqt_1644.2.a: "Let Yangzhou be made an example."
 mqt_1644.2.b: "The city will be spared and the scholars won over."

 mqt_1644.3.title: "The End of the Dashun"
 mqt_1644.3.desc: "The rebel emperor has been hunted across the mountains of Huguang and has met his end at the hands of local militia. His followers are leaderless, and the great rising of the peasants is broken."
 mqt_1644.3.historical_info: "Li Zicheng, founder of the short-lived Shun dynasty, died in 1645 in Hubei."
 mqt_1644.3.a: "The leader is dead."
 mqt_1644.3.b: "The remnants will fight on."

 mqt_1644.4.title: "The End of the Daxi"
 mqt_1644.4.desc: "Zhang Xianzhong has been killed in a skirmish with Qing forces in Sichuan. His generals must now choose between surrender, flight, and alliance with the Ming loyalists."
 mqt_1644.4.historical_info: "Zhang Xianzhong, ruler of the short-lived Daxi state in Sichuan, was killed in 1647."
 mqt_1644.4.a: "The leader is dead."
 mqt_1644.4.b: "The remnants will join the Ming cause."

 mqt_1644.5.title: "Two Princes Slain"
 mqt_1644.5.desc: "The Ming armies of the south-west have won two victories in a single year, killing two of the enemy's princely commanders. For the first time in a decade the loyalist cause has hope."
 mqt_1644.5.historical_info: "Li Dingguo's victories at Guilin (1652) and Hengzhou (1652) killed the Qing princes Kong Youde and Nikan, and were called 'two princes in one year'."
 mqt_1644.5.a: "The loyalist cause revives."
 mqt_1644.5.b: "The people take heart."

 mqt_1644.6.title: "The Northern Expedition"
 mqt_1644.6.desc: "A loyalist fleet and army have been gathered on the coast, and a general of great reputation proposes to sail up the Yangtze and invest Nanjing itself. The city was taken once; it may be taken again."
 mqt_1644.6.historical_info: "Zheng Chenggong's 1659 northern expedition reached Nanjing but failed after a siege of the city."
 mqt_1644.6.a: "Let the expedition sail."
 mqt_1644.6.b: "The coast must be held, not the river."

 mqt_1644.7.title: "The Court in Exile"
 mqt_1644.7.desc: "The last Ming court has been driven from Yunnan into the forests of Burma, a government without a capital and an emperor without a throne. The loyalist armies in the hills fight on without it."
 mqt_1644.7.historical_info: "The Yongli Emperor fled into Burma in 1659 and was handed over to the Qing in 1662."
 mqt_1644.7.a: "The court will withdraw into Burma."
 mqt_1644.7.b: "We will make our last stand in Yunnan."

 mqt_1644.8.title: "The Sea Ban"
 mqt_1644.8.desc: "The loyalists on the islands live by the sea trade of the mainland. The court proposes to remove the coastal population inland and forbid all sea traffic — to starve the enemy by ruining our own coast."
 mqt_1644.8.historical_info: "The 'sea ban' and coastal evacuation of 1661 depopulated the south-east coast in order to cut off the Zheng regime in Taiwan."
 mqt_1644.8.a: "The coast will be evacuated."
 mqt_1644.8.b: "The sea trade will be kept open."

 mqt_1644.9.title: "The Three Feudatories"
 mqt_1644.9.desc: "Three Chinese generals who were rewarded with provinces for their part in the conquest now rule them as their own. The court has resolved to take back their power — and they have resolved not to give it up."
 mqt_1644.9.historical_info: "The Revolt of the Three Feudatories (1673-1681) was led by Wu Sangui, Geng Jingzhong and Shang Zhixin against the Kangxi Emperor's attempt to abolish their fiefs."
 mqt_1644.9.a: "Their fiefs will be abolished."
 mqt_1644.9.b: "They will be left in peace for now."

 mqt_1644.10.title: "The Feudatories Are Broken"
 mqt_1644.10.desc: "After eight years of war the rebellion has collapsed. Wu Sangui is dead, his grandson has hanged himself in Kunming, and the southern provinces are again subject to the throne."
 mqt_1644.10.historical_info: "The rebellion ended in 1681 with the fall of Kunming; the feudatories were abolished and the south brought under direct rule."
 mqt_1644.10.a: "The south is pacified."
 mqt_1644.10.b: "The feudatories will be reduced, not destroyed."

 mqt_1644.11.title: "The Conquest of Taiwan"
 mqt_1644.11.desc: "A loyalist admiral has offered to take the island for the throne, and the fleet is ready. The Ming hold on Taiwan is the last remnant of the old order, and it will be ended."
 mqt_1644.11.historical_info: "Admiral Shi Lang defeated the Zheng fleet at Penghu in 1683, ending Ming loyalist rule on Taiwan."
 mqt_1644.11.a: "The island will be brought under the throne."
 mqt_1644.11.b: "The island is not worth a fleet."

 mqt_1644.12.title: "The Erudite and Learned Examination"
 mqt_1644.12.desc: "The court proposes to summon the surviving scholars of the old dynasty to a special examination and to employ them in the compilation of the imperial library. Many refuse; those who come will be given office and honour."
 mqt_1644.12.historical_info: "The boxue hongru examination of 1679 recruited Ming loyalist scholars into Qing service and produced the 'Complete Library of the Four Treasuries'."
 mqt_1644.12.a: "The scholars will be summoned and employed."
 mqt_1644.12.b: "Their writings will be examined for sedition."

 # =========================================================
 # DYNASTY STABILITY
 # =========================================================
 dynasty_stability_1644.1.title: "A Golden Age"
 dynasty_stability_1644.1.desc: "The granaries are full, the borders are quiet, the examinations are crowded with talent and the tribute fleets come up the river. Men speak of our reign as they once spoke of the ancients."
 dynasty_stability_1644.1.a: "Heaven favours this dynasty."

 dynasty_stability_1644.2.title: "Signs of Trouble"
 dynasty_stability_1644.2.desc: "The omens are ambiguous and the memorials grow bolder. Nothing is yet wrong that cannot be mended, but the court knows the difference between peace and prosperity."
 dynasty_stability_1644.2.a: "The situation is worse than it appears."
 dynasty_stability_1644.2.b: "We have weathered worse."

 dynasty_stability_1644.3.title: "The Mandate Is Shaken"
 dynasty_stability_1644.3.desc: "Banditry is general in the hills, the treasury is short, and officials speak openly of the faults of the throne. The people have begun to ask whether this dynasty still deserves the name of Son of Heaven."
 dynasty_stability_1644.3.a: "The dynasty must look to itself."
 dynasty_stability_1644.3.b: "An edict of self-blame will be issued."

 dynasty_stability_1644.4.title: "On the Brink"
 dynasty_stability_1644.4.desc: "The provinces are in open revolt, the armies are unreliable, and the great families are quietly making their own arrangements. The signs of dynastic collapse are all present at once."
 dynasty_stability_1644.4.a: "We must endure."
 dynasty_stability_1644.4.b: "A general amnesty may buy us time."

 dynasty_stability_1644.5.title: "The Change of Dynasty"
 dynasty_stability_1644.5.desc: "The mandate of Heaven has passed from this house. The altars of the dynasty are broken, the capital is lost, and the question is no longer whether the dynasty will fall but what will follow it."
 dynasty_stability_1644.5.a: "Let a new dynasty be founded."
 dynasty_stability_1644.5.b: "Let the dynasty perish with honour."
 dynasty_stability_1644.5.c: "We will restore the fortunes of this house."

 dynasty_stability_1644.6.title: "A New Dynasty Is Proclaimed"
 dynasty_stability_1644.6.desc: "The altars have been rebuilt and a new reign name proclaimed. The officials have taken their oaths, the armies have been re-enrolled, and the people — as always — will wait to see whether the new house fares better than the old."
 dynasty_stability_1644.6.a: "A new age begins."
 dynasty_stability_1644.6.b: "The mandate is ours again."

 dynasty_stability_1644.7.title: "Loyalists of the Old House"
 dynasty_stability_1644.7.desc: "There are still men who will not accept the new order — old officials, scholars, and officers of the fallen dynasty. They gather in the hills and correspond in ciphers, and they call us usurpers."
 dynasty_stability_1644.7.a: "They will be hunted down."
 dynasty_stability_1644.7.b: "They will be offered office."

 # =========================================================
 # NEW CHINESE DYNASTY INTERACTIONS
 # =========================================================
 enfeoff_tributary_king: "Enfeoff a Tributary King"
 enfeoff_tributary_king_desc: "Grant a king of a tributary state the patent of investiture, his seal of office and a rank in the Chinese order of things."
 revoke_fanwang: "Reduce a Prince"
 revoke_fanwang_desc: "Withdraw part of the lands, titles and privileges of a prince of the imperial house, as a warning to the rest."
 force_gaitu_guiliu: "Replace the Native Chieftains"
 force_gaitu_guiliu_desc: "Abolish a native chieftaincy and bring its lands directly under the regular administration of the empire."
 grant_amnesty_to_rebels: "Proclaim an Amnesty"
 grant_amnesty_to_rebels_desc: "Offer pardon and office to the leaders of a rebellion, if they will lay down their arms."
 bestow_imperial_surname: "Bestow the Imperial Surname"
 bestow_imperial_surname_desc: "Grant a favoured ruler the surname of the imperial house, binding his family to ours by an unbreakable tie of honour."

 # =========================================================
 # IMPERIAL ACTIONS
 # =========================================================
 issue_edict_of_self_blame: "Issue an Edict of Self-Blame"
 issue_edict_of_self_blame_desc: "The emperor takes the misfortunes of the realm upon himself, and promises reform. It costs him prestige and may restore the confidence of the people."
 proclaim_great_amnesty: "Proclaim a Great Amnesty"
 proclaim_great_amnesty_desc: "A general pardon for all but the worst offenders, proclaimed throughout the empire."
 order_tax_remission: "Order Tax Remission"
 order_tax_remission_desc: "Remit the taxes of the afflicted provinces and open the granaries to the poor."
 conduct_imperial_audit: "Conduct the Imperial Audit"
 conduct_imperial_audit_desc: "Examine the records and conduct of every official of the central and provincial governments."
 undertake_imperial_tour: "Undertake an Imperial Tour"
 undertake_imperial_tour_desc: "The emperor travels in state through the provinces, showing himself to the people and inspecting the officials at work."
 proclaim_imperial_call_to_arms: "Proclaim a Call to Arms"
 proclaim_imperial_call_to_arms_desc: "Issue a proclamation calling on every loyal subject and tributary to take up arms in the emperor's cause."
 proclaim_imperial_call_to_arms_tt: "Every member of the dynasty will be called upon to answer the emperor's summons."
 present_captives_at_ancestral_temple: "Present Captives at the Ancestral Temple"
 present_captives_at_ancestral_temple_desc: "A great victory is reported to the imperial ancestors and the enemy leaders are presented at the temple, as the rites require."

 # =========================================================
 # NEW STATIC MODIFIERS
 # =========================================================
 imperial_favour: "Imperial Favour"
 imperial_favour_desc: "The emperor's goodwill rests upon us, and our standing among the tributaries is the better for it."
 imperial_investiture: "Imperial Investiture"
 imperial_investiture_desc: "We hold the patent and seal of the Son of Heaven, and our rule is legitimised in the eyes of all."
 fanwang_reduced: "Prince Reduced"
 fanwang_reduced_desc: "Our lands and privileges have been cut back by the throne, and our power is much diminished."
 imperial_amnesty: "Imperial Amnesty"
 imperial_amnesty_desc: "The emperor has pardoned our rebellion and taken us into his service."
 imperial_surname_bestowed: "Imperial Surname Bestowed"
 imperial_surname_bestowed_desc: "The throne has honoured our house with its own surname, an unbreakable tie of honour."
 imperial_call_to_arms: "Call to Arms Proclaimed"
 imperial_call_to_arms_desc: "The empire has been summoned to arms, and every loyal subject is expected to answer."
 answered_the_call_to_arms: "Answered the Call to Arms"
 answered_the_call_to_arms_desc: "We have answered the emperor's summons and sent our forces to his standard."
 captives_presented_at_the_temple: "Captives Presented at the Temple"
 captives_presented_at_the_temple_desc: "The victory has been reported to the imperial ancestors, and the rites of triumph have been observed."
 dynasty_golden_age: "A Golden Age"
 dynasty_golden_age_desc: "The dynasty is at the height of its fortunes; the realm is rich, the borders quiet and the throne secure."
 dynasty_peace_and_prosperity: "Peace and Prosperity"
 dynasty_peace_and_prosperity_desc: "The realm is at peace and the harvests are good."
 dynasty_creeping_decline: "Creeping Decline"
 dynasty_creeping_decline_desc: "Nothing is openly wrong, yet the machinery of government is quietly running down."
 dynasty_mandate_shaken: "The Mandate Shaken"
 dynasty_mandate_shaken_desc: "The omens and the memorials alike suggest that the dynasty has lost the confidence of Heaven."
 dynasty_on_the_brink: "On the Brink"
 dynasty_on_the_brink_desc: "The dynasty stands at the edge of collapse; revolt, bankruptcy and faction threaten it at once."
 imperial_apology_edict: "Edict of Self-Blame"
 imperial_apology_edict_desc: "The emperor has taken the faults of the realm upon himself, and the people are somewhat comforted."
 great_amnesty: "Great Amnesty"
 great_amnesty_desc: "A general pardon has been proclaimed throughout the empire."
 imperial_audit: "Imperial Audit"
 imperial_audit_desc: "The records and conduct of the officials have been examined and the service is the cleaner for it."
 war_levies_imposed: "War Levies Imposed"
 war_levies_imposed_desc: "Extraordinary taxes have been laid upon the provinces for the needs of the war."
 tax_remission_and_relief: "Tax Remission and Relief"
 tax_remission_and_relief_desc: "Taxes have been remitted and the granaries opened to the afflicted provinces."
 imperial_tour: "Imperial Tour"
 imperial_tour_desc: "The emperor has shown himself to the provinces and the officials have had reason to be diligent."
 new_dynasty_consolidation: "A New Dynasty Consolidates"
 new_dynasty_consolidation_desc: "The new house is settling into the government of the realm."
 new_era_proclaimed: "A New Era Proclaimed"
 new_era_proclaimed_desc: "A new reign name has been proclaimed and the calendar begins again."
 loyalists_of_the_old_dynasty: "Loyalists of the Old Dynasty"
 loyalists_of_the_old_dynasty_desc: "There are still men who will not accept the new order and work in secret against it."
 mandate_of_heaven_bestowed: "The Mandate Bestowed"
 mandate_of_heaven_bestowed_desc: "Heaven has conferred its mandate upon this house, and the realm acknowledges it."


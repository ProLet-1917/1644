 flavor_zun.1:"Rise of The Dzunghar Horde"
 flavor_zun.1.title:"Rise of The Dzunghar Horde"
 flavor_zun.1.desc:"The Dzungar Khanate was a nomadic khanate of Oirat Mongol origin. At its greatest extent, it covered an area from southern Siberia in the north to present-day Kyrgyzstan in the south, and from present-day west of Mongolia and the Great Wall of China in the east to present-day Kazakhstan in the west. The core of the Dzungar Khanate is today part of northern Xinjiang, also called Dzungaria."
 flavor_zun.1.a:"Declare our destiny"
 flavor_zun.1.b:"On another thought we should better do more trade with nearby nations"
 STATIC_MODIFIER_NAME_rise_of_dzungar_horde:"Rise of The Dzungar Horde"
 STATIC_MODIFIER_NAME_conquest_tibet_region:"Conquest Tibet Region"
 flavor_zun.2:"Campaign Attack [GetCountry('CHG').GetName]?"
 flavor_zun.2.title:"Campaign Attack [GetCountry('CHG').GetName]?"
 flavor_zun.2.desc:"The [GetCountry('CHG').GetName] rule Tarim area.They have more abundant land but lack sufficient strength to protect themselves,As Dzungars,We have the obligation to help them protect their land."
 flavor_zun.2.a:"For the wealth and khan"
 flavor_zun.2.b:"On another thought we should trade with them"
 flavor_zun.3:"Campaign Attack [GetCountry('QKH').GetName] and [GetCountry('UUS').GetName]?"
 flavor_zun.3.title:"Campaign Attack [GetCountry('QKH').GetName] and [GetCountry('UUS').GetName]?"
 flavor_zun.3.desc:"Tsewang Rabtan's brother Tseren Dondup invaded the Khoshut Khanate in 1717, deposed Yeshe Gyatso, killed Lha-bzang Khan, and looted Lhasa. The Kangxi Emperor retaliated in 1718, but his military expedition was annihilated by the Dzungars in the Battle of the Salween River, not far from Lhasa. A second and larger expedition sent by Kangxi expelled the Dzungars from Tibet in 1720. They brought Kälzang Gyatso with them from Kumbum to Lhasa and installed him as the 7th Dalai Lama in 1721."
 flavor_zun.3.a:"Conquer the tibet!"
 flavor_zun.3.b:"Hire a character to conquer tibet for us."
 flavor_zun.3.c:"On another thought we should not invade the symbol of Tibetan Buddhist."

l_english:
 character_title_governor: "Governor"
 promote_to_local_governor: "Appoint a Governor"
 promote_to_local_governor_desc: "This governorship currently has no governor in office. We can appoint a governor to assist in governing this region."
 rulling_nearby_land: "Control Surrounding Lands"
 rulling_nearby_land_desc: "We can order our governor to undertake a task to bring surrounding lands under control, which will provide more control for the governor's region."
 spread_culture: "Promote Culture"
 spread_culture_desc: "We can order our governor to undertake a task to promote our culture, which will cause the population in the governor's region to convert to our culture more quickly."
 spread_religion: "Demand Conversion"
 spread_religion_desc: "We can order our governor to undertake a task to demand the conversion of heathens, which will cause the population in the governor's region to convert to our religion more quickly."
 held_holiday_celebration: "Hold Holiday Celebrations"
 held_holiday_celebration_desc: "We can order our governor to hold celebrations during festivals, which will reduce the likelihood of the population in the governor's region participating in rebellions."
 local_governor_organize_troops: "Organize Levies"
 local_governor_organize_troops_desc: "We can order our governor to undertake the organization of levies, which will cause the population in the governor's region to provide more levies."
 local_governor_production_plan: "Optimize Production"
 local_governor_production_plan_desc: "We can order our governor to negotiate the supply and output of local workshops, which will increase the efficiency of production in the governor's region."
 remove_current_work: "Remove Current Task"
 remove_current_work_desc: "This will remove the governor's current task, allowing the governor to undertake another task."
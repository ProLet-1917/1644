l_english:
# Tag specific. Please keep alphabetical order
 country_history_BAV: "After centuries of division, [GetCountry('BAV').GetName] is once again united. Located at the heart of the [GetInternationalOrganization('hre').GetName], the Danube flows through our lands, bringing wealth and fertile soil.\n\nOur country is now ruled by the [GetDynasty('wittelsbach_dynasty').GetName] dynasty, which is currently embroiled in a dispute over the status of [ShowSpecialStatusName('elector')].\n\nAs the religious wars sweep across Europe, we cannot remain neutral. As members of the Catholic League, we support the authority of the Emperor of the [GetInternationalOrganization('hre').GetName]."
 country_history_BRA: "The [GetDynasty('hohenzollern_dynasty').GetName] dynasty has ruled [GetCountry('BRA').GetName] for centuries. Under their reign, the lands of [GetCountry('BRA').GetName] have escaped the difficulties of the era under the [GetDynasty('wittelsbach_dynasty').GetName] dynasty and have prospered anew under successive monarchs. The [GetDynasty('hohenzollern_dynasty').GetName] dynasty now also rules [GetCountry('PRU').GetName]; perhaps one day we might unite and form a new country.\n\nNorthern Germany was invaded not long ago by the armies of [GetCountry('SWE').GetName]. At the same time, the Emperor of the [GetInternationalOrganization('hre').GetName] launched a counterattack from the south, and the flames of war once again ravaged this land. But chaos always brings opportunities. Our territory has not been greatly affected. Perhaps we can take this moment to forge our own path."
# Fallback
 country_history_fallback: "In this pivotal moment, our nation faces new opportunities and challenges. As global trade routes expand, we stand to benefit from novel ideas, goods, and cultural exchanges. However, maintaining our traditions and sovereignty amid these shifts remains a critical task.\n\nOur country must choose whether to focus on enhancing cultural richness or fortifying military strength. Our decisions will shape our nation's future trajectory in this increasingly interconnected world."

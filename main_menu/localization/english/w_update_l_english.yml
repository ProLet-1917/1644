 echo_of_the_empire_key: "#italic Echo of the Empire #!"
 echo_of_the_empire_desc: "Inherit the resistance spirit of the thousand-year empire, lead the Catholic world to resist the invasion of the heathens, or seize the long-desired city - Vienna.\n\nThe 'Echo of the Empire' flavor update focuses on the history of the Mani people, the Ottoman Empire, and the Holy League. It adds dozens of special events and different routes for the Mani people, add the Holy League event chain and adds a series of contents including reforms and expansions for the Ottoman Empire."
 flavor_update: "Flavor Update"
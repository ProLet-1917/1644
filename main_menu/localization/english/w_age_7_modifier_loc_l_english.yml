l_english:
 # =========================================================
 # Age 7 - core static modifiers
 # =========================================================
 second_french_empire: "The Second Empire"
 second_french_empire_desc: "The empire of the plebiscite: order at home, glory abroad, and an emperor who answers to the people."
 revanchism_against_germany: "Revanchism"
 revanchism_against_germany_desc: "The lost provinces are not forgotten, and every schoolbook teaches the map of the frontier as it ought to be."
 paris_commune_crushed: "The Commune Crushed"
 paris_commune_crushed_desc: "The insurrection of the capital has been put down in blood, and the army and the propertied classes have learned what they can do."
 french_colonial_party: "The Colonial Party"
 french_colonial_party_desc: "Deputies, officers and merchants have made colonial expansion a national cause."
 french_master_painter: "A Master Painter"
 french_master_painter_desc: "His canvases have changed how Europe sees light itself."
 french_man_of_letters: "A Man of Letters"
 french_man_of_letters_desc: "His novels are read in every province and debated in every salon."
 mandate_of_heaven_upheld: "The Mandate Upheld"
 mandate_of_heaven_upheld_desc: "The omens are favourable and the throne is secure in the affection of its subjects."
 mandate_of_heaven_failing: "The Mandate Failing"
 mandate_of_heaven_failing_desc: "The signs are read against us: famine, flood and sedition in the same season."
 new_dynasty_enthroned: "A New Dynasty Enthroned"
 new_dynasty_enthroned_desc: "The altars have been rebuilt and the new house has taken up the government of the realm."
 dynastic_collapse: "Dynastic Collapse"
 dynastic_collapse_desc: "The machinery of state has seized; the provinces are beyond control and the name of the dynasty is spoken with contempt."
 dynastic_restoration: "Dynastic Restoration"
 dynastic_restoration_desc: "The house has weathered the storm, and the realm has been set in order once more."

 # =========================================================
 # Age 7 - national flavour (DHE)
 # =========================================================
 # --- Habsburg Monarchy ---
 habsburg_reform_era: "The Era of Reform"
 habsburg_reform_era_desc: "Constitutions, schools and railways have been granted, and the monarchy has bought itself time."
 habsburg_military_absolutism: "Military Absolutism"
 habsburg_military_absolutism_desc: "The army holds the monarchy together, and the monarchy is the army."
 austro_hungarian_compromise: "The Dual Monarchy"
 austro_hungarian_compromise_desc: "Two states under one sovereign: the settlement has reconciled the Magyars and steadied the realm."
 balkan_annexation_crisis: "The Balkan Crisis"
 balkan_annexation_crisis_desc: "Our forward policy in the Balkans has alarmed every power in Europe."
 viennese_master_composer: "A Viennese Master"
 viennese_master_composer_desc: "The city of music has produced another composer whom the world will not forget."
 viennese_secession_painter: "A Secessionist Painter"
 viennese_secession_painter_desc: "He has broken with the Academy and painted the modern soul in gold and ornament."
 viennese_scientific_school: "The Viennese School"
 viennese_scientific_school_desc: "A physician of the capital has founded a new science of the mind, and the faculty is divided over it."

 # --- Russia ---
 crimean_war_humiliation: "The Crimean Humiliation"
 crimean_war_humiliation_desc: "Our armies were beaten in the south and the whole world has seen how backward we are."
 emancipation_of_the_serfs: "The Serfs Emancipated"
 emancipation_of_the_serfs_desc: "Forty million souls have been freed with land, and the old agrarian order is at an end."
 serfdom_upheld: "Serfdom Upheld"
 serfdom_upheld_desc: "The gentry have kept their labour, and the peasants their grievances."
 trans_siberian_railway: "The Great Siberian Railway"
 trans_siberian_railway_desc: "Seven thousand versts of iron bind the Pacific to Europe and make our power in the East real."
 october_manifest: "The October Manifesto"
 october_manifest_desc: "A constitution and a Duma have been granted, and the autocracy has been limited for the first time."
 stolypin_reaction: "The Reaction"
 stolypin_reaction_desc: "The gallows and the land reform together have broken the back of the revolution."
 russian_man_of_letters: "A Russian Novelist"
 russian_man_of_letters_desc: "His great novel on war, family and faith is read from Petersburg to Siberia."
 russian_master_composer: "A Russian Composer"
 russian_master_composer_desc: "He has married Russian melody to the western concert hall, and the world listens."

 # --- Ottoman Empire ---
 tanzimat_reforms: "The Tanzimat"
 tanzimat_reforms_desc: "Law, army, treasury and school have been reorganised, and all subjects declared equal before the law."
 ottoman_old_order: "The Old Order"
 ottoman_old_order_desc: "The ulema and the great families hold the empire in the shape that four centuries have made."
 ottoman_constitution: "The Ottoman Constitution"
 ottoman_constitution_desc: "A written constitution and a parliament have been granted, and the Sultan's power has a limit at last."
 ottoman_absolutism: "Ottoman Absolutism"
 ottoman_absolutism_desc: "The parliament is dissolved and the Sultan governs alone, by decree and by police."
 balkan_retreat: "Retreat in the Balkans"
 balkan_retreat_desc: "One province after another has been lost, and the empire has shrunk towards its heartland."
 empty_treasury: "The Empty Treasury"
 empty_treasury_desc: "The state cannot pay its servants or its soldiers, and it borrows at ruinous rates."
 ottoman_imperial_architect: "The Imperial Architect"
 ottoman_imperial_architect_desc: "His palaces on the Bosphorus join Ottoman form to European engineering, and the empire has an image again."

 # --- Japan ---
 meiji_restoration: "The Meiji Restoration"
 meiji_restoration_desc: "The shogunate is abolished, the Emperor restored, and Japan is being remade from the ground up."
 bakufu_preserved: "The Shogunate Preserved"
 bakufu_preserved_desc: "The old order holds, and the domains keep their privileges and their quarrels."
 iwakura_mission: "The Iwakura Mission"
 iwakura_mission_desc: "Our statesmen and students have toured America and Europe and brought home what can be used."
 leave_asia_join_europe: "Leave Asia, Join Europe"
 leave_asia_join_europe_desc: "Japan will be treated as a European power, and will behave as one."
 preserve_asian_traditions: "Asian Traditions Preserved"
 preserve_asian_traditions_desc: "We will take the machines of the West without taking its soul."
 japanese_imperial_expansion: "Imperial Expansion"
 japanese_imperial_expansion_desc: "Our army and navy are ready, and our neighbours are not."
 ukiyo_e_master_modifier: "A Master of the Floating World"
 ukiyo_e_master_modifier_desc: "His prints of the transient world are exported as packing paper and collected as masterpieces."

 # --- United States ---
 westward_expansion: "Westward Expansion"
 westward_expansion_desc: "Settlers, surveyors and railroads are pushing the frontier across the continent."
 civil_war_and_emancipation: "The Union Preserved"
 civil_war_and_emancipation_desc: "The rebellion is crushed and slavery abolished, and the republic has been made whole by force of arms."
 compromise_of_the_sections: "Compromise of the Sections"
 compromise_of_the_sections_desc: "The quarrel over slavery has been postponed by bargain and concession."
 gilded_age: "The Gilded Age"
 gilded_age_desc: "Railroads, steel and oil have made fortunes such as the world has never seen."
 progressive_era: "The Progressive Era"
 progressive_era_desc: "The trusts are regulated, the cities cleaned and the franchise widened."
 american_overseas_empire: "An Overseas Empire"
 american_overseas_empire_desc: "The republic now holds islands beyond its own seas, and a navy to keep them."
 anti_imperialist_league: "The Anti-Imperialist League"
 anti_imperialist_league_desc: "A republic, its citizens insist, does not govern colonies."
 american_man_of_letters: "An American Voice"
 american_man_of_letters_desc: "His book has given the nation a literature that is neither English nor provincial."
 american_inventor_modifier: "An Inventor"
 american_inventor_modifier_desc: "He has turned invention itself into an industry, and the world is lit by it."
 american_industrial_laboratories: "Industrial Laboratories"
 american_industrial_laboratories_desc: "Corporations now keep laboratories of their own, and invention has become a business."

 # --- Spain ---
 carlist_wars: "The Carlist Wars"
 carlist_wars_desc: "The succession is disputed and the old order has taken up arms for throne and altar."
 disaster_of_1898: "The Disaster of 1898"
 disaster_of_1898_desc: "The last of the old empire has been lost in a single summer, and the nation must find itself anew."
 spanish_restoration_compromise: "The Restoration Compromise"
 spanish_restoration_compromise_desc: "The parties have agreed to alternate in office, and politics has been made peaceful if not honest."
 catalan_modernisme_architect: "The Architect of Barcelona"
 catalan_modernisme_architect_desc: "His buildings seem to grow out of the earth, and the city is being remade before our eyes."

 # --- Portugal ---
 portuguese_constitutional_monarchy: "The Constitutional Monarchy"
 portuguese_constitutional_monarchy_desc: "A charter and a parliament have settled the long quarrel between absolutists and liberals."
 pink_map_plan: "The Pink Map"
 pink_map_plan_desc: "Our explorers have surveyed a belt of Africa from coast to coast, and we mean to claim it."
 portuguese_man_of_letters: "A Poet of Portugal"
 portuguese_man_of_letters_desc: "He writes of saudade and of the vanished greatness of the nation."

 # --- Netherlands ---
 dutch_trade_reorientation: "Trade Reorientation"
 dutch_trade_reorientation_desc: "With the southern provinces gone, the merchants of Amsterdam look to the sea and the Indies."
 dutch_liberal_reform: "Liberal Reform"
 dutch_liberal_reform_desc: "A liberal constitution has been granted, and the chamber has been given real powers."
 cultivation_system: "The Cultivation System"
 cultivation_system_desc: "The Indies are made to grow what Europe will buy, and the profits flow to the treasury."
 ethical_policy: "The Ethical Policy"
 ethical_policy_desc: "The Indies are to be governed for the benefit of the islanders as well as the metropole."
 dutch_master_painter: "A Dutch Painter"
 dutch_master_painter_desc: "He took the light of the polders and made something entirely his own, and sold almost nothing in his lifetime."

 # --- Sweden ---
 swedish_era_of_liberty: "The Era of Liberty"
 swedish_era_of_liberty_desc: "The estates govern, the press is free and the age of royal absolutism is over."
 swedish_scandinavian_union: "Scandinavian Co-operation"
 swedish_scandinavian_union_desc: "The northern kingdoms have drawn closer together, and the peninsula is quieter for it."
 swedish_industrial_breakthrough: "The Industrial Breakthrough"
 swedish_industrial_breakthrough_desc: "Iron ore, timber and engineering have made a small country a modern economy."
 swedish_man_of_letters: "A Swedish Novelist"
 swedish_man_of_letters_desc: "She has turned the provincial town into a stage for the whole human comedy."

 # --- Poland-Lithuania ---
 polish_national_rising: "The National Rising"
 polish_national_rising_desc: "The nation is partitioned but not dead, and it has risen again for its independence."
 organic_work: "Organic Work"
 organic_work_desc: "Schools, banks, railways and cooperatives: the nation is being strengthened from within."
 polish_master_composer: "A Polish Composer"
 polish_master_composer_desc: "He has made the dances of the villages into a national music that all Europe admires."

 # --- Italy ---
 risorgimento_legacy: "The Legacy of the Risorgimento"
 risorgimento_legacy_desc: "The nation is made, and the task now is to make Italians."
 italian_transformismo: "Transformismo"
 italian_transformismo_desc: "Governments are made and unmade by the management of deputies, and the system works after its own fashion."
 italian_southern_question: "The Southern Question"
 italian_southern_question_desc: "The south is poor, its roads bad and its estates worked by landless labourers; the kingdom has inherited a problem."
 italian_brigandage_suppressed: "Brigandage Suppressed"
 italian_brigandage_suppressed_desc: "The bands in the hills have been broken by the army, and the south is quiet if not content."
 italian_master_composer: "An Italian Composer"
 italian_master_composer_desc: "His operas are sung in the streets before the second performance."

 # --- Germany ---
 german_empire_proclaimed: "The Empire Proclaimed"
 german_empire_proclaimed_desc: "A nation of princes, armies and universities has become a single empire."
 german_liberal_empire: "A Liberal Empire"
 german_liberal_empire_desc: "The empire has a parliament with real powers and a press that uses them."
 land_of_poets_and_thinkers: "Land of Poets and Thinkers"
 land_of_poets_and_thinkers_desc: "Our universities are the best in the world and our industry lives by its laboratories."
 german_militarism: "German Militarism"
 german_militarism_desc: "The army is the school of the nation, and the nation is organised as an army."
 weltpolitik: "Weltpolitik"
 weltpolitik_desc: "A fleet, colonies and a place in every negotiation: Germany demands her place in the sun."
 german_continental_policy: "Continental Policy"
 german_continental_policy_desc: "Germany is a continental power, and her strength lies in her army and her diplomacy, not in her fleet."
 german_master_composer: "A German Composer"
 german_master_composer_desc: "His music dramas have transformed what music may be."

 # --- Great Britain ---
 victorian_imperial_zenith: "The Imperial Zenith"
 victorian_imperial_zenith_desc: "A quarter of the world's people and a third of its trade lie under our flag."
 little_england_policy: "Little England"
 little_england_policy_desc: "The empire is a burden and a distraction; the nation's business is at home."
 british_raj: "The British Raj"
 british_raj_desc: "India is governed directly from London, by the crown's own servants and the crown's own army."
 company_rule_preserved: "Company Rule Preserved"
 company_rule_preserved_desc: "The Company still governs India in the crown's name, and it still pays."
 repeal_of_the_corn_laws: "Free Trade"
 repeal_of_the_corn_laws_desc: "Cheap bread for the industrial cities, and the landed interest made to yield."
 protectionist_lobby: "The Protectionist Interest"
 protectionist_lobby_desc: "The landed interest has kept its tariffs, and the countryside its rents."
 british_man_of_letters: "A Victorian Novelist"
 british_man_of_letters_desc: "His novels are published in monthly parts and devoured by every class, and he has made the abuses of the courts and the schools his subject."

 # =========================================================
 # Ming-Qing transition and dynasty stability
 # =========================================================
 qing_queue_decree: "The Queue Decree"
 qing_queue_decree_desc: "Every subject must shave the front of his head and wear the queue, on pain of death."
 qing_queue_deferred: "The Queue Decree Deferred"
 qing_queue_deferred_desc: "The order has been relaxed for the present, and the south is the quieter for it."
 yangzhou_massacre: "The Ten Days of Yangzhou"
 yangzhou_massacre_desc: "The city was made an example, and the literati of the south have not forgotten it."
 yangzhou_pacified: "Yangzhou Pacified"
 yangzhou_pacified_desc: "The city was spared and the scholars won over, and the conquest has a gentler face."
 dashun_leaderless: "The Shun Without a Leader"
 dashun_leaderless_desc: "The rebel emperor is dead, his armies are scattered and the great rising is broken."
 dashun_guerrilla_warfare: "The Shun in the Hills"
 dashun_guerrilla_warfare_desc: "The remnants have taken to the mountains and the roads, and they will not be caught."
 daxi_leaderless: "The Xi Without a Leader"
 daxi_leaderless_desc: "Zhang Xianzhong is dead and his generals are quarrelling over what is left."
 daxi_remnants_alliance: "The Xi Remnants Join the Ming"
 daxi_remnants_alliance_desc: "The surviving armies of the west have allied with the Ming loyalists against the invaders."
 two_princes_slain: "Two Princes Slain"
 two_princes_slain_desc: "Two of the enemy's princely commanders have been killed in a single year, and the loyalist cause has hope."
 northern_expedition: "The Northern Expedition"
 northern_expedition_desc: "A loyalist fleet and army have sailed up the river to invest the old capital."
 maritime_defence: "The Maritime Defence"
 maritime_defence_desc: "The coast is held by fortified ports and a fleet that will not be drawn inland."
 court_in_exile: "The Court in Exile"
 court_in_exile_desc: "The emperor is a fugitive in a foreign land, and the government is a government of tents."
 last_stand_in_yunnan: "The Last Stand in Yunnan"
 last_stand_in_yunnan_desc: "The hills of the south-west are a natural fortress, and the loyalists mean to hold them."
 coastal_evacuation: "The Coastal Evacuation"
 coastal_evacuation_desc: "The coast has been cleared inland and the sea trade forbidden, to starve the islands into submission."
 maritime_trade_opened: "The Sea Trade Opened"
 maritime_trade_opened_desc: "The ports are open again, and the customs houses are busy."
 three_feudatories_rebellion: "The Three Feudatories"
 three_feudatories_rebellion_desc: "The southern feudatories have risen against the throne, and eight years of war lie ahead."
 three_feudatories_leader: "Leader of the Feudatories"
 three_feudatories_leader_desc: "The rebel princes have made common cause and field armies of their own."
 feudatories_appeased: "The Feudatories Appeased"
 feudatories_appeased_desc: "The fiefs have been left in peace for the present, and the princes are content."
 feudatories_abolished: "The Feudatories Abolished"
 feudatories_abolished_desc: "The fiefs have been extinguished and the south is again subject to the throne."
 feudatories_reduced: "The Feudatories Reduced"
 feudatories_reduced_desc: "The princes keep their titles but have lost their teeth."
 conquest_of_taiwan: "The Conquest of Taiwan"
 conquest_of_taiwan_desc: "The island has been brought under the throne, and the last remnant of the old order is ended."
 boxue_hongru_examination: "The Erudite and Learned Examination"
 boxue_hongru_examination_desc: "The surviving scholars of the old dynasty have been summoned, examined and employed."
 literary_inquisition: "The Literary Inquisition"
 literary_inquisition_desc: "Writings are examined for sedition, and the scholars have learned to write with care."

 # =========================================================
 # Age 7 choice advances (pre-existing five)
 # =========================================================
 manage_oversea_territories_advance: "Manage Overseas Territories"
 manage_oversea_territories_advance_desc: "The administration of distant possessions is centralised, and sea communications with them are made cheaper and surer."
 national_debt_advance: "National Debt"
 national_debt_advance_desc: "The state funds its wars by a permanent funded debt, and the bond market becomes a matter of policy."
 overseas_expantion_advance: "Overseas Expansion"
 overseas_expantion_advance_desc: "Our merchants and squadrons reach further across the seas in search of markets and coaling stations."
 overseas_conscription_advance: "Overseas Conscription"
 overseas_conscription_advance_desc: "Recruiting stations abroad bring colonial manpower into the metropolitan army."
 enlistment_manual_advance: "Enlistment Manual"
 enlistment_manual_advance_desc: "A standard drill book and a standard establishment for every regiment of the line."

 # =========================================================

# ===== Previously undefined static modifiers =====
 jiangnan_wealth_modifier: "The Wealth of Jiangnan"
 jiangnan_wealth_modifier_desc: "The silk, tea and salt of the Yangtze delta flow into the treasury, and the merchants of Suzhou and Hangzhou prosper under our protection."
 unified_china_modifier: "China Reunited"
 unified_china_modifier_desc: "The realm is one again. From the Great Wall to the southern seas, a single order governs the Middle Kingdom."
 war_of_three_kingdoms_impact: "The Wars of the Three Kingdoms"
 war_of_three_kingdoms_impact_desc: "Kingdom is set against kingdom, and the Isles are bled white by civil war."
 obstructing_industrialization: "Obstructing Industrialization"
 obstructing_industrialization_desc: "Guild privileges and local monopolies strangle the new manufactures before they can take root."
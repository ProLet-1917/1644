l_english:
 land_of_free_advance: "Land of Freedom"
 land_of_free_advance_desc: "As free people, we call our country the Land of Freedom."
 nation_with_various_groups_of_people_advance: "Nation with various groups of People"
 nation_with_various_groups_of_people_advance_desc: "Although the people who make up our country are diverse in terms of culture and occupation, we collectively refer to them as Cossacks."
 black_land_advance: "Black Land"
 black_land_advance_desc: "The land we govern is mostly black soil, and this type of soil is extremely fertile, which is conducive to our agricultural activities."
 reform_cossack_cavalry: "Reform Cossack Cavalry"
 reform_cossack_cavalry_desc: "The Cossack cavalry was gradually regarded as no longer capable of adapting to the development of the times. We must reform them in order to enable them to rise again in the world."
 unlock_cossack_infantry_advance: "Cossack Infantry"
 unlock_cossack_infantry_advance_desc: "The Cossack infantry was mainly composed of Cossacks. These people might have held various occupations in the past, thus acquiring certain skills and possessing sufficient strength."
 unlock_cossack_cavalry_advance: "Cossack Cavalry"
 unlock_cossack_cavalry_advance_desc: "The Cossack cavalry was mainly composed of Cossacks. These people might have held various occupations in the past, thus acquiring certain skills and possessing sufficient strength."
 improve_herd_organzation_advance: "Improve Herd Management"
 improve_herd_organzation_advance_desc: "We should improve our herd management methods in order to increase its production."
 reform_the_duty_of_herd_organzier_advance: "Reform the Duty of Herd Manager"
 reform_the_duty_of_herd_organzier_advance_desc: "Reforming herd managers to make their responsibilities clearer will bring benefits to the growth of our herds."
 centralize_the_manage_of_herds_advance: "Centralize the manage of Herds"
 centralize_the_manage_of_herds_advance_desc: "Centralized management of herds can bring about fundamental changes and progress."
 modernize_herd_organzation_advance: "Modernize Herd Management"
 modernize_herd_organzation_advance_desc: "Modernizing our herd management methods can increase the productivity of the herds and produce higher-quality herds."
 country_unity_organize_herd_advance: "The Country uniformly manages the Herds"
 country_unity_organize_herd_advance_desc: "Unifying the herds under the state's management will reduce unnecessary losses and enable unified scientific breeding by the state."
 klephts_advance: "The Klephts"
 klephts_advance_desc: "$a_klephts_desc$"
 country_among_the_mountains_advance: "Country among the mountains"
 country_among_the_mountains_advance_desc: "Our country is located on the rugged terrain of the Greek Peninsula, that makes our people have managed to adapt to the presence of high mountains."
 moi_naval_tradition_advance:"Naval tradition"
 moi_naval_tradition_advance_desc: "We have had a standing navy since thousands of years ago, and have successfully guarded our coastline with it over the course of a thousand years."
 moi_military_society_advance: "Military Society"
 moi_military_society_advance_desc: "Our people have received military education since childhood so that they can one day take up arms to defend our homeland."
 moi_oblique_order: "Oblique Order"
 moi_oblique_order_desc: "The oblique order is a military tactic whereby an attacking army focuses its forces to attack a single enemy flank. The first recorded use oblique order was in 371 BC at the Battle of Leuctra."
 moi_spartan_style_training_advance: "Spartan-style training"
 moi_spartan_style_training_advance_desc: "We should follow the example of the Spartan city-state in ancient Greece and train our soldiers with strict regulations and rigorous training methods."
 moi_universal_society_advance: "Universal Society"
 moi_universal_society_advance_desc: "Our society is always filled with various foreign visitors, and our people have long accepted them."
 reformed_klephts_advance: "$a_klephts_2$"
 reformed_klephts_advance_desc: "$a_klephts_2_desc$"

 early_institutionalized_tools: "Standardized Tool Templates"
 early_institutionalized_tools_desc: "A toolmaker fixes the shape and size of the tools they produce, effectively increasing the efficiency of tool production through standardized templates."
 legacy_apprenticeship: "Apprenticeship System"
 legacy_apprenticeship_desc: "Apprentices can work in workshops as junior production staff to assist in the production of goods."
 wooden_lifting_machine: "Wooden Lifting Equipment"
 wooden_lifting_machine_desc: "Lifting equipment built from wooden planks and simple pulleys can effectively lift building materials, accelerating construction speed."
 mercenary_contract: "Mercenary Contract"
 mercenary_contract_desc: "Signing long-term contracts with mercenaries reduces disputes during the hiring period and clearly defines the services or payments due to both parties."
 early_levies_training: "Training Peasants"
 early_levies_training_desc: "A small amount of training for peasants during the off-season can improve their combat ability."
 early_collegiate_system: "Early Collegiate System"
 early_collegiate_system_desc: "Establishing different colleges within a school can increase their research efficiency."
 early_academic_discussion: "Academic Discussion"
 early_academic_discussion_desc: "Discussing research content can reduce unnecessary research losses and increase research efficiency."
 early_monetary_management: "Currency Recoinage"
 early_monetary_management_desc: "Collecting old currencies of different denominations and minting new ones reduces transactional problems and significantly improves trade efficiency."
 discovery_regional_trade_networt: "Simple Regional Trade Network"
 discovery_regional_trade_networt_desc: "Establishing a trade network in small regions can improve local production efficiency and reduce losses due to transportation distances."
 temporary_bureaucratic_institutions: "Temporary Bureaucratic Institutions"
 temporary_bureaucratic_institutions_desc: "A temporary bureaucratic body composed of professionals can improve our governance deficiencies in corresponding issues."
 discovery_collegiate_system: "Improved Collegiate System"
 discovery_collegiate_system_desc: "Specifying the responsibilities of different colleges in a school avoids duplicate research on similar topics, thereby increasing research efficiency."
 standard_mercenary_contract: "Standardized Mercenary Contract"
 standard_mercenary_contract_desc: "Standardizing mercenary contracts improves our hiring efficiency and reduces unnecessary losses."
 discovery_levies_training: "Muster Training"
 discovery_levies_training_desc: "Regularly mustering levied troops for training improves their formation skills and battlefield combat effectiveness, adapting them to modern warfare."
 early_government_administration: "Simple Government Administration"
 early_government_administration_desc: "Establishing simple administrative bodies assists the ruler in governance, enabling timely problem detection and improvement."
 reformation_academic_discussion: "Academic Debate"
 reformation_academic_discussion_desc: "Regular debates to discuss academic problems help avoid erroneous research and inspire better ideas."
 multiple_regional_trade_networt: "Complex Regional Trade Network"
 multiple_regional_trade_networt_desc: "Establishing complex trade networks in small regions improves local production efficiency and reduces losses from transporting goods over long distances."
 reformation_apprenticeship: "Improved Apprenticeship"
 reformation_apprenticeship_desc: "Evaluating apprentices prevents certain problems and improves production efficiency."
 reformation_currency_manage: "Early Currency Management"
 reformation_currency_manage_desc: "Setting up simple institutions to collect old currencies of different denominations and mint new ones reduces transactional problems and significantly improves trade efficiency."
 reformation_bureaucratic_institutions: "Simple Bureaucratic Institutions"
 reformation_bureaucratic_institutions_desc: "Simple but permanent bureaucratic bodies composed of professionals improve our governance deficiencies in corresponding issues."
 reformation_levies_training: "Levied Troops Training"
 reformation_levies_training_desc: "Regularly gathering levied troops to fixed locations for training allows early detection and avoidance of problems during mobilization, while fostering unit cohesion and combat effectiveness."
 reformation_standard_army_training: "Standardized Training Methods"
 reformation_standard_army_training_desc: "Systematically studying and regulating the content and locations of peacetime training for standing armies improves the efficiency and effectiveness of their training."
 early_blast_furnace: "Blast Furnace Ironmaking"
 early_blast_furnace_desc: "Using water power to drive bellows for iron smelting can greatly improve the efficiency of iron production and produce higher quality iron ingots."
 coarse_wollens: "Woolen fabric"
 coarse_wollens_desc: "The combination of carding rather than combing weft wool, and then spinning it on the great wheel rather than with a distaff and spindle, made it possible to make an acceptable coarse woollen. Further, the weft thread was made more quickly and economically."

 power_revolution_advance: "Power Revolution"
 power_revolution_advance_desc: "Transition from traditional muscle, wind, and water power to centralized steam and electricity, enabling unprecedented industrial productivity and urbanization."

 anaesthesia_advance: "Anesthesia"
 anaesthesia_advance_desc: "Use of ether, chloroform, or nitrous oxide to induce unconsciousness during surgery, allowing painless operations and greatly expanding the scope of medical procedures."

 chemotherapy_advance: "Chemotherapy"
 chemotherapy_advance_desc: "Treatment of disease (especially cancer and infections) by chemical compounds. Early breakthroughs included Paul Ehrlich's salvarsan against syphilis, pioneering systemic drug therapy."

 penicillin_advance: "Penicillin"
 penicillin_advance_desc: "First true antibiotic, discovered by Alexander Fleming. It kills bacteria by disrupting cell wall synthesis, revolutionizing treatment of infections and saving countless lives."

 sulfanilamide_advance: "Sulfanilamide"
 sulfanilamide_advance_desc: "First synthetic antibiotic, a sulfa drug. Effective against streptococcal and other bacterial infections; paved the way for modern antimicrobial chemotherapy in the 1930s."

 x-rays_advance: "X-rays"
 x-rays_advance_desc: "High-energy electromagnetic radiation discovered by Röntgen. Enables non-invasive imaging of bones and internal structures, revolutionizing medical diagnosis and later radiotherapy."

 steam_engine_factory_advance: "Steam Engine Factory"
 steam_engine_factory_advance_desc: "Specialized factories mass-producing steam engines. Standardized parts and assembly methods lower costs, making reliable stationary and mobile steam power widely available."

 clean_coal_advance: "Clean Coal"
 clean_coal_advance_desc: "Techniques to wash coal and reduce impurities before burning. Also includes early smoke abatement and improved combustion, lowering urban air pollution and increasing thermal efficiency."

 steel_factory_advance: "Steel Factory"
 steel_factory_advance_desc: "Integrated mills using Bessemer or open-hearth processes to produce steel on a large scale. Supplies affordable structural steel for railways, ships, bridges, and skyscrapers."

 structural_steel_construction_advance: "Structural Steel Construction"
 structural_steel_construction_advance_desc: "Use of steel beams, columns, and riveted connections to build frames for tall buildings and long-span bridges. Enables the first skyscrapers and modern urban architecture."

 ammunition_factory_advance: "Ammunition Factory"
 ammunition_factory_advance_desc: "Industrial facilities for mass-producing cartridges, shells, and propellants using precision machinery. Increases output and consistency, essential for modern warfare."

 artillery_factory_advance: "Artillery Factory"
 artillery_factory_advance_desc: "Dedicated plants for forging and machining large caliber guns, breech mechanisms, and recoil systems. Enables rapid production of rifled breech-loading artillery."

 steel_railroad_advance: "Steel Railroad"
 steel_railroad_advance_desc: "Replacement of iron rails with stronger, more durable steel rails. Allows heavier locomotives and freight trains, longer track life, and cheaper maintenance, expanding rail networks."

 modernize_high_speed_railroad_advance: "High-Speed Railroad"
 modernize_high_speed_railroad_advance_desc: "Upgraded tracks, signaling, and locomotives enabling sustained speeds above 100 km/h. Includes express passenger services and streamlined operations, shrinking travel times."

 bessemer_steel_advance: "Bessemer Process"
 bessemer_steel_advance_desc: "First inexpensive industrial process for mass-producing steel. Blowing air through molten pig iron removes impurities, revolutionizing construction, transportation, and weaponry."

 cordite_advance: "Cordite"
 cordite_advance_desc: "A double-base smokeless propellant made from nitroglycerin, nitrocellulose, and petroleum jelly. Provides consistent thrust, less smoke, and greater range for firearms and artillery."

 open_hearth_furnace_advance: "Open Hearth Furnace"
 open_hearth_furnace_advance_desc: "Steelmaking process using a regenerative furnace to melt scrap and pig iron. Allows better control of chemistry and larger batches than Bessemer, dominant from 1880s to 1950s."

 stainless_steel_advance: "Stainless Steel"
 stainless_steel_advance_desc: "Steel alloy with at least 10.5% chromium, forming a passive oxide layer that resists rust and corrosion. Developed by Brearley in 1913, widely used for cutlery and industrial equipment."

 harvey_steel_advance: "Harvey Steel"
 harvey_steel_advance_desc: "A nickel-steel alloy face-hardened by a carburizing process, used for naval armor. Developed in the 1890s, it provided superior protection against shells."

 electricity_advance: "Electricity"
 electricity_advance_desc: "Harnessing electric power for lighting, motors, and heating. Development of generators, transformers, and distribution networks enables factories, trams, and home lighting."

 electric_rolling_techniques_advance: "Electric Rolling Techniques"
 electric_rolling_techniques_advance_desc: "Use of electric motors to drive rolling mills in steel production. Provides precise speed control, reversing capability, and improved efficiency compared to steam-driven mills."

 electric_arc_furnace_advance: "Electric Arc Furnace"
 electric_arc_furnace_advance_desc: "Furnace that heats scrap metal using an electric arc. Allows production of specialty steels and alloys with precise temperature control, independent of coal."

 high_and_low_pressure_steam_engine_advance: "High and Low Pressure Steam Engine"
 high_and_low_pressure_steam_engine_advance_desc: "Compound engine using steam first at high pressure, then expanding into a low-pressure cylinder. Increases thermal efficiency by up to 30%, saving fuel on ships and mills."

 mobile_engine_advance: "Mobile Engine"
 mobile_engine_advance_desc: "Self-contained, portable steam or internal combustion engine mounted on wheels or skids. Powers threshers, sawmills, and other farm or construction equipment without permanent installation."

 agricultural_harvesting_machinery_advance: "Agricultural Harvesting Machinery"
 agricultural_harvesting_machinery_advance_desc: "Mechanical reapers, binders, and combine harvesters drawn by horses or steam engines. Dramatically reduces labor needed for grain harvest, enabling large-scale farming."

 large_construction_machinery_advance: "Large Construction Machinery"
 large_construction_machinery_advance_desc: "Steam shovels, pile drivers, and cable excavators for digging canals, foundations, and earthworks. Makes major projects like the Panama Canal and railway cuttings feasible."

 modern_paper_factory_advance: "Modern Paper Factory"
 modern_paper_factory_advance_desc: "Integrated mills using wood pulp (sulfite or kraft process) instead of rags. Continuous paper machines (Fourdrinier) produce rolls of paper cheaply, fueling newspapers and books."

 modern_tools_factory_advance: "Modern Tools Factory"
 modern_tools_factory_advance_desc: "Factories producing high-quality hand tools, saws, files, and wrenches using drop forging, precision grinding, and interchangeable parts. Supplies construction and manufacturing."

 modern_cloth_factory_advance: "Modern Cloth Factory"
 modern_cloth_factory_advance_desc: "Mechanized textile mills with automatic looms, ring spinning, and finishing machinery. Uses steam or electric power, vastly increasing fabric output and lowering prices."

 modern_furniture_factory_advance: "Modern Furniture Factory"
 modern_furniture_factory_advance_desc: "Factories mass-producing chairs, tables, and cabinets using sawmills, veneer cutters, and assembly lines. Uses kiln-dried lumber and standardized designs."

 modern_glass_factory_advance: "Modern Glass Factory"
 modern_glass_factory_advance_desc: "Industrial glassmaking with continuous tanks, automatic pressing, and blowing machines. Produces bottles, window glass, and tableware at high speed, reducing cost."

 rubber_using_advance: "Rubber Processing"
 rubber_using_advance_desc: "Vulcanization process (Goodyear, 1839) cross-links natural rubber with sulfur. Produces durable, elastic, heat-resistant material for tires, hoses, and gaskets."

 combustion_engine_advance: "Internal Combustion Engine"
 combustion_engine_advance_desc: "Engine burning fuel (gasoline, diesel, or oil) inside cylinders. Higher efficiency than steam; leads to automobiles, trucks, and later aviation. Key inventions: Otto cycle (1876), Diesel (1893)."

 turbine_engine_advance: "Turbine Engine"
 turbine_engine_advance_desc: "Rotary engine using fluid (steam, gas, or water) to spin blades. Steam turbines by Parsons (1884) revolutionized ship propulsion and electricity generation."

 electrical_power_generation_advance: "Electrical Power Generation"
 electrical_power_generation_advance_desc: "Central stations using steam turbines or water turbines to drive alternators, producing AC power. Enables long-distance transmission and widespread electrification."

 oil_refinery_advance: "Oil Refinery"
 oil_refinery_advance_desc: "Industrial plants that distill crude oil into kerosene, gasoline, lubricants, and fuel oil. Uses fractionating columns and thermal cracking to increase yield of valuable products."

 synthetic_oil_factory_advance: "Synthetic Oil Factory"
 synthetic_oil_factory_advance_desc: "Facilities producing liquid hydrocarbons from coal or natural gas using hydrogenation or Fischer–Tropsch processes. Provides fuel independence for nations lacking crude oil."

 wood_based_synthetic_oil_method_advance: "Wood-Based Synthetic Oil"
 wood_based_synthetic_oil_method_advance_desc: "Early method to produce methanol and oils via destructive distillation of wood (wood pyrolysis) or by reacting wood gas. A precursor to modern coal-to-liquids."

 mechanization_factory_advance: "Mechanized Factory"
 mechanization_factory_advance_desc: "Factory where machines perform most production steps, replacing hand tools. Belts, shafts, and later electric motors drive multiple workstations, raising output per worker."

 mechanical_production_advance: "Mechanical Production"
 mechanical_production_advance_desc: "Systematic use of machine tools (lathes, milling machines, planers) to produce precise, interchangeable metal parts. Foundation of mass production and modern industry."

 assembly_line_advance: "Assembly Line"
 assembly_line_advance_desc: "Production method where product moves sequentially past stationary workers, each adding a part. Pioneered by Ford (1913) for automobiles, drastically reducing assembly time."

 telephone_assembly_advance: "Telephone Assembly"
 telephone_assembly_advance_desc: "Mass production of telephone sets and switchboards using assembly lines and standardized components. Enables rapid expansion of telecommunication networks."

 radio_application_advance: "Radio Applications"
 radio_application_advance_desc: "Practical use of electromagnetic waves for wireless telegraphy (Marconi), then voice and music broadcasting. Leads to ship-to-shore communication, news, and entertainment."

 fertilizer_advance: "Artificial Fertilizer"
 fertilizer_advance_desc: "Industrial production of nitrogenous fertilizers (e.g., sodium nitrate from Chile, later synthetic ammonia via Haber process, 1909). Greatly boosts crop yields, supporting population growth."

 large_scale_farms_advance: "Large-Scale Farms"
 large_scale_farms_advance_desc: "Commercial farms of hundreds or thousands of hectares using machinery, hired labor, and scientific management. Focus on monoculture for export, increasing efficiency."

 ideology_advance: "Modern Ideologies"
 ideology_advance_desc: "Systematic political belief systems (liberalism, conservatism, socialism, nationalism) that mobilize masses, shape institutions, and justify state actions, replacing dynastic legitimacy."

 nationalism_advance: "Nationalism"
 nationalism_advance_desc: "Ideology holding that the nation (shared language, culture, history) is the foundation of political legitimacy. Fuels unification movements (Germany, Italy) and separatist demands."

 manifest_destiny_advance: "Manifest Destiny"
 manifest_destiny_advance_desc: "American belief that the United States is destined to expand across North America. Used to justify territorial acquisitions, displacement of Native peoples, and continental dominance."

 secret_police_advance: "Secret Police"
 secret_police_advance_desc: "State security organs operating in secrecy to monitor, detain, and eliminate political opposition using surveillance, informants, and covert operations (e.g., Okhrana)."

 modern_diplomacy_advance: "Modern Diplomacy"
 modern_diplomacy_advance_desc: "Professional foreign service with embassies, permanent missions, and codified protocols (Congress of Vienna). Includes multilateral conferences, treaties, and international law."

 social_science_advance: "Social Science"
 social_science_advance_desc: "Systematic study of society using empirical methods – economics, sociology, anthropology, political science. Emerges as academic disciplines separate from philosophy."

 modern_education_advance: "Modern Education System"
 modern_education_advance_desc: "State-funded, compulsory primary education for all children, organized secondary schools, and research universities. Creates literate workforce and national identity."

 quality_education_advance: "Quality Education"
 quality_education_advance_desc: "Emphasis on teacher training, standardized curricula, and inspection systems. Improves literacy, numeracy, and scientific knowledge; leads to higher productivity and innovation."

 modern_research_facility_advance: "Modern Research Facility"
 modern_research_facility_advance_desc: "Purpose-built laboratories with advanced instruments (spectrometers, microscopes, test chambers) and dedicated staff for industrial or academic R&D (e.g., GE lab, Kaiser Wilhelm institutes)."

 financial_center_advance: "Financial Center"
 financial_center_advance_desc: "Cities (London, New York, Paris) concentrating banks, stock exchanges, insurance firms, and commodity markets. Provide capital, liquidity, and investment services globally."

 modern_bank_advance: "Modern Commercial Bank"
 modern_bank_advance_desc: "Joint-stock banks offering deposit accounts, loans, check clearing, and foreign exchange. Widens access to credit for businesses and individuals, supporting industrial growth."

 modern_national_bank_advance: "Modern National Bank"
 modern_national_bank_advance_desc: "Central bank (e.g., Bank of England, Bundesbank) managing currency issuance, government debt, and lender-of-last-resort functions. Stabilizes financial system and monetary policy."

 modern_customs_office_advance: "Modern Customs Office"
 modern_customs_office_advance_desc: "Professional customs service with uniform tariffs, classification systems, and inspection procedures. Facilitates international trade and collects import/export duties efficiently."

 central_bank_money_bill_printing_advance: "Central Bank Money Printing"
 central_bank_money_bill_printing_advance_desc: "Monopoly on issuing legal tender banknotes, using anti-counterfeiting technologies (watermarks, engraving). Enables centralized control of money supply and credit."

 investment_banks_advance: "Investment Banks"
 investment_banks_advance_desc: "Financial institutions specializing in underwriting securities, facilitating mergers, and corporate restructuring. Fuel the rise of large industrial corporations and stock markets."

 corporate_governance_advance: "Corporate Governance"
 corporate_governance_advance_desc: "Structures separating ownership (shareholders) from management (directors). Includes boards, accounting standards, and disclosure rules, improving accountability and investor confidence."

 international_exchange_standard_advance: "International Exchange Standard"
 international_exchange_advance_desc: "Gold standard or gold-exchange standard linking major currencies to fixed gold prices. Facilitates stable exchange rates and international trade settlement (late 19th – early 20th century)."

 monior_market_behaviour_advance: "Monitor Market Behavior"
 monior_market_behaviour_advance_desc: "Systematic collection and analysis of price, volume, and trend data. Use of ticker tape, charts, and statistics to anticipate market movements. (Typo 'monior' corrected as 'Monitor')."

 organized_factory_advance: "Organized Factory Management"
 organized_factory_advance_desc: "Scientific management (Taylorism) and systematic layout, production planning, cost accounting, and quality control. Increases efficiency and reduces waste."

 shift_system_advance: "Shift System"
 shift_system_advance_desc: "Organizing work in multiple daily shifts (day, evening, night) to keep factories and services running continuously. Maximizes capital utilization and output."

 citizen_rights_advance: "Citizen Rights"
 citizen_rights_advance_desc: "Legal recognition of individual liberties (speech, assembly, vote) and equality before law. Extended gradually to broader classes, including workers and women."

 organized_sports_advance: "Organized Sports"
 organized_sports_advance_desc: "Codified rules, national associations, leagues, and international competitions (Olympic Games revived 1896). Promotes physical fitness, mass entertainment, and national pride."

 civilian_government_advance: "Civilian Government"
 civilian_government_advance_desc: "Principle that elected or appointed civilian officials control military policy, budgets, and appointments. Reduces risk of military coups and ensures democratic accountability."

 identification_documents_advance: "Identification Documents"
 identification_documents_advance_desc: "Official papers (passports, ID cards, driver's licenses) with photographs, fingerprints, and serial numbers. Enables state control over movement, voting, and eligibility for services."

 camera_advance: "Photography"
 camera_advance_desc: "Portable photographic devices using dry plates, roll film (Kodak, 1888), and handheld designs. Democratizes image-making, enabling journalism, family portraits, and documentation."

 film_advance: "Motion Picture Film"
 film_advance_desc: "Flexible celluloid film strips capturing sequential images. When projected rapidly, creates moving pictures. Basis of cinema, newsreels, and entertainment industry."

 large_cinema: "Movie Palace"
 large_cinema_desc: "Grand theatres built specifically for motion picture exhibition, seating hundreds or thousands. Features high-quality projection, sound (after 1920s), and comfortable seating, making cinema a mass medium."

 political_agitation_advance: "Political Agitation"
 political_agitation_advance_desc: "Systematic use of pamphlets, rallies, posters, and newspapers to mobilize public opinion for or against policies. Key tool for mass movements and revolutionary parties."

 the_theory_on_war_advance: "The Theory of War"
 the_theory_on_war_advance_desc: "Clausewitz's 'On War' (1832) analyzes war as continuation of policy, emphasizing 'fog of war', friction, and decisive battle. Shapes modern military doctrine."

 flexible_firepower_advance: "Flexible Firepower"
 flexible_firepower_advance_desc: "Doctrine emphasizing mobile, rapid-firing artillery and infantry firepower. Uses shrapnel shells, quick-firing guns, and decentralized command to adapt to battlefield conditions."

 field_works_advance: "Entrenchments"
 field_works_advance_desc: "Field fortifications including trenches, rifle pits, and earthworks. Allows defenders to survive heavy artillery and infantry assault, increasing defensive advantage."

 general_staff_organization_advance: "General Staff Organization"
 general_staff_organization_advance_desc: "Permanent body of trained officers planning operations, logistics, intelligence, and mobilization. Pioneered by Prussia, it ensures professional command and rapid deployment."

 enlistment_offices_advance: "Enlistment Offices"
 enlistment_offices_advance_desc: "Systematic recruitment centers for volunteers or conscripts. Conducts medical exams, aptitude tests, and paperwork, enabling mass mobilization of reserves."

 war_propaganda_advance: "War Propaganda"
 war_propaganda_advance_desc: "Government-organized campaigns to shape public opinion, boost recruitment, sell war bonds, and demonize the enemy. Uses posters, films, newspapers, and speeches."

 trench_works_advance: "Complex Systems"
 trench_works_advance_desc: "Elaborate networks of front-line trenches, support trenches, communication trenches, dugouts, and barbed wire. Characteristic of WWI static warfare, providing protection but stalemate."

 trench_infantry_advance: "Trench Infantry Tactics"
 trench_infantry_advance_desc: "Specialized infantry training for trench raids, grenade use, and coordinated attacks with artillery barrages (creeping barrage). Adapts to stalemate conditions."

 siege_artillery_advance: "Heavy Howitzers"
 siege_artillery_advance_desc: "Large-caliber, short-barreled guns firing high-angle shells to destroy fortifications. Examples: German Big Bertha (420 mm) and Austro-Hungarian Mörser."

 early_armor_advance: "Armored Cars"
 early_armor_advance_desc: "Motor vehicles with steel plates and machine guns, used for reconnaissance and infantry support. Predecessor to tanks; first used by British and French in 1914-15."

 modern_armor_advance: "Tanks"
 modern_armor_advance_desc: "Tracked, armored fighting vehicle combining firepower, protection, and mobility. First deployed by British at Somme (1916) to break trench deadlock."

 flamethrower_advance: "Flamethrower"
 flamethrower_advance_desc: "Portable device projecting ignited fuel (oil/gas) up to 20m. Used for clearing trenches and bunkers. Introduced by Germans in 1915, later adopted by all sides."

 skirmish_infantry_advance: "Light Infantry Tactics"
 skirmish_infantry_advance_desc: "Soldiers fighting in open order, using cover and individual marksmanship rather than dense lines. Increases survivability and flexibility on modern battlefield."

 handcranked_machine_gun_advance: "Hand-Cranked Machine Gun"
 handcranked_machine_gun_advance_desc: "Early rapid-fire gun (e.g., Gatling, Nordenfelt) requiring manual cranking to fire multiple barrels. Offers high rate of fire but heavy and crew-dependent."

 automatic_machine_gun_advance: "Automatic Machine Gun"
 automatic_machine_gun_advance_desc: "Recoil or gas-operated machine gun (Maxim, 1884) firing continuously as long as trigger is pressed. Uses cloth or metal belts, revolutionizing infantry firepower."

 military_aviation_advance: "Military Aviation"
 military_aviation_advance_desc: "Use of aircraft for reconnaissance, artillery spotting, bombing, and later air-to-air combat. First significant role in WWI (1914-18)."

 interceptor_advance: "Interceptor Aircraft"
 interceptor_advance_desc: "Fast, high-climb aircraft designed to catch and destroy enemy bombers before they reach targets. Emphasizes speed and powerful armament."

 fighter_advance: "Pursuit Plane"
 fighter_advance_desc: "Light, agile armed aircraft for air superiority. Armed with machine guns (often synchronized to fire through propeller). Evolved from scouts to dedicated dogfighters."

 close_air_supportor_advance: "Close Air Support"
 close_air_supportor_advance_desc: "Aircraft attacking enemy ground forces near friendly troops. Uses bombs, machine guns, and rockets. Developed in late WWI to support infantry offensives."

 bomber_advance: "Bomber Aircraft"
 bomber_advance_desc: "Long-range aircraft designed to drop bombs on strategic targets (factories, cities, railways). Ranges from light tactical bombers to heavy strategic types (e.g., Gotha)."

 iron_made_ships_advance: "Iron-Made Hulls"
 iron_made_ships_advance_desc: "Ship hulls constructed from wrought iron or mild steel instead of wood. Stronger, less susceptible to rot, and allows larger vessel size and better armor."

 ironclad_advance: "Ironclad Warships"
 ironclad_advance_desc: "Steam-powered warship protected by iron or steel armor plates. Evolved from wooden ships with belt armor to turreted designs like HMS Warrior (1860)."

 pre_dreadnoughts_advance: "Pre-Dreadnought Battleships"
 pre_dreadnoughts_advance_desc: "Late 19th-century battleships with mixed-caliber main guns (usually 4 heavy, many medium). Featured steel armor, triple-expansion engines, and turrets."

 early_fire_control_advance: "Early Fire Control"
 early_fire_control_advance_desc: "Basic systems for directing naval gunfire: rangefinders (coincidence or stereoscopic), spotting scopes, and voice tubes to transmit data to turrets."

 dreadnoughts_advance: "Dreadnought Battleships"
 dreadnoughts_advance_desc: "All-big-gun battleship typified by HMS Dreadnought (1906). Uniform main battery (10-12 guns of single caliber), steam turbine propulsion, and heavy belt armor."

 late_dreadnoughts_advance: "Super-Dreadnoughts"
 late_dreadnoughts_advance_desc: "Improved dreadnoughts with larger guns (13.5-15 inch), better armor schemes, and higher speed. Includes the US Standard-type and British Queen Elizabeth class."

 modern_fire_control_advance: "Central Director"
 modern_fire_control_advance_desc: "Centralized fire control using a mechanical computer (rangekeeper) fed by director sights. Allows firing all main guns simultaneously with corrected aim, first used by RN around 1912."

 monitor_advance: "Monitor Warship"
 monitor_advance_desc: "Shallow-draft, slow, heavily armored ship with one or two large turrets. Designed for coastal bombardment and riverine support; revived during US Civil War and WWI."

 destroyer_advance: "Torpedo Boat Destroyer"
 destroyer_advance_desc: "Fast, maneuverable escort vessel armed with guns and torpedoes. Evolved to protect fleets from torpedo boats and later to conduct torpedo attacks itself."

 early_armor_cruiser_advance: "Early Armored Cruiser"
 early_armor_cruiser_advance_desc: "Large cruiser with a protective armored belt and deck, capable of independent raiding or fleet scouting. Predecessor to battlecruisers."

 scout_cruiser_advance: "Scout Cruiser"
 scout_cruiser_advance_desc: "Fast, lightly armored cruiser with high endurance, intended for fleet reconnaissance and screening. Often armed with small-caliber quick-firing guns."

 heavy_cruiser_advance: "Heavy Cruiser"
 heavy_cruiser_advance_desc: "Cruiser with guns of 8-inch (203 mm) caliber, designed after Washington Naval Treaty (1922) to balance firepower and displacement under 10,000 tons."

 self_propelled_torpedoes_advance: "Self-Propelled Torpedoes"
 self_propelled_torpedoes_advance_desc: "Underwater missile with own propulsion (compressed air, then wet-heater engine), gyroscopic steering, and explosive warhead. Invented by Whitehead (1866)."

 torpedo_boat_advance: "Torpedo Boat"
 torpedo_boat_advance_desc: "Small, fast, cheap surface vessel carrying torpedoes. Designed to swarm and sink battleships, forcing development of destroyers as counters."

 modern_transport_advance: "Modern Troop Transport"
 modern_transport_advance_desc: "Steel-hulled, steam-powered ships specialized for carrying soldiers and military cargo. Includes converted passenger liners and purpose-built vessels with berthing and cranes."

 sailor_schools_advance: "Naval Training"
 sailor_schools_advance_desc: "Formal instruction for enlisted sailors in navigation, gunnery, engineering, and seamanship. Improves crew quality and reduces accidents."

 naval_university_advance: "Officer Academies"
 naval_university_advance_desc: "Institutions like Naval War College (Newport) and Royal Naval College (Greenwich) for advanced study of strategy, logistics, and command. Produces professional officers."
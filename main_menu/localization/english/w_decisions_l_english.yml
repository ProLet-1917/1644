 claim_mandate_of_heaven: "Claim Mandate of Heaven"
 claim_mandate_of_heaven_desc: "The Mandate of Heaven has always been regarded as the foundation for the rule of the rulers who governed China. With our possession of the major territory of China, we can now claim the Mandate of Heaven."
 rtr_recreate_middle_kingdom.tt:"[ShowInternationalOrganizationType('middle_kingdom')] will Reborn"
 DECISIONS_TT:"Decision"
 DECISIONS_GROUP_TT:"Decision Group"
 create_general_war_commissariat: "Create General War Commissariat"
 create_general_war_commissariat_desc: "General War Commissariat is a permanent war council, serving as an organization and maintenance body for the army and its logistical support, including the institution responsible for the increase and distribution of military funds. It was established by our rulers to manage all aspects of the army more efficiently."
 reform_sejm_parliament: "Reform the Sejm"
 reform_sejm_parliament_desc: "The widespread corruption within the Sejm has always been the greatest obstacle to our exercise of power. By gradually strengthening our own power, we can now eliminate the corruption in Sejm."
 claim_dominance_over_the_baltic_sea: "Claim Dominance over the Baltic Sea"
 claim_dominance_over_the_baltic_sea_desc: "As $SWE$, our territory is mainly located on both sides of the Baltic Sea. After we unified the lands on both sides of the Baltic Sea, we can now announce our dominance in the Baltic Sea"
 unite_ukranie: "Unite Ukraine"
 unite_ukranie_desc: "As we gained control of the left bank and the right bank of Ukraine,We now can announce the United Ukraine has been formed"
 custom_unite_ukraine:"We will #E Form [GetFormableCountry('UKR').GetName]"
 reform_the_regulars: "Reform the Regulars"
 reform_the_regulars_desc: "With the establishment of a certain number of regulars, we are now able to make improvements to some of these issues."
 declare_golden_age_of_our_country: "Declare Our Golden Age"
 declare_golden_age_of_our_country_desc: "With our recent dominance on the world stage, we can now claim that our golden age has arrived."
 only_once_golden_age_of_our_country_allowed_per_game: "Only allow #L Declare Golden Age #N once per game"
 Reform_tibet_empire: "Reform Tibet Empire"
 Reform_tibet_empire_desc: "After we unified both sides of the Himalayas, we can now follow the ancient Tibetan people and re-establish the [GetFormableCountry('TIB').GetName] Empire and unified the culture."
 Between_the_two_seas: "Between the Two Seas"
 Between_the_two_seas_desc: "As for [GetCountry('RUS').GetName], our country has always lacked suitable coastal areas with sufficient water temperature. We must launch an offensive towards the Baltic Sea and the Black Sea, seize the ports there, and expand our influence at sea."
 Claim_the_third_rome: "Claim the Third Rome"
 Claim_the_third_rome_desc: "As the true successor of Rome, having successfully conquered Rome and New Rome, we can now declare that we will rule as the Third Rome forever."
 Unify_germany: "Unify Germany"
 Unify_germany_desc: "REPLACE_ME"
 ug_improve_local_goverment: "Improve Local Government"
 ug_improve_local_goverment_desc: "REPLACE_ME"
 ug_pru_organized_troops: "Organized Troops"
 ug_pru_organized_troops_desc: "REPLACE_ME"
 Expand_hofburg_palace: "Expand Hofburg Palace"
 Expand_hofburg_palace_desc: "REPLACE_ME"
 promoting_religious_tolerance: "Enact laws promoting Religious Tolerance"
 promoting_religious_tolerance_desc: "Enacting religious tolerance laws can improve the living conditions of our country's non-believers, which will make them more likely to accept other policies of our country and stabilize our society."
 connect_global_trade: "Establish a Global Trade Network"
 connect_global_trade_desc: "As we expanded across various continents, we are now able to establish a series of shipping routes from the east to the west, and from the north to the south. These connections link up our various regions and bring us unparalleled competitive advantages."

 enable_dynamic_territorial_occupation_tt: "REPLACE_ME"

l_english:
 # ===== Qing DHE =====
 dhe_qing_1644.1.title: "The Prince Regent"
 dhe_qing_1644.1.desc: "The realm is won but not yet governed. The young Emperor sits upon a throne he cannot yet fill, and behind him stands the Prince Regent, whose banners broke the rebel armies and opened the passes of the Great Wall. Some at court say the Prince should be given the whole conduct of the state; others whisper that a throne lent is a throne lost."
 dhe_qing_1644.1.historical_info: "Dorgon (1612-1650) ruled as Prince Regent for the Shunzhi Emperor from 1643 until his death, and was the architect of the Qing conquest of China."
 dhe_qing_1644.1.a: "Let the Prince Regent govern in the Emperor's name."
 dhe_qing_1644.1.b: "The Emperor shall rule, and the Prince shall serve."
 dhe_qing_1644.2.title: "The Enclosure Edict"
 dhe_qing_1644.2.desc: "The bannermen who followed us through the pass have no lands of their own. The court proposes to set aside the fields about the capital for them, and to drive out the husbandmen who hold them. It is an old custom of conquest, and a cruel one."
 dhe_qing_1644.2.historical_info: "The enclosure edicts of 1644-1669 seized large tracts of farmland around Beijing for the Eight Banners, displacing hundreds of thousands of peasants."
 dhe_qing_1644.2.a: "The banners must be settled. Enclose the lands."
 dhe_qing_1644.2.b: "The fields belong to those who till them."
 dhe_qing_1644.3.title: "The Tonsure Order"
 dhe_qing_1644.3.desc: "A decree is proposed requiring every man to shave the front of the head and wear the queue, so that all may be seen at a glance to be the Emperor's subjects. The southern cities have already answered such rumours with riot."
 dhe_qing_1644.3.historical_info: "The tonsure order of 1645 provoked widespread resistance, most famously in the defence of Jiangyin and Jiading, and was later relaxed to the three-day shave."
 dhe_qing_1644.3.a: "Enforce the order. One realm, one head."
 dhe_qing_1644.3.b: "Proclaim it, but do not hunt those who refuse."
 dhe_qing_1644.4.title: "The Emperor Assumes the Government"
 dhe_qing_1644.4.desc: "The years of regency are over. The Emperor is of age, the offices have been confirmed, and the great seal is placed in his own hand. From this day the decrees of the empire issue from one will alone."
 dhe_qing_1644.4.historical_info: "The Shunzhi Emperor took personal control of government in 1651, after the death of Dorgon."
 dhe_qing_1644.4.a: "The Emperor governs in his own right."
 dhe_qing_1644.5.title: "Albazin and the Northern Boundary"
 dhe_qing_1644.5.desc: "Cossack settlers have built a fort on the Amur, and the native tribes who pay us tribute complain of their raids. The envoys of the Tsar are far away and slow to answer, and the season for campaigning is short."
 dhe_qing_1644.5.historical_info: "The Qing besieged the Russian fort at Albazin in 1685 and 1686; the Treaty of Nerchinsk (1689) fixed the frontier along the Amur basin."
 dhe_qing_1644.5.a: "Reduce the fort and negotiate from strength."
 dhe_qing_1644.5.b: "Draw a boundary and leave the north in peace."
 dhe_qing_1644.6.title: "The Assembly at Dolon Nor"
 dhe_qing_1644.6.desc: "The Khalkha princes have come to Dolon Nor to do homage, driven to us by the raids of the Dzungars. The Emperor will dine among them under the great tent, and settle them in banners after our own fashion."
 dhe_qing_1644.6.historical_info: "The Dolon Nor assembly of 1691 formally incorporated the Khalkha Mongol nobility into the Qing banner system."
 dhe_qing_1644.6.a: "Receive their homage and give them the banners."
 dhe_qing_1644.6.b: "Let their princes keep their own tribes — and their quarrels."

 # ===== Shun DHE =====
 dhe_shun_1644.1.title: "Land to the Tillers"
 dhe_shun_1644.1.desc: "Our armies were raised on a promise: the land to those who plough it, and no tax for three years. Now the tax rolls of the fallen dynasty are in our hands, and the treasury is empty. The promise is a heavy thing to keep."
 dhe_shun_1644.1.historical_info: "Li Zicheng's slogan 'equal fields, remitted taxes' (均田免赋) won the peasantry of the north to his cause in 1643-1644."
 dhe_shun_1644.1.a: "We keep the promise. Three years without tax."
 dhe_shun_1644.1.b: "The army must eat first. Levy the grain."
 dhe_shun_1644.2.title: "Exacting the Officials"
 dhe_shun_1644.2.desc: "The mandarins of the Ming have hidden their silver in cellars and send it to relatives in the villages. Our captains propose to put them to the question until they yield it — the method they call 'assisting the army'."
 dhe_shun_1644.2.historical_info: "The 'zhui zang zhu xiang' (追赃助饷) campaign of 1644 tortured former Ming officials for their wealth, alienating the gentry of north China."
 dhe_shun_1644.2.a: "Put them to the question. The army must be paid."
 dhe_shun_1644.2.b: "Stop. We need the scholars more than their silver."
 dhe_shun_1644.3.title: "The Death of the King"
 dhe_shun_1644.3.desc: "The King has been killed in the hills of Huguang, cut down by village militia while foraging with a handful of men. The army does not know, and the court dares not tell it."
 dhe_shun_1644.3.historical_info: "Li Zicheng died in 1645, killed by local militia in the mountains of Hubei while scouting for food."
 dhe_shun_1644.3.a: "Keep it secret, and let his name hold the army together."
 dhe_shun_1644.3.b: "Proclaim his death and raise a new leader."
 dhe_shun_1644.4.title: "The Thirteen Families of Kuidong"
 dhe_shun_1644.4.desc: "In the mountains between Sichuan and Huguang, our remaining brigades hold passes that no army can turn. They have taken to farming the valleys and fighting in the passes, and they will not be dislodged in a year or in ten."
 dhe_shun_1644.4.historical_info: "The 'Thirteen Families of Kuidong' held out in the mountains of the Sichuan-Hubei border against the Qing until 1664."
 dhe_shun_1644.4.a: "Hold the passes and till the valleys. We can wait."
 dhe_shun_1644.4.b: "Treat with the enemy. Better a living than a dead loyalist."
 dhe_shun_1644.5.title: "The Camp Enters Huguang"
 dhe_shun_1644.5.desc: "The survivors of the old army have come down into Huguang under their own banners, and the officers of the Ming court in the south have sent envoys to propose a joint front. They call us brothers; their letters call us rebels."
 dhe_shun_1644.5.historical_info: "The remnant armies of the Shun, chief among them the Zhongzhen Camp (忠贞营), fought alongside the Southern Ming against the Qing from 1647."
 dhe_shun_1644.5.a: "Answer the Ming. Let us fight the Manchus together."
 dhe_shun_1644.5.b: "We will keep our own command and our own quarrel."

 # ===== Ming DHE =====
 dhe_ming_1644.1.title: "The Court at Nanjing"
 dhe_ming_1644.1.desc: "The northern capital has fallen and the Emperor is dead. The ministers who escaped have gathered at Nanjing with the seals of office, and they must set a prince upon the throne before the news spreads further than it already has."
 dhe_ming_1644.1.historical_info: "The Hongguang Emperor was enthroned at Nanjing in June 1644, beginning the Southern Ming."
 dhe_ming_1644.1.a: "Enthrone the prince and summon the realm to the standard."
 dhe_ming_1644.1.b: "Secure the south first. The restoration can wait a season."
 dhe_ming_1644.2.title: "The Four Garrisons"
 dhe_ming_1644.2.desc: "The defence of the Yangtze rests on four commanders and their private armies, who hold their districts as their own domains and answer the court when it suits them. They have saved the south, and they know it."
 dhe_ming_1644.2.historical_info: "The Four Garrisons of Jiangbei (江北四镇) were semi-independent military commands that dominated the Hongguang court and fatally weakened its authority."
 dhe_ming_1644.2.a: "Lean upon the four garrisons. Let them guard the river."
 dhe_ming_1644.2.b: "Break their armies and restore the authority of the court."
 dhe_ming_1644.3.title: "The Army Marches East"
 dhe_ming_1644.3.desc: "General Zuo, who commands the upper Yangtze, has turned his army downstream and declares he marches to 'clear the court of traitors'. Whether he means to save the dynasty or to rule it, no one in Nanjing can say."
 dhe_ming_1644.3.historical_info: "Zuo Liangyu's eastward march on Nanjing in 1645 was aimed at the faction of Ma Shiying, and its collapse left the Yangtze undefended against the Qing."
 dhe_ming_1644.3.a: "Order him back to his post, on pain of treason."
 dhe_ming_1644.3.b: "Call him east and give him a place at court."
 dhe_ming_1644.4.title: "Eighty-One Days"
 dhe_ming_1644.4.desc: "A county town on the Yangtze has shut its gates against the tonsure order and holds out under its own magistrates. The siege has lasted weeks, and the whole province is watching to see whether the people of a single town can defy an empire."
 dhe_ming_1644.4.historical_info: "Jiangyin held out for eighty-one days in 1645 against the Qing army, becoming a byword for Ming loyalist resistance."
 dhe_ming_1644.4.a: "Honour them before all the realm. Let every town know."
 dhe_ming_1644.4.b: "Send what help we can, and no more."
 dhe_ming_1644.5.title: "The Lord of the Seas"
 dhe_ming_1644.5.desc: "The Zheng family holds the coast from Xiamen to the straits with a fleet that no power in the south can match, and their son has taken the surname of the imperial house. He asks for commissions, and for the freedom to take the great island from the Dutch."
 dhe_ming_1644.5.historical_info: "Zheng Chenggong (Koxinga, 1624-1662) drove the Dutch from Taiwan in 1662 and made it the base of Ming loyalist resistance."
 dhe_ming_1644.5.a: "Give him the commission. Let him take Taiwan."
 dhe_ming_1644.5.b: "Let him hold the mainland coast; the island can wait."
 dhe_ming_1644.6.title: "The Court in Exile"
 dhe_ming_1644.6.desc: "The last court has been driven from Yunnan into the hills of Burma, and its ministers are scattered or dead. The generals of the old Western army still hold the border districts, and they ask what is to be done."
 dhe_ming_1644.6.historical_info: "The Yongli Emperor fled into Burma in 1659; he was handed over to the Qing and executed at Kunming in 1662, ending the Southern Ming."
 dhe_ming_1644.6.a: "Follow the court into exile."
 dhe_ming_1644.6.b: "Stand in the west with the army. The dynasty is not a place."

 # ===== Xi DHE =====
 dhe_xi_1644.1.title: "The Throne in Chengdu"
 dhe_xi_1644.1.desc: "All Sichuan is ours. The officers have raised a great hall in Chengdu and ask that we take the imperial title, so that the court may be furnished with the proper offices and the army with the proper ranks."
 dhe_xi_1644.1.historical_info: "Zhang Xianzhong proclaimed himself Emperor of the Great Xi in Chengdu in late 1644."
 dhe_xi_1644.1.a: "Take the imperial title. The Great Xi is proclaimed."
 dhe_xi_1644.1.b: "Let us be kings, and keep the army in the field."
 dhe_xi_1644.2.title: "The Stele of Seven Kills"
 dhe_xi_1644.2.desc: "A monument has been raised in the city bearing the words 'Heaven brings forth all things for men; men have nothing to give back to Heaven — kill, kill, kill, kill, kill, kill, kill.' The generals say the people must be taught what resistance costs."
 dhe_xi_1644.2.a: "Let it stand. Let them read and fear."
 dhe_xi_1644.2.b: "Pull it down. We need the province to feed the army."
 dhe_xi_1644.3.title: "The Silver of the River"
 dhe_xi_1644.3.desc: "Barges carrying the wealth of the province have gone down in the shallows at Jiangkou, and the fishermen know where the wrecks lie. The army asks whether it may dredge the river bed."
 dhe_xi_1644.3.a: "Dredge the river. Every ounce of it."
 dhe_xi_1644.3.b: "Leave the dead and their silver in the water."
 dhe_xi_1644.4.title: "The Western Army and the Ming"
 dhe_xi_1644.4.desc: "The remaining brigades have carried their standards south, where the last Ming court still holds a corner of the realm. The generals propose to take the Ming side, to bury old quarrels and fight the Manchus together."
 dhe_xi_1644.4.a: "Swallow the quarrel. The Ming and the West fight together."
 dhe_xi_1644.4.b: "We fight our own war, in our own province."
 dhe_xi_1644.5.title: "The Death of the Emperor of the West"
 dhe_xi_1644.5.desc: "He was killed at Xichong by a stray arrow, riding out with a few men to look over the ground. The four generals who command the army have sworn to keep it secret until the succession is settled."
 dhe_xi_1644.5.historical_info: "Zhang Xianzhong was killed by a Qing arrow at Xichong in January 1647; his four generals then took his army south and joined the Ming."
 dhe_xi_1644.5.a: "Keep it secret. The four generals will hold the army together."
 dhe_xi_1644.5.b: "Proclaim the death, and withdraw to Yunnan and Guizhou."

 # ===== New static modifiers =====
 qing_dorgon_regency: "The Prince Regent's Government"
 qing_dorgon_regency_desc: "The Prince Regent conducts the government in the Emperor's name, and the offices of the realm answer to his seal."
 qing_tonsure_order: "The Tonsure Order Enforced"
 qing_tonsure_order_desc: "Every man must shave the front of his head and wear the queue, and the orders are enforced by the army."
 shun_leadership_crisis: "Leaderless Bands"
 shun_leadership_crisis_desc: "The King is dead and his captains answer to no one; the army is held together by plunder and habit."
 xi_four_generals: "The Four Generals"
 xi_four_generals_desc: "The four generals who commanded the Western army divide the government and the land between them."

# ===== Xi DHE missing historical notes =====
 dhe_xi_1644.2.historical_info: "The 'Seven Kill Stele' said to have been raised by Zhang Xianzhong in Chengdu is recorded in later sources, though its authenticity is disputed; it became the emblem of the massacres attributed to his rule in Sichuan."
 dhe_xi_1644.3.historical_info: "Zhang Xianzhong's treasure fleet was sunk at Jiangkou in 1646; large quantities of silver were recovered from the river bed by archaeologists from 2017 onwards."
 dhe_xi_1644.4.historical_info: "After Zhang Xianzhong's death his four generals — Sun Kewang, Li Dingguo, Liu Wenxiu and Ai Nengqi — led the Western army south and allied with the Southern Ming against the Qing."
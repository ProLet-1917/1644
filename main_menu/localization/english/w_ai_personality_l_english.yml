l_english:
 ai_unifier: "Unifier"
 ai_unifier_desc: "This country will dedicate itself to unifying a specific region and will spare no effort in pursuit of this goal."
 ai_globalism: "Globalism"
 ai_globalism_desc: "This country will dedicate itself to conquering neighboring nations while simultaneously seeking possible expansion overseas."
 ai_commercialist: "Commercialist"
 ai_commercialist_desc: "This country's primary policies are influenced by merchants, and it will increasingly seek opportunities for trade and profit, pursuing commercial expansion rather than adopting a path of military expansion."
 ai_interior: "Interior"
 ai_interior_desc: "This country believes that establishing a stable society, maintaining the government's legitimacy, and improving relations among the various social strata are the cornerstones of governance and the guarantee of the nation's continuity."
 ai_adventurous: "Adventurous"
 ai_adventurous_desc: "This country firmly believes that only through calculated and daring ventures, defeating those nations that appear powerful but are hollow in substance, can it carve out its own place in the world."
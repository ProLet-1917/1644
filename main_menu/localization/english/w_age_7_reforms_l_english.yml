l_english:
 # ===== Age 7 government reforms (unlock automatically when the age begins) =====
 # --- Common ---
 modern_civil_service_reform: "Modern Civil Service"
 modern_civil_service_reform_desc: "A salaried, examination-tested bureaucracy replaces the patronage networks of the past. Officials answer to the state, not to a faction."
 general_staff_reform: "General Staff"
 general_staff_reform_desc: "A permanent body of staff officers plans mobilisation, logistics and campaigns in peacetime, so that the army may act as one instrument in war."
 public_welfare_reform: "Public Welfare"
 public_welfare_reform_desc: "The state now accepts a duty towards the poor, the sick and the old. Relief is cheaper than revolution."
 state_education_reform: "State Education"
 state_education_reform_desc: "Schools are built and teachers paid by the state, so that every subject may read, count and be useful to the nation."
 industrial_mobilization_reform: "Industrial Mobilisation"
 industrial_mobilization_reform_desc: "Forges, mills and machine shops are organised so that the country can be armed and supplied from its own soil."
 central_banking_reform: "Central Banking"
 central_banking_reform_desc: "A single bank of issue, backed by the state, manages the currency, discounts bills and lends in time of war."

 # --- Monarchy ---
 constitutional_monarchy_reform: "Constitutional Monarchy"
 constitutional_monarchy_reform_desc: "The crown reigns but does not govern. Ministers answer to an elected chamber, and the sovereign is the nation's living emblem."
 royal_army_reform: "Royal Army"
 royal_army_reform_desc: "A standing army of long-service regulars, drilled, barracked and paid by the crown, replaces the levies of the past."
 imperial_court_reform: "Imperial Court"
 imperial_court_reform_desc: "The court becomes the great stage of the nation: ambassadors, artists and officers all play their parts before the throne."

 # --- Republic ---
 republican_constitution_reform: "Republican Constitution"
 republican_constitution_reform_desc: "A written constitution defines the powers of the state, the rights of citizens, and the limits of the magistrate."
 parliamentary_government_reform: "Parliamentary Government"
 parliamentary_government_reform_desc: "The chamber that commands a majority forms the government. The cabinet governs, the assembly legislates, the courts judge."
 presidential_republic_reform: "Presidential Republic"
 presidential_republic_reform_desc: "A single elected magistrate, independent of the assembly, holds the executive power for a fixed term."

 # --- Theocracy ---
 theocratic_constitution_reform: "Theocratic Constitution"
 theocratic_constitution_reform_desc: "The sacred law is codified and a council of the faithful shares in the government of the realm."
 social_gospel_reform: "Social Gospel"
 social_gospel_reform_desc: "The church takes up the cause of the working poor, founding hospitals, schools and charities in every quarter."

 # --- Tribe ---
 tribal_confederation_reform: "Tribal Confederation"
 tribal_confederation_reform_desc: "The tribes bind themselves together by a common council and a common war-leader, without surrendering their own customs."
 tribal_modernization_reform: "Tribal Modernisation"
 tribal_modernization_reform_desc: "Schools, workshops and written law are adopted from the settled peoples, that the tribe may survive in a new age."

 # --- Steppe Horde ---
 horde_modernization_reform: "Horde Modernisation"
 horde_modernization_reform_desc: "The khanate adopts the settled arts of administration, literacy and manufacture while keeping the horse at its heart."
 banner_modernization_reform: "Banner Reform"
 banner_modernization_reform_desc: "The warriors of the horde are enrolled in hereditary banners, each with its own lands, officers and roll."

 # ===== 0.5 reforms (colonial) =====
 colonial_government_reform: "Colonial Government"
 colonial_government_reform_desc: "The colony is given a government of its own: a charter, a legislature, and a claim to be governed for its own benefit as well as the mother country's. It is the foundation on which all our further colonial advances rest."

 thirty_years_war: "Thirty Years War"
 thirty_years_war_desc: "After several decades of religious strife, dissent over the correct practice of [ShowReligionGroupAdjective('christian')] worship in the [GetInternationalOrganization('hre').GetName] has reached a point where armed conflict between the [GetInternationalOrganizationType('protestant_union').GetName] and [GetInternationalOrganizationType('catholic_league').GetName] seems impossible to avoid. While these organizations of Imperial princes are mainly concerned with the protection of their respective faiths, many leaders in [ShowContinentName('europe')] look at the turbulent Empire with greedy eyes. Whether it be charged with religious fervor or worldly desire, the mightiest powers of [ShowContinentNameWithNoTooltip('europe')] are preparing their armies for a fight, as the peace of the Empire hangs in a delicate balance.The war has been going on for over twenty years, and it seems that it will continue."

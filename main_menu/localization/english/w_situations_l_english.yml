 the_deluge: "The Deluge"
 the_deluge_desc: "Since the mid-17th century, internal conflicts in [GetCountry('PLC').GetName] have gradually erupted. As the [GetCountry('PLC').GetName] gradually weakened its military power against external powers, the inefficiency and corruption of the internal Sejm, as well as the serfs who were oppressed by the nobility, were weakening the country.Now, with the internal rebellion, the external enemies are becoming aware of [GetCountry('PLC').GetName]'s weakness and may invade at any time.This era is what we called - the Deluge."

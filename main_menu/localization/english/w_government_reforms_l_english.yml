l_english:
 cossack_hetmanate_reform: "Hetmanate Government"
 cossack_hetmanate_reform_desc: "The government of Hetman was one led by Hetman himself. Hetman was mainly elected into office."
 landless_adventurer_reform: "Landless Adventurer"
 landless_adventurer_reform_desc: "Adventurers can usually consist of a wide variety of people, ranging from nobles who have lost their territories to explorers, those who aim to conquer their own lands, or various bandits."
 an_army_owned_country: "A country owned by Army"
 an_army_owned_country_desc: "Prussia was usually referred to as a country "owned by the army" due to its unique status as an army state."
 rebuild_the_theme_system: "Rebuilt the Theme System"
 rebuild_the_theme_system_desc: "A system of provincial headquarters and armies, spearheaded by a strategos with dual responsibilities to protect the locals and establish authority at the behest of the [GetCountry('MOI').GetFlavorRank]. This system replaced the provincial administration of Diocletian and has served our people ever since."
 diverse_society: "Diverse Society"
 diverse_society_desc: "The diversity of our society can effectively attract people from other regions who are suffering oppression to migrate to our territory, which will bring us a larger population."
 klephts_society: "Klephts Society"
 klephts_society_desc: "The Klephts constitute an important part of our country. They protect our land and maintain the independence of our nation."

 moi_protect_klephts_right: "Protect Klephts Right"
 moi_protect_klephts_right_desc: "Klephts as our guerrilla fighters in the fight against the enemy's invasion, we will protect every Klephts who arrives in our country and grant them special status."

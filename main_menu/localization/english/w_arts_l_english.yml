 klephtic_songs: "Klephtic Songs"
 klephtic_songs_desc: "Klephtic songs, or ballads, were developed in mainland Greece.They are part of the Greek folk music genre, which includes folk poetry, and are thematically oriented on either the achievements and death of a single klepht or the generic life of the klephts as a group."
l_english:
 flavor_cxi.1.title: "Emperor of the Great Xi"
 flavor_cxi.1.desc: "Chengdu is firmly in our hands. Zhang Xianzhong's successors can now claim the imperial title and found a dynasty of the Great Xi."
 flavor_cxi.1.a: "Proclaim the empire"
 flavor_cxi.1.b: "The time is not yet ripe"
 flavor_cxi.1.entry: "$flavor_cxi.1.title$"
 flavor_cxi.2.title: "Ally with the Ming against the Qing"
 flavor_cxi.2.desc: "The Qing press south while the Ming court still holds out. Some among us argue that the bandit and the remnant Ming should fight the invader together."
 flavor_cxi.2.historical_info: "After Zhang Xianzhong's death, Sun Kewang and Li Dingguo turned the Great Xi remnants toward an alliance with the Yongli court, fighting the Qing in the southwest under the Ming banner."
 flavor_cxi.2.a: "Join forces with the Ming"
 flavor_cxi.2.b: "We claim the Mandate ourselves"
 flavor_cxi.2.entry: "$flavor_cxi.2.title$"
 flavor_cxi.3.title: "Move the Court to Kunming"
 flavor_cxi.3.desc: "Chengdu is no longer secure. Kunming, astride the roads of Yunnan, can serve as a new seat of power."
 flavor_cxi.3.historical_info: "The Great Xi remnants and later the Yongli court both used Kunming as a refuge after losing the Sichuan basin, drawing on Yunnan's depth to continue the war."
 flavor_cxi.3.a: "Establish the court at Kunming"
 flavor_cxi.3.b: "Hold our present capital"
 flavor_cxi.3.entry: "$flavor_cxi.3.title$"

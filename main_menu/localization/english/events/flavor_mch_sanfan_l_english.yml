l_english:
 flavor_mch.20.title: "Revolt of the Three Feudatories"
 flavor_mch.20.desc: "Wu Sangui and the other feudatory princes have grown too powerful in the south. If we move to cut them down, they may raise the standard of rebellion; if we do nothing, they will become another dynasty in all but name."
 flavor_mch.20.historical_info: "In 1673 the Qing court ordered the feudatories to be abolished. Wu Sangui rose in Yunnan, followed by Shang and Geng, plunging the south into an eight-year war before the Qing restored control."
 flavor_mch.20.a: "Abolish the feudatories"
 flavor_mch.20.b: "Delay, and buy their loyalty"
 flavor_mch.20.entry: "$flavor_mch.20.title$"
 sanfan_rebellion_tt: "Wu Sangui will take up arms against us."

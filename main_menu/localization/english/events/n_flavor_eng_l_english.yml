l_english:
 flavor_eng.1.title: "Restore the Monarchy"
 flavor_eng.1.desc: "Years of experimentation with a parliamentary republican system have wrought great havoc upon our nation. All signs now indicate that we should perhaps return to the old ways and welcome back a monarch to lead our great country."
 flavor_eng.1.historical_info: "After the death of the Lord Protector Oliver Cromwell, his son Richard Cromwell succeeded him as Lord Protector, but he lacked authority. He attempted to mediate between the army and civil society, but all peaceful mediations failed. The army subsequently assembled at St James's Palace, and Cromwell ultimately yielded to their demands. On 25 May 1659, Cromwell submitted a formal letter resigning the office of Lord Protector. Thereafter, under the leadership of General George Monck, the monarchy was restored. In May 1660, Charles II returned from exile to England and was subsequently crowned King at Westminster Abbey on 23 April 1661."
 flavor_eng.1.a: "We shall welcome back the heir of Charles I"
 flavor_eng.1.b: "We should choose the King of Scotland"
 flavor_eng.1.c: "We should crown the current leader as King"
 flavor_eng.1.d: "Parliament and the Republic shall continue"
 flavor_eng.1.entry: "$flavor_eng.1.title$"
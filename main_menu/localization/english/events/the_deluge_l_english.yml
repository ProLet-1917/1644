l_english:
 the_deluge.1.t: "[GetCountry('ZAZ').GetName] request we join their war against [GetCountry('PLC').GetName]"
 the_deluge.2.t: "Message from [GetCountry('CRI').GetName]"
 the_deluge.3.t: "Message from [GetCountry('CRI').GetName]"
 the_deluge.4.t: "A message from [GetCountry('PRU').GetName]"
 the_deluge.5.t: "The weakness of [GetCountry('PLC').GetName]"
 the_deluge.6.t: "the Intervention Force"
 the_deluge.7.t: "Message from warsaw - Prussia for Army"
 the_deluge.8.t: "A help from our friend"
 the_deluge.1.a: "We accept."
 the_deluge.1.b: "We refuse!"
 the_deluge.1.desc: "Our northern neighbors, the Cossacks, under the leadership of Hemelynitsky, are advancing northward, determined to fight for the injustice he has suffered in the federation. They have sent messengers to ask if we would join their side."
 the_deluge.2.a: "Welcome!"
 the_deluge.2.desc: "The messenger who went to Crimea has recently brought back the good news that they will join our side."
 the_deluge.3.a: "They are too weak."
 the_deluge.3.desc: "The messenger who went to Crimea has recently brought back the bad news that they will not help us."
 the_deluge.4.a: "We accept,but they should send us a troop to help us on battle."
 the_deluge.4.b: "We refuse,Prussia must under Commonwealth rule."
 the_deluge.4.c: "We have to accept,but they must stay in current war."
 the_deluge.4.desc: "The messenger from Prussia brought a treaty, and the content of the treaty was that we were required to recognize the independence of them."
 the_deluge.5.a: "No!"
 the_deluge.5.desc: "The federation has become so weak that it can no longer hide the blatant disorder. Our military is inefficient and corrupt, and our people are also subjected to the tyranny of the nobility. With the invasion of foreign enemies, our future is precarious."
 the_deluge.6.a: "Time to leave the home."
 the_deluge.6.b: "I will lead them!"
 the_deluge.6.desc: "We have dispatched an intervention force to other countries to assist them in achieving victory on the battlefield."
 the_deluge.7.a: "We accept."
 the_deluge.7.b: "No."
 the_deluge.7.desc: "The messenger we sent to Warsaw brought the demands of the Poles. They asked us to provide an army in exchange for their recognition."
 the_deluge.8.a: "Welcome."
 the_deluge.8.desc: "A foreign country has currently dispatched an intervention force to our country to assist us in fighting against our enemies."
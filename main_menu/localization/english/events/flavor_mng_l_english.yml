l_english:
 flavor_mng.1.title: "Hongguang Emperor"
 flavor_mng.1.desc: "The northern capital [ShowLocationName('dadu')] has fallen to the rebels. The late emperor has perished amidst the chaos of battle, but the realm cannot be without a sovereign for a single day. We have already enthroned a new monarch in the southern capital. We are determined to reclaim our mountains and rivers and restore the nation."
 flavor_mng.1.historical_info: "In 1644, after Li Zicheng captured Beijing, the officials in Nanjing enthroned Zhu Yousong as emperor, adopting the reign title 'Hongguang' and pursuing a 'borrow the Manchus to suppress the bandits' policy, aiming to ally with the Qing forces to destroy the peasant armies. However, intense factional strife led to corrupt governance and lax military preparations. After Shi Kefa held Yangzhou to the death and perished, the Qing army breached the Yangtze defense line, and Nanjing's defending generals, including Zhao Zhilong and Qian Qianyi, opened the gates and surrendered, bringing the Hongguang regime to an end."
 flavor_mng.1.a: "Rebuild the Court"
 flavor_mng.1.entry: "$flavor_mng.1.title$"
 emperor_in_nanjing: "Should Nanjing fall, uncontrollable consequences will occur."
 flavor_mng.2.title: "Loss of Nanjing"
 flavor_mng.2.desc: "[ShowLocationName('shangyuan')] has fallen to the rebels. The emperor has recently left Nanjing to seek temporary refuge in the south, and voices everywhere are questioning whether we can still govern."
 flavor_mng.2.a: "The Hongguang Emperor has been captured by the enemy"
 flavor_mng.2.b: "The Hongguang Emperor flees south"
 flavor_mng.2.entry: "$flavor_mng.2.title$"
 lost_nanjing: "Nanjing has been lost. The consequences will gradually manifest over the coming months."
 flavor_mng.3.title: "Longwu Emperor"
 flavor_mng.3.desc: "With the support of the clique led by Zheng Zhilong, Zhu Yujian, as a member of the imperial family, has proclaimed himself emperor at [ShowLocationName('minxian')]. We are determined to reclaim our mountains and rivers and restore the nation."
 flavor_mng.3.historical_info: "After the collapse of the Hongguang regime, Zhu Yujian, the Longwu Emperor, was enthroned by Zheng Zhilong and others in the intercalary sixth month of 1645 in Fuzhou, adopting the reign title 'Longwu'. During his reign, he vigorously reformed the bureaucracy, severely punished corruption, pursued a policy of 'allying with the bandits to resist the Qing,' incorporated remnants of the Dashun army, and appointed Jin Sheng, Yang Tinglin, He Tengjiao, and others to fight the Qing forces. He also recovered lost territories such as Jingde and Ningguo in Anhui, while attempting to mediate conflicts with the Prince of Lu regime. However, constrained by the Zheng clique's self-preserving military stance and the continued Qing southern offensive, he ultimately could not turn the tide. In 1646, the Qing army broke through the Xianxia Pass into Fujian; Zheng Zhilong surrendered, and Zhu Yujian was captured at Tingzhou, where he starved himself to death as a martyr for the nation at the age of 44."
 flavor_mng.3.a: "Rebuild the Court"
 emperor_in_fuzhou: "Should Fuzhou fall, uncontrollable consequences will occur."
 flavor_mng.3.entry: "$flavor_mng.3.title$"
 flavor_mng.4.title: "Prince of Lu"
 flavor_mng.4.desc: "Zhu Yihai, with the support of Zhang Guowei, Sun Jiaji, and others, has declared a regency in Shaoxing. All territories in the Zhejiang region still under our control have pledged allegiance to the Prince of Lu."
 flavor_mng.4.historical_info: "In 1645, after the Hongguang Emperor was killed, Zhu Yihai, the Prince of Lu, declared a regency in Shaoxing with the backing of Zhang Guowei, Sun Jiaji, and others. He later organized the Qiantang River campaign, attempting to hold the river line, but was ultimately repelled by the Qing forces. In 1646, the Qing army crossed the river in force, the defensive line collapsed, and Shaoxing fell. The Prince of Lu managed to escape and narrowly survived the calamity."
 flavor_mng.4.a: "How can there be two rulers?"
 flavor_mng.4.b: "I shall lead them"
 flavor_mng.4.entry: "$flavor_mng.4.title$"
 flavor_mng.5.title: "Longwu's Northern Expedition"
 flavor_mng.5.desc: "Much of our territory has now fallen into enemy hands. Having recently taken temporary refuge in the south, we must rebuild our army and launch a northern expedition to reclaim the occupied lands."
 flavor_mng.5.a: "Recover the Central Plains"
 flavor_mng.5.entry: "$flavor_mng.5.title$"
 flavor_mng.6.title: "The Recovery of Nanjing"
 flavor_mng.6.desc: "The southern capital, Nanjing, which once fell into enemy hands, has now been recovered by our forces. As the founding place of our dynasty, this event proves that we still possess the capability to rule China."
 flavor_mng.6.a: "Re-establish the Six Ministries in Nanjing"
 flavor_mng.6.entry: "$flavor_mng.6.title$"
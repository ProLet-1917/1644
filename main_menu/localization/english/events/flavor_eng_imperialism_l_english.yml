l_english:
  flavor_eng_imperialism.1.title: "The Chartist Movement"
  flavor_eng_imperialism.1.desc: "In the mills and pit-holes of the realm, the labouring classes are stirring under the banner of the 'New Charter of the People's Rights': universal suffrage, secret ballots, and a voice in Parliament. The movement swells, and the government must decide how to answer the cry of the working man."
  flavor_eng_imperialism.1.historical_info: "In 1838, the Chartist movement organised around a charter demanding universal male suffrage, annual parliaments and secret ballots. Their petitions of 1839, 1842 and 1848 drew up to three million signers. Parliament rejected the Charter, but the agitation helped carry the reforms that extended the franchise to the working classes over the following decades."
  flavor_eng_imperialism.1.a: "Answer the demands of the people"
  flavor_eng_imperialism.1.b: "Guard the constitution as it stands"
  flavor_eng_imperialism.1.entry: "$flavor_eng_imperialism.1.title$"

  flavor_eng_imperialism.2.title: "The Great Famine in Ireland"
  flavor_eng_imperialism.2.desc: "Blight has come upon the Irish potato harvest — and this is the third year of it. Famine marches across the western provinces, and the emigrant ships are crowded with the desperate fleeing to America. The government must decide how to respond."
  flavor_eng_imperialism.2.historical_info: "Between 1845 and 1852, the Great Famine — An Gorta Mór — struck Ireland as the potato crop failed year after year. Up to a million people died and a further million emigrated. The restrained, free-trade response of the British government was widely condemned, and the famine became a wound in Irish memory that endures to this day."
  flavor_eng_imperialism.2.a: "Send aid and open the granaries"
  flavor_eng_imperialism.2.b: "Let the market provide"
  flavor_eng_imperialism.2.entry: "$flavor_eng_imperialism.2.title$"

  flavor_eng_imperialism.3.title: "The Great Exhibition of 1851"
  flavor_eng_imperialism.3.desc: "The Prince Consort has proposed a Great Exhibition of the Works of Industry of All Nations, to be held in Hyde Park. A palace of glass and iron is to be raised in a matter of months — an engineering marvel that will astonish the world."
  flavor_eng_imperialism.3.historical_info: "On 1 May 1851, the Great Exhibition opened inside the Crystal Palace, the vast glass-and-iron structure designed by Joseph Paxton, in Hyde Park, London. Some fourteen thousand exhibitors showed their wares and more than six million visitors came to marvel, marking the first World's Fair and a triumph of the industrial age."
  flavor_eng_imperialism.3.a: "Raise the Crystal Palace"
  flavor_eng_imperialism.3.b: "Such a spectacle is a waste of gold"
  flavor_eng_imperialism.3.entry: "$flavor_eng_imperialism.3.title$"

  flavor_eng_imperialism.4.title: "On the Origin of Species"
  flavor_eng_imperialism.4.desc: "A naturalist has published a work that overturns the very foundations of the natural order: that all living things descend with modification from common ancestors, and that the struggle for existence selects the fittest. The learned world is in a ferment."
  flavor_eng_imperialism.4.historical_info: "In 1859, Charles Darwin published On the Origin of Species by Means of Natural Selection. The 1,250 copies of the first edition sold out on the day of publication, and his theory of evolution — built on twenty years of study and the voyage of the HMS Beagle — transformed biology and provoked a furious debate with both the Church and the scientific establishment."
  flavor_eng_imperialism.4.a: "The learned world embraces it"
  flavor_eng_imperialism.4.b: "Condemn the blasphemy"
  flavor_eng_imperialism.4.entry: "$flavor_eng_imperialism.4.title$"

  flavor_eng_imperialism.5.title: "The Pre-Raphaelite Brotherhood"
  flavor_eng_imperialism.5.desc: "A coterie of young painters, poets and sculptors have formed a Brotherhood devoted to the jewel-like colour and detail of the 'early' painters before Raphael. They reject the academic manner and the Royal Academy's smug conventions — and they intend to make the art of this realm new."
  flavor_eng_imperialism.5.historical_info: "In 1848, Dante Gabriel Rossetti, William Holman Hunt and John Everett Millais founded the Pre-Raphaelite Brotherhood in London. Working from nature with jewel-like detail and rich colour, the movement transformed British painting, literature and design for a generation, and its echoes remain to be seen today."
  flavor_eng_imperialism.5.a: "Patronize the Brotherhood"
  flavor_eng_imperialism.5.b: "Mediocre paintings"
  flavor_eng_imperialism.5.entry: "$flavor_eng_imperialism.5.title$"

  flavor_eng_imperialism.6.title: "The Father of the Modern Novel"
  flavor_eng_imperialism.6.desc: "A young writer has been publishing his novels in weekly installments, and the reading public devours them. His tales of London orphans, debtor's prisons and the great sweep of history have made him the most famous man in England. His name is Charles Dickens."
  flavor_eng_imperialism.6.historical_info: "Charles Dickens (1812–1870) was the defining novelist of the Age of Imperialism. His serialized works — Oliver Twist, David Copperfield, A Tale of Two Cities, Great Expectations — along with his journalism on poverty and the law, made him the most celebrated writer of his era and its sharpest social critic."
  flavor_eng_imperialism.6.a: "Make him the voice of the age"
  flavor_eng_imperialism.6.b: "A passing sensation"
  flavor_eng_imperialism.6.entry: "$flavor_eng_imperialism.6.title$"

  flavor_eng_imperialism.7.title: "The Engineer of the Railway Age"
  flavor_eng_imperialism.7.desc: "Word has arrived from the realm's most celebrated engineer, Isambard Kingdom Brunel: the great suspension bridge over the Avon Gorge is complete, and his ironclad ocean-going ships are making the old ways of crossing the water obsolete. Railways, bridges and hulls of iron are remaking the face of the realm."
  flavor_eng_imperialism.7.historical_info: "Isambard Kingdom Brunel (1806–1859) was the engineer of the railway age: the Clifton Suspension Bridge, the SS Great Western, the Great Western Railway and the iron-hulled SS Great Britain. His monuments of engineering still stand and still inspire engineers to this day."
  flavor_eng_imperialism.7.a: "Patron the railways of the age"
  flavor_eng_imperialism.7.b: "A modest monument"
  flavor_eng_imperialism.7.entry: "$flavor_eng_imperialism.7.title$"

  flavor_eng_imperialism.8.title: "The Lady of the Lamp"
  flavor_eng_imperialism.8.desc: "News comes from the front of the Crimean War: a lady named Nightingale has taken charge of the hospital at Scutari. The soldiers write home that they will follow 'the Lady of the Lamp' anywhere, and the stench and squalor that used to kill half the wounded are at last being cleansed."
  flavor_eng_imperialism.8.historical_info: "Florence Nightingale (1820–1910) led a body of nurses to the Crimean War and transformed military medicine at the Scutari hospital in Constantinople. Her work on sanitation and her statistical studies of mortality made her a national icon and the founder of modern nursing."
  flavor_eng_imperialism.8.a: "Honour the Lady of the Lamp"
  flavor_eng_imperialism.8.b: "Reward her with a pension"
  flavor_eng_imperialism.8.entry: "$flavor_eng_imperialism.8.title$"

  flavor_eng_imperialism.9.title: "The Adventures of Sherlock Holmes"
  flavor_eng_imperialism.9.desc: "A young army doctor from Scotland has published a novel introducing a consulting detective of Baker Street who 'thinks' his way through every crime. The world will never forget this character. His name is Sherlock Holmes."
  flavor_eng_imperialism.9.historical_info: "Arthur Conan Doyle's A Study in Scarlet (1887) introduced Sherlock Holmes and Dr Watson. The serialized adventures — from The Hound of the Baskervilles to The Valley of Fear — invented the world of consulting detection, and 221B Baker Street became one of the most famous addresses in all of literature."
  flavor_eng_imperialism.9.a: "Give the stories to the public"
  flavor_eng_imperialism.9.b: "A fireside story"
  flavor_eng_imperialism.9.entry: "$flavor_eng_imperialism.9.title$"

l_english:
 flavor_plc.5000.title:"The rebellion of Janusz Radziwiłł"
 flavor_plc.5000.desc:"With the invasion of foreign troops, in Vilnius, there is a Lithuanian nobleman named Janusz Radziwiłł who has now joined forces with some other nobles to raise the banner of rebellion."
 flavor_plc.5000.historical_info:"In June 1655 Swedish forces started to advance across the northern territories of the Commonwealth. The Swedish invasion of Polish–Lithuanian Commonwealth, part of the Second Northern War, is known in Lithuanian history as the Deluge. Together with his cousin Bogusław Radziwiłł, Janusz began talks with Swedish king Charles X Gustav of Sweden, discussing how to reverse the Union of Lublin which created the Commonwealth. Janusz first declared the Grand Duchy a Swedish protectorate in the Treaty of Kėdainiai on 17 August 1655, then the brothers signed another treaty on 20 October according to which the Swedish–Lithuanian union was founded, and in which Radziwiłł's were to rule a part of the Grand Duchy."
 flavor_plc.5000.a:"How dare him"
 flavor_pru.1.title:"The unified [GetFormableCountry('PRU').GetName]"
 flavor_pru.1.desc:"As our family's rulers took control of the regions of Brandenburg and Prussia, and as the demand for the unification of the territories under a single title grew, we should accept the title of [GetFormableCountry('PRU').GetName]."
 flavor_pru.1.historical_info:"In return for an alliance against France in the War of the Spanish Succession, the Great Elector's son, Frederick III, was allowed to elevate Prussia to a kingdom in the Crown Treaty of 16 November 1700. Frederick crowned himself "King in Prussia" as Frederick I on 18 January 1701. Legally, no kingdoms could exist in the Holy Roman Empire except for Bohemia and Italy. However, Frederick took the line that since Prussia had never been part of the empire and the Hohenzollerns were fully sovereign over it, he could elevate Prussia to a kingdom. Emperor Leopold I, keen to secure Frederick's support in the impending War of the Spanish Succession, acquiesced."
 flavor_pru.1.a:"Claiming the title, unifying our territory"
 flavor_pru.1.b:"We cannot violate the regulations of the Holy Roman Empire"
 flavor_pru.2.title:"Country owned by the Army"
 flavor_pru.2.desc:"Prussia was often referred to as a country "owned by the army" due to its unique military status within its territory. This indicates the position of the military, especially the military nobility, within the country."
 flavor_pru.2.a:"Accept the reform"
 flavor_pru.2.b:"Maybe not"
 flavor_pru.3.title:"Brothers from other countries"
 flavor_pru.3.desc:"As the peak of the Reformation movement passed and the religious wars came to an end, some Protestant believers who had been oppressed by other Catholic German states fled to our territory to seek refuge."
 flavor_pru.3.a:"Arrange them properly"
 flavor_pru.3.b:"Send them back"
 flavor_zaz.2000.title:"A men called Bohdan Khmelnytsky asking for help"
 flavor_zaz.2000.desc:"Bohdan Khmelnytsky was treated unfairly in the Polish-Lithuanian Commonwealth. In response, he fled the country and came to our land to call on our people to join the movement that supported him in opposing the Polish-Lithuanian Commonwealth."
 flavor_zaz.2000.a:"Let him lead us!"
 flavor_zaz.2000.b:"Send him back Poland."
 flavor_zaz.2000.c:"Let him become a general of us."

 flavor_plc.5000.entry: "$flavor_plc.5000.title$"
 flavor_pru.1.entry: "$flavor_pru.1.title$"
 flavor_pru.2.entry: "$flavor_pru.2.title$"
 flavor_pru.3.entry: "$flavor_pru.3.title$"
 flavor_zaz.2000.entry: "$flavor_zaz.2000.title$"

 flavor_pru.4.title: "Proclaim Kingdom Status"
 flavor_pru.4.desc: "With the consolidation of our territorial titles complete, we can now proclaim our primary title as the Kingdom of Prussia."
 flavor_pru.4.a: "Proclaim the new title"
 flavor_pru.4.b: "We should abandon this claim"
 flavor_pru.4.entry: "$flavor_pru.4.title$"



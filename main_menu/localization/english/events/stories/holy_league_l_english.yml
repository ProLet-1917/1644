l_english:
 holy_league.1.title: "The current Situation of [GetCountry('TUR').GetName]"
 holy_league.1.desc: "The Ottoman Empire entered a new state in the 17th century. Externally, the empire was unable to launch attacks on new targets, while internally, mutiny and uprisings occurred from time to time. The state of being proactive in foreign affairs that began in the 14th century has now vanished. If we cannot break away from the current situation, we are bound to decline step by step due to the power struggles in the court and the estrangement of the governor.\nAt present, we have several options before us. We can attack the city that Sultan Suleiman had always longed for - Vienna, in order to undermine the confidence of the Christian believers. At the same time, we can also reform the domestic administrative structure first, thereby stabilizing the domestic situation first."
 holy_league.1.a: "We should make the capture of Vienna our top priority."
 holy_league.1.b: "We should make reforming the internal administrative structure our top priority."
 unlock_ottomans_decisions: "Will Unlock Few Decisions to help us improve our current situation"
 holy_league.2.title: "Conquer [GetCountry('CRT').GetName]"
 holy_league.2.a: "We should declare war now!"
 holy_league.2.b: "Prepare the ship!"
 holy_league.2.desc: "The fact that Crete, which had been under Venetian control for several hundred years, served as a base for the Venetians, seriously hindered our navy's access to the Mediterranean. Due to the Venetians' blockade of Crete and the surrounding islands, the Balkan Peninsula, which was under our rule, was constantly threatened by the Christian coalition for the past century. Therefore, we must capture Crete in order to effectively protect our territory."
 holy_league.2.historical_info: "The Cretan War, also known as the War of Candia or the fifth Ottoman–Venetian war, was a conflict between the Republic of Venice and her allies (chief among them the Knights of Malta, the Papal States and France) against the Ottoman Empire and the Barbary States largely fought over the island of Crete, Venice's largest and richest overseas possession. The war lasted from 1645 to 1669 and was fought in Crete, especially in the city of Candia, and in numerous naval engagements and raids around the Aegean Sea, with Dalmatia providing a secondary theater of operations."
 holy_league.3.title: "Fortify the defenses of Candia"
 holy_league.3.a: "We should enhance the local defense."
 holy_league.3.b: "We should have faith that our fleet can protect that area well."
 holy_league.3.desc: "Recent rumors suggest that the [GetCountry('TUR').GetName] are about to attack our main base on the island of Crete, Candia. Our adviser suggested that we enhance the defense of the local fortifications."
 holy_league.4.title: "Helping Candia's resistance"
 holy_league.4.a: "We will send our help."
 holy_league.4.b: "We do now have enough power to help them."
 holy_league.4.desc: "Candia is now caught in the midst of the Ottoman attack. As their friends, we should send a small force to assist them."
 holy_league.5.title: "Help from [GetCountry('MOI').GetName]"
 holy_league.5.a: "We will make full use of it."
 holy_league.5.desc: "Our friends, [GetCountry('MOI').GetName] has send a group to help us defend the [GetCountry('TUR').GetName]."
 holy_league.6.title: "The upper hungary"
 holy_league.6.a: "We should donate him."
 holy_league.6.b: "He will prove his ability"
 holy_league.6.desc: "A hungarian prince called Emeric Thököly has lead an army across the border of duchy of transylvania. He and his troop has successfully occupied some land in slovakia. With nearly reinforced, he has start the march to the capital of [GetCountry('HUN').GetName]."
 upper_hungary: "Upper Hungary"
 holy_league.7.title: "Conquer Malta?"
 holy_league.7.a: "Prepare the ship!"
 holy_league.7.desc: "Malta is under [GetCountry('KNI').GetName]'s rule, we have tried conquer them before, but we failed. With new technology and stronger army, we have confidence to conquer them now."
 holy_league.8.title: "Köprülü Mehmed Pasha"
 holy_league.8.a: "Grant him the Grand Vizier"
 holy_league.8.b: "Grant him as adviser"
 holy_league.8.desc: "There is a man called Köprülü Mehmed shining brightly in the recent court setting, by the formal grand vizier's nominate, should we consider give him the position of grand vizier?"
 holy_league.8.historical_info: "Firstly, Köprülü Mehmed Pasha completely eliminated the hostile military faction in Istanbul, firmly seizing power. In August 1657, Köprülü once again defeated the Venetian navy in the Aegean Sea, breaking the blockade imposed by the enemy country on the Bosphorus Strait. The main threat to Istanbul was eliminated, providing a solid foundation for the tough policies implemented by him. In particular, the Turhan Empress in the court strongly supported this elderly grand vizier. The following year, in order to punish the Transylvania duke who was at odds with the Ottoman Empire, the grand vizier led an expedition to Transylvania and attacked Poland. Moreover, on the charge of fueling chaos in Wallachia, he executed the chief bishop of the Greek Orthodox Church. On the other hand, the anti-establishment military politicians and local influential military figures who felt threatened by his actions also became restless. The provincial military governor of Aleppo, Abazaza Hassan Pasha, raised the rebel flag in Anatolia and subsequently the rebellion spread to the Anatolian region. However, Copuluru Mohammed Pasha quelled the rebellion in 1661, laying the foundation for economic and social stability in the latter half of the 17th century."

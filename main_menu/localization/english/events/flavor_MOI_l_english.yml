l_english:
 flavor_moi.1.title: "Resistance in the Mountains"
 flavor_moi.1.desc: "As a group that fought against the [GetCountry('TUR').GetName] in the mountains, we have continued our actions for over a hundred years.We will unite as one and strike the enemy with a powerful blow in the mountains, in order to safeguard our freedom."
 flavor_moi.1.a: "United together!"
 flavor_moi.1.historical_info: "Since the fall of Constantinople to the [GetCountry('TUR').GetName] in 1453, and until the Peloponnese declare independence from [GetCountry('TUR').GetName]'s rule. The people of the Mani Peninsula united as one to resist the rule of the [GetCountry('TUR').GetName] for hundreds of years. Until the end of the Greek War of Independence, this place was the base for the resistance. People were assisting all of [GetCountry('TUR').GetName]'s enemies, especially during the Candia War from 1648 to 1669."
 flavor_moi.2.title: "Purchase the island of Kythira"
 flavor_moi.2.a: "We should offer a price to Venice for purchasing this island."
 flavor_moi.2.b: "We cannot take the risk of purchasing this island."
 flavor_moi.2.desc: "As an important island of [GetCountry('VEN').GetName] in the Aegean Sea, with the current reduction in Venice's maintenance efforts for this island, as their friendly friend, we can propose to them to purchase this island for 50 [gold|e] in order to assist them in maintaining their control over the Aegean Sea."
 flavor_moi.3.title: "A letter from [GetCountry('MOI').GetName]"
 flavor_moi.3.a: "We should accept their offer."
 flavor_moi.3.b: "This island is still useful to us."
 flavor_moi.3.desc: "The messenger from [GetCountry('MOI').GetName] informed us that they were interested in purchasing our Kythira island. We have been reducing our maintenance efforts on the island recently. Perhaps we should consider selling it to them for a better price."
 flavor_moi.4.title: "Reply from [GetCountry('VEN').GetName]"
 flavor_moi.4.a: "To us, let's toast!"
 flavor_moi.4.desc: "The reply from [GetCountry('VEN').GetName] informed us that they have accepted our offer and the island will be handed over to us shortly"
 flavor_moi.5.title: "Reply from [GetCountry('VEN').GetName]"
 flavor_moi.5.a: "What a pity!"
 flavor_moi.5.desc: "The reply from Venice informed us that they had rejected our offer. It seems that we should give up this idea."
 flavor_moi.6.title: "Klephtic songs"
 flavor_moi.6.a: "I am happy to hear this."
 flavor_moi.6.desc: "A group of people in our country spontaneously created some folk songs.We will collectively refer to these songs as Klephtic songs.This will be passed down as an integral part of our national culture for generations to come."
 flavor_moi.6.historical_info: "Klephtic songs, or ballads, were developed in mainland Greece. They are part of the Greek folk music genre, which includes folk poetry, and are thematically oriented on either the achievements and death of a single klepht or the generic life of the klephts as a group."
 flavor_moi.7.title: "Expand Mystras"
 flavor_moi.7.a: "We should expand it."
 flavor_moi.7.b: "It is enough for us."
 flavor_moi.7.desc: "Mystras, as the ruling center of the former [GetFormableCountry('BYZ').GetName] in the Peloponnese, is now under our control. We should expand the old towns to support our cause of resistance against the [GetCountry('TUR').GetName]"
 flavor_moi.8.title: "Expand Kalamata"
 flavor_moi.8.a: "We should expand it."
 flavor_moi.8.b: "It is enough for us."
 flavor_moi.8.desc: "Kalamata, as an important trading port for [GetCountry('VEN').GetName] in the Peloponnese in the past, is now under our control. We should expand the old towns to support our cause of resistance against the [GetCountry('TUR').GetName]"
 flavor_moi.9.title: "What are we fighting for?"
 flavor_moi.9.a: "We are Romans, and will rebuild our empire."
 flavor_moi.9.b: "We are Greeks, and will liberate all the people have same culture with us."
 flavor_moi.9.desc: "With our recent expansion, we can now start to consider what goals our traditions, our future and the purpose behind all of this that we did."
 follow_romans_path: "We will choose the [GetFormableCountry('BYZ').GetName] path and will do our utmost to achieve this goal."
 follow_greek_path: "We will choose the [GetFormableCountry('GRE').GetName] path and will do our utmost to achieve this goal."
 flavor_moi.10.title: "Expand Kythira"
 flavor_moi.10.a: "We should expand it."
 flavor_moi.10.b: "It is enough for us."
 flavor_moi.10.desc: "Kythira, as an important trading port for [GetCountry('VEN').GetName] in the aegean sea in the past, is now under our control. We should expand the settlement to support our cause of resistance against the [GetCountry('TUR').GetName]"
 flavor_moi.11.title: "Rebuild the [ShowBuildingTypeNameWithNoTooltip('hexamilion_wall')]"
 flavor_moi.11.desc: "With our reconquer the [ShowAreaNameWithNoTooltip('morea_area')], We can rebuild the [ShowBuildingTypeNameWithNoTooltip('hexamilion_wall')] in [ShowLocationName('corinth')] to protect [ShowAreaNameWithNoTooltip('morea_area')] to make sure our enemy can not into the [ShowAreaNameWithNoTooltip('morea_area')]. Then we can confidently build our homeland."
 flavor_moi.11.a: "The safety of [ShowAreaNameWithNoTooltip('morea_area')] is our biggest priority."
 flavor_moi.11.b: "The [ShowBuildingTypeNameWithNoTooltip('hexamilion_wall')] is too expensive."
 flavor_moi.11.historical_info: "During Constantine XI's reign over Morea, he shifted the empire's focus towards the mountains of the region, believing that if the empire was to survive, it was by fortifying the Hexamilion Wall and developing the cities there. His plans failed though when the Ottomans launched an invasion in his lands, leaving the countryside devastated."
 flavor_moi.12.title: "Rebuild the Theme System"
 flavor_moi.12.a: "We should rebuild this system to organize our military in a more efficient manner."
 flavor_moi.12.b: "History has proved that this system is inappropriate."
 flavor_moi.12.desc: "Theme system is a system of provincial headquarters and armies, spearheaded by a strategos with dual responsibilities to protect the locals and establish authority. For centuries, it has been the cornerstone of imperial rule. Although this system was later abandoned, due to its nature, some of us are calling for its re-establishment in order to maintain our military more efficiently."
 reopening_of_the_olympic_games: "We will reopen the Olympic Games"
 flavor_moi.13.title: "Reopen the Olympic Games"
 flavor_moi.13.a: "We should reconvene this event."
 flavor_moi.13.b: "No, this is too expensive. And our current main concern should be focused on defending against external enemies."
 flavor_moi.13.desc: "We have reoccupied Olympia. This city has been the venue for the Olympic Games since the classical era. Each Greek city would send representatives to participate in this grand event. As we aim to revive ancient Greece, we should reconvene the Olympic Games and invite other countries to participate together."
 flavor_moi.13.historical_info: "The ancient Olympic Games were a series of athletic competitions among representatives of city-states and one of the Panhellenic Games of ancient Greece. They were held at the Panhellenic religious sanctuary of Olympia, in honor of Zeus, and the Greeks gave them a mythological origin. The originating Olympic Games are traditionally dated to 776 BC. The games were held every four years, or Olympiad, which became a unit of time in historical chronologies. These Olympiads were referred to based on the winner of their stadion sprint, e.g., "the third year of the eighteenth Olympiad when Ladas of Argos won the stadion". They continued to be celebrated when Greece came under Roman rule in the 2nd century BC. Their last recorded celebration was in AD 393, under the emperor Theodosius I, but archaeological evidence indicates that some games were still held after this date. The games likely came to an end under Theodosius II, possibly in connection with a fire that burned down the temple of the Olympian Zeus during his reign."
 flavor_moi.14.title: "Reclaiming Corinth"
 flavor_moi.14.a: "A great step towards reclaiming our homeland!"
 flavor_moi.14.desc: "Our recent military operation enabled us to successfully recapture [ShowLocationName('corinth')], a city located at the junction of the Peloponnese Peninsula and other Greek regions. As we took control of the city, we moved one step closer to achieving our goal."
 flavor_moi.15.title: "Reclaiming Athens"
 flavor_moi.15.a: "A great step towards reclaiming our homeland!"
 flavor_moi.15.desc: "Our recent military operation enabled us to successfully recapture [ShowLocationName('athens')], which has always been a very important city in the Greek region. As our flag once again waves above the Acropolis, we have been able to wipe away the disgrace that has persisted since 1204."
 flavor_moi.16.title: "Reclaiming Larissa"
 flavor_moi.16.a: "A great step towards reclaiming our homeland!"
 flavor_moi.16.desc: "Our recent military operation enabled us to successfully recapture [ShowLocationName('larissa')], a city located in the central part of Greece and serving as a key link between the north and the south. By seizing this location, we were able to utilize it as an important military base and exert control over this area."
 flavor_moi.17.title: "Reclaiming Thessaloniki"
 flavor_moi.17.a: "A great step towards reclaiming our homeland!"
 flavor_moi.17.desc: "Our recent military operation enabled us to successfully recapture [ShowLocationName('thessaloniki')], long regarded as the second city of the Byzantine Empire after Constantinople, Thessaloniki's wealth and prestige stem from her strategic position in commerce. Her bustling ports channel valuable goods between Italy and the Roman heartland, serving as a vital bridge between East and West."
 flavor_moi.18.title: "Enter Constantinople!"
 flavor_moi.18.a: "The City of Wishes of the World has once again returned to our possession!"
 flavor_moi.18.b: "We will move our capital to here."
 flavor_moi.18.desc: "After a grueling battle, after a century of separation, our army crossed the Golden Gate and entered Constantinople. This city, once called New Rome, has now been recaptured by us. Constantinople was the former capital of the [GetFormableCountry('BYZ').GetName] empire. As we return here, this will also mark the beginning of a new era. Just like a phoenix rising from the ashes, we will rebuild our empire."

 universality_vs_exclusivity: "Universality vs Exclusivity"
 universality_vs_exclusivity_desc: "A universal country would be more welcoming to people from other cultures, while an exclusive country would be hostile to them."
 universality_focus: "Universality"
 exclusivity_focus: "Exclusivity"

 flavor_moi.19.title: "Turks driven from Thrace!"
 flavor_moi.19.a: "The Phoenix rises!"
 flavor_moi.19.desc: "The forces of the [GetCountry('TUR').GetName] have been driven out of [ShowAreaName('thrace_area')], which was once the seat of their power. With [ShowAreaNameWithNoTooltip('thrace_area')]] secured our prosperity is assured!"
 flavor_moi.20.title: "Revive [ShowReligionName('hellenism_religion')]?"
 flavor_moi.20.a: "Maybe [ShowReligionName('hellenism_religion')] is right after all."
 flavor_moi.20.b: "We cannot accept such heretical nonsense."
 flavor_moi.20.desc: "In our country, there has emerged a group of people who are advocating for the revival of the ancient [ShowReligionName('hellenism_religion')]. They claim that our current predicament is entirely due to the adoption of Christianity. They proposed that we should return to believing in the ancient [ShowReligionName('hellenism_religion')]."
 flavor_moi.21.title: "Turks driven from Macedonia!"
 flavor_moi.21.a: "The Phoenix rises!"
 flavor_moi.21.desc: "The forces of the [GetCountry('TUR').GetName] have been driven out of [ShowAreaName('macedonia_area')], which was once the seat of their power. With [ShowAreaNameWithNoTooltip('macedonia_area')]] secured our prosperity is assured!"


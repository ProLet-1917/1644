l_english:
 # ===== Age 7 parliament types =====
 republican_parliament: "Republican Parliament"
 republican_parliament_desc: "A sovereign chamber elected on a broad franchise. It makes the law, votes the taxes and watches the ministers."
 imperial_parliament: "Imperial Parliament"
 imperial_parliament_desc: "A chamber of nobles, clergy and burghers summoned by the crown. The emperor reigns, but the chamber holds the purse."
 presidential_parliament: "Presidential Assembly"
 presidential_parliament_desc: "A legislature elected separately from the president, armed with the power of the purse and of enquiry."
 mass_suffrage_parliament: "Mass Suffrage Parliament"
 mass_suffrage_parliament_desc: "A chamber elected by every adult citizen, in which the labouring classes hold the balance of power."

 # ===== Age 7 parliament issues =====
 army_bill: "The Army Bill"
 army_bill_desc: "The chamber is asked to vote the men, money and terms of service for the army."
 compulsory_education_bill: "Compulsory Education Bill"
 compulsory_education_bill_desc: "A bill to make primary schooling universal and free, at the expense of the treasury."
 colonial_autonomy_bill: "Colonial Autonomy Bill"
 colonial_autonomy_bill_desc: "A bill to grant the colonies a measure of self-government and a voice in their own taxation."
 tariff_reform_bill: "Tariff Reform Bill"
 tariff_reform_bill_desc: "A bill to revise the customs tariff, whether towards protection or towards free trade."
 suffrage_extension_bill: "Suffrage Extension Bill"
 suffrage_extension_bill_desc: "A bill to lower the property qualification and admit new classes of voters to the franchise."
 pension_bill: "Old Age Pension Bill"
 pension_bill_desc: "A bill to grant a state pension to the aged poor, funded from general taxation."
 railway_nationalization_bill: "Railway Nationalisation Bill"
 railway_nationalization_bill_desc: "A bill to bring the trunk railways into public ownership and operate them for the common good."
 anti_trust_bill: "Anti-Trust Bill"
 anti_trust_bill_desc: "A bill to restrain the great trusts, cartels and monopolies that dominate the market."
 public_health_bill: "Public Health Bill"
 public_health_bill_desc: "A bill to establish a national board of health, with powers over water, sewers and housing."
 colonial_conscription_bill: "Colonial Conscription Bill"
 colonial_conscription_bill_desc: "A bill to extend the obligation of service to the colonies and dependencies."
 civil_service_reform_bill: "Civil Service Reform Bill"
 civil_service_reform_bill_desc: "A bill to reform the public service on the principles of examination, merit and tenure."
 central_bank_charter_bill: "Central Bank Charter Bill"
 central_bank_charter_bill_desc: "A bill to renew and extend the charter of the central bank, and to define its relation to the treasury."

 # ===== Age 7 elections =====
 constitutional_cabinet_election: "Cabinet Election"
 constitutional_cabinet_election_desc: "The chamber that commands a majority forms the government. The head of government is chosen by, and answerable to, the elected assembly."
 presidential_election: "Presidential Election"
 presidential_election_desc: "The head of state is chosen for a fixed term by direct or indirect election, and governs independently of the legislature."
 mass_suffrage_election: "Mass Suffrage Election"
 mass_suffrage_election_desc: "Every adult citizen casts a ballot. The result is decided by the great mass of the labouring and farming population."
 imperial_diet_election: "Imperial Diet Election"
 imperial_diet_election_desc: "The imperial diet elects a chancellor to head the government in the emperor's name."
 universal_suffrage_eligibility: "Universal Suffrage: every adult citizen may stand for election."

 # ===== Age 7 static modifiers =====
 passed_army_bill: "Army Bill Passed"
 passed_army_bill_desc: "The chamber has voted the men and money for the army."
 passed_compulsory_education_bill: "Compulsory Education Passed"
 passed_compulsory_education_bill_desc: "Primary schooling is now universal and free."
 passed_colonial_autonomy_bill: "Colonial Autonomy Granted"
 passed_colonial_autonomy_bill_desc: "The colonies have been granted a measure of self-government."
 granted_colonial_autonomy: "Granted Colonial Autonomy"
 granted_colonial_autonomy_desc: "A share in their own government has reconciled the colonies to the mother country."
 passed_tariff_reform_bill: "Tariff Reform Passed"
 passed_tariff_reform_bill_desc: "The customs tariff has been revised by act of the chamber."
 passed_suffrage_extension_bill: "Suffrage Extended"
 passed_suffrage_extension_bill_desc: "New classes of voters have been admitted to the franchise."
 passed_pension_bill: "Old Age Pensions Passed"
 passed_pension_bill_desc: "The state now pays a pension to the aged poor."
 passed_railway_nationalization_bill: "Railways Nationalised"
 passed_railway_nationalization_bill_desc: "The trunk railways are now the property of the nation."
 passed_anti_trust_bill: "Anti-Trust Act Passed"
 passed_anti_trust_bill_desc: "The great trusts have been restrained by act of the chamber."
 passed_public_health_bill: "Public Health Act Passed"
 passed_public_health_bill_desc: "A national board of health now watches over water, sewers and housing."
 passed_colonial_conscription_bill: "Colonial Conscription Passed"
 passed_colonial_conscription_bill_desc: "The obligation of service has been extended to the colonies."
 passed_civil_service_reform_bill: "Civil Service Reformed"
 passed_civil_service_reform_bill_desc: "The public service is now recruited by examination and held by tenure."
 passed_central_bank_charter_bill: "Central Bank Chartered"
 passed_central_bank_charter_bill_desc: "The charter of the central bank has been renewed and extended."

 republican_parliament_law_vote_required: "Law Changes Require a Vote"
 republican_parliament_law_vote_required_desc: "The chamber, not the crown, makes the law. Policies may no longer simply be bought with stability and must be carried as parliament issues."

 # ===== Age 7 auto modifiers =====
 republican_parliament_law_vote_required_auto: "Laws Require a Parliamentary Vote"
 republican_parliament_law_vote_required_auto_desc: "With a sovereign chamber in session, law changes must be carried by parliament rather than purchased with stability."
 parliament_seat_nobles_power: "Noble Seats in the Chamber"
 parliament_seat_nobles_power_desc: "The nobility holds a substantial block of seats, and its influence over the state grows accordingly."
 parliament_seat_burghers_power: "Burgher Seats in the Chamber"
 parliament_seat_burghers_power_desc: "The urban middle classes dominate the chamber, and their power in the state grows accordingly."
 parliament_seat_peasants_power: "Popular Seats in the Chamber"
 parliament_seat_peasants_power_desc: "The labouring and farming masses hold the balance of seats, and their power in the state grows accordingly."

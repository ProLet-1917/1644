l_english:
 # =========================================================
 # FRANCE
 # =========================================================
 flavor_fra_imperialism.1.title: "The July Revolution"
 flavor_fra_imperialism.1.desc: "The king has issued ordinances dissolving the chamber and silencing the press. Paris has risen in answer: barricades in every street, the tricolour over the Tuileries, and a new dynasty offered the crown on liberal terms."
 flavor_fra_imperialism.1.historical_info: "The July Revolution of 1830 overthrew Charles X and installed Louis-Philippe as 'King of the French', a constitutional monarch."
 flavor_fra_imperialism.1.a: "A liberal monarchy will satisfy the nation."
 flavor_fra_imperialism.1.b: "The ordinances stand. The barricades will be cleared."

 flavor_fra_imperialism.2.title: "The February Revolution"
 flavor_fra_imperialism.2.desc: "The ban on political banquets has become a general insurrection. The National Guard has gone over to the people, the throne is empty, and a republic has been proclaimed at the Hôtel de Ville."
 flavor_fra_imperialism.2.historical_info: "The February Revolution of 1848 established the Second Republic, which briefly introduced universal male suffrage and abolished slavery in the colonies."
 flavor_fra_imperialism.2.a: "The Republic is proclaimed."
 flavor_fra_imperialism.2.b: "The monarchy will be restored by force."

 flavor_fra_imperialism.3.title: "The Second Empire"
 flavor_fra_imperialism.3.desc: "The president has dissolved the assembly, arrested his opponents and appealed to the people. A plebiscite has ratified him as Emperor. Order is restored, and the nation has a master again."
 flavor_fra_imperialism.3.historical_info: "Louis-Napoléon Bonaparte's coup of 1851 and plebiscite of 1852 established the Second Empire, which lasted until the defeat of 1870."
 flavor_fra_imperialism.3.a: "The Empire is proclaimed."
 flavor_fra_imperialism.3.b: "The Republic will be preserved."

 flavor_fra_imperialism.4.title: "The Road to War"
 flavor_fra_imperialism.4.desc: "A German power is gathering the German states under its leadership, and the question of the Rhine has become the question of our survival. The army is confident; the diplomats are not."
 flavor_fra_imperialism.4.historical_info: "The Franco-Prussian War of 1870-71 ended in the collapse of the Second Empire, the loss of Alsace-Lorraine and the proclamation of the German Empire at Versailles."
 flavor_fra_imperialism.4.a: "We will meet them in the field."
 flavor_fra_imperialism.4.b: "We will not be provoked into war."

 flavor_fra_imperialism.5.title: "The Commune"
 flavor_fra_imperialism.5.desc: "With the enemy at the gates and the government fled, the workers of Paris have declared a commune of their own. They hold the cannon, the mairies and the heart of the capital."
 flavor_fra_imperialism.5.historical_info: "The Paris Commune of 1871 governed Paris for two months before being crushed by the French army in the 'Bloody Week'."
 flavor_fra_imperialism.5.a: "The Commune must be crushed."
 flavor_fra_imperialism.5.b: "We will treat with the Commune."

 flavor_fra_imperialism.6.title: "The Dreyfus Affair"
 flavor_fra_imperialism.6.desc: "An officer has been convicted of treason on forged evidence, and the army refuses to admit the error. The affair has split the nation into two camps and made the question of the Republic itself a matter of daily quarrel."
 flavor_fra_imperialism.6.historical_info: "The Dreyfus Affair (1894-1906) divided France between republicans and nationalists and led to the separation of Church and State in 1905."
 flavor_fra_imperialism.6.a: "The army and the Church must be defended."
 flavor_fra_imperialism.6.b: "Justice must be done, whatever the cost."

 flavor_fra_imperialism.10.title: "The Impressionists"
 flavor_fra_imperialism.10.desc: "A group of young painters have abandoned the studio for the open air and the fleeting moment, painting light itself in strokes of pure colour. The Salon has rejected them; the public is beginning to look."
 flavor_fra_imperialism.10.historical_info: "Impressionism, named after Monet's 'Impression, Sunrise' (1874), broke with academic painting and reshaped European art."
 flavor_fra_imperialism.10.a: "We will patronise the new painting."
 flavor_fra_imperialism.10.b: "This is not art. Let them starve."

 flavor_fra_imperialism.11.title: "A Man of Letters"
 flavor_fra_imperialism.11.desc: "A novelist of enormous energy has made the whole of French society his subject — its greed, its politics, its vices and its genius. His books are read in every province and banned in several."
 flavor_fra_imperialism.11.historical_info: "Honoré de Balzac's 'La Comédie Humaine' and the works of Victor Hugo and Émile Zola dominated the French novel of the nineteenth century."
 flavor_fra_imperialism.11.a: "We will honour our greatest writer."
 flavor_fra_imperialism.11.b: "The Church will decide what may be read."

 flavor_fra_imperialism.12.title: "The Colonial Party"
 flavor_fra_imperialism.12.desc: "Deputies, officers and merchants have formed a party of colonial expansion. They argue that France must have her share of the world, or be reduced to a second-rate power in Europe."
 flavor_fra_imperialism.12.historical_info: "France acquired Algeria, Tunisia, Indochina and much of West and Equatorial Africa between 1830 and 1914."
 flavor_fra_imperialism.12.a: "France must have her place in the sun."
 flavor_fra_imperialism.12.b: "We have no need of deserts and jungles."

 # =========================================================
 # HABSBURG MONARCHY
 # =========================================================
 flavor_hab_imperialism.1.title: "The Springtime of Peoples"
 flavor_hab_imperialism.1.desc: "Vienna has risen. Students and workers hold the streets, the court has fled to Innsbruck, and the peoples of the monarchy — German, Magyar, Italian, Czech — each demand their own constitution and their own nation."
 flavor_hab_imperialism.1.historical_info: "The revolutions of 1848 shook the Habsburg Monarchy to its foundations; the court fled Vienna and the Emperor Ferdinand abdicated in favour of Franz Joseph."
 flavor_hab_imperialism.1.a: "We will grant reforms and hold the monarchy together."
 flavor_hab_imperialism.1.b: "The army will restore order."

 flavor_hab_imperialism.2.title: "The Compromise"
 flavor_hab_imperialism.2.desc: "The Magyar gentry will not be ruled from Vienna like a province. A settlement is proposed: two states, one sovereign, one army, one foreign policy — and two parliaments."
 flavor_hab_imperialism.2.historical_info: "The Austro-Hungarian Compromise of 1867 created the Dual Monarchy, which lasted until 1918."
 flavor_hab_imperialism.2.a: "We will accept the Dual Monarchy."
 flavor_hab_imperialism.2.b: "One empire, one law, one government."

 flavor_hab_imperialism.3.title: "The Balkan Crisis"
 flavor_hab_imperialism.3.desc: "The Ottoman grip on the Balkans is loosening, and the powers are circling. A forward policy in the Balkans would secure our southern flank — and might set all Europe alight."
 flavor_hab_imperialism.3.historical_info: "The annexation of Bosnia-Herzegovina in 1908 and the Balkan Wars of 1912-13 set the stage for the July Crisis of 1914."
 flavor_hab_imperialism.3.a: "We will act in the Balkans."
 flavor_hab_imperialism.3.b: "We will show restraint."

 flavor_hab_imperialism.10.title: "The City of Music"
 flavor_hab_imperialism.10.desc: "From the suburbs to the Hofburg, Vienna lives by music. The concert halls are full, the conservatory is the finest in Europe, and a new generation of composers is writing for an audience that knows what it is hearing."
 flavor_hab_imperialism.10.historical_info: "Vienna was the musical capital of Europe, home to Beethoven, Schubert, the Strauss family, Brahms, Bruckner and Mahler."
 flavor_hab_imperialism.10.a: "We will patronise our composers."
 flavor_hab_imperialism.10.b: "Music is a private amusement, not a state matter."

 flavor_hab_imperialism.11.title: "The Vienna Secession"
 flavor_hab_imperialism.11.desc: "A group of artists have broken with the Academy and founded a movement of their own, with a magazine, an exhibition hall and a style of ornament that is entirely new. The public is scandalised and delighted."
 flavor_hab_imperialism.11.historical_info: "The Vienna Secession of 1897, led by Gustav Klimt, broke with academic art and produced the Jugendstil style."
 flavor_hab_imperialism.11.a: "The new art will be shown."
 flavor_hab_imperialism.11.b: "The Academy speaks for Vienna."

 flavor_hab_imperialism.12.title: "The Viennese School"
 flavor_hab_imperialism.12.desc: "A physician of the city has published a theory of the unconscious mind, arguing that our dreams, our slips and our neuroses have meaning. The medical faculty is divided between outrage and fascination."
 flavor_hab_imperialism.12.historical_info: "Sigmund Freud's 'The Interpretation of Dreams' (1899) founded psychoanalysis and transformed the understanding of the mind."
 flavor_hab_imperialism.12.a: "We will support the new science."
 flavor_hab_imperialism.12.b: "This is quackery. Let him leave."

 # =========================================================
 # RUSSIA
 # =========================================================
 flavor_rus_imperialism.1.title: "The Crimean War"
 flavor_rus_imperialism.1.desc: "Our armies have been defeated in the Crimea by an alliance of the western powers. The Black Sea is neutralised, our fleet is sunk, and the whole world now knows that Russia cannot defend her own borders."
 flavor_rus_imperialism.1.historical_info: "The Crimean War (1853-56) exposed the backwardness of the Russian army and administration and triggered the reforms of Alexander II."
 flavor_rus_imperialism.1.a: "We must reform, or perish."
 flavor_rus_imperialism.1.b: "Our faith and our numbers will suffice."

 flavor_rus_imperialism.2.title: "The Emancipation of the Serfs"
 flavor_rus_imperialism.2.desc: "Forty million souls are bound to the land. The tsar proposes to free them, with land, by decree — against the furious opposition of the gentry, and with the peasantry suspicious of the terms."
 flavor_rus_imperialism.2.historical_info: "The Emancipation Manifesto of 1861 freed the Russian serfs, the single greatest social reform of the nineteenth century."
 flavor_rus_imperialism.2.a: "Let the serfs be free."
 flavor_rus_imperialism.2.b: "The gentry will not permit it."

 flavor_rus_imperialism.3.title: "The Great Siberian Railway"
 flavor_rus_imperialism.3.desc: "Engineers propose a single line of iron from Moscow to the Pacific — seven thousand versts of track across the steppe and the taiga. The cost is enormous, and the strategic value beyond reckoning."
 flavor_rus_imperialism.3.historical_info: "The Trans-Siberian Railway, begun in 1891 and completed in 1916, bound Siberia to European Russia and made Russian power in the Far East possible."
 flavor_rus_imperialism.3.a: "Let the railway be built."
 flavor_rus_imperialism.3.b: "The treasury cannot bear it."

 flavor_rus_imperialism.4.title: "The Year of Disorder"
 flavor_rus_imperialism.4.desc: "The war has gone badly, the cities are hungry, and a peaceful procession to the Winter Palace was met with rifle fire. Strikes, mutinies and a soviet of workers have appeared in the capital."
 flavor_rus_imperialism.4.historical_info: "The Revolution of 1905 forced Nicholas II to issue the October Manifesto, creating a Duma, but the autocracy survived until 1917."
 flavor_rus_imperialism.4.a: "We will grant a constitution and a Duma."
 flavor_rus_imperialism.4.b: "The autocracy will not be surrendered."

 flavor_rus_imperialism.10.title: "The Russian Novel"
 flavor_rus_imperialism.10.desc: "A novelist has published a great work on the moral condition of man — war, family, faith and death — and it is being read from Petersburg to Siberia. The critics argue about it; the censors watch it."
 flavor_rus_imperialism.10.historical_info: "Tolstoy's 'War and Peace' (1869) and Dostoevsky's 'Crime and Punishment' (1866) are among the supreme achievements of the European novel."
 flavor_rus_imperialism.10.a: "We will honour our writers."
 flavor_rus_imperialism.10.b: "The censors will decide."

 flavor_rus_imperialism.11.title: "The Russian School of Music"
 flavor_rus_imperialism.11.desc: "A composer of genius has married the melodies of the Russian folk to the forms of the western concert hall. His works are played in Moscow, in Paris, and in America."
 flavor_rus_imperialism.11.historical_info: "Pyotr Ilyich Tchaikovsky (1840-1893) and the 'Mighty Handful' gave Russia a national school of music."
 flavor_rus_imperialism.11.a: "We will patronise our composers."
 flavor_rus_imperialism.11.b: "Foreign music is good enough."

 # =========================================================
 # OTTOMAN EMPIRE
 # =========================================================
 flavor_tur_imperialism.1.title: "The Tanzimat"
 flavor_tur_imperialism.1.desc: "The reform party proposes to reorganise the empire from top to bottom: a written law for all subjects, a modern army, a modern treasury, and the guarantee of life, honour and property to Muslim and non-Muslim alike."
 flavor_tur_imperialism.1.historical_info: "The Tanzimat ('reorganisation') reforms of 1839-76 modernised Ottoman law, administration and education, and proclaimed equality of all subjects before the law."
 flavor_tur_imperialism.1.a: "We will carry out the reforms."
 flavor_tur_imperialism.1.b: "The old order has served us for four centuries."

 flavor_tur_imperialism.2.title: "The Constitution"
 flavor_tur_imperialism.2.desc: "Young officers and officials, educated in Paris and Constantinople, demand a constitution, a parliament and a limit upon the Sultan's power. The ulema is hostile; the army is sympathetic."
 flavor_tur_imperialism.2.historical_info: "The Ottoman constitution of 1876 established a short-lived parliament; it was suspended by Abdülhamid II in 1878 and restored by the Young Turks in 1908."
 flavor_tur_imperialism.2.a: "A constitution will be granted."
 flavor_tur_imperialism.2.b: "The parliament will be dissolved."

 flavor_tur_imperialism.3.title: "The Balkan Storm"
 flavor_tur_imperialism.3.desc: "One by one our provinces in Europe are slipping away: a rising in Bosnia, a war with Serbia and Montenegro, and now the great powers demand reforms we cannot carry out."
 flavor_tur_imperialism.3.historical_info: "The Balkan crises of 1875-1913 stripped the Ottoman Empire of most of its European territory."
 flavor_tur_imperialism.3.a: "We will fight for every province."
 flavor_tur_imperialism.3.b: "We will buy peace with concessions."

 flavor_tur_imperialism.10.title: "The Imperial Architect"
 flavor_tur_imperialism.10.desc: "A court architect has begun to build in a new manner, joining the forms of the Ottoman tradition to the engineering of Europe. The palaces on the Bosphorus will stand as the image of a modern empire."
 flavor_tur_imperialism.10.historical_info: "The Balyan family of Armenian architects designed the Dolmabahçe and Beylerbeyi palaces and reshaped the Ottoman skyline."
 flavor_tur_imperialism.10.a: "Let him build."
 flavor_tur_imperialism.10.b: "We will build in the old manner."

 # =========================================================
 # JAPAN
 # =========================================================
 flavor_jap_imperialism.1.title: "The Restoration"
 flavor_jap_imperialism.1.desc: "Black ships have come from the West and forced open our ports. The shogunate is discredited; young samurai of the outer domains demand the restoration of the Emperor and the expulsion of the barbarians — or, if that fails, the adoption of their arts."
 flavor_jap_imperialism.1.historical_info: "The Meiji Restoration of 1868 abolished the shogunate, restored the Emperor and launched a programme of rapid modernisation."
 flavor_jap_imperialism.1.a: "The Emperor will rule, and Japan will modernise."
 flavor_jap_imperialism.1.b: "The shogunate will be preserved."

 flavor_jap_imperialism.2.title: "The Mission to the West"
 flavor_jap_imperialism.2.desc: "A great embassy of statesmen and students is proposed to tour America and Europe — to study their factories, their schools, their armies and their constitutions, and to bring home what can be used."
 flavor_jap_imperialism.2.historical_info: "The Iwakura Mission of 1871-73 toured the United States and Europe to study modern institutions."
 flavor_jap_imperialism.2.a: "Let the embassy go."
 flavor_jap_imperialism.2.b: "We have nothing to learn from barbarians."

 flavor_jap_imperialism.3.title: "Leave Asia, Join Europe"
 flavor_jap_imperialism.3.desc: "The question of the age is put plainly by our thinkers: shall Japan remain an Asian nation among Asian nations, or shall she adopt the manners and the power of Europe and take her place among the great empires?"
 flavor_jap_imperialism.3.historical_info: "'Datsu-A Ron' (Leave Asia, 1885) argued that Japan should be treated as a European power rather than as an Asian state."
 flavor_jap_imperialism.3.a: "Japan will join the ranks of the great powers."
 flavor_jap_imperialism.3.b: "Japan will remain herself."

 flavor_jap_imperialism.4.title: "The Empire's First Wars"
 flavor_jap_imperialism.4.desc: "Our army and navy are ready. Korea and Manchuria lie within our reach, and the continental empires that claim them are large but slow. A short, decisive war would make Japan a power to be reckoned with."
 flavor_jap_imperialism.4.historical_info: "Japan defeated China in 1894-95 and Russia in 1904-05, becoming the first Asian power to defeat a European great power."
 flavor_jap_imperialism.4.a: "We will strike while the opportunity lasts."
 flavor_jap_imperialism.4.b: "We will be patient."

 flavor_jap_imperialism.10.title: "Pictures of the Floating World"
 flavor_jap_imperialism.10.desc: "The printmakers of the cities have made an art of the transient world — actors, courtesans, teahouses, the great wave off Kanagawa. The prints are exported as packing paper, and European painters have begun to collect them."
 flavor_jap_imperialism.10.historical_info: "Ukiyo-e prints by Hokusai, Hiroshige and their fellows profoundly influenced the Impressionists and Art Nouveau."
 flavor_jap_imperialism.10.a: "We will honour our artists."
 flavor_jap_imperialism.10.b: "Prints are for wrapping paper."

 # =========================================================
 # UNITED STATES
 # =========================================================
 flavor_usa_imperialism.1.title: "The Frontier Moves West"
 flavor_usa_imperialism.1.desc: "Settlers, surveyors and railroads are pushing the frontier across the continent. The land is vast, the natives resist, and the question of whether the new territories shall be free or slave-holding will not wait."
 flavor_usa_imperialism.1.historical_info: "American expansion across the continent in the nineteenth century was driven by settlement, railroads and the doctrine of 'Manifest Destiny'."
 flavor_usa_imperialism.1.a: "The continent is ours to settle."
 flavor_usa_imperialism.1.b: "We have land enough already."

 flavor_usa_imperialism.2.title: "The Union Divided"
 flavor_usa_imperialism.2.desc: "The election of a president hostile to slavery has driven the southern states to secede. Fort Sumter has been fired upon, and the question of the Union will now be settled by armies."
 flavor_usa_imperialism.2.historical_info: "The American Civil War (1861-65) preserved the Union and abolished slavery."
 flavor_usa_imperialism.2.a: "The Union will be preserved, and slavery ended."
 flavor_usa_imperialism.2.b: "Let the sections part in peace."

 flavor_usa_imperialism.3.title: "The Gilded Age"
 flavor_usa_imperialism.3.desc: "Railroads, steel and oil have made fortunes such as the world has never seen, and the great industrialists bestride the republic like kings. In the cities, the workers organise; in the countryside, the farmers revolt."
 flavor_usa_imperialism.3.historical_info: "The 'Gilded Age' of the 1870s-1900s saw vast industrial growth alongside political corruption and labour conflict."
 flavor_usa_imperialism.3.a: "Industry is the genius of the nation."
 flavor_usa_imperialism.3.b: "The trusts must be broken and the workers protected."

 flavor_usa_imperialism.4.title: "The Splendid Little War"
 flavor_usa_imperialism.4.desc: "A rebellion in Cuba and a sunken battleship in Havana harbour have brought us to the brink of war with Spain. The prize would be an overseas empire; the cost would be our own founding principles."
 flavor_usa_imperialism.4.historical_info: "The Spanish-American War of 1898 made the United States an imperial power in the Caribbean and the Philippines."
 flavor_usa_imperialism.4.a: "We will take up the white man's burden."
 flavor_usa_imperialism.4.b: "A republic does not rule colonies."

 flavor_usa_imperialism.10.title: "The American Voice"
 flavor_usa_imperialism.10.desc: "An American writer has at last found a voice that is neither English nor provincial — the speech of the river and the frontier, plain, humorous and profound. Europe is beginning to read him."
 flavor_usa_imperialism.10.historical_info: "Mark Twain's 'Adventures of Huckleberry Finn' (1884) is regarded as the foundation of a distinctively American literature."
 flavor_usa_imperialism.10.a: "We will honour our writers."
 flavor_usa_imperialism.10.b: "Let the moralists complain."

 flavor_usa_imperialism.11.title: "The Inventor's Laboratory"
 flavor_usa_imperialism.11.desc: "A self-taught inventor proposes to turn invention itself into an industry, with a laboratory of assistants working on electric light, the phonograph and the moving picture all at once."
 flavor_usa_imperialism.11.historical_info: "Thomas Edison's Menlo Park laboratory pioneered industrial research and gave the world the incandescent lamp and the phonograph."
 flavor_usa_imperialism.11.a: "Fund the laboratory."
 flavor_usa_imperialism.11.b: "These are the dreams of a charlatan."

 # =========================================================
 # SPAIN
 # =========================================================
 flavor_spa_imperialism.1.title: "The Carlist Wars"
 flavor_spa_imperialism.1.desc: "The succession is disputed: the liberals support the infant queen, the absolutists her uncle, and the clergy and the Basque provinces have taken up arms for the old order and the old faith."
 flavor_spa_imperialism.1.historical_info: "The Carlist Wars (1833-76) were a series of civil wars over the succession and the nature of the Spanish state."
 flavor_spa_imperialism.1.a: "The liberal monarchy will prevail."
 flavor_spa_imperialism.1.b: "The traditional order will be restored."

 flavor_spa_imperialism.2.title: "The Disaster of 1898"
 flavor_spa_imperialism.2.desc: "A war with the United States has cost us Cuba, Puerto Rico and the Philippines in a single summer. The last of the old empire is gone, and the nation must decide what it is without it."
 flavor_spa_imperialism.2.historical_info: "The 'Disaster of 98' stripped Spain of its remaining overseas empire and provoked the 'Generation of 98' to rethink Spanish national identity."
 flavor_spa_imperialism.2.a: "We must regenerate the nation."
 flavor_spa_imperialism.2.b: "We will restore our empire one day."

 flavor_spa_imperialism.10.title: "The Architect of Barcelona"
 flavor_spa_imperialism.10.desc: "A Catalan architect is building in a manner that seems to grow out of the earth itself — curving stone, coloured tile, forms borrowed from plants and bones. The city is being remade before our eyes."
 flavor_spa_imperialism.10.historical_info: "Antoni Gaudí's Sagrada Família and Park Güell are the masterworks of Catalan Modernisme."
 flavor_spa_imperialism.10.a: "Let him build."
 flavor_spa_imperialism.10.b: "This is not architecture. It is madness."

 # =========================================================
 # PORTUGAL
 # =========================================================
 flavor_por_imperialism.1.title: "The Constitutional Monarchy"
 flavor_por_imperialism.1.desc: "After years of civil war between absolutists and liberals, a charter has been granted and a parliament summoned. The old empire is gone, but the nation has at least a settled constitution."
 flavor_por_imperialism.1.historical_info: "The Liberal Wars (1828-34) ended absolutism in Portugal and established a constitutional monarchy."
 flavor_por_imperialism.1.a: "The charter will be upheld."
 flavor_por_imperialism.1.b: "The old order will return."

 flavor_por_imperialism.2.title: "The Pink Map"
 flavor_por_imperialism.2.desc: "Our explorers and soldiers have surveyed a belt of territory from Angola to Mozambique, and the government proposes to claim it before the other powers arrive. The British have their own designs on the same ground."
 flavor_por_imperialism.2.historical_info: "The 'Pink Map' project to link Angola and Mozambique was destroyed by the British ultimatum of 1890."
 flavor_por_imperialism.2.a: "We will claim the whole of our Africa."
 flavor_por_imperialism.2.b: "We will not quarrel with Britain."

 flavor_por_imperialism.10.title: "The Poet of Portugal"
 flavor_por_imperialism.10.desc: "A poet has appeared who writes of the Portuguese soul, of saudade and of the vanished greatness of the nation. He is read by schoolboys and quoted in the chamber."
 flavor_por_imperialism.10.historical_info: "Fernando Pessoa (1888-1935) and the poets of the 'Geração de Orpheu' transformed Portuguese literature."
 flavor_por_imperialism.10.a: "We will honour our poets."
 flavor_por_imperialism.10.b: "Poetry will not save the nation."

 # =========================================================
 # NETHERLANDS
 # =========================================================
 flavor_ned_imperialism.1.title: "After Belgium"
 flavor_ned_imperialism.1.desc: "The southern provinces have gone their own way, and the kingdom must find a new footing. The merchants of Amsterdam look to the sea and the Indies; the reformers look to a liberal constitution at home."
 flavor_ned_imperialism.1.historical_info: "Belgian independence (1830-39) halved the United Kingdom of the Netherlands and turned Dutch attention to colonial trade."
 flavor_ned_imperialism.1.a: "Our future lies in trade and the Indies."
 flavor_ned_imperialism.1.b: "We will reform at home."

 flavor_ned_imperialism.2.title: "The Cultivation System"
 flavor_ned_imperialism.2.desc: "The Indies are made to grow what Europe will buy, and the profits flow to the treasury. It is enormously profitable, and it is worked by forced labour. Consciences and ledgers are both troubled."
 flavor_ned_imperialism.2.historical_info: "The 'Cultuurstelsel' (1830-70) required Javanese farmers to grow export crops for the Dutch government, and was later criticised and partly reformed under the 'Ethical Policy'."
 flavor_ned_imperialism.2.a: "The system pays. Let it stand."
 flavor_ned_imperialism.2.b: "We will adopt an ethical policy."

 flavor_ned_imperialism.10.title: "The Painter of the New Age"
 flavor_ned_imperialism.10.desc: "A Dutch painter has taken the light of the polders and the colour of the Impressionists and made something entirely his own. He sold almost nothing in his lifetime."
 flavor_ned_imperialism.10.historical_info: "Vincent van Gogh (1853-1890) is among the most influential painters of the modern era."
 flavor_ned_imperialism.10.a: "We will honour him."
 flavor_ned_imperialism.10.b: "He is a madman."

 # =========================================================
 # SWEDEN
 # =========================================================
 flavor_swe_imperialism.1.title: "The Era of Liberty"
 flavor_swe_imperialism.1.desc: "Finland is lost and the age of great-power war is over. The estates have taken the government into their own hands, and Sweden must choose between a free constitution and a new royal absolutism."
 flavor_swe_imperialism.1.historical_info: "The 'Era of Liberty' (1719-72) was Sweden's experiment in parliamentary government; the constitution of 1809 began the modern era."
 flavor_swe_imperialism.1.a: "The estates will govern."
 flavor_swe_imperialism.1.b: "Scandinavia will stand together."

 flavor_swe_imperialism.2.title: "The Iron Breakthrough"
 flavor_swe_imperialism.2.desc: "Swedish iron and Swedish engineers are building a new industry: mines in the north, railways to the coast, factories in the towns. A small country is becoming a modern economy."
 flavor_swe_imperialism.2.historical_info: "Sweden industrialised rapidly in the late nineteenth century on the basis of iron ore, timber and engineering."
 flavor_swe_imperialism.2.a: "Industry will make us rich."
 flavor_swe_imperialism.2.b: "The old countryside is our strength."

 flavor_swe_imperialism.10.title: "The Swedish Novel"
 flavor_swe_imperialism.10.desc: "A Swedish writer has turned the provincial town into a stage for the whole human comedy, and the books are being translated into every European language."
 flavor_swe_imperialism.10.historical_info: "Selma Lagerlöf (1858-1940) was the first woman to win the Nobel Prize in Literature."
 flavor_swe_imperialism.10.a: "We will honour our writers."
 flavor_swe_imperialism.10.b: "Provincial life is not the stuff of literature."

 # =========================================================
 # POLAND-LITHUANIA
 # =========================================================
 flavor_plc_imperialism.1.title: "The National Rising"
 flavor_plc_imperialism.1.desc: "The nation is partitioned but not dead. Officers, students and gentry have risen again for independence, and the peasants have been promised their freedom if they fight."
 flavor_plc_imperialism.1.historical_info: "The November Rising of 1830 and the January Rising of 1863 were Polish insurrections against Russian rule."
 flavor_plc_imperialism.1.a: "We will fight for our independence."
 flavor_plc_imperialism.1.b: "We will preserve the nation by other means."

 flavor_plc_imperialism.2.title: "Organic Work"
 flavor_plc_imperialism.2.desc: "Since the risings have failed, a new programme is proposed: to strengthen the nation from within — schools, banks, railways, cooperatives and industry — so that when the moment comes Poland will be ready."
 flavor_plc_imperialism.2.historical_info: "'Organic work' (praca organiczna) was the programme of economic and educational self-strengthening pursued by Poles after 1864."
 flavor_plc_imperialism.2.a: "We will build the nation from within."
 flavor_plc_imperialism.2.b: "Only the sword will free Poland."

 flavor_plc_imperialism.10.title: "The Polish Composer"
 flavor_plc_imperialism.10.desc: "A Polish composer has taken the mazurka and the polonaise — the dances of the villages — and made of them a national music that all Europe admires and no nation can censor."
 flavor_plc_imperialism.10.a: "We will honour our composers."
 flavor_plc_imperialism.10.b: "Dance music is a trifle."

 # =========================================================
 # ITALY
 # =========================================================
 flavor_ita_imperialism.1.title: "The Legacy of the Risorgimento"
 flavor_ita_imperialism.1.desc: "The nation is made, but it is made of provinces that have never been governed together. The men of the Risorgimento now face the harder task of turning Italians into one people."
 flavor_ita_imperialism.1.historical_info: "After unification in 1861 Italy faced the problem of 'making Italians' — integrating regions with different laws, dialects and economies."
 flavor_ita_imperialism.1.a: "We will make the nation one."
 flavor_ita_imperialism.1.b: "The provinces will govern themselves."

 flavor_ita_imperialism.2.title: "The Southern Question"
 flavor_ita_imperialism.2.desc: "The south is poor, its roads are bad, its great estates are worked by landless labourers, and bandits and the secret societies flourish. The new kingdom has inherited a problem it does not yet understand."
 flavor_ita_imperialism.2.historical_info: "The 'Questione Meridionale' — the economic gap between northern and southern Italy — has shaped Italian politics since unification."
 flavor_ita_imperialism.2.a: "We will reform the south."
 flavor_ita_imperialism.2.b: "We will crush the brigands."

 flavor_ita_imperialism.10.title: "The Opera Houses"
 flavor_ita_imperialism.10.desc: "The Italian stage is the musical capital of the world. A new opera is a matter of national excitement, and the melodies are sung in the streets before the second performance."
 flavor_ita_imperialism.10.a: "We will patronise our composers."
 flavor_ita_imperialism.10.b: "Let the theatres pay for themselves."

 # =========================================================
 # GERMANY
 # =========================================================
 flavor_ger_imperialism.1.title: "The Empire Is Proclaimed"
 flavor_ger_imperialism.1.desc: "In the Hall of Mirrors at Versailles, the German princes have offered the imperial crown to our king. A nation of princes and cities, armies and universities, has become a single empire in a single afternoon."
 flavor_ger_imperialism.1.historical_info: "The German Empire was proclaimed on 18 January 1871 in the Hall of Mirrors at Versailles."
 flavor_ger_imperialism.1.a: "The Empire is proclaimed."
 flavor_ger_imperialism.1.b: "A liberal empire will be built."

 flavor_ger_imperialism.2.title: "The Land of Poets and Thinkers"
 flavor_ger_imperialism.2.desc: "Our universities are the best in the world, our scientists win the Nobel prizes, and our industry lives by its laboratories. A nation that reads and invents will not long be poor."
 flavor_ger_imperialism.2.a: "We will invest in science and learning."
 flavor_ger_imperialism.2.b: "The army is the true school of the nation."

 flavor_ger_imperialism.3.title: "Weltpolitik"
 flavor_ger_imperialism.3.desc: "The empire has grown great in Europe, but the world is being divided by other hands. A fleet, colonies and a place in every negotiation — this is the policy the Kaiser demands."
 flavor_ger_imperialism.3.a: "We demand our place in the sun."
 flavor_ger_imperialism.3.b: "Germany is a continental power, not a maritime one."

 flavor_ger_imperialism.10.title: "The German Composer"
 flavor_ger_imperialism.10.desc: "A German composer has completed a cycle of operas on the old northern myths, and the new music — chromatic, enormous, overwhelming — is transforming what music may be."
 flavor_ger_imperialism.10.a: "We will build him a festival theatre."
 flavor_ger_imperialism.10.b: "This is noise, not music."

 # =========================================================
 # GREAT BRITAIN
 # =========================================================
 flavor_gbr_imperialism.1.title: "The Imperial Zenith"
 flavor_gbr_imperialism.1.desc: "A quarter of the world's people and a third of its trade lie under our flag. The empire is not a policy but a fact of nature, and the sun has not set on it in living memory."
 flavor_gbr_imperialism.1.historical_info: "The Victorian era saw the British Empire reach its greatest extent, covering a quarter of the globe."
 flavor_gbr_imperialism.1.a: "We will hold and extend the empire."
 flavor_gbr_imperialism.1.b: "Little England is enough for us."

 flavor_gbr_imperialism.2.title: "The Indian Mutiny"
 flavor_gbr_imperialism.2.desc: "The sepoys have risen, the old Mughal has been proclaimed emperor again, and the Company's rule in India has collapsed in a single summer. The crown must decide who shall govern India."
 flavor_gbr_imperialism.2.historical_info: "The Indian Rebellion of 1857 ended Company rule and established direct Crown rule — the British Raj."
 flavor_gbr_imperialism.2.a: "The Crown will rule India directly."
 flavor_gbr_imperialism.2.b: "The Company will be restored."

 flavor_gbr_imperialism.3.title: "The Repeal of the Corn Laws"
 flavor_gbr_imperialism.3.desc: "The manufacturers and the working classes both demand cheap bread, and the landed interest demands protection. The question is whether Britain shall be an agrarian or an industrial nation."
 flavor_gbr_imperialism.3.historical_info: "The repeal of the Corn Laws in 1846 committed Britain to free trade and cheap food for the industrial cities."
 flavor_gbr_imperialism.3.a: "Free trade will feed the nation."
 flavor_gbr_imperialism.3.b: "The landed interest will be protected."

 flavor_gbr_imperialism.10.title: "The Victorian Novel"
 flavor_gbr_imperialism.10.desc: "The novel has become the great popular art of the age, published in monthly parts and devoured by every class. Its author has made the injustices of the law courts and the schools his subject."
 flavor_gbr_imperialism.10.a: "We will honour our writers."
 flavor_gbr_imperialism.10.b: "Novels corrupt the lower orders."


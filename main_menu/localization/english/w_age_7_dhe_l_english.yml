# ===== Historical notes for events that were missing them =====
 flavor_gbr_imperialism.10.historical_info: "The Victorian novel was the great popular art of the age, published in monthly parts and read by every class. Charles Dickens (1812-1870) made the injustices of the courts, the schools and the workhouses his subject, and was the most widely read novelist of his time."
 flavor_ger_imperialism.2.historical_info: "The German research university, with its seminars and laboratories, was the model for the world in the nineteenth century. German scientists won a disproportionate share of the early Nobel Prizes, and German industry lived by its laboratories."
 flavor_ger_imperialism.3.historical_info: "'Weltpolitik' was the policy announced by Kaiser Wilhelm II and Bernhard von Bülow in the 1890s: Germany would demand a share in the colonial and naval affairs of the world commensurate with her strength. It brought her into collision with Britain."
 flavor_ger_imperialism.10.historical_info: "Richard Wagner (1813-1883) built a festival theatre at Bayreuth for his music dramas, and his chromatic harmony and leitmotifs transformed the course of European music."
 flavor_ita_imperialism.10.historical_info: "Giuseppe Verdi (1813-1901) was the most popular opera composer of the century and, through works such as Nabucco and the chorus 'Va, pensiero', became a symbol of the Italian national movement."
 flavor_plc_imperialism.10.historical_info: "Frédéric Chopin (1810-1849) took the mazurka and the polonaise, the dance forms of the Polish countryside, and made of them a national music that all Europe admired."
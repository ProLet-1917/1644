l_english:
 italy_unification: "The Italian Question"
 italy_unification_desc: "The Italian states are stirred by the dream of a single nation. The strongest of them gather the lesser into their alliances, but Rome is held by the Papacy and the great powers watch the peninsula closely."
 ITALIAN_UNIFIER: "Potential Unifiers"
 ITALIAN_COUNTRY: "Italian Countries"
 ITALIAN_PAPAL_STATES: "The Papal States"
 only_1_italian_unifier_now: "There is only one remaining potential unifier"
 italy_unification_union: "Italian Unification Alliance"
 ITALY_UNIFICATION_UNION_NAME: "Italian Unification Alliance"
 support_the_italian_unifier: "Support a Unifier"
 support_the_italian_unifier_desc: "Join the alliance of an Italian unifier and back their claim to lead the nation."
 declare_unification_of_italy_kingdom: "Declare the Kingdom of Italy"
 declare_unification_of_italy_kingdom_desc: "As the sole remaining unifier, we can proclaim the Kingdom of Italy and invite the alliance members — and the other Italian states — to join us."
 launch_expedition_of_the_thousand: "Launch an Expedition of the Thousand"
 launch_expedition_of_the_thousand_desc: "A band of volunteers under a charismatic leader marches to liberate the south. It may win glory, or it may end in disaster."
 intervene_in_italy: "Intervene in Italy"
 intervene_in_italy_desc: "The settlement of the peninsula concerns us. We will make our weight felt in the Italian question."
 cb_italian_unification: "Italian Unification"
 cb_italian_unification_desc: "The unification of Italy is our cause, and those who stand against it must be brought to heel."
 give_up_leader_of_italy_unification_union: "Give up leadership of the Italian unification alliance"

 italy_unification.1000.title: "The Italian Question"
 italy_unification.1000.desc: "From Piedmont to Sicily, men speak of a single Italian nation. The greater states now bid for the leadership of the Risorgimento, gathering the lesser into their alliances."
 italy_unification.1000.a: "A new age for Italy begins."

 italy_unification.1001.title: "Italy Is Proclaimed"
 italy_unification.1001.desc: "[target_country.GetNameWithNoTooltip] has proclaimed the Kingdom of Italy. As members of their alliance, we are expected to enter the new state."
 italy_unification.1001.a: "The nation calls."

 italy_unification.1002.title: "An Invitation from Italy"
 italy_unification.1002.desc: "[target_country.GetNameWithNoTooltip] has proclaimed the Kingdom of Italy. They invite all remaining Italian states to join the new nation."
 italy_unification.1002.a: "We will join Italy."
 italy_unification.1002.b: "We will keep our independence."

 italy_unification.1101.title: "The Papal States and the New Kingdom"
 italy_unification.1101.desc: "A new Kingdom of Italy has been proclaimed, and its armies stand before the gates of Rome. The Cardinals must decide whether to submit to the new kingdom or to resist to the last."
 italy_unification.1101.a: "We submit to the new kingdom."
 italy_unification.1101.b: "We will never surrender Rome."

 italy_unification.1200.title: "The Roman Question"
 italy_unification.1200.desc: "The kingdom is nearly made whole, but Rome remains in the hands of the Papacy. So long as the Pope is a temporal sovereign in the heart of Italy, our nation will never be complete."
 italy_unification.1200.historical_info: "The Roman Question was the dispute between the Kingdom of Italy and the Papacy over Rome, resolved incompletely in 1871 by the Law of Guarantees and finally settled by the Lateran Treaty of 1929."
 italy_unification.1200.a: "We will offer the Pope a concordat."
 italy_unification.1200.b: "We will take Rome by force."
 italy_unification.1200.c: "The question can wait."

 italy_unification.1201.title: "The Pope Protests"
 italy_unification.1201.desc: "The Holy See has denounced the seizure of its patrimony before the whole Catholic world. The faithful are divided, and our clergy are troubled."
 italy_unification.1201.a: "The temporal power of the Pope is at an end."
 italy_unification.1201.b: "We will make amends to the Church."

 italy_unification.1300.title: "The Italian Question and Us"
 italy_unification.1300.desc: "The unification of Italy threatens the balance of power in the Mediterranean and the position of our friends in the peninsula. The cabinet must decide how far we will go."
 italy_unification.1300.a: "We will intervene in arms."
 italy_unification.1300.b: "We will mediate diplomatically."
 italy_unification.1300.c: "We will not interfere."

 italy_unification.1301.title: "The Italian Question and Us"
 italy_unification.1301.desc: "The unification of Italy may disturb our own possessions in the peninsula. The court must decide how to respond to the Risorgimento."
 italy_unification.1301.a: "We will intervene."
 italy_unification.1301.b: "We will let events take their course."

 italy_unification.1400.title: "The Expedition of the Thousand"
 italy_unification.1400.desc: "A charismatic volunteer leader offers to raise a small band of adventurers and march south to overturn the old order. Fortune favours the bold, but failure would be humiliating."
 italy_unification.1400.historical_info: "In 1860 Giuseppe Garibaldi sailed from Genoa with about a thousand volunteers, landed in Sicily and overthrew the Kingdom of the Two Sicilies, handing his conquests to Victor Emmanuel II."
 italy_unification.1400.a: "Let the volunteers march."
 italy_unification.1400.b: "This is a fool's errand."

 papal_concordat: "Papal Concordat"
 papal_concordat_desc: "An agreement with the Holy See has reconciled the Papacy to the new order and given the Church a secure place within it."
 roman_question_settled_negotiated: "The Roman Question Settled"
 roman_question_settled_negotiated_desc: "Rome has entered the kingdom by agreement rather than by force, and the crown is the stronger for it."
 roman_question_settled_by_force: "Rome Taken by Force"
 roman_question_settled_by_force_desc: "The capital is ours, but the seizure of Rome has cost us the goodwill of Catholic opinion throughout Europe."
 papal_imprisoned_in_the_vatican: "The Pope in the Vatican"
 papal_imprisoned_in_the_vatican_desc: "The Holy Father refuses to recognise the new kingdom and has withdrawn behind the walls of the Vatican, a prisoner in his own palace."
 italian_unification_foreign_pressure: "Foreign Pressure over Italy"
 italian_unification_foreign_pressure_desc: "The great powers have made the Italian question their business, and our freedom of action is constrained accordingly."
 italian_risorgimento_fever: "Risorgimento Fever"
 italian_risorgimento_fever_desc: "The nation is made, and the people are intoxicated with it. Volunteers flock to the colours and the whole peninsula resounds with the name of Italy."
 roman_question_postponed: "The Roman Question Postponed"
 roman_question_postponed_desc: "We have put off the settlement of Rome, and both the Church and the patriots are disappointed in us."
 expedition_of_the_thousand: "Expedition of the Thousand"
 expedition_of_the_thousand_desc: "A thousand volunteers in red shirts have carried our cause into the south, and no one who has seen them forgets it."


l_english:
 # ===== Formable countries added by Anno 1644 (engine keys are <KEY>_f / <KEY>_f_desc) =====
 VOB_f: "Brazil"
 VOB_f_desc: "The vast land of the southern cross has grown rich on sugar, gold and cattle, and its captains no longer look to Lisbon for orders. Let the Viceroyalty be swept away and a Brazilian nation take its place among the powers."
 LPL_f: "Rio de la Plata"
 LPL_f_desc: "The silver of Potosí flows down the rivers to the great estuary, and the cattle herds of the pampas feed the towns of the coast. From Buenos Aires and Montevideo a new nation of the Plate may be proclaimed."
 VOP_f: "Peru"
 VOP_f_desc: "The Viceroyalty of Peru rests on the mines of Potosí and the labour of the Andes. The criollo families of Lima have grown accustomed to governing, and need only declare themselves a nation to be one."
 NSP_f: "New Spain"
 NSP_f_desc: "From Mexico City the viceroys have ruled half a continent. The silver of Zacatecas, the roads of the north and the great estates of the valley have made the colony strong enough to stand alone."
 NEN_f: "New England"
 NEN_f_desc: "The towns of the northern coast live by the meeting-house, the school and the ship. Their charters are patents of self-government in all but name, and the day is coming when they will need no charter at all."
 NFR_f: "New France"
 NFR_f_desc: "The fur trade of the St Lawrence has pushed the settlements west, and the farms of the river valley now feed them. A French nation in America has taken root, and will not be transplanted."
 GRN_f: "New Granada"
 GRN_f_desc: "The highlands of Bogotá command the road between the Caribbean and the Pacific, and the emerald mines of Muzo fill the treasury. A new kingdom of New Granada stands ready to be declared."
 VNZ_f: "Venezuela"
 VNZ_f_desc: "The pearl coast and the cacao plantations of the tierra caliente have made Caracas a city of merchants. Let Venezuela be its own master."
 ECU_f: "Ecuador"
 ECU_f_desc: "The equatorial mountains hold Quito and Guayaquil, and the cacao of the coast is carried to the world. A nation between the Andes and the sea may be proclaimed here."
 BLV_f: "Bolivia"
 BLV_f_desc: "Alto Perú is the richest mining province of the empire, and Potosí's mountain of silver has no equal. The land which the mines have made rich can govern itself."
 CLH_f: "Chile"
 CLH_f_desc: "Between the desert to the north and the forests to the south, and shut in by the Andes and the sea, Chile has grown into a distinct land with its own temper. Let it be a nation."
 URG_f: "Uruguay"
 URG_f_desc: "The Banda Oriental and its haven at Montevideo lie on the northern bank of the Plate. The cattle and the ports can sustain a nation of their own."
 PGY_f: "Paraguay"
 PGY_f_desc: "Asunción is one of the oldest cities of the interior, and the Guaraní missions of the Jesuit towns have made a people of their own. Paraguay can stand alone."
 UCA_f: "United Provinces of Central America"
 UCA_f_desc: "Guatemala, San Salvador, Honduras, Nicaragua and Costa Rica share a captaincy-general, a coastline and a fear of being ruled from elsewhere. Let them form a single federation rather than five quarrels."
 GTM_f: "Guatemala"
 GTM_f_desc: "The old captaincy-general of Guatemala keeps the courts, the mint and the audiencia, and its capital has been the seat of government for three centuries. It may become a nation in its own right."
 COS_f: "Costa Rica"
 COS_f_desc: "The fertile highlands of the interior, far from the mines and the great roads, have bred a province of small farmers. Let Costa Rica be a nation of its own."
 NIC_f: "Nicaragua"
 NIC_f_desc: "The great lake and the route across the isthmus have always made Nicaragua a place of passage. It can be a country as well as a road."
 CUB_f: "Cuba"
 CUB_f_desc: "The largest of the Antilles, with the finest harbour of the Caribbean and sugar plantations without end, has become the keystone of the Spanish Indies. Cuba may claim the rank of a nation."
 HTI_f: "Haiti"
 HTI_f_desc: "The western part of Hispaniola feeds the world with sugar and coffee, worked by men who were not born to chains. They have taken their freedom by the sword and will not give it back."
 SDM_f: "Santo Domingo"
 SDM_f_desc: "The oldest city of the New World stands on the eastern shore of Hispaniola, and the cattle ranches of the interior have made it a land of small holders. Let it be sovereign."
 QUE_f: "Quebec"
 QUE_f_desc: "The settlements of the St Lawrence have their own language, their own church and their own laws. A Canadien nation may be proclaimed on the banks of the great river."
 NNL_f: "New Netherland"
 NNL_f_desc: "The valley of the great river and the bay beyond it were settled by the Dutch, and their people remain. Let New Netherland be a nation in its own right."
 AUS_f: "Australia"
 AUS_f_desc: "The southern continent is a land of convict settlements, wool and gold. Distant by half a world from the government that claims it, it will in time govern itself."
 NZL_f: "New Zealand"
 NZL_f_desc: "Two islands of forests, mountains and rivers, settled from the sea and by the Maori people. A nation of the southern seas may be declared here."
 SAF_f: "South Africa"
 SAF_f_desc: "The Cape of Good Hope commands the road to the Indies eastward and to Europe, and the settlers of the interior have grown beyond the reach of the Company. Let a new nation be founded there."

 # ===== STATIC_MODIFIER aliases for the new-world formables =====
 STATIC_MODIFIER_NAME_new_world_nation_founded: "A Nation Is Founded"
 STATIC_MODIFIER_DESC_new_world_nation_founded: "The colony has declared itself a nation, with its own government, its own flag and its own place among the powers of the world."

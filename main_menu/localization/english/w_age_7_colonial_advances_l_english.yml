l_english:
 # ===== Generic colonial branch =====
 colonial_frontier_expansion: "Frontier Expansion"
 colonial_frontier_expansion_desc: "The frontier is pushed further inland: surveyed, settled and connected to the coast."
 immigration_policy_advance: "Immigration Policy"
 immigration_policy_advance_desc: "The state actively recruits settlers abroad and grants them land, tools and passage."
 continental_railroad_advance: "Continental Railroad"
 continental_railroad_advance_desc: "A single line of iron binds the settled coast to the interior and the interior to the coast."
 federal_industrialization_advance: "Federal Industrialisation"
 federal_industrialization_advance_desc: "Forges, mills and machine shops are established behind a tariff wall, on native ore and native fuel."
 colonial_constitution_advance: "Colonial Constitution"
 colonial_constitution_advance_desc: "A written frame of government gives the colony its own assembly, courts and charter of rights."
 colonial_manifest_destiny_advance: "Manifest Destiny"
 colonial_manifest_destiny_advance_desc: "It is the evident destiny of our nation to spread across the continent and to carry its institutions with it."
 public_land_grants_advance: "Public Land Grants"
 public_land_grants_advance_desc: "Surveyed public land is granted to settlers who will improve it, on easy terms."
 transcontinental_telegraph_advance: "Transcontinental Telegraph"
 transcontinental_telegraph_advance_desc: "A line of poles and wire joins the far coasts, and news travels in minutes rather than months."
 independent_foreign_policy_advance: "Independent Foreign Policy"
 independent_foreign_policy_advance_desc: "We conduct our own diplomacy, conclude our own treaties and answer to no foreign ministry."

 # ===== Thirteen Colonies / United States =====
 usa_manifest_destiny_advance: "Our Manifest Destiny"
 usa_manifest_destiny_advance_desc: "The continent is ours to settle from ocean to ocean, and no power may deny it."
 usa_homestead_act_advance: "The Homestead Act"
 usa_homestead_act_advance_desc: "A quarter-section of public land to any head of family who will live on it and improve it."
 usa_abolition_amendment_advance: "Abolition Amendment"
 usa_abolition_amendment_advance_desc: "Slavery is abolished by constitutional amendment, and the freedmen are made citizens."
 usa_transcontinental_railroad_advance: "The Transcontinental Railroad"
 usa_transcontinental_railroad_advance_desc: "Two companies race across the plains and mountains to meet at the far end of the continent."
 usa_progressive_reform_advance: "The Progressive Movement"
 usa_progressive_reform_advance_desc: "The trusts are regulated, the cities cleaned up and the franchise extended by amendment."

 # ===== New Spain / Mexico =====
 mex_mining_modernization_advance: "Mining Modernisation"
 mex_mining_modernization_advance_desc: "Steam pumps, drainage and modern refining restore the silver mines to their old richness."
 mex_reform_wars_advance: "The Reform Laws"
 mex_reform_wars_advance_desc: "The liberal constitution separates Church and State and abolishes the corporate privileges of the clergy and the army."
 mex_land_reform_advance: "Land Reform"
 mex_land_reform_advance_desc: "The great estates are broken up and the communal lands of the villages restored."

 # ===== Brazil =====
 brz_coffee_economy_advance: "The Coffee Economy"
 brz_coffee_economy_advance_desc: "The coffee groves of the Paraíba valley make Brazil the greatest exporter of the bean in the world."
 brz_abolition_advance: "The Golden Law"
 brz_abolition_advance_desc: "Slavery is abolished throughout the empire, and the last of the old plantation order passes away."
 brz_republic_advance: "The Republic"
 brz_republic_advance_desc: "The empire is replaced by a federal republic of states, with a constitution and an elected president."

 # ===== Canada =====
 can_dominion_advance: "Dominion Status"
 can_dominion_advance_desc: "The provinces are united in a self-governing dominion, with its own parliament and ministry."
 can_pacific_railway_advance: "The Pacific Railway"
 can_pacific_railway_advance_desc: "A single line of steel binds the Atlantic provinces to the Pacific coast."

 # ===== Rio de la Plata =====
 arg_conquest_of_the_desert_advance: "Conquest of the Desert"
 arg_conquest_of_the_desert_advance_desc: "The frontier is extended south and west by force of arms, and the land opened to settlement."
 arg_export_economy_advance: "The Export Economy"
 arg_export_economy_advance_desc: "Beef, hides, wheat and wool are shipped to Europe through refrigerated holds and new railways."

l_english:
 germany_unification: "German Unification"
 germany_unification_desc: "The German states are seeking a nation-state. Unifiers gather lesser German countries into their alliances, and may proclaim a unified Germany."
 POTENTIAL_UNIFIER: "Potential Unifiers"
 GERMAN_COUNTRY: "German Countries"
 demand_vassalization_from_members_tt: "Members of our unification alliance will be integrated into Germany."
 declare_unification_of_germany_empire: "Declare the Unification of Germany"
 declare_unification_of_germany_empire_desc: "As the sole remaining unifier, we can proclaim the German Empire and invite our alliance members — and other German states — to join us."
 declare_unification_through_hre: "Unify Germany through the Empire"
 declare_unification_through_hre_desc: "As Emperor of the Holy Roman Empire, we can proclaim a German nation, invite the princes to join, and dissolve the Empire."
 support_the_unifier: "Support a Unifier"
 support_the_unifier_desc: "Join one of the German unification alliances and back that unifier."
 only_1_unifier_now: "There is only one remaining potential unifier"
 germany_unification.1000.title: "The German Question"
 germany_unification.1000.desc: "Across the German lands, princes and burghers speak of a single nation. Powerful German states now bid for the role of unifier, gathering lesser countries into their alliances."
 germany_unification.1000.a: "A new age for Germany begins."
 germany_unification.1001.title: "Germany Is Proclaimed"
 germany_unification.1001.desc: "[target_country.GetNameWithNoTooltip] has declared the unification of Germany. As members of their alliance, we are expected to enter the new state."
 germany_unification.1001.a: "The nation calls."
 germany_unification.1002.title: "An Invitation from Germany"
 germany_unification.1002.desc: "[target_country.GetNameWithNoTooltip] has proclaimed a unified Germany. They invite all remaining German states to join the new nation."
 germany_unification.1002.a: "We will join Germany."
 germany_unification.1002.b: "We will keep our independence."
 germany_unification.1101.title: "The Empire Becomes Germany"
 germany_unification.1101.desc: "The Emperor has proclaimed a unified German nation and dissolved the Holy Roman Empire. The princes must decide whether to enter Germany or stand alone."
 germany_unification.1101.a: "We enter Germany."
 germany_unification.1101.b: "We remain independent."

 germany_unification.1200.title: "The Brothers' War"
 germany_unification.1200.desc: "Two German powers now claim the leadership of the nation. The question can no longer be settled by congress and compromise alone — it will be decided by blood and iron, or by a bargain struck in the shadow of a general war."
 germany_unification.1200.historical_info: "The Austro-Prussian War of 1866 decided the question of 'Lesser Germany' versus 'Greater Germany' in favour of Prussia and led to the North German Confederation."
 germany_unification.1200.a: "The question will be decided by arms."
 germany_unification.1200.b: "We will seek a compromise."

 germany_unification.1300.title: "The North German Confederation"
 germany_unification.1300.desc: "The northern states have been bound to us by treaty, common institutions and a common army. The Confederation is not yet a nation, but it is the shell of one."
 germany_unification.1300.historical_info: "The North German Confederation of 1867 united the German states north of the Main under Prussian leadership, with a federal council, a Reichstag and a common army."
 germany_unification.1300.a: "We will build the Confederation."
 germany_unification.1300.b: "Let the states keep their freedom."

 germany_unification.1400.title: "Blood and Iron"
 germany_unification.1400.desc: "The great questions of the day will not be settled by speeches and majority resolutions but by iron and blood. Our army and our diplomacy must be forged into a single instrument of policy."
 germany_unification.1400.historical_info: "Otto von Bismarck's 'blood and iron' speech of 1862 defined the Prussian path to German unification through a strengthened army and an assertive foreign policy."
 germany_unification.1400.a: "Iron and blood it shall be."
 germany_unification.1400.b: "That is a dangerous course."

 german_dual_leadership_contest: "Contest for German Leadership"
 german_dual_leadership_contest_desc: "Two German powers contend for the leadership of the nation, and the dispute has hardened into rivalry."
 german_dual_leadership_compromise: "Compromise over German Leadership"
 german_dual_leadership_compromise_desc: "A bargain has been struck between the German powers, and the question of leadership has been deferred."
 north_german_confederation: "North German Confederation"
 north_german_confederation_desc: "The northern states are bound to us by common institutions and a common army."
 blood_and_iron: "Blood and Iron"
 blood_and_iron_desc: "The great questions of the day will be settled by iron and blood, and our army is the instrument of that policy."


l_simp_chinese:
 LOADING_TIP_0: "#T “虽朕薄德匪躬，上干天咎，然皆诸臣之误朕也。”#!\n#tooltip_subheading ——崇祯帝遗诏#!"
 LOADING_TIP_1: "#T “朕死，无面目见祖宗于地下，自去冠冕，以发覆面，任贼分裂朕尸，无伤百姓一人。”#!\n#tooltip_subheading ——崇祯帝遗诏#!"
 LOADING_TIP_2: "#T “独夫授首，拟尧舜而多武功；四海归心，比汤武而无惭德。”#!\n#tooltip_subheading ——为闯王李自成劝进表#!"
 LOADING_TIP_3: "#T “后之为人君者不然，以为天下利害之权皆出于我，我以天下之利尽归于己，以天下之害尽归于人，亦无不可。使天下之人不敢自私，不敢自利，以我之大私为天下之大公。”#!\n#tooltip_subheading ——明末思想家黄宗羲#italic《明夷待访录》#!"
 LOADING_TIP_4: "#T “凡投诚官吏军民，皆著薙发，衣冠悉尊本朝制度。各官宜痛改故明陋习，共砥忠廉，毋朘民自利。”#!\n#tooltip_subheading ——摄政王多尔衮谕令#!"
 LOADING_TIP_5: "#T “美日寸影，勿尔空过；所见万品，与时并流。”#!\n#tooltip_subheading ——利玛窦墓志铭#!"
 LOADING_TIP_6: "#T “宁死荒外，毋降也。”#!\n#tooltip_subheading ——大明晋王李定国遗言#!"
 LOADING_TIP_7: "#T 一生事业总成空，半世功名在梦中。死后不愁无勇将，忠魂依旧守辽东。#! \n #tooltip_subheading ——袁崇焕#italic《临刑口占》!# (1629)#!"
 LOADING_TIP_8: "#T “经略从北来，审知松山殉难故督师洪公果死耶？抑未死耶？”#!\n#tooltip_subheading ——义军首领孙兆奎被俘后反问洪承畴 (1647)#!"
 LOADING_TIP_9: "#T “驱逐胡虏，恢复中华，立纲陈纪，救济斯民。”#!\n#tooltip_subheading ——朱元璋#italic《奉天讨蒙元檄文》#! (1367)#!"
 LOADING_TIP_10: "#T “纲常万古，磨灭不得；轮回复始，终古常新。”#! \n#tooltip_subheading —— 大儒黄道周南京遗墨 (1646)#!"
 LOADING_TIP_11: "#T “八十日带发效忠，表十七代先朝未亡之本；十万人同心死义，留三百里大明不改之江山。”#! \n
 LOADING_TIP_12: "#T “缟素临江誓灭胡，雄师十万气吞吴。试看天堑投鞭渡，不信中原不姓朱！”#! \n #tooltip_subheading —— 郑成功#italic 《出师讨满夷自瓜州至金陵》》#!"
 LOADING_TIP_13: "#T “保国者，其君其臣肉食者谋之；保天下者，匹夫之贱与有责焉耳矣。”#! \n#tooltip_subheading —— 顾炎武#italic《日知录》#! (1670)#!"
 LOADING_TIP_14: "#T “眼见他起高楼，眼见他宴宾客，眼见他楼塌了。”#!\n#tooltip_subheading ——孔尚任#italic《桃花扇》#!"
 LOADING_TIP_15: "#T “美日寸影，勿尔空过；所见万品，与时并流。”#!\n#tooltip_subheading ——利玛窦墓志铭#!"
 LOADING_TIP_16: "#T “我立誓绝不发动不义的战争，但也绝不终止正义的战争——除非敌人已被彻底击败。”#!\n#tooltip_subheading ——瑞典国王 卡尔十二世，1699年#!"
 LOADING_TIP_17: "#T “一个政府向其他政府学习技术，其最快学会的，无过于向人民腰包刮取金钱的技术。”#!\n#tooltip_subheading ——亚当·斯密，苏格兰经济学家，#italic 《国富论》#!，1776年#!"
 LOADING_TIP_18: "#T “我恳求你们，在基督的怀抱中，想想你们可能错了。”#!\n#tooltip_subheading ——奥利弗·克伦威尔，英格兰、苏格兰及爱尔兰联邦护国公，1652年#!"
 LOADING_TIP_19: "#T “我怀着遗憾的心情宣布这一冷酷的真相：路易必须死，因为祖国必须生。”#!\n#tooltip_subheading ——马克西米连·罗伯斯庇尔，国民公会代表，1792年#!"
 LOADING_TIP_20: "#T “我从你这里得不到任何援助与裨益。我从未料到你竟会如此，曾对你怀有全然不同的期待，如今方知一切尽是虚妄……”#!\n#tooltip_subheading ——雷恩舍尔德于1708年波尔塔瓦战役中对贻误战机的莱文豪普特#!"
 LOADING_TIP_21: "#T “既然我的双脚已沾满泥泞，注定落草为寇，那么与其做无名小卒，不如当个船长。”#!\n#tooltip_subheading ——威尔士海盗船长 “黑巴特”，1719年#!"
 LOADING_TIP_22: "#T “宁可如雄狮称霸一日，也不似豺狼苟活百年！”#!\n#tooltip_subheading ——迈索尔之虎 蒂普苏丹，约1780年#!"
 LOADING_TIP_23: "#T “我的正义之路尚未终结——它必将延续。”#!\n#tooltip_subheading ——夏威夷国王 卡美哈梅哈一世，1819年，遗言#!"
 LOADING_TIP_24: "#T “在佛罗里达、弗吉尼亚、新英格兰与加拿大，这里的土地广阔，足以让全体基督徒耕耘不尽。”#!\n#tooltip_subheading ——英国殖民者 约翰·史密斯船长，1631年#!"
 LOADING_TIP_25: "#T “我们的独立必须不惜一切代价实现。若有产者不愿支持，他们必将倾覆；我们将依靠社会中那众多且可敬的无产者之力，自立前行。”#!\n#tooltip_subheading ——爱尔兰革命者 沃尔夫·托恩，1796年#!"
 LOADING_TIP_26: "#T “美洲没有法定的国王、贵族与神职阶层，它是这地表之上最繁荣且治理最完美的土地。”#!\n#tooltip_subheading ——爱尔兰革命者 沃尔夫·托恩，1796年#!"
 LOADING_TIP_27: "#T “我们认为这些真理是不言而喻的：人人生而平等，造物者赋予他们若干不可剥夺的权利，包括生命、自由与对幸福的追求。”#!\n#tooltip_subheading ——《美国独立宣言》，1776年#!"
 LOADING_TIP_28: "#T “平心而论，这两句箴言皆为真理：人与人可为神明相待，人与人亦为彻头彻尾的豺狼。”#!\n#tooltip_subheading ——托马斯·霍布斯，《论公民》，1651年#!"
 LOADING_TIP_29: "#T “人类在原始状态下最为温良——这是自然赋予的一种状态，既与兽类的蒙昧保持距离，又与文明人的致命启蒙相隔均等。”#!\n#tooltip_subheading ——让‑雅克·卢梭，#italic 《论人类不平等的起源和基础》#!，1754年#!"
 LOADING_TIP_30: "#T “杜鹃不啼，则杀之。”#!\n#tooltip_subheading ——织田信长，日本战国大名，活跃于永禄‑天正年间#!"
 LOADING_TIP_31: "#T “杜鹃不啼，则逗其啼。”#!\n#tooltip_subheading ——丰臣秀吉，日本关白，活跃于天正‑庆长年间#!"
 LOADING_TIP_32: "#T “杜鹃不啼，则俟其啼。”#!\n#tooltip_subheading ——德川家康，日本幕府将军，活跃于庆长‑元和年间#!"
 LOADING_TIP_33: "#T “瑞典于我何干？我憎恶其国，尤甚于地狱深渊……”#!\n#tooltip_subheading ——德国剧作家 弗里德里希·席勒，#italic 《华伦斯坦之死》#!，1799年#!"
 LOADING_TIP_34: "#T “视每个法国人如魔鬼本身。”#!\n#tooltip_subheading ——英国海军上将 霍雷肖·纳尔逊，1793年#!"
 LOADING_TIP_35: "#T “我无法再屈身于他人之下：既已挥舞过统帅的权杖，便再无将其搁下之理。”#!\n#tooltip_subheading ——拿破仑·波拿巴，科西嘉炮兵中尉，1790年#!"
 LOADING_TIP_36: "#T “敢于将战舰驶至敌舰近旁的舰长，其决断必然不会出现重大失误。”#!\n#tooltip_subheading ——英国海军上将 霍雷肖·纳尔逊，1805年#!"
 LOADING_TIP_37: "#T “阁下所言对待敌手之方式，实乃#italic 您#!宽宏大度之典型，然在英格兰举国之中，实属罕见。”#!\n#tooltip_subheading ——西班牙海军上将 布拉斯·德莱索，#italic 《致蓝旗舰队副司令爱德华·弗农书》#!，1739年#!"
 LOADING_TIP_38: "#T “每个西班牙人撒尿都得面朝英格兰。”#!\n#tooltip_subheading ——西班牙海军上将 布拉斯·德莱索，于1741年卡塔赫纳围城期间#!"
 LOADING_TIP_39: "#T “贪生者死，忘死者生。”#!\n#tooltip_subheading ——上杉谦信，日本战国大名，活跃于天文‑天正年间#!"
 LOADING_TIP_40: "#T “就学之于人，犹枝叶之于树，岂可或缺？”\n#tooltip_subheading ——武田信玄，日本战国大名，活跃于天文‑元龟年间#!"
 LOADING_TIP_41: "#T “只要加泰罗尼亚尚存一人，吾等便必有敌人与战争。”#!\n#tooltip_subheading ——卡斯蒂利亚作家 弗朗西斯科·德·克韦多，1645年#!"
 LOADING_TIP_42: "#T “西班牙多处几近荒芜凋敝。盖因民性怠惰成性，颇似威尔士人……”#!\n#tooltip_subheading ——英格兰作家 弗朗西斯·威勒比，1673年#!"
 LOADING_TIP_43: "#T “。肉为人食骨践泥，魂虽黄昏不敢啼。惟羡芦花白如练，随风俱起免尘溅。君不见片片不是芦花飞，乃是满途白骨飞霜霰。”#!\n#tooltip_subheading ——左懋第#italic《芦花行》#!"
 LOADING_TIP_44: "#T “莫道萤光小，犹怀照夜心。清风不识字，何故乱翻书。”#!\n#tooltip_subheading ——徐骏#italic《无题》#! (1730)#!"
 LOADING_TIP_45: "#T “崇祯五年十二月，余往西湖。大雪三日，湖中人鸟声俱绝。”#!\n#tooltip_subheading ——张岱#italic《湖心亭看雪》#! (1633)#!"
 LOADING_TIP_46: "#T “君非甚暗，孤立而炀蔽恒多；臣尽行私，比党而公忠绝少。”甚至贿通宫府，朝端之威福日移；利擅宗绅，闾左之脂膏罄竭。”#!\n#tooltip_subheading ——李自成#italic《永昌元年诏》#! (1644)#!"
 LOADING_TIP_47: "#T “肆昊天既穷乎仁爱，致兆民爰苦于灾祲。朕起布衣，目击憔悴之形，身切痌瘝之痛。”#!\n#tooltip_subheading ——李自成#italic《永昌元年诏》#! (1644)#!"
 LOADING_TIP_48: "#T “予闻不共戴天者，君父之仇；救灾恤患者，邻国之义。”#!\n#tooltip_subheading ——多尔衮入关檄(1644)#!"
 LOADING_TIP_49: "#T “英格兰有六十种宗教派别，却只有一种酱料。”#!\n#tooltip_subheading ——弗朗切斯科·卡拉乔洛，那不勒斯海军上将，卒于1799年#!"
 LOADING_TIP_50: "#T “无事袖手谈心性，临危一死报君王。”#!\n#tooltip_subheading ——明末清初学者颜元#!"
 LOADING_TIP_51: "#T “杀牛羊，备酒浆，开了城门迎闯王，闯王来了不纳粮。吃他娘，着她娘，吃着不够有闯王。”#!\n#tooltip_subheading ——李自成起义军口号#!"
 LOADING_TIP_52: "#T “天生万物与人，人无一物与天，杀杀杀杀杀杀杀！”#!\n#tooltip_subheading ——张献忠起义军口号#!"
 LOADING_TIP_53: "#T “慨自李贼倡叛，神京陆沉。建酋本我属夷，屡生反侧，遂乘多难，窃踞中原。”#!\n#tooltip_subheading ——张煌言#italic《南明讨伐满清檄文》#!(1662)#!"
 LOADING_TIP_54: "#T “身后有余忘缩手，眼前无路想回头。”#!\n#tooltip_subheading ——曹雪芹#italic《红楼梦》第二回#! (1791)#!"
 LOADING_TIP_55: "#T “三年羁旅客，今日又南冠。无限山河泪，谁言天地宽。”#!\n#tooltip_subheading ——夏完淳#italic《别云间》#! (1647)#!"
 LOADING_TIP_56: "#T “为天下之大害者，君而已矣！”#!\n#tooltip_subheading ——明末思想家黄宗羲#italic《明夷待访录》#! (1661)#!"
 LOADING_TIP_57: "#T “天下者，非一姓之私也，兴亡之修短有恒数，苟易姓而无原野流血之惨，则轻授他人而民不病。”#!\n#tooltip_subheading ——王夫之#italic《读通鉴论》#! (1691)#!"
 LOADING_TIP_58: "#T “生存还是毁灭，这是一个值得考虑的问题。”#!\n#tooltip_subheading ——莎士比亚#italic《哈姆雷特》#! (1623)#!"
 LOADING_TIP_59: "#T “疯子领着瞎子赶路，是这个时代一般的病态。”#!\n#tooltip_subheading ——莎士比亚#italic《李尔王》#! (1606)#!"
 LOADING_TIP_60: "#T “奉上帝之名，滚！”#!\n#tooltip_subheading ——奥利弗·克伦威尔（1653）#!"
 LOADING_TIP_61: "#T “人生而自由，却无往不在枷锁之中。”#!\n#tooltip_subheading ——让‑雅克·卢梭#italic《社会契约论》#! (1762)#!"
 LOADING_TIP_62: "#T “路易无法受审：要么他已被判决，要么共和国未被证明清白。”#!\n#tooltip_subheading ——马克西米连·罗伯斯庇尔（1792）#!"
 LOADING_TIP_63: "#T “不给我自由，就给我死亡！”#!\n#tooltip_subheading ——帕特里克·亨利（1775）#!"
 LOADING_TIP_64: "#T “宁愿为狮子一日，也不为豺狼百年。”#!\n#tooltip_subheading ——蒂普苏丹（约1780）#!"
 LOADING_TIP_65: "#T “朕就是这样汉子，就是这样秉性，就是这样皇帝。”#!\n#tooltip_subheading ——雍正皇帝（1724）#!"
 LOADING_TIP_66: "#T “尔之识几个臭字，不知那去了？”#!\n#tooltip_subheading ——康熙皇帝（1709）#!"
 LOADING_TIP_67: "#T “知识就是力量。”#!\n#tooltip_subheading ——弗朗西斯·培根（1597）#!"
 LOADING_TIP_68: "#T “我思故我在。”#!\n#tooltip_subheading ——勒内·笛卡尔（1637）#!"
 LOADING_TIP_69: "#T “如果我比别人看得更远，那是因为我站在巨人的肩膀上。”#!\n#tooltip_subheading ——艾萨克·牛顿（1676）#!"
 LOADING_TIP_70: "#T “眼见他起高楼，眼见他宴宾客，眼见他楼塌了。”#!\n#tooltip_subheading ——孔尚任#italic《桃花扇》#!"
 LOADING_TIP_71: "#T “予闻不共戴天者，君父之仇；救灾恤患者，邻国之义。”#!\n#tooltip_subheading ——多尔衮入关檄（1644）#!"
 LOADING_TIP_72: "#T “身后有余忘缩手，眼前无路想回头。”#!\n#tooltip_subheading ——曹雪芹#italic《红楼梦》#!（第二回，1791）#!"
 LOADING_TIP_73: "#T “朕即国家！”#!\n#tooltip_subheading ——法国国王路易十四#!"
 LOADING_TIP_74: "#T “败军之将，不可言勇；负国之臣，不可言忠。身死封疆，实有馀恨。”#!\n#tooltip_subheading ——史可法遗书（1645）#!"
 LOADING_TIP_75: "#T “驱逐胡虏，恢复中华，立纲陈纪，救济斯民。”#!\n#tooltip_subheading ——朱元璋#italic《奉天讨蒙元檄文》#!（1367）#!"
 LOADING_TIP_76: "#T “纲常万古，磨灭不得；轮回复始，终古常新。”#!\n#tooltip_subheading ——黄道周南京遗墨（1646）#!"

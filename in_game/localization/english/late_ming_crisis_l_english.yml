l_english:
 late_ming_crisis: "late_ming_crisis"
 late_ming_crisis_desc: "late_ming_crisis_desc"



# Generic Action: Grant Unification CB
late_ming_crisis_grant_unification_cb: "Grant Unification of China Casus Belli"
late_ming_crisis_grant_unification_cb_desc: "During the Late Ming Crisis situation, eligible countries in Chinese regions can obtain a casus belli to unify China, allowing them to declare war on other countries in the same region."

# Generic Action: Subjugate Disobedient Subject
late_ming_crisis_subjugate_disobedient: "Subjugate Disobedient Subject"
late_ming_crisis_subjugate_disobedient_desc: "Obtain a casus belli to unify China, allowing you to annex your subject countries."

# Generic Action: Restore Celestial Empire
late_ming_crisis_restore_celestial_empire: "Restore Celestial Empire"
late_ming_crisis_restore_celestial_empire_desc: "By unifying China and recreating the [GetUniqueInternationalOrganization('middle_kingdom').GetName] organization, reestablish the Celestial Empire system. This action establishes our country as the leader of the Celestial Empire and restores the traditional tributary system."

# Generic Action: Test Button - Recreate Middle Kingdom (Test Only)
late_ming_crisis_test_recreate_middle_kingdom: "[TEST] Recreate Middle Kingdom"
late_ming_crisis_test_recreate_middle_kingdom_desc: "Test only: Use vanilla effect to recreate the [GetUniqueInternationalOrganization('middle_kingdom').GetName] organization with full country effects (change tag to CHI, core all of China, accept Chinese cultures, set empire rank, etc.)."


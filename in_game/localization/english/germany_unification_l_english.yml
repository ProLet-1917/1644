l_english:
 germany_unification: "German Unification"
 germany_unification_desc: "The German states are seeking a nation-state. Unifiers gather lesser German countries into their alliances, and may proclaim a unified Germany."
 POTENTIAL_UNIFIER: "Potential Unifiers"
 GERMAN_COUNTRY: "German Countries"
 demand_vassalization_from_members_tt: "Members of our unification alliance will be integrated into Germany."
 declare_unification_of_germany_empire: "Declare the Unification of Germany"
 declare_unification_of_germany_empire_desc: "As the sole remaining unifier, we can proclaim the German Empire and invite our alliance members — and other German states — to join us."
 declare_unification_through_hre: "Unify Germany through the Empire"
 declare_unification_through_hre_desc: "As Emperor of the Holy Roman Empire, we can proclaim a German nation, invite the princes to join, and dissolve the Empire."
 support_the_unifier: "Support a Unifier"
 support_the_unifier_desc: "Join one of the German unification alliances and back that unifier."
 only_1_unifier_now: "There is only one remaining potential unifier"
 germany_unification.1000.title: "The German Question"
 germany_unification.1000.desc: "Across the German lands, princes and burghers speak of a single nation. Powerful German states now bid for the role of unifier, gathering lesser countries into their alliances."
 germany_unification.1000.a: "A new age for Germany begins."
 germany_unification.1001.title: "Germany Is Proclaimed"
 germany_unification.1001.desc: "[target_country.GetNameWithNoTooltip] has declared the unification of Germany. As members of their alliance, we are expected to enter the new state."
 germany_unification.1001.a: "The nation calls."
 germany_unification.1002.title: "An Invitation from Germany"
 germany_unification.1002.desc: "[target_country.GetNameWithNoTooltip] has proclaimed a unified Germany. They invite all remaining German states to join the new nation."
 germany_unification.1002.a: "We will join Germany."
 germany_unification.1002.b: "We will keep our independence."
 germany_unification.1101.title: "The Empire Becomes Germany"
 germany_unification.1101.desc: "The Emperor has proclaimed a unified German nation and dissolved the Holy Roman Empire. The princes must decide whether to enter Germany or stand alone."
 germany_unification.1101.a: "We enter Germany."
 germany_unification.1101.b: "We remain independent."

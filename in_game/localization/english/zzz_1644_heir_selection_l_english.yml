l_english:
 # Heir Selection Laws
 patrilineal_primogeniture: "Patrilineal Primogeniture"
 patrilineal_primogeniture_desc: "This is a [heir_selection|e] for [ShowGovernmentTypeName('monarchy')], where the [heir|e] is the current [ruler|e]'s eldest son. Females can never inherit, and inheritance cannot pass through female lines. Succession follows strict patrilineal descent, ensuring only male descendants can inherit the throne. Heirs must be from the same dynasty, with priority given to direct descendants (biological children). If no direct descendants exist, other members of the same dynasty are considered."
 
 # Heir Selection Score Descriptions
 HEIR_SELECTION_DIRECT_DESCENDANT: "• Direct Descendant (Biological Child)"
 HEIR_SELECTION_SAME_DYNASTY: "• Same Dynasty Member"



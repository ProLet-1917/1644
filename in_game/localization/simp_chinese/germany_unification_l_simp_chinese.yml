l_simp_chinese:
 germany_unification: "德国统一"
 germany_unification_desc: "德意志各邦正在寻求建立民族国家。统一者将较小的德意志国家纳入联盟，并可以宣布成立统一的德国。"
 POTENTIAL_UNIFIER: "潜在统一者"
 GERMAN_COUNTRY: "德意志国家"
 demand_vassalization_from_members_tt: "我们统一联盟的成员将被并入德国。"
 declare_unification_of_germany_empire: "宣布统一德国"
 declare_unification_of_germany_empire_desc: "作为唯一剩余的统一者，我们可以宣布建立德意志帝国，并邀请联盟成员以及其他德意志国家加入。"
 declare_unification_through_hre: "通过帝国统一德国"
 declare_unification_through_hre_desc: "作为神圣罗马帝国皇帝，我们可以宣布建立德意志国家，邀请诸侯加入，并解散神罗。"
 support_the_unifier: "支持统一者"
 support_the_unifier_desc: "加入一个德国统一联盟，支持该统一者。"
 only_1_unifier_now: "目前仅剩一名潜在统一者"
 germany_unification.1000.title: "德意志问题"
 germany_unification.1000.desc: "在德意志各地，诸侯与市民都在谈论一个统一的民族国家。强大的德意志国家开始争夺统一者的地位，并将较小国家纳入各自的联盟。"
 germany_unification.1000.a: "德意志的新时代开始了。"
 germany_unification.1001.title: "德国宣告成立"
 germany_unification.1001.desc: "[target_country.GetNameWithNoTooltip]已宣布统一德国。作为其联盟的成员，我们理应加入这个新国家。"
 germany_unification.1001.a: "民族在召唤。"
 germany_unification.1002.title: "来自德国的邀请"
 germany_unification.1002.desc: "[target_country.GetNameWithNoTooltip]已宣布建立统一的德国。他们邀请所有剩余的德意志国家加入。"
 germany_unification.1002.a: "我们将加入德国。"
 germany_unification.1002.b: "我们将保持独立。"
 germany_unification.1101.title: "帝国化为德国"
 germany_unification.1101.desc: "皇帝已宣布建立统一的德意志国家，并解散神圣罗马帝国。诸侯必须决定是加入德国，还是自立门户。"
 germany_unification.1101.a: "我们加入德国。"
 germany_unification.1101.b: "我们保持独立。"

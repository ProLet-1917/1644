l_simp_chinese:
 late_ming_crisis: "甲申天变"
 late_ming_crisis_desc: "西历1644年，崇祯十七年，甲申年。中华民族走到了命运的十字路口..."
 


 # 事件 1: 启动
late_ming_crisis.1.title:0 "反正？"
late_ming_crisis.1.desc:0 "当初形势所迫我们不得不投降闯王，然而如今大顺军在清军面前连吃败仗。姜瓖作为前明将领，是否应该抓住机会，赶快反正？"
#late_ming_crisis.1.historical_info:0 "姜瓖原为明大同总兵，李自成三月至大同时投降，见大顺势衰，遂反叛。"
late_ming_crisis.1.a:0 "降清"
late_ming_crisis.1.b:0 "归明"
late_ming_crisis.1.c:0 "现在还不是时候"

late_ming_crisis.2.title:0 "姜瓖背叛"
late_ming_crisis.2.desc:0 "大同总兵姜瓖包藏祸心，见我军不利，突然发动叛乱，杀害张天琳、柯天相。我们丧失了大同这个兵家必争之地！"
late_ming_crisis.2.a:0 "奸贼！恶贼！逆贼！"

late_ming_crisis.3.title:0 "宣府叛乱"
late_ming_crisis.3.desc:0 "宣府前巡抚李鉴、前副总兵总兵王应晖、前总兵孙国柱之弟孙国勋见大顺势衰，遂发动叛乱，杀害了制将军白邦政，投降东虏。我们丧失了宣府这个兵家必争之地！"
late_ming_crisis.3.a:0 "奸贼！恶贼！逆贼！"

late_ming_crisis.4.title:0 "河北、山东叛乱"
late_ming_crisis.4.desc:0 "河北、山东多地的官绅不愿助饷，纷纷杀害我官员，又拥立前明香河知县朱帅𨨢为济王，反叛我朝。"
late_ming_crisis.4.a:0 "只有东虏来了他们才愿意交钱"

late_ming_crisis.5.title:0 "交了白卷"
late_ming_crisis.5.desc:0 ""
late_ming_crisis.5.a:0 "退回陕西，凭险据守"
late_ming_crisis.5.b:0 "渡河而死，其奈公何"


# Generic Action: 获取统一中国CB
late_ming_crisis_grant_unification_cb: "逐鹿群雄"
late_ming_crisis_grant_unification_cb_desc: "获得对明末群雄的“统一中国”宣战理由。"

# Generic Action: 对附庸获取统一中国CB
late_ming_crisis_subjugate_disobedient: "征讨不臣"
late_ming_crisis_subjugate_disobedient_desc: "获得对附属国的"统一中国"宣战理由并解除附属关系。"

# Generic Action: 重建天朝
late_ming_crisis_restore_celestial_empire: "重建天朝"
late_ming_crisis_restore_celestial_empire_desc: "通过统一中国并重建[GetUniqueInternationalOrganization('middle_kingdom').GetName]组织，重新确立天朝体系。此行动将我国确立为天朝领袖，恢复传统的朝贡体系。"

# Generic Action: 测试按钮 - 重建天朝组织（测试用）
late_ming_crisis_test_recreate_middle_kingdom: "[测试]重建天朝组织"
late_ming_crisis_test_recreate_middle_kingdom_desc: "测试用：使用原版效果重建[GetUniqueInternationalOrganization('middle_kingdom').GetName]组织，包含完整国家效果（改变tag为CHI、核心化中国地区、接受中华文化、设置帝国等级等）。"

